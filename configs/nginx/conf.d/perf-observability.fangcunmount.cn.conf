# K6 生产观测只读入口。
# worker 指标来自 Prometheus federation，避免普通 Nginx 轮询在压测前后命中
# 不同 worker 副本。Broker 状态由 RocketMQ 专用指标与告警负责。

server {
    listen 443 ssl;
    http2 on;
    server_name worker.fangcunmount.cn;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $prometheus_observability http://prometheus:9090;

    ssl_certificate     /data/ssl/certs/fangcunmount.cn.crt;
    ssl_certificate_key /data/ssl/private/fangcunmount.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 5m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    location = /metrics {
        limit_except GET {
            deny all;
        }
        # Only export Docker-discovered worker targets. The retired static
        # qs-worker:9092 target otherwise duplicates one randomly selected replica.
        proxy_pass $prometheus_observability/federate?match[]=%7Bjob%3D%22qs-worker%22%2Ccomponent%3D%22qs-worker%22%7D;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host prometheus;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location = /readyz {
        limit_except GET {
            deny all;
        }
        # Docker SD's target component label is "qs-worker". Prometheus moves
        # the application's colliding component="worker" label to exported_component.
        proxy_pass $prometheus_observability/api/v1/query?query=count%28%28up%7Bjob%3D%22qs-worker%22%2Ccomponent%3D%22qs-worker%22%7D%20%3D%3D%201%29%20and%20on%28instance%29%20%28qs_runtime_component_ready%7Bjob%3D%22qs-worker%22%2Ccomponent%3D%22qs-worker%22%2Cexported_component%3D%22worker%22%7D%20%3D%3D%201%29%29;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host prometheus;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name worker.fangcunmount.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$server_name$request_uri;
    }
}
