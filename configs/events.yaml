# ============================================================================
# 领域事件配置
# ============================================================================
# 本文件只描述当前运行时真实生效的事件契约与 Topic 映射。
# delivery 语义：
#   durable_outbox  - 可靠业务事件，Outbox + NSQ
#   best_effort     - 尽力投递领域事件（direct publish），可丢
# 一次性唤醒信令见 configs/signals.yaml（ephemeral_signal，Redis Pub/Sub）
# ============================================================================

version: "1.0"

topics:
  questionnaire-lifecycle:
    name: "qs.survey.lifecycle"
    description: "问卷和量表生命周期事件"

  assessment-lifecycle:
    name: "qs.evaluation.lifecycle"
    description: "测评生命周期事件"

  task-lifecycle:
    name: "qs.plan.task"
    description: "测评任务生命周期事件"

events:
  questionnaire.changed:
    topic: questionnaire-lifecycle
    delivery: best_effort
    aggregate: Questionnaire
    domain: survey/questionnaire
    description: "问卷生命周期变化"
    handler: questionnaire_changed_handler

  assessment_model.changed:
    topic: questionnaire-lifecycle
    delivery: best_effort
    aggregate: AssessmentModel
    domain: modelcatalog
    description: "测评模型生命周期变化"
    handler: assessment_model_changed_handler

  answersheet.submitted:
    topic: assessment-lifecycle
    delivery: durable_outbox
    aggregate: AnswerSheet
    domain: survey/answersheet
    description: "答卷已提交"
    handler: answersheet_submitted_handler

  evaluation.requested:
    topic: assessment-lifecycle
    delivery: durable_outbox
    aggregate: Evaluation
    domain: evaluation
    description: "Evaluation 已请求执行"
    handler: evaluation_requested_handler

  evaluation.retry.requested:
    topic: assessment-lifecycle
    delivery: durable_outbox
    aggregate: Evaluation
    domain: evaluation
    description: "Evaluation 自动或人工重试已获授权"
    handler: evaluation_retry_requested_handler

  evaluation.outcome.committed:
    topic: assessment-lifecycle
    delivery: durable_outbox
    aggregate: Evaluation
    domain: evaluation
    description: "评分事实已可靠提交，等待报告生成"
    handler: evaluation_outcome_committed_handler

  evaluation.failed:
    topic: assessment-lifecycle
    delivery: durable_outbox
    aggregate: Evaluation
    domain: evaluation
    description: "Evaluation 执行失败"
    handler: evaluation_failed_handler

  interpretation.report.generated:
    topic: assessment-lifecycle
    delivery: durable_outbox
    aggregate: Report
    domain: interpretation/report
    description: "报告已生成（outcome 投影：model/primary_score/level）"
    handler: interpretation_report_generated_handler

  interpretation.report.failed:
    topic: assessment-lifecycle
    delivery: durable_outbox
    aggregate: Report
    domain: interpretation/report
    description: "报告生成尝试失败（含持久化 RetryDecision 投影）"
    handler: interpretation_report_failed_handler

  interpretation.retry.requested:
    topic: assessment-lifecycle
    delivery: durable_outbox
    aggregate: ReportGeneration
    domain: interpretation
    description: "Interpretation 自动或人工重试已获授权"
    handler: interpretation_retry_requested_handler

  interpretation.ai_explanation.requested:
    topic: assessment-lifecycle
    delivery: durable_outbox
    aggregate: AIExplanationGeneration
    domain: interpretation/aiexplanation
    description: "参与者已手动请求一次 AI 解读，等待异步执行"
    handler: ai_explanation_requested_handler

  interpretation.ai_explanation.retry.requested:
    topic: assessment-lifecycle
    delivery: durable_outbox
    aggregate: AIExplanationGeneration
    domain: interpretation/aiexplanation
    description: "AI 解读失败 attempt 的人工重试已获授权并完成调用预算预留"
    handler: ai_explanation_requested_handler

  interpretation.ai_explanation.lease_recovery.requested:
    topic: assessment-lifecycle
    delivery: durable_outbox
    aggregate: AIExplanationGeneration
    domain: interpretation/aiexplanation
    description: "AI 解读同一 attempt 的过期执行租约已被确定性唤醒"
    handler: ai_explanation_requested_handler

  interpretation.ai_explanation.generated:
    topic: assessment-lifecycle
    delivery: durable_outbox
    aggregate: AIExplanationGeneration
    domain: interpretation/aiexplanation
    description: "AI 解读 Artifact 已可靠提交（事件不携带解读正文）"
    handler: ai_explanation_terminal_handler

  interpretation.ai_explanation.failed:
    topic: assessment-lifecycle
    delivery: durable_outbox
    aggregate: AIExplanationGeneration
    domain: interpretation/aiexplanation
    description: "AI 解读尝试失败（仅安全失败摘要）"
    handler: ai_explanation_terminal_handler

  interpretation.ai_explanation.prompt_evaluation.step_requested:
    topic: assessment-lifecycle
    delivery: durable_outbox
    aggregate: AIExplanationPromptEvaluation
    domain: interpretation/aiexplanation
    description: "AI 解读 Prompt 评测的一个合成 attempt 已请求执行"
    handler: ai_explanation_prompt_evaluation_step_handler

  task.opened:
    topic: task-lifecycle
    delivery: best_effort
    aggregate: AssessmentTask
    domain: plan
    description: "任务已开放"
    handler: task_opened_handler

  task.completed:
    topic: task-lifecycle
    delivery: best_effort
    aggregate: AssessmentTask
    domain: plan
    description: "任务已完成"
    handler: task_completed_handler

  task.expired:
    topic: task-lifecycle
    delivery: best_effort
    aggregate: AssessmentTask
    domain: plan
    description: "任务已过期"
    handler: task_expired_handler

  task.canceled:
    topic: task-lifecycle
    delivery: best_effort
    aggregate: AssessmentTask
    domain: plan
    description: "任务已取消"
    handler: task_canceled_handler
