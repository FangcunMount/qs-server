name: AI bridge MySQL
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
env:
  # Only availability is shared; credentials stay in the service/login inputs.
  CI_DOCKERHUB_LOGIN: ${{ secrets.DOCKERHUB_USERNAME != '' || secrets.DOCKERHUB_TOKEN != '' }}
jobs:
  delivery:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql: ['8.0.36', '8.4']
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          MYSQL_ROOT_PASSWORD: bridge_test_root
          MYSQL_DATABASE: qs_bridge_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pbridge_test_root --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@v6
      - name: Log in for CI image pulls
        if: env.CI_DOCKERHUB_LOGIN == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          logout: true
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache: true
      - name: Start isolated NSQ with the production message size limit
        run: |
          # Same immutable Docker Hub v1.3.0 manifest, served by its public cache.
          # Avoid the upstream pull quota; keep the actual NSQ scenario mandatory.
          nsq_cached='mirror.gcr.io/nsqio/nsq@sha256:1a369c146af71bc95c25d54b375a2b98452478c1eaf4e85f8fcb01da20f2c78a'
          docker pull "$nsq_cached"
          docker tag "$nsq_cached" nsqio/nsq:v1.3.0
          docker run -d --name qs-ai-mq-ci-nsq --memory=128m --cpus=1 -p 4150:4150 -p 4151:4151 nsqio/nsq:v1.3.0 /nsqd --max-msg-size=262144 --mem-queue-size=3000
          python3 - <<'PYREADY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:4151/ping', timeout=1) as response:
                      if response.status == 200:
                          break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('required isolated NSQ is not ready')
          PYREADY
      - name: Apply bridge schema to isolated test database
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          docker exec -i "$MYSQL_CONTAINER" mysql -uroot -pbridge_test_root qs_bridge_test < internal/pkg/migration/migrations/mysql/000072_ai_bridge_delivery.up.sql
          docker exec -i "$MYSQL_CONTAINER" mysql -uroot -pbridge_test_root qs_bridge_test < internal/pkg/migration/migrations/mysql/000083_ai_runtime_index.up.sql
          docker exec -i "$MYSQL_CONTAINER" mysql -uroot -pbridge_test_root qs_bridge_test < internal/pkg/migration/migrations/mysql/000091_ai_messaging.up.sql
          docker exec -i "$MYSQL_CONTAINER" mysql -uroot -pbridge_test_root qs_bridge_test < internal/pkg/migration/migrations/mysql/000092_ai_messaging_failures.up.sql
          docker exec -i "$MYSQL_CONTAINER" mysql -uroot -pbridge_test_root qs_bridge_test < internal/pkg/migration/migrations/mysql/000093_ai_messaging_legacy_commands.up.sql
          docker exec -i "$MYSQL_CONTAINER" mysql -uroot -pbridge_test_root qs_bridge_test < internal/pkg/migration/migrations/mysql/000094_ai_messaging_admission.up.sql
          docker exec -i "$MYSQL_CONTAINER" mysql -uroot -pbridge_test_root qs_bridge_test < internal/pkg/migration/migrations/mysql/000095_ai_messaging_observations.up.sql
          docker exec -i "$MYSQL_CONTAINER" mysql -uroot -pbridge_test_root qs_bridge_test < internal/pkg/migration/migrations/mysql/000097_ai_command_retirement.up.sql
      - name: Verify durable request and result transactions
        env:
          QS_AI_BRIDGE_TEST_DSN: 'root:bridge_test_root@tcp(127.0.0.1:3306)/qs_bridge_test?parseTime=true'
          QS_AI_MQ_TEST_DSN: 'root:bridge_test_root@tcp(127.0.0.1:3306)/qs_bridge_test?parseTime=true'
          QS_AI_MQ_NSQD: '127.0.0.1:4150'
          QS_AI_MQ_NSQD_HTTP: 'http://127.0.0.1:4151'
          GOWORK: 'off'
        run: |
          mkdir -p artifacts
          go test -p 1 -tags=integration -count=1 -race -json ./internal/apiserver/application/aibridge ./internal/apiserver/infra/mysql/aibridge ./internal/apiserver/infra/aibridge ./internal/apiserver/transport/grpc/aibridge > artifacts/ai-mq-tests.json
          {
            go test -count=1 -race -json ./internal/apiserver/transport/rest/handler ./internal/apiserver/transport/rest -run '^TestMQ'
            go test -count=1 -race -json ./internal/apiserver/container/modules/interpretation ./internal/apiserver/options ./internal/apiserver/transport/grpc/service ./internal/collection-server/transport/rest/handler -run '^TestMQ'
            go test -count=1 -race -json ./internal/apiserver/transport/grpc ./internal/collection-server/infra/grpcclient ./internal/collection-server/application/aiexplanation ./internal/collection-server/transport/rest
            go test -tags=integration -count=1 -race -json ./scripts/maintenance/qs-ai-messaging
            go test -count=1 -race -json ./internal/apiserver/maintenance/aimessagingbinding ./scripts/maintenance/qs-ai-messaging-preflight
          } >> artifacts/ai-mq-tests.json
          go build ./cmd/qs-apiserver ./cmd/collection-server
          go build -ldflags "-X main.sourceSHA=${{ github.sha }}" -o artifacts/qs-ai-messaging ./scripts/maintenance/qs-ai-messaging
          go build -ldflags "-X main.sourceSHA=${{ github.sha }}" -o artifacts/qs-ai-messaging-preflight ./scripts/maintenance/qs-ai-messaging-preflight
          python3 scripts/cd/test_ai_messaging_release.py > artifacts/ai-mq-release-tests.json
          go build ./scripts/testing/ai-mq-process
          python3 scripts/testing/ai-mq-report.py artifacts/ai-mq-tests.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ai-mq-mysql-${{ matrix.mysql }}
          path: |
            artifacts/ai-mq-tests.json
            artifacts/qs-ai-messaging
            artifacts/qs-ai-messaging-preflight
            artifacts/ai-mq-release-tests.json
          if-no-files-found: error
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [qs-apiserver, collection-server]
    steps:
      - uses: actions/checkout@v6
      - name: Log in for CI image pulls
        if: env.CI_DOCKERHUB_LOGIN == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          logout: true
      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/Dockerfile.${{ matrix.service }}
          platforms: linux/amd64
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            VERSION=mq-candidate
          load: true
          tags: qs-mq-${{ matrix.service }}:ci
          cache-from: type=gha,scope=qs-ai-mq-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=qs-ai-mq-${{ matrix.service }}
      - name: Verify standard image without publication or production startup
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          mkdir -p artifacts
          docker run --rm --network none --read-only --entrypoint sh "qs-mq-$SERVICE:ci" -c 'test "$(id -u)" != "0" && test "$TZ" = Asia/Shanghai && test -x /app/'"$SERVICE"
          if [ "$SERVICE" = qs-apiserver ]; then
            docker run --rm --network none --read-only --entrypoint sh "qs-mq-$SERVICE:ci" -c 'for tool in qs-ai-messaging qs-ai-messaging-preflight qs-authz; do test -x "/app/$tool" || exit 1; done'
            embedded_source="$(docker run --rm --network none --read-only --entrypoint /app/qs-ai-messaging-preflight "qs-mq-$SERVICE:ci" --source-sha)"
            test "$embedded_source" = "$GITHUB_SHA"
          fi
          docker image inspect "qs-mq-$SERVICE:ci" > "artifacts/$SERVICE-image.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          service = os.environ['SERVICE']
          p = Path('artifacts') / f'{service}-source.json'
          p.write_text(json.dumps({'source_sha': os.environ['GITHUB_SHA'], 'service': service, 'dockerfile': f'build/docker/Dockerfile.{service}', 'runtime_health': 'not_verified', 'production': False}))
          PY
      - uses: actions/setup-go@v6
        if: matrix.service == 'qs-apiserver'
        with:
          go-version: '1.25.12'
          cache: true
      - name: Required final transaction native preflight
        if: matrix.service == 'qs-apiserver'
        run: |
          set -Eeuo pipefail
          umask 077
          fixture_dir="$(mktemp -d "${RUNNER_TEMP}/qs-final-preflight.XXXXXX")"
          trap 'sudo -n rm -rf -- "$fixture_dir"' EXIT
          go run ./scripts/maintenance/qs-ai-messaging-preflight/testdata/fixture "$fixture_dir"
          sudo -n env GITHUB_ACTIONS=true GITHUB_SHA="$GITHUB_SHA" RUNNER_TEMP="$RUNNER_TEMP" \
            python3 scripts/cd/test_final_native_preflight.py \
            --fixture "$fixture_dir" --image qs-mq-qs-apiserver:ci \
            --report "$PWD/artifacts/final-transaction-preflight.json"
      - uses: actions/upload-artifact@v7
        with:
          name: ai-mq-image-${{ matrix.service }}
          path: artifacts/
          if-no-files-found: error
