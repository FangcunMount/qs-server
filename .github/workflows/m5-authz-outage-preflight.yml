name: M5 AuthZ Outage Read-only Preflight

on:
  workflow_dispatch:
    inputs:
      expected_api_sha:
        description: Exact currently deployed QS API commit
        required: false
        type: string
      assessment_id:
        description: Exact assessment ID for read-only production reconciliation
        required: false
        type: string
      answersheet_id:
        description: Exact answer sheet ID observed from the assessment row
        required: false
        type: string
      outcome_id:
        description: Exact outcome ID observed from the assessment row
        required: false
        type: string
      check_mode:
        description: Run the existing before-cutover preflight or read-only after-cutover check
        required: false
        type: choice
        default: before
        options:
          - before
          - after
          - prepare-role-window
          - revoke-role-window
          - inspect-role-window
          - cleanup-role-window
          - inspect-role-sudo
          - inspect-role-root
          - resume-prepare-role-window
          - inspect-role-http
          - audit-assessment
          - preflight-mysql-cutover

permissions:
  contents: read

jobs:
  servera:
    if: inputs.check_mode == 'before' || inputs.check_mode == 'after'
    name: API guard and recovery prerequisites (ServerA)
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64, ops]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Read-only API preflight
        if: inputs.check_mode != 'after'
        uses: appleboy/ssh-action@v1.2.2
        env:
          EXPECTED_API_SHA: ${{ inputs.expected_api_sha }}
        with:
          host: ${{ vars.SVRA_HOST }}
          username: ${{ vars.SVRA_USERNAME }}
          key: ${{ secrets.SVRA_SSH_KEY }}
          port: ${{ vars.SVRA_SSH_PORT || 22 }}
          fingerprint: ${{ vars.SVRA_SSH_FINGERPRINT }}
          envs: EXPECTED_API_SHA
          script_path: scripts/cd/m5-authz-servera-readonly-preflight.sh
      - name: Read-only API postcheck
        if: inputs.check_mode == 'after'
        uses: appleboy/ssh-action@v1.2.2
        env:
          EXPECTED_API_SHA: ${{ inputs.expected_api_sha }}
        with:
          host: ${{ vars.SVRA_HOST }}
          username: ${{ vars.SVRA_USERNAME }}
          key: ${{ secrets.SVRA_SSH_KEY }}
          port: ${{ vars.SVRA_SSH_PORT || 22 }}
          fingerprint: ${{ vars.SVRA_SSH_FINGERPRINT }}
          envs: EXPECTED_API_SHA
          script_path: scripts/cd/m5-authz-ephemeral-postcheck-servera.sh

  serverd:
    if: inputs.check_mode == 'before' || inputs.check_mode == 'after'
    name: NSQ channel and recovery prerequisites (ServerD)
    runs-on: ${{ vars.QS_DEPLOY_RUNNER || 'serverd' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Read-only NSQ preflight
        if: inputs.check_mode != 'after'
        run: bash scripts/cd/m5-authz-serverd-readonly-preflight.sh
      - name: Read-only NSQ postcheck
        if: inputs.check_mode == 'after'
        run: bash scripts/cd/m5-authz-ephemeral-postcheck-servera.sh serverD

  role_window:
    if: inputs.check_mode == 'prepare-role-window' || inputs.check_mode == 'resume-prepare-role-window' || inputs.check_mode == 'revoke-role-window' || inputs.check_mode == 'inspect-role-window' || inputs.check_mode == 'inspect-role-http' || inputs.check_mode == 'cleanup-role-window' || inputs.check_mode == 'inspect-role-sudo' || inputs.check_mode == 'inspect-role-root'
    name: Scoped Qingdao role verification (ServerA)
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64, ops]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Verify fixed-scope recovery tool
        if: inputs.check_mode == 'prepare-role-window'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(shasum -a 256 scripts/cd/m5-authz-temporary-tool.go | awk '{print $1}')" = 7c623d23edb9b8ef266bfc357616b4c02483f282eaad364f2c7b58f5bdcfe453
          test "$(shasum -a 256 scripts/cd/m5-authz-temporary-tool-linux | awk '{print $1}')" = 824defd5012780be40eccfcfc45ec2f7f2ce7708707a9d14c2af98012ce93bdb
          test "$(shasum -a 256 scripts/cd/m5-authz-temporary-restore.sh | awk '{print $1}')" = ef0402574908374e8191799376b2f556c426c7247f422f9ce4f53e78160d81cb
          cp scripts/cd/m5-authz-temporary-restore.sh scripts/cd/m5-authz-temporary-restore-live.sh
          chmod 0700 scripts/cd/m5-authz-temporary-tool-linux scripts/cd/m5-authz-temporary-restore-live.sh
      - name: Stage recovery materials
        if: inputs.check_mode == 'prepare-role-window'
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ vars.SVRA_HOST }}
          username: ${{ vars.SVRA_USERNAME }}
          key: ${{ secrets.SVRA_SSH_KEY }}
          port: ${{ vars.SVRA_SSH_PORT || 22 }}
          fingerprint: ${{ vars.SVRA_SSH_FINGERPRINT }}
          source: scripts/cd/m5-authz-temporary-tool-linux,scripts/cd/m5-authz-temporary-restore-live.sh
          target: /tmp/rm-m5-20260928-stage
          strip_components: 2
          overwrite: true
      - name: Execute exact role-window phase
        uses: appleboy/ssh-action@v1.2.2
        env:
          EXPECTED_API_SHA: ${{ inputs.expected_api_sha }}
          ROLE_WINDOW_MODE: ${{ inputs.check_mode }}
          ROLE_WINDOW_RUN_ID: ${{ github.run_id }}
        with:
          host: ${{ vars.SVRA_HOST }}
          username: ${{ inputs.check_mode == 'inspect-role-root' && 'root' || vars.SVRA_USERNAME }}
          key: ${{ secrets.SVRA_SSH_KEY }}
          port: ${{ vars.SVRA_SSH_PORT || 22 }}
          fingerprint: ${{ vars.SVRA_SSH_FINGERPRINT }}
          envs: EXPECTED_API_SHA,ROLE_WINDOW_MODE,ROLE_WINDOW_RUN_ID
          command_timeout: 4m
          script_path: scripts/cd/m5-authz-temporary-exercise.sh

  assessment_audit:
    if: inputs.check_mode == 'audit-assessment' || inputs.check_mode == 'preflight-mysql-cutover'
    name: Read-only assessment identity and MySQL chain
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64, ops]
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v6
      - name: Reconcile one exact assessment ID
        if: inputs.check_mode == 'audit-assessment'
        uses: appleboy/ssh-action@v1.2.2
        env:
          ASSESSMENT_ID: ${{ inputs.assessment_id }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT || 3306 }}
          MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE != '' && secrets.MYSQL_DATABASE || secrets.MYSQL_DBNAME }}
        with:
          host: ${{ vars.SVRA_HOST }}
          username: ${{ vars.SVRA_USERNAME }}
          key: ${{ secrets.SVRA_SSH_KEY }}
          port: ${{ vars.SVRA_SSH_PORT || 22 }}
          fingerprint: ${{ vars.SVRA_SSH_FINGERPRINT }}
          envs: ASSESSMENT_ID,MYSQL_HOST,MYSQL_PORT,MYSQL_USERNAME,MYSQL_PASSWORD,MYSQL_DATABASE
          script_path: scripts/cd/m5-assessment-single-id-audit.sh
      - name: Reconcile matching Mongo answer and durable message
        if: inputs.check_mode == 'audit-assessment'
        uses: appleboy/ssh-action@v1.2.2
        env:
          ANSWER_SHEET_ID: ${{ inputs.answersheet_id }}
          ASSESSMENT_ID: ${{ inputs.assessment_id }}
          OUTCOME_ID: ${{ inputs.outcome_id }}
          MONGODB_HOST: ${{ secrets.MONGODB_HOST }}
          MONGODB_PORT: ${{ secrets.MONGODB_PORT || 27017 }}
          MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
          MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
          MONGODB_DBNAME: ${{ secrets.MONGODB_DBNAME }}
        with:
          host: ${{ vars.SVRA_HOST }}
          username: ${{ vars.SVRA_USERNAME }}
          key: ${{ secrets.SVRA_SSH_KEY }}
          port: ${{ vars.SVRA_SSH_PORT || 22 }}
          fingerprint: ${{ vars.SVRA_SSH_FINGERPRINT }}
          envs: ANSWER_SHEET_ID,ASSESSMENT_ID,OUTCOME_ID,MONGODB_HOST,MONGODB_PORT,MONGODB_USERNAME,MONGODB_PASSWORD,MONGODB_DBNAME
          script_path: scripts/cd/m5-answersheet-single-id-audit.sh
      - name: Read-only MySQL cutover waterline
        if: inputs.check_mode == 'preflight-mysql-cutover'
        uses: appleboy/ssh-action@v1.2.2
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT || 3306 }}
          MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE != '' && secrets.MYSQL_DATABASE || secrets.MYSQL_DBNAME }}
        with:
          host: ${{ vars.SVRA_HOST }}
          username: ${{ vars.SVRA_USERNAME }}
          key: ${{ secrets.SVRA_SSH_KEY }}
          port: ${{ vars.SVRA_SSH_PORT || 22 }}
          fingerprint: ${{ vars.SVRA_SSH_FINGERPRINT }}
          envs: MYSQL_HOST,MYSQL_PORT,MYSQL_USERNAME,MYSQL_PASSWORD,MYSQL_DATABASE
          script_path: scripts/cd/m5-mysql-cutover-readonly-preflight.sh

  mysql_cutover_nsq:
    if: inputs.check_mode == 'preflight-mysql-cutover'
    name: Read-only assessment NSQ channel waterline
    runs-on: ${{ vars.QS_DEPLOY_RUNNER || 'serverd' }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/cd/m5-mysql-cutover-nsq-readonly.sh
