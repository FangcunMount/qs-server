        run: |
          set -Eeuo pipefail
          : "${SVRA_HOST:?SVRA_HOST is empty}"
          : "${SVRA_USERNAME:?SVRA_USERNAME is empty}"
          : "${SVRA_SSH_KEY:?SVRA_SSH_KEY is empty}"
          : "${SVRA_SSH_FINGERPRINT:?SVRA_SSH_FINGERPRINT is empty}"
          if ! [[ "$SVRA_SSH_PORT" =~ ^[0-9]+$ ]] || (( SVRA_SSH_PORT < 1 || SVRA_SSH_PORT > 65535 )); then
            echo "❌ SVRA_SSH_PORT is invalid" >&2
            exit 1
          fi

      - name: Transfer model template route governance tool with pinned host identity
        env:
          SVRA_HOST: ${{ vars.SVRA_HOST }}
          SVRA_USERNAME: ${{ vars.SVRA_USERNAME }}
          SVRA_SSH_KEY: ${{ secrets.SVRA_SSH_KEY }}
          SVRA_SSH_PORT: ${{ vars.SVRA_SSH_PORT || 22 }}
          SVRA_SSH_FINGERPRINT: ${{ vars.SVRA_SSH_FINGERPRINT }}
          GOVERNANCE_RUN_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
          MODEL_TEMPLATE_ROUTE_OPERATION_INPUT: ${{ github.event.inputs.governance_operation }}
        run: |
          set -Eeuo pipefail
          if ! [[ "$GOVERNANCE_RUN_TOKEN" =~ ^[0-9]+-[0-9]+$ ]]; then
            echo "❌ Invalid governance run token" >&2
            exit 1
          fi

          KEY_FILE="${RUNNER_TEMP}/qs-svra-model-template-${GOVERNANCE_RUN_TOKEN}.key"
          KNOWN_HOSTS_FILE="${RUNNER_TEMP}/qs-svra-model-template-${GOVERNANCE_RUN_TOKEN}.known_hosts"
          REMOTE_TOOL="/tmp/qs-server-model-template-route-governance-${GOVERNANCE_RUN_TOKEN}.js"
          REMOTE_HASH_AMD64="/tmp/qs-server-model-template-route-hash-${GOVERNANCE_RUN_TOKEN}-amd64"
          REMOTE_HASH_ARM64="/tmp/qs-server-model-template-route-hash-${GOVERNANCE_RUN_TOKEN}-arm64"
          cleanup_local_credentials() {
            rm -f -- "$KEY_FILE" "$KNOWN_HOSTS_FILE"
          }
          trap cleanup_local_credentials EXIT

          umask 077
          printf '%s\n' "$SVRA_SSH_KEY" > "$KEY_FILE"
          ssh-keyscan -T 10 -p "$SVRA_SSH_PORT" "$SVRA_HOST" 2>/dev/null > "$KNOWN_HOSTS_FILE"
          if [ ! -s "$KNOWN_HOSTS_FILE" ]; then
            echo "❌ Unable to obtain ServerA SSH host keys" >&2
            exit 1
          fi
          if ! ssh-keygen -lf "$KNOWN_HOSTS_FILE" -E sha256 |
            awk '{print $2}' |
            grep -Fqx -- "$SVRA_SSH_FINGERPRINT"; then
            echo "❌ ServerA SSH fingerprint mismatch" >&2
            exit 1
          fi

          scp -q \
            -i "$KEY_FILE" \
            -P "$SVRA_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            scripts/oneoff/govern_interpretation_model_template_routes/govern.js \
            "${SVRA_USERNAME}@${SVRA_HOST}:${REMOTE_TOOL}"
          if [ "$MODEL_TEMPLATE_ROUTE_OPERATION_INPUT" = "audit" ]; then
            scp -q \
              -i "$KEY_FILE" \
              -P "$SVRA_SSH_PORT" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
              "$RUNNER_TEMP/model-template-route-hash-linux-amd64" \
              "${SVRA_USERNAME}@${SVRA_HOST}:${REMOTE_HASH_AMD64}"
            scp -q \
              -i "$KEY_FILE" \
              -P "$SVRA_SSH_PORT" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
              "$RUNNER_TEMP/model-template-route-hash-linux-arm64" \
              "${SVRA_USERNAME}@${SVRA_HOST}:${REMOTE_HASH_ARM64}"
            ssh \
              -i "$KEY_FILE" \
              -p "$SVRA_SSH_PORT" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
              "${SVRA_USERNAME}@${SVRA_HOST}" \
              chmod 0700 "$REMOTE_HASH_AMD64" "$REMOTE_HASH_ARM64"
          fi
          echo "✅ Model template route governance tool transferred for run ${GOVERNANCE_RUN_TOKEN}"

      - name: Execute manifest-driven model template route governance
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.SVRA_HOST }}
