                  generated_at: {$gte: from},
                  risk_level: {$in: ["high", "severe"]}
                }),
                missing: gaps.length,
                distinct_assessments: new Set(gaps.map(gap => gap.assessment_id)).size,
                distinct_testees: Object.keys(reportsPerTestee).length,
                duplicate_testee_groups: Object.values(reportsPerTestee).filter(count => count > 1).length,
                max_gap_reports_per_testee: Math.max(0, ...Object.values(reportsPerTestee)),
                generated_within_30m_safety_lag: gaps.filter(gap => gap.generated_at >= safetyCutoff).length,
                oldest_generated_at: gaps.length > 0 ? gaps[0].generated_at : null,
                newest_generated_at: gaps.length > 0 ? gaps[gaps.length - 1].generated_at : null,
                by_risk: gapCountsByRisk,
                target_manifest: {
                  count: gaps.length,
                  fingerprint: manifestFingerprint,
                  report_ids: gaps.map(gap => gap.report_id).sort()
                }
              })
              const fs = require("fs")
              fs.writeFileSync(
                process.env.ATTENTION_GAP_EXPORT_PATH,
                gaps.map(gap => [gap.report_id, gap.assessment_id, gap.testee_id, gap.org_id].join("\t")).join("\n") + (gaps.length > 0 ? "\n" : ""),
                {encoding: "utf8", mode: 0o600}
              )
            }
            MONGOJS

            chmod 0700 "$MONGO_STATUS_DIR"
            chmod 0600 "$MONGO_STATUS_SCRIPT"
            sudo docker run --rm --network infra-network \
              --user "$(id -u):$(id -g)" \
              -v "$MONGO_STATUS_DIR:/audit" \
              -e HOME=/tmp \
              -e MONGODB_DBNAME="$MONGODB_DBNAME" \
              -e AUDIT_FROM="${AUDIT_FROM:-}" \
              -e ATTENTION_GAP_EXPORT_PATH=/audit/attention-gaps.tsv \
              mongo:7.0 mongosh \
                --host "$MONGODB_HOST" \
                --port "${MONGODB_PORT:-27017}" \
                --username "$MONGODB_USERNAME" \
                --password="$MONGODB_PASSWORD" \
                --authenticationDatabase admin \
                --quiet \
                --file /audit/status.js

            if [ -n "${AUDIT_FROM:-}" ]; then
              chmod 0600 "$ATTENTION_GAP_TSV"
              emit_attention_gap_cte() {
                printf 'WITH attention_gap (report_id, assessment_id, testee_id, org_id) AS (\n'
                row_count=0
                while IFS=$'\t' read -r report_id assessment_id testee_id org_id; do
                  [ -z "$report_id" ] && continue
                  for value in "$report_id" "$assessment_id" "$testee_id" "$org_id"; do
                    if ! [[ "$value" =~ ^[1-9][0-9]*$ ]]; then
                      echo "Invalid numeric identifier in private Attention gap export" >&2
                      return 1
                    fi
                  done
                  if [ "$row_count" -gt 0 ]; then
                    printf ' UNION ALL\n'
                  fi
                  printf ' SELECT %s, %s, %s, %s' "$report_id" "$assessment_id" "$testee_id" "$org_id"
                  row_count=$((row_count + 1))
                done < "$ATTENTION_GAP_TSV"
                if [ "$row_count" -eq 0 ]; then
                  printf ' SELECT CAST(NULL AS UNSIGNED), CAST(NULL AS UNSIGNED), CAST(NULL AS UNSIGNED), CAST(NULL AS UNSIGNED) WHERE FALSE'
                fi
                printf '\n)\n'
              }

              {
                emit_attention_gap_cte
                cat <<'MYSQL_TESTEE_AUDIT'
                , per_testee AS (
                  SELECT testee_id, MIN(org_id) AS org_id, COUNT(*) AS gap_reports,
                         COUNT(DISTINCT org_id) AS org_count
                  FROM attention_gap
                  GROUP BY testee_id
                )
                SELECT
                  (SELECT COUNT(*) FROM attention_gap) AS gap_reports,
                  COUNT(*) AS affected_testees,
                  COALESCE(SUM(testee.id IS NULL), 0) AS missing_testee_refs,
                  COALESCE(SUM(testee.id IS NOT NULL AND testee.deleted_at IS NOT NULL), 0) AS deleted_testee_refs,
                  COALESCE(SUM(testee.id IS NOT NULL AND testee.deleted_at IS NULL AND testee.is_key_focus = 1), 0)
                    AS already_key_focus_testees,
                  COALESCE(SUM(testee.id IS NOT NULL AND testee.deleted_at IS NULL AND testee.is_key_focus = 0), 0)
                    AS needs_key_focus_testees,
                  COALESCE(SUM(per_testee.org_count <> 1), 0) AS cross_org_gap_groups,
                  COALESCE(SUM(testee.id IS NOT NULL AND testee.org_id <> per_testee.org_id), 0)
                    AS testee_org_mismatches
                FROM per_testee
                LEFT JOIN testee ON testee.id = per_testee.testee_id;
            MYSQL_TESTEE_AUDIT
                emit_attention_gap_cte
                cat <<'MYSQL_ASSESSMENT_AUDIT'
                SELECT
                  COUNT(*) AS gap_reports,
                  COALESCE(SUM(assessment.id IS NULL), 0) AS missing_assessment_refs,
                  COALESCE(SUM(assessment.id IS NOT NULL AND assessment.deleted_at IS NOT NULL), 0)
                    AS deleted_assessment_refs,
                  COALESCE(SUM(assessment.id IS NOT NULL AND assessment.testee_id <> attention_gap.testee_id), 0)
                    AS assessment_testee_mismatches,
                  COALESCE(SUM(assessment.id IS NOT NULL AND assessment.org_id <> attention_gap.org_id), 0)
                    AS assessment_org_mismatches
                FROM attention_gap
                LEFT JOIN assessment ON assessment.id = attention_gap.assessment_id;
            MYSQL_ASSESSMENT_AUDIT
              } > "$ATTENTION_GAP_SQL"
              chmod 0600 "$ATTENTION_GAP_SQL"

              echo "Attention gap cross-store classification (aggregate counts only):"
              sudo docker run --rm --interactive --network infra-network \
                -v "$ATTENTION_GAP_SQL:/audit/attention-gaps.sql:ro" \
                -e MYSQL_PWD="$MYSQL_PASSWORD" \
                mysql:8.0 mysql --protocol=tcp \
                  --host="$MYSQL_HOST" \
                  --port="${MYSQL_PORT:-3306}" \
                  --user="$MYSQL_USERNAME" \
                  --database="$MYSQL_DATABASE" \
                  --batch --raw \
                  < "$ATTENTION_GAP_SQL"
            fi
            cleanup_mongo_status_script
            trap - EXIT

            echo "✅ MongoDB connection and read-only audit OK"

            echo ""
            echo "Running MongoDB utility containers:"
            sudo docker ps \
              --no-trunc \
              --filter ancestor=mongo:7.0 \
              --format '{{.ID}}\t{{.Names}}\t{{.CreatedAt}}\t{{.Status}}\t{{.Labels}}\t{{.Command}}'

            echo ""
            echo "Available backups:"
            sudo docker run --rm \
              -v /opt/backups/qs-server/mongodb:/backup:ro \
              --entrypoint /bin/bash \
              mongo:7.0 -Eeuo pipefail -c '
                shopt -s nullglob
                FILES=(/backup/qs_mongodb_backup_*.archive.gz /backup/qs_mongodb_backup_*.partial)
                if (( ${#FILES[@]} == 0 )); then
                  echo "No backups or partial archives found"
                else
                  ls -lht -- "${FILES[@]}" | head -10
                fi
              '
        env:
          MONGODB_HOST: ${{ secrets.MONGODB_HOST }}
          MONGODB_PORT: ${{ secrets.MONGODB_PORT || 27017 }}
          MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
          MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
          MONGODB_DBNAME: ${{ secrets.MONGODB_DBNAME }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT || 3306 }}
          MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          AUDIT_FROM: ${{ github.event.inputs.audit_from }}

  mongodb-presentation-governance:
    name: MongoDB Interpretation Presentation Governance
    if: github.event.inputs.operation == 'govern-presentation' && github.event.inputs.database == 'mongodb'
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64, ops]
    timeout-minutes: 180
    environment: production
    steps:
      - name: Checkout immutable governance tool
        uses: actions/checkout@v6

      - name: Validate SSH configuration
        env:
          SVRA_HOST: ${{ vars.SVRA_HOST }}
          SVRA_USERNAME: ${{ vars.SVRA_USERNAME }}
          SVRA_SSH_KEY: ${{ secrets.SVRA_SSH_KEY }}
          SVRA_SSH_PORT: ${{ vars.SVRA_SSH_PORT || 22 }}
          SVRA_SSH_FINGERPRINT: ${{ vars.SVRA_SSH_FINGERPRINT }}
        run: |
          set -Eeuo pipefail
          : "${SVRA_HOST:?SVRA_HOST is empty}"
          : "${SVRA_USERNAME:?SVRA_USERNAME is empty}"
          : "${SVRA_SSH_KEY:?SVRA_SSH_KEY is empty}"
          : "${SVRA_SSH_FINGERPRINT:?SVRA_SSH_FINGERPRINT is empty}"
          if ! [[ "$SVRA_SSH_PORT" =~ ^[0-9]+$ ]] || (( SVRA_SSH_PORT < 1 || SVRA_SSH_PORT > 65535 )); then
            echo "❌ SVRA_SSH_PORT is invalid" >&2
            exit 1
          fi

      - name: Transfer governance tool with pinned host identity
        env:
          SVRA_HOST: ${{ vars.SVRA_HOST }}
          SVRA_USERNAME: ${{ vars.SVRA_USERNAME }}
          SVRA_SSH_KEY: ${{ secrets.SVRA_SSH_KEY }}
          SVRA_SSH_PORT: ${{ vars.SVRA_SSH_PORT || 22 }}
          SVRA_SSH_FINGERPRINT: ${{ vars.SVRA_SSH_FINGERPRINT }}
          GOVERNANCE_RUN_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          if ! [[ "$GOVERNANCE_RUN_TOKEN" =~ ^[0-9]+-[0-9]+$ ]]; then
            echo "❌ Invalid governance run token" >&2
            exit 1
          fi

          KEY_FILE="${RUNNER_TEMP}/qs-svra-${GOVERNANCE_RUN_TOKEN}.key"
          KNOWN_HOSTS_FILE="${RUNNER_TEMP}/qs-svra-${GOVERNANCE_RUN_TOKEN}.known_hosts"
          REMOTE_TOOL="/tmp/qs-server-presentation-governance-${GOVERNANCE_RUN_TOKEN}.js"
          cleanup_local_credentials() {
            rm -f -- "$KEY_FILE" "$KNOWN_HOSTS_FILE"
          }
          trap cleanup_local_credentials EXIT

          umask 077
          printf '%s\n' "$SVRA_SSH_KEY" > "$KEY_FILE"
          ssh-keyscan -T 10 -p "$SVRA_SSH_PORT" "$SVRA_HOST" 2>/dev/null > "$KNOWN_HOSTS_FILE"
          if [ ! -s "$KNOWN_HOSTS_FILE" ]; then
            echo "❌ Unable to obtain ServerA SSH host keys" >&2
            exit 1
          fi
          if ! ssh-keygen -lf "$KNOWN_HOSTS_FILE" -E sha256 |
            awk '{print $2}' |
            grep -Fqx -- "$SVRA_SSH_FINGERPRINT"; then
            echo "❌ ServerA SSH fingerprint mismatch" >&2
            exit 1
          fi

          scp -q \
            -i "$KEY_FILE" \
            -P "$SVRA_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            scripts/oneoff/govern_interpretation_presentation_profiles/govern.js \
            "${SVRA_USERNAME}@${SVRA_HOST}:${REMOTE_TOOL}"
          echo "✅ Governance tool transferred for run ${GOVERNANCE_RUN_TOKEN}"

      - name: Execute manifest-driven presentation governance
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.SVRA_HOST }}
          username: ${{ vars.SVRA_USERNAME }}
          key: ${{ secrets.SVRA_SSH_KEY }}
          port: ${{ vars.SVRA_SSH_PORT || 22 }}
          fingerprint: ${{ vars.SVRA_SSH_FINGERPRINT }}
          command_timeout: 175m
          envs: MONGODB_HOST,MONGODB_PORT,MONGODB_USERNAME,MONGODB_PASSWORD,MONGODB_DBNAME,GITHUB_RUN_ID_INPUT,GITHUB_RUN_ATTEMPT_INPUT,PRESENTATION_OPERATION_INPUT,PRESENTATION_MANIFEST_INPUT,PRESENTATION_AFTER_ID_INPUT,PRESENTATION_MAX_RECORDS_INPUT,PRESENTATION_REQUIRE_COMPLETE_INPUT,PRESENTATION_CONFIRM_INPUT,BACKUP_FILE_INPUT
          script: |
            set -Eeuo pipefail
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin${PATH:+:$PATH}"

            : "${MONGODB_HOST:?MONGODB_HOST is empty (check production Environment secrets)}"
            : "${MONGODB_DBNAME:?MONGODB_DBNAME is empty}"
            : "${MONGODB_USERNAME:?MONGODB_USERNAME is empty}"
            : "${MONGODB_PASSWORD:?MONGODB_PASSWORD is empty}"
            if ! [[ "$MONGODB_DBNAME" =~ ^[A-Za-z0-9_-]+$ ]]; then
              echo "❌ MONGODB_DBNAME contains unsupported characters" >&2
              exit 1
            fi
            if ! [[ "$GITHUB_RUN_ID_INPUT" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT_INPUT" =~ ^[0-9]+$ ]]; then
              echo "❌ Invalid GitHub run identity" >&2
              exit 1
            fi
            if ! [[ "$PRESENTATION_AFTER_ID_INPUT" =~ ^[0-9]+$ && "$PRESENTATION_MAX_RECORDS_INPUT" =~ ^[0-9]+$ ]]; then
              echo "❌ Presentation range inputs must be unsigned decimal integers" >&2
              exit 1
            fi
            if [[ "$PRESENTATION_REQUIRE_COMPLETE_INPUT" != "true" && "$PRESENTATION_REQUIRE_COMPLETE_INPUT" != "false" ]]; then
              echo "❌ PRESENTATION_REQUIRE_COMPLETE_INPUT must be true or false" >&2
              exit 1
            fi
            case "$PRESENTATION_OPERATION_INPUT" in
              audit|apply|verify|rollback) ;;
              *)
                echo "❌ Unsupported presentation operation: $PRESENTATION_OPERATION_INPUT" >&2
                exit 1
                ;;
            esac
            if ! sudo docker network inspect infra-network >/dev/null 2>&1; then
              echo "❌ infra-network is unavailable" >&2
              exit 1
            fi

            GOVERNANCE_RUN_TOKEN="${GITHUB_RUN_ID_INPUT}-${GITHUB_RUN_ATTEMPT_INPUT}"
            TOOL_FILE="/tmp/qs-server-presentation-governance-${GOVERNANCE_RUN_TOKEN}.js"
            MANIFEST_DIR="/opt/backups/qs-server/interpretation-presentation"
            MONGO_BACKUP_DIR="/opt/backups/qs-server/mongodb"
            CONTAINER_NAME="qs-server-presentation-governance-${GOVERNANCE_RUN_TOKEN}"
            cleanup_governance() {
              sudo docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
              rm -f -- "$TOOL_FILE"
            }
            trap cleanup_governance EXIT
            if [ ! -s "$TOOL_FILE" ]; then
              echo "❌ Transferred governance tool is missing or empty" >&2
              exit 1
            fi

            sudo install -d -m 0750 "$MANIFEST_DIR"
            if [ "$PRESENTATION_OPERATION_INPUT" = "audit" ]; then
              MANIFEST_NAME="interpretation-presentation-${GOVERNANCE_RUN_TOKEN}.json"
              if sudo test -e "$MANIFEST_DIR/$MANIFEST_NAME" || sudo test -e "$MANIFEST_DIR/$MANIFEST_NAME.partial"; then
                echo "❌ Refusing to overwrite an existing audit manifest: $MANIFEST_NAME" >&2
                exit 1
              fi
              MANIFEST_MOUNT="$MANIFEST_DIR:/work"
            else
              MANIFEST_NAME="$PRESENTATION_MANIFEST_INPUT"
              if ! [[ "$MANIFEST_NAME" =~ ^interpretation-presentation-[0-9]+-[0-9]+\.json$ ]]; then
                echo "❌ Invalid or missing presentation manifest name" >&2
                exit 1
              fi
              if ! sudo test -s "$MANIFEST_DIR/$MANIFEST_NAME" || ! sudo test -s "$MANIFEST_DIR/$MANIFEST_NAME.sha256"; then
                echo "❌ Presentation manifest or checksum is missing: $MANIFEST_NAME" >&2
                exit 1
              fi
              sudo docker run --rm --network none \
                -v "$MANIFEST_DIR:/work:ro" \
                --entrypoint /bin/sh \
                mongo:7.0 -c 'cd /work && sha256sum --check "$1.sha256"' sh "$MANIFEST_NAME"
              MANIFEST_MOUNT="$MANIFEST_DIR:/work:ro"
            fi

            if [[ "$PRESENTATION_OPERATION_INPUT" = "apply" || "$PRESENTATION_OPERATION_INPUT" = "rollback" ]]; then
              if ! [[ "$BACKUP_FILE_INPUT" =~ ^qs_mongodb_backup_[0-9]{8}_[0-9]{6}\.archive\.gz$ ]]; then
                echo "❌ A valid MongoDB backup name is required for write operations" >&2
                exit 1
              fi
              if ! sudo test -s "$MONGO_BACKUP_DIR/$BACKUP_FILE_INPUT"; then
                echo "❌ Required MongoDB backup is missing or empty: $BACKUP_FILE_INPUT" >&2
                exit 1
              fi
              echo "Write safety backup: $BACKUP_FILE_INPUT"
            fi

            MONGODB_PORT="${MONGODB_PORT:-27017}"
            MONGODB_URI="mongodb://${MONGODB_HOST}:${MONGODB_PORT}/${MONGODB_DBNAME}?connectTimeoutMS=30000&socketTimeoutMS=0"
            echo "Presentation governance operation: $PRESENTATION_OPERATION_INPUT"
            echo "Collection: interpret_report_artifacts"
            echo "Manifest: $MANIFEST_NAME"
            echo "Range: after_id=$PRESENTATION_AFTER_ID_INPUT max_records=$PRESENTATION_MAX_RECORDS_INPUT"

            sudo docker run --rm --network infra-network \
              --name "$CONTAINER_NAME" \
              --label "com.fangcunmount.qs-server.operation=interpretation-presentation-governance" \
              --label "com.fangcunmount.qs-server.github-run-id=$GITHUB_RUN_ID_INPUT" \
              -v "$TOOL_FILE:/tool/govern.js:ro" \
              -v "$MANIFEST_MOUNT" \
              -e PRESENTATION_OPERATION="$PRESENTATION_OPERATION_INPUT" \
              -e PRESENTATION_COLLECTION="interpret_report_artifacts" \
              -e PRESENTATION_MANIFEST_PATH="/work/$MANIFEST_NAME" \
              -e PRESENTATION_AFTER_ID="$PRESENTATION_AFTER_ID_INPUT" \
              -e PRESENTATION_MAX_RECORDS="$PRESENTATION_MAX_RECORDS_INPUT" \
              -e PRESENTATION_REQUIRE_COMPLETE="$PRESENTATION_REQUIRE_COMPLETE_INPUT" \
              -e PRESENTATION_CONFIRM="$PRESENTATION_CONFIRM_INPUT" \
              --entrypoint /usr/bin/timeout \
              mongo:7.0 170m mongosh "$MONGODB_URI" \
                --username="$MONGODB_USERNAME" \
                --password="$MONGODB_PASSWORD" \
                --authenticationDatabase=admin \
                --quiet \
                --file=/tool/govern.js

            if [ "$PRESENTATION_OPERATION_INPUT" = "audit" ]; then
              if ! sudo test -s "$MANIFEST_DIR/$MANIFEST_NAME"; then
                echo "❌ Audit did not create a non-empty manifest" >&2
                exit 1
              fi
              sudo docker run --rm --network none \
                -v "$MANIFEST_DIR:/work" \
                --entrypoint /bin/sh \
                mongo:7.0 -c 'cd /work && sha256sum "$1" > "$1.sha256" && chmod 0440 "$1" "$1.sha256"' sh "$MANIFEST_NAME"
              echo "✅ Immutable audit manifest: $MANIFEST_NAME"
            fi
            echo "✅ Presentation governance operation completed"
        env:
          MONGODB_HOST: ${{ secrets.MONGODB_HOST }}
          MONGODB_PORT: ${{ secrets.MONGODB_PORT || 27017 }}
          MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
          MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
          MONGODB_DBNAME: ${{ secrets.MONGODB_DBNAME }}
          GITHUB_RUN_ID_INPUT: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT_INPUT: ${{ github.run_attempt }}
          PRESENTATION_OPERATION_INPUT: ${{ github.event.inputs.governance_operation }}
          PRESENTATION_MANIFEST_INPUT: ${{ github.event.inputs.governance_manifest }}
          PRESENTATION_AFTER_ID_INPUT: ${{ github.event.inputs.presentation_after_id }}
          PRESENTATION_MAX_RECORDS_INPUT: ${{ github.event.inputs.presentation_max_records }}
          PRESENTATION_REQUIRE_COMPLETE_INPUT: ${{ github.event.inputs.presentation_require_complete }}
          PRESENTATION_CONFIRM_INPUT: ${{ github.event.inputs.governance_confirm }}
          BACKUP_FILE_INPUT: ${{ github.event.inputs.backup_name }}

