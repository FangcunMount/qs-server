                  testee_id: {$toString: "$testee_id"},
                  org_id: {$toString: "$org_id"},
                  risk_level: {$ifNull: ["$risk_level", ""]},
                  generated_at: 1
                }},
                {$lookup: {
                  from: "interpretation_attention_projections",
                  localField: "report_id",
                  foreignField: "report_id",
                  as: "projection"
                }},
                {$match: {projection: {$size: 0}}},
                {$project: {projection: 0}},
                {$sort: {generated_at: 1, report_id: 1}}
              ], {allowDiskUse: true}).toArray()
              const numericID = /^[1-9][0-9]*$/
              for (const gap of gaps) {
                for (const field of ["report_id", "assessment_id", "testee_id", "org_id"]) {
                  if (!numericID.test(gap[field] || "")) {
                    throw new Error(`invalid ${field} in Attention gap audit`)
                  }
                }
              }
              const gapCountsByRisk = Object.entries(gaps.reduce((counts, gap) => {
                counts[gap.risk_level] = (counts[gap.risk_level] || 0) + 1
                return counts
              }, {})).sort(([left], [right]) => left.localeCompare(right)).map(([risk_level, count]) => ({risk_level, count}))
              const reportsPerTestee = gaps.reduce((counts, gap) => {
                counts[gap.testee_id] = (counts[gap.testee_id] || 0) + 1
                return counts
              }, {})
              const safetyCutoff = new Date(Date.now() - 30 * 60 * 1000)
              const crypto = require("crypto")
              const manifestLines = gaps.map(gap => [
                gap.report_id, gap.assessment_id, gap.testee_id, gap.risk_level, "true"
              ].join("\t")).sort()
              const manifestFingerprint = crypto.createHash("sha256")
                .update(manifestLines.join("\n") + "\n")
                .digest("hex")
              print(`High-risk report artifact attention coverage since ${process.env.AUDIT_FROM}:`)
              printjson({
                artifacts: targetDB.getCollection("interpret_report_artifacts").countDocuments({
