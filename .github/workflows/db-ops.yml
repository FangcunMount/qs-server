              }
              const gaps = targetDB.getCollection("interpret_report_artifacts").aggregate([
                {$match: {
                  deleted_at: null,
                  generated_at: {$gte: from},
                  risk_level: {$in: ["high", "severe"]}
                }},
                {$project: {
                  report_id: {$toString: "$domain_id"},
