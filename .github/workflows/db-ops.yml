            if [ "$MODEL_TEMPLATE_ROUTE_AFTER_ID_INPUT" = "0" ]; then
              MODEL_TEMPLATE_ROUTE_AFTER_ID_INPUT=""
            elif [ -n "$MODEL_TEMPLATE_ROUTE_AFTER_ID_INPUT" ] && ! [[ "$MODEL_TEMPLATE_ROUTE_AFTER_ID_INPUT" =~ ^[a-f0-9]{24}$ ]]; then
              echo "❌ Invalid model template route after_id" >&2
              exit 1
            fi
            if ! [[ "$MODEL_TEMPLATE_ROUTE_MAX_RECORDS_INPUT" =~ ^[0-9]+$ ]]; then
              echo "❌ Invalid model template route max_records" >&2
              exit 1
            fi
            if ! [[ "$MODEL_TEMPLATE_ROUTE_REQUIRE_COMPLETE_INPUT" =~ ^(true|false)$ ]]; then
              echo "❌ Invalid model template route require_complete" >&2
              exit 1
            fi
            if ! sudo docker network inspect infra-network >/dev/null 2>&1; then
              echo "❌ infra-network is unavailable" >&2
              exit 1
            fi

            GOVERNANCE_RUN_TOKEN="${GITHUB_RUN_ID_INPUT}-${GITHUB_RUN_ATTEMPT_INPUT}"
            TOOL_FILE="/tmp/qs-server-model-template-route-governance-${GOVERNANCE_RUN_TOKEN}.js"
            HASH_TOOL_AMD64="/tmp/qs-server-model-template-route-hash-${GOVERNANCE_RUN_TOKEN}-amd64"
            HASH_TOOL_ARM64="/tmp/qs-server-model-template-route-hash-${GOVERNANCE_RUN_TOKEN}-arm64"
            if [ "$MODEL_TEMPLATE_ROUTE_OPERATION_INPUT" = "audit" ]; then
              case "$(uname -m)" in
                x86_64|amd64) HASH_TOOL_FILE="$HASH_TOOL_AMD64" ;;
                aarch64|arm64) HASH_TOOL_FILE="$HASH_TOOL_ARM64" ;;
                *)
                  echo "❌ Unsupported ServerA architecture: $(uname -m)" >&2
                  exit 1
                  ;;
              esac
            else
              # Non-audit operations consume the immutable enriched manifest
              # and never execute the canonical hash helper.
              HASH_TOOL_FILE="$TOOL_FILE"
            fi
            MANIFEST_DIR="/opt/backups/qs-server/interpretation-model-template-route"
            MONGO_BACKUP_DIR="/opt/backups/qs-server/mongodb"
            CONTAINER_NAME="qs-server-model-template-route-${GOVERNANCE_RUN_TOKEN}"
            cleanup_governance() {
              sudo docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
              rm -f -- "$TOOL_FILE" "$HASH_TOOL_AMD64" "$HASH_TOOL_ARM64"
            }
            trap cleanup_governance EXIT
            if [ ! -s "$TOOL_FILE" ]; then
              echo "❌ Transferred model template route governance tool is missing or invalid" >&2
              exit 1
            fi
            if [ "$MODEL_TEMPLATE_ROUTE_OPERATION_INPUT" = "audit" ]; then
              if [ ! -s "$HASH_TOOL_FILE" ] || [ ! -x "$HASH_TOOL_FILE" ]; then
                echo "❌ Transferred canonical hash helper is missing or invalid" >&2
                exit 1
              fi
            fi

            sudo install -d -m 0750 "$MANIFEST_DIR"
            if [ "$MODEL_TEMPLATE_ROUTE_OPERATION_INPUT" = "audit" ]; then
              MANIFEST_NAME="interpretation-model-template-route-${GOVERNANCE_RUN_TOKEN}.json"
              if sudo test -e "$MANIFEST_DIR/$MANIFEST_NAME" || sudo test -e "$MANIFEST_DIR/$MANIFEST_NAME.partial"; then
                echo "❌ Refusing to overwrite an existing model template route manifest: $MANIFEST_NAME" >&2
                exit 1
              fi
              MANIFEST_MOUNT="$MANIFEST_DIR:/work"
            else
              MANIFEST_NAME="$MODEL_TEMPLATE_ROUTE_MANIFEST_INPUT"
              if ! [[ "$MANIFEST_NAME" =~ ^interpretation-model-template-route-[0-9]+-[0-9]+\.json$ ]]; then
                echo "❌ Invalid or missing model template route manifest name" >&2
                exit 1
              fi
              if ! sudo test -s "$MANIFEST_DIR/$MANIFEST_NAME" || ! sudo test -s "$MANIFEST_DIR/$MANIFEST_NAME.sha256"; then
                echo "❌ Model template route manifest or checksum is missing: $MANIFEST_NAME" >&2
                exit 1
              fi
              sudo docker run --rm --network none \
                -v "$MANIFEST_DIR:/work:ro" \
                --entrypoint /bin/sh \
                mongo:7.0 -c 'cd /work && sha256sum --check "$1.sha256"' sh "$MANIFEST_NAME"
              MANIFEST_MOUNT="$MANIFEST_DIR:/work:ro"
            fi

            if [[ "$MODEL_TEMPLATE_ROUTE_OPERATION_INPUT" = "apply" || "$MODEL_TEMPLATE_ROUTE_OPERATION_INPUT" = "rollback" ]]; then
              if ! [[ "$BACKUP_FILE_INPUT" =~ ^qs_mongodb_backup_[0-9]{8}_[0-9]{6}\.archive\.gz$ ]]; then
                echo "❌ A valid MongoDB backup name is required for write operations" >&2
                exit 1
              fi
              if ! sudo test -s "$MONGO_BACKUP_DIR/$BACKUP_FILE_INPUT"; then
                echo "❌ Required MongoDB backup is missing or empty: $BACKUP_FILE_INPUT" >&2
                exit 1
              fi
              echo "Write safety backup: $BACKUP_FILE_INPUT"
            fi

            MONGODB_PORT="${MONGODB_PORT:-27017}"
            MONGODB_URI="mongodb://${MONGODB_HOST}:${MONGODB_PORT}/${MONGODB_DBNAME}?connectTimeoutMS=30000&socketTimeoutMS=0"
            echo "Model template route governance operation: $MODEL_TEMPLATE_ROUTE_OPERATION_INPUT"
            echo "Collection: assessment_models"
            echo "Manifest: $MANIFEST_NAME"

            sudo docker run --rm --network infra-network \
              --name "$CONTAINER_NAME" \
              --label "com.fangcunmount.qs-server.operation=interpretation-model-template-route-governance" \
              --label "com.fangcunmount.qs-server.github-run-id=$GITHUB_RUN_ID_INPUT" \
              -v "$TOOL_FILE:/tool/govern.js:ro" \
              -v "$HASH_TOOL_FILE:/tool/enrich-manifest:ro" \
              -v "$MANIFEST_MOUNT" \
              -e MONGODB_HOST="$MONGODB_HOST" \
              -e MONGODB_PORT="$MONGODB_PORT" \
              -e MONGODB_USERNAME="$MONGODB_USERNAME" \
              -e MONGODB_PASSWORD="$MONGODB_PASSWORD" \
              -e MONGODB_DBNAME="$MONGODB_DBNAME" \
              -e MONGODB_URI="$MONGODB_URI" \
              -e MODEL_TEMPLATE_ROUTE_OPERATION="$MODEL_TEMPLATE_ROUTE_OPERATION_INPUT" \
              -e MODEL_TEMPLATE_ROUTE_MANIFEST_PATH="/work/$MANIFEST_NAME" \
              -e MODEL_TEMPLATE_ROUTE_AFTER_ID="$MODEL_TEMPLATE_ROUTE_AFTER_ID_INPUT" \
              -e MODEL_TEMPLATE_ROUTE_MAX_RECORDS="$MODEL_TEMPLATE_ROUTE_MAX_RECORDS_INPUT" \
              -e MODEL_TEMPLATE_ROUTE_REQUIRE_COMPLETE="$MODEL_TEMPLATE_ROUTE_REQUIRE_COMPLETE_INPUT" \
              -e MODEL_TEMPLATE_ROUTE_CONFIRM="$MODEL_TEMPLATE_ROUTE_CONFIRM_INPUT" \
              --entrypoint /usr/bin/timeout \
              mongo:7.0 80m /bin/bash -Eeuo pipefail -c '
                mongosh "$MONGODB_URI" \
                  --username="$MONGODB_USERNAME" \
                  --password="$MONGODB_PASSWORD" \
                  --authenticationDatabase=admin \
                  --quiet \
                  --file=/tool/govern.js
                if [ "$MODEL_TEMPLATE_ROUTE_OPERATION" = "audit" ]; then
                  /tool/enrich-manifest
                fi
              '

            if [ "$MODEL_TEMPLATE_ROUTE_OPERATION_INPUT" = "audit" ]; then
              if ! sudo test -s "$MANIFEST_DIR/$MANIFEST_NAME"; then
                echo "❌ Audit did not create a non-empty model template route manifest" >&2
                exit 1
              fi
              sudo docker run --rm --network none \
                -v "$MANIFEST_DIR:/work" \
                --entrypoint /bin/sh \
                mongo:7.0 -c 'cd /work && sha256sum "$1" > "$1.sha256" && chmod 0440 "$1" "$1.sha256"' sh "$MANIFEST_NAME"
              echo "✅ Immutable model template route manifest: $MANIFEST_NAME"
            fi
            echo "✅ Model template route governance operation completed"
        env:
          MONGODB_HOST: ${{ secrets.MONGODB_HOST }}
          MONGODB_PORT: ${{ secrets.MONGODB_PORT || 27017 }}
          MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
          MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
          MONGODB_DBNAME: ${{ secrets.MONGODB_DBNAME }}
          GITHUB_RUN_ID_INPUT: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT_INPUT: ${{ github.run_attempt }}
          MODEL_TEMPLATE_ROUTE_OPERATION_INPUT: ${{ github.event.inputs.governance_operation }}
          MODEL_TEMPLATE_ROUTE_MANIFEST_INPUT: ${{ github.event.inputs.governance_manifest }}
          MODEL_TEMPLATE_ROUTE_AFTER_ID_INPUT: ${{ github.event.inputs.presentation_after_id }}
          MODEL_TEMPLATE_ROUTE_MAX_RECORDS_INPUT: ${{ github.event.inputs.presentation_max_records }}
          MODEL_TEMPLATE_ROUTE_REQUIRE_COMPLETE_INPUT: ${{ github.event.inputs.presentation_require_complete }}
          MODEL_TEMPLATE_ROUTE_CONFIRM_INPUT: ${{ github.event.inputs.governance_confirm }}
          BACKUP_FILE_INPUT: ${{ github.event.inputs.backup_name }}

  mysql-status:
    name: MySQL Status
    if: github.event.inputs.operation == 'status' && (github.event.inputs.database == 'mysql' || github.event.inputs.database == 'all')
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64, ops]
    environment: production
    steps:
      - name: Validate SSH configuration
        env:
          SVRA_HOST: ${{ vars.SVRA_HOST }}
          SVRA_USERNAME: ${{ vars.SVRA_USERNAME }}
          SVRA_SSH_KEY: ${{ secrets.SVRA_SSH_KEY }}
          SVRA_SSH_FINGERPRINT: ${{ vars.SVRA_SSH_FINGERPRINT }}
        run: |
          set -Eeuo pipefail
          : "${SVRA_HOST:?SVRA_HOST is empty}"
          : "${SVRA_USERNAME:?SVRA_USERNAME is empty}"
          : "${SVRA_SSH_KEY:?SVRA_SSH_KEY is empty}"
          : "${SVRA_SSH_FINGERPRINT:?SVRA_SSH_FINGERPRINT is empty}"

      - name: Check MySQL recovery status
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.SVRA_HOST }}
          username: ${{ vars.SVRA_USERNAME }}
          key: ${{ secrets.SVRA_SSH_KEY }}
          port: ${{ vars.SVRA_SSH_PORT || 22 }}
          fingerprint: ${{ vars.SVRA_SSH_FINGERPRINT }}
          envs: MYSQL_HOST,MYSQL_PORT,MYSQL_USERNAME,MYSQL_PASSWORD,MYSQL_DATABASE,AUDIT_FROM
          script: |
            set -Eeuo pipefail
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin${PATH:+:$PATH}"

            : "${MYSQL_HOST:?MYSQL_HOST is empty}"
            : "${MYSQL_USERNAME:?MYSQL_USERNAME is empty}"
            : "${MYSQL_PASSWORD:?MYSQL_PASSWORD is empty}"
            : "${MYSQL_DATABASE:?MYSQL_DATABASE is empty}"

            if ! sudo docker network inspect infra-network >/dev/null 2>&1; then
              echo "❌ infra-network is unavailable" >&2
              exit 1
            fi
            if [ -n "${AUDIT_FROM:-}" ] && ! [[ "$AUDIT_FROM" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
              echo "❌ audit_from must use YYYY-MM-DDTHH:MM:SSZ" >&2
              exit 1
            fi

            audit_clause=""
            event_audit_clause=""
            hold_audit_clause=""
            if [ -n "${AUDIT_FROM:-}" ]; then
              audit_from_mysql="CONVERT_TZ('${AUDIT_FROM%Z}', '+00:00', '+08:00')"
              audit_clause="AND failed_at >= ${audit_from_mysql}"
              event_audit_clause="OR (status = 'published' AND created_at >= ${audit_from_mysql})"
              hold_audit_clause="OR (status = 'replayed' AND updated_at >= ${audit_from_mysql})"
            fi
            sudo docker run --rm --network infra-network \
              -e MYSQL_PWD="$MYSQL_PASSWORD" \
              mysql:8.0 mysql --protocol=tcp \
                --host="$MYSQL_HOST" \
                --port="${MYSQL_PORT:-3306}" \
                --user="$MYSQL_USERNAME" \
                --database="$MYSQL_DATABASE" \
                --batch --raw \
                --execute="
                  SELECT VERSION() AS mysql_version;
                  SELECT @@transaction_isolation AS transaction_isolation;
                  SELECT version AS schema_migration_version, dirty AS schema_migration_dirty
                  FROM schema_migrations
                  LIMIT 1;
                  SELECT table_name, engine, table_rows, data_length, index_length
                  FROM information_schema.tables
                  WHERE table_schema = DATABASE() AND table_type = 'BASE TABLE'
                  ORDER BY table_name;
                  SELECT table_name AS unexpected_retirement_table
                  FROM information_schema.tables
                  WHERE table_schema = DATABASE()
                    AND table_type = 'BASE TABLE'
                    AND table_name IN (
                      'analytics_scan_watermarks',
                      'seed_orphan_outbox_bak_hist_v1_20260802_r1',
                      'seed_orphan_outbox_bak_hist_v1_orphans_20260802',
                      'seed_orphan_stats_bak_hist_v1_20260802_r1',
                      'seed_orphan_stats_bak_hist_v1_orphans_20260802'
                    )
                  ORDER BY table_name;
                  WITH ranked_assessments AS (
                    SELECT assessment.testee_id,
                           COUNT(*) OVER (PARTITION BY assessment.testee_id) AS total_evaluated,
                           assessment.evaluated_at AS last_evaluated_at,
                           COALESCE(assessment.risk_level, '') AS risk_level,
                           ROW_NUMBER() OVER (
                             PARTITION BY assessment.testee_id
                             ORDER BY assessment.evaluated_at DESC, assessment.id DESC
                           ) AS row_num
                    FROM assessment FORCE INDEX (idx_assessment_org_testee_evaluated_summary)
                    WHERE assessment.status = 'evaluated'
                      AND assessment.deleted_at IS NULL
                  ), canonical_assessment_summary AS (
                    SELECT testee_id, total_evaluated, last_evaluated_at, risk_level
                    FROM ranked_assessments
                    WHERE row_num = 1
                  )
                  SELECT COUNT(*) AS active_testees,
                         SUM(testee.total_assessments <> 0) AS legacy_total_non_default,
                         SUM(testee.last_assessment_at IS NOT NULL) AS legacy_last_at_non_default,
                         SUM(COALESCE(testee.last_risk_level, '') <> '') AS legacy_risk_non_default,
                         SUM(testee.total_assessments <> COALESCE(canonical.total_evaluated, 0))
                           AS legacy_total_mismatches,
                         SUM(NOT (testee.last_assessment_at <=> canonical.last_evaluated_at))
                           AS legacy_last_at_mismatches,
                         SUM(COALESCE(testee.last_risk_level, '') <> COALESCE(canonical.risk_level, ''))
                           AS legacy_risk_mismatches
                  FROM testee
                  LEFT JOIN canonical_assessment_summary AS canonical
                    ON canonical.testee_id = testee.id
                  WHERE testee.deleted_at IS NULL;
                  SELECT table_name AS retired_table_still_present
                  FROM information_schema.tables
                  WHERE table_schema = DATABASE()
                    AND table_name IN (
                      'analytics_projector_checkpoint',
                      'evaluation_run',
                      'behavior_footprint',
                      'assessment_episode',
                      'analytics_pending_event',
                      'statistics_daily',
                      'statistics_accumulated',
                      'statistics_plan',
                      'statistics_journey_daily',
                      'statistics_content_daily',
                      'statistics_plan_daily',
                      'statistics_v2_org_snapshot',
                      'seed_backfill_stage',
                      'seed_backfill_stage_attempt',
                      'seed_backfill_rollback_operation',
                      'seed_backfill_rollback_resource',
                      'seed_backfill_rollback_phase_attempt'
                    )
                  ORDER BY table_name;
                  SELECT table_name, column_name AS retired_column_still_present
                  FROM information_schema.columns
                  WHERE table_schema = DATABASE()
                    AND (
                      (table_name = 'assessment' AND column_name IN (
                        'questionnaire_id',
                        'medical_scale_id',
                        'medical_scale_code',
                        'medical_scale_name',
                        'interpreted_at',
                        'current_run_id'
                      ))
                      OR (table_name = 'assessment_score' AND column_name IN (
                        'medical_scale_id',
                        'medical_scale_code',
                        'conclusion',
                        'suggestion'
                      ))
                      OR (table_name = 'evaluation_outcome' AND column_name IN (
                        'payload_format',
                        'algorithm_family'
                      ))
                      OR (table_name IN ('assessment_plan', 'assessment_task') AND column_name = 'scale_id')
                    )
                  ORDER BY table_name, column_name;
                  SELECT table_name, index_name AS retired_index_still_present
                  FROM information_schema.statistics
                  WHERE table_schema = DATABASE()
                    AND (
                      (table_name = 'assessment' AND index_name IN (
                        'idx_questionnaire_id',
                        'idx_assessment_current_run_id',
                        'idx_assessment_testee_scale_deleted_id',
                        'idx_medical_scale_id'
                      ))
                      OR (table_name = 'assessment_score' AND index_name IN (
                        'idx_score_testee_scale_deleted_id',
                        'idx_medical_scale_id'
                      ))
                      OR (table_name IN ('assessment_plan', 'assessment_task') AND index_name = 'idx_scale_id')
                    )
                  GROUP BY table_name, index_name
                  ORDER BY table_name, index_name;
                  SELECT expected.table_name AS canonical_statistics_table_missing
                  FROM (
                    SELECT 'statistics_access_fact' AS table_name
                    UNION ALL SELECT 'statistics_assessment_fact'
                    UNION ALL SELECT 'statistics_plan_fact'
                    UNION ALL SELECT 'statistics_access_daily'
                    UNION ALL SELECT 'statistics_assessment_daily'
                    UNION ALL SELECT 'statistics_plan_activity_daily'
                    UNION ALL SELECT 'statistics_plan_fulfillment_daily'
                    UNION ALL SELECT 'statistics_org_snapshot'
                    UNION ALL SELECT 'statistics_sync_run'
                  ) AS expected
                  LEFT JOIN information_schema.tables AS actual
                    ON actual.table_schema = DATABASE()
                   AND actual.table_name = expected.table_name
                   AND actual.table_type = 'BASE TABLE'
                  WHERE actual.table_name IS NULL
                  ORDER BY expected.table_name;
                  SELECT event_type, status, COALESCE(retry_disposition, '') AS retry_disposition,
                         COUNT(*) AS records, MIN(created_at) AS oldest_created_at,
                         MAX(updated_at) AS latest_updated_at, MAX(attempt_count) AS max_attempt_count
                  FROM domain_event_outbox
                  WHERE status <> 'published' ${event_audit_clause}
                  GROUP BY event_type, status, retry_disposition
                  ORDER BY event_type, status, retry_disposition;
                  SELECT DISTINCT event_type AS unexpected_active_event_type
                  FROM domain_event_outbox
                  WHERE (status <> 'published' ${event_audit_clause})
                    AND event_type NOT IN (
                      'evaluation.requested',
                      'evaluation.retry.requested',
                      'evaluation.outcome.committed',
                      'evaluation.failed'
                    )
                  ORDER BY event_type;
                  SELECT status, COALESCE(retry_disposition, '') AS retry_disposition,
                         COUNT(*) AS records, MIN(blocked_at) AS oldest_blocked_at,
                         MAX(updated_at) AS latest_updated_at,
                         MAX(replay_attempt_count) AS max_replay_attempt_count
                  FROM retry_event_hold
                  WHERE status <> 'replayed' ${hold_audit_clause}
                  GROUP BY status, retry_disposition
                  ORDER BY status, retry_disposition;
                  SELECT run_mode, status, stage, COUNT(*) AS runs,
                         MIN(started_at) AS first_started_at,
                         MAX(started_at) AS last_started_at
                  FROM statistics_sync_run
                  GROUP BY run_mode, status, stage
                  ORDER BY run_mode, status, stage;
                  WITH latest_publish AS (
                    SELECT org_id, id, as_of_date, status, stage, cache_generation,
                           cache_published_at, started_at, finished_at,
                           ROW_NUMBER() OVER (PARTITION BY org_id ORDER BY id DESC) AS row_num
                    FROM statistics_sync_run
                    WHERE run_mode = 'publish'
                  )
                  SELECT publish.org_id, publish.id AS latest_publish_run_id,
                         publish.as_of_date, publish.status, publish.stage,
                         publish.cache_generation, publish.cache_published_at,
                         publish.started_at, publish.finished_at,
                         snapshot.as_of_date AS snapshot_as_of_date,
                         snapshot.snapshot_at
                  FROM latest_publish AS publish
                  LEFT JOIN statistics_org_snapshot AS snapshot
                    ON snapshot.org_id = publish.org_id
                  WHERE publish.row_num = 1
                  ORDER BY publish.org_id;
                  SELECT id, org_id, run_mode, status, stage, as_of_date,
                         cache_generation, cache_published_at, started_at,
                         data_committed_at, finished_at, error_code
                  FROM statistics_sync_run
                  WHERE (status = 'running' AND started_at < NOW(3) - INTERVAL 30 MINUTE)
                     OR status = 'data_committed'
                  ORDER BY started_at, id;
                  SELECT fact_family, fact_type, COUNT(*) AS records,
                         MIN(occurred_at) AS first_occurred_at,
                         MAX(occurred_at) AS last_occurred_at
                  FROM (
                    SELECT 'access' AS fact_family, fact_type, occurred_at FROM statistics_access_fact
                    UNION ALL
                    SELECT 'assessment' AS fact_family, fact_type, occurred_at FROM statistics_assessment_fact
                    UNION ALL
                    SELECT 'plan' AS fact_family, fact_type, occurred_at FROM statistics_plan_fact
                  ) AS facts
                  GROUP BY fact_family, fact_type
                  ORDER BY fact_family, fact_type;
                  SELECT attribution_mode, COUNT(*) AS records,
                         MIN(occurred_at) AS first_occurred_at,
                         MAX(occurred_at) AS last_occurred_at
                  FROM statistics_assessment_fact
                  GROUP BY attribution_mode
                  ORDER BY attribution_mode;
                  SELECT created.org_id,
                         COUNT(DISTINCT created.task_id) AS task_created_facts,
                         COUNT(DISTINCT CASE WHEN schedule.task_id IS NULL THEN created.task_id END)
                           AS tasks_using_legacy_fulfillment_fallback,
                         COUNT(DISTINCT CASE WHEN schedule.task_id IS NOT NULL THEN created.task_id END)
                           AS tasks_with_revisioned_schedule_fact
                  FROM statistics_plan_fact AS created
                  LEFT JOIN (
                    SELECT org_id, task_id
                    FROM statistics_plan_fact
                    WHERE fact_type = 'task_schedule_defined' AND task_id IS NOT NULL
                    GROUP BY org_id, task_id
                  ) AS schedule
                    ON schedule.org_id = created.org_id
                   AND schedule.task_id = created.task_id
                  WHERE created.fact_type = 'task_created' AND created.task_id IS NOT NULL
                  GROUP BY created.org_id
                  ORDER BY created.org_id;
                  SELECT retry_disposition, COUNT(*) AS records,
                         MIN(failed_at) AS first_failed_at, MAX(failed_at) AS last_failed_at
                  FROM event_delivery_dead_letter
                  WHERE 1 = 1 ${audit_clause}
                  GROUP BY retry_disposition
                  ORDER BY retry_disposition;
                  SELECT id, event_id, org_id, delivery_attempts, retry_disposition, failed_at
                  FROM event_delivery_dead_letter
                  WHERE last_error LIKE '%would create a conflict%' ${audit_clause}
                  ORDER BY failed_at, id;
                  SELECT assessment_id, attempt_no, COUNT(*) AS duplicate_records,
                         GROUP_CONCAT(resource_id ORDER BY id SEPARATOR ',') AS run_ids
                  FROM runtime_checkpoint
                  WHERE scope = 'evaluation_run'
                    AND assessment_id IS NOT NULL
                    AND deleted_at IS NULL
                  GROUP BY assessment_id, attempt_no
                  HAVING COUNT(*) > 1
                  ORDER BY assessment_id, attempt_no;
                  SELECT COUNT(*) AS noncanonical_evaluation_run_identities
                  FROM runtime_checkpoint
                  WHERE scope = 'evaluation_run'
                    AND assessment_id IS NOT NULL
                    AND deleted_at IS NULL
                    AND resource_id <> CONCAT(CAST(assessment_id AS CHAR), ':', CAST(attempt_no AS CHAR));
                  SELECT id, assessment_id, attempt_no, resource_id
                  FROM runtime_checkpoint
                  WHERE scope = 'evaluation_run'
                    AND assessment_id IS NOT NULL
                    AND deleted_at IS NULL
                    AND resource_id <> CONCAT(CAST(assessment_id AS CHAR), ':', CAST(attempt_no AS CHAR))
                  ORDER BY id
                  LIMIT 20;
                  SELECT index_name, non_unique,
                         GROUP_CONCAT(column_name ORDER BY seq_in_index SEPARATOR ',') AS index_columns
                  FROM information_schema.statistics
                  WHERE table_schema = DATABASE()
                    AND table_name = 'runtime_checkpoint'
                  GROUP BY index_name, non_unique
                  ORDER BY index_name;
                  SELECT
                    (SELECT COUNT(*)
                     FROM assessment AS a
                     LEFT JOIN evaluation_outcome AS o ON o.assessment_id = a.id
                     WHERE a.status = 'evaluated' AND a.deleted_at IS NULL AND o.id IS NULL)
                      AS evaluated_assessments_without_outcome,
                    (SELECT COUNT(*)
                     FROM evaluation_outcome AS o
                     LEFT JOIN assessment AS a ON a.id = o.assessment_id AND a.deleted_at IS NULL
                     WHERE a.id IS NULL OR a.status <> 'evaluated')
                      AS outcomes_without_evaluated_assessment,
                    (SELECT COUNT(*)
                     FROM assessment_score
                     WHERE deleted_at IS NULL AND evaluation_outcome_id IS NULL)
                      AS score_rows_without_outcome,
                    (SELECT COUNT(*)
                     FROM evaluation_outcome
                     WHERE model_sub_kind IS NOT NULL AND model_sub_kind <> '')
                      AS outcomes_with_legacy_sub_kind,
                    (SELECT COUNT(*)
                     FROM evaluation_outcome
                     WHERE decision_kind IS NULL OR decision_kind = '')
                      AS outcomes_missing_decision_kind;
                  SELECT COUNT(*) AS total_outcomes,
                         SUM(report_input_json IS NULL OR report_input_json = '') AS missing_report_input,
                         SUM(report_input_json IS NOT NULL AND report_input_json <> '' AND NOT JSON_VALID(report_input_json))
                           AS invalid_report_input_json
                  FROM evaluation_outcome;
                  WITH report_routes AS (
                    SELECT outcome.id,
                           outcome.model_kind,
                           outcome.decision_kind,
                           outcome.evaluated_at,
                           COALESCE(section.template_id, '') AS section_template_id,
                           COALESCE(section.template_version, '') AS section_template_version,
                           COALESCE(JSON_UNQUOTE(JSON_EXTRACT(
                             CASE WHEN JSON_VALID(outcome.report_input_json)
                                  THEN outcome.report_input_json ELSE JSON_OBJECT() END,
                             '$.typology_routing.template_id'
                           )), '') AS typology_template_id,
                           COALESCE(JSON_UNQUOTE(JSON_EXTRACT(
                             CASE WHEN JSON_VALID(outcome.report_input_json)
                                  THEN outcome.report_input_json ELSE JSON_OBJECT() END,
                             '$.typology_routing.template_version'
                           )), '') AS typology_template_version
                    FROM evaluation_outcome AS outcome
                    LEFT JOIN JSON_TABLE(
                      CASE WHEN JSON_VALID(outcome.report_input_json)
                           THEN outcome.report_input_json ELSE JSON_OBJECT() END,
                      '$.InterpretationAssets.ReportSpec.Sections[*]'
                      COLUMNS (
                        template_id VARCHAR(64) PATH '$.TemplateID' NULL ON EMPTY,
                        template_version VARCHAR(64) PATH '$.TemplateVersion' NULL ON EMPTY
                      )
                    ) AS section ON TRUE
                  ), route_rollup AS (
                    SELECT id, model_kind, decision_kind, evaluated_at,
                           MAX(section_template_id <> '') AS has_section_template_id,
                           MAX(section_template_version <> '') AS has_section_template_version,
                           MAX(typology_template_id <> '') AS has_typology_template_id,
                           MAX(typology_template_version <> '') AS has_typology_template_version
                    FROM report_routes
                    GROUP BY id, model_kind, decision_kind, evaluated_at
                  )
                  SELECT COUNT(*) AS outcomes,
                         SUM(has_section_template_id = 0) AS missing_section_template_id,
                         SUM(has_section_template_version = 0) AS missing_section_template_version,
                         SUM(model_kind = 'typology' AND has_typology_template_id = 0)
                           AS typology_missing_frozen_template_id,
                         SUM(model_kind = 'typology' AND has_typology_template_version = 0)
                           AS typology_missing_frozen_template_version,
                         SUM(evaluated_at >= NOW(3) - INTERVAL 24 HOUR AND has_section_template_version = 0)
                           AS recent_24h_missing_section_template_version,
                         SUM(evaluated_at >= NOW(3) - INTERVAL 7 DAY AND has_section_template_version = 0)
                           AS recent_7d_missing_section_template_version
                  FROM route_rollup;
                  WITH report_routes AS (
                    SELECT outcome.model_kind,
                           outcome.decision_kind,
                           COALESCE(section.template_id, '') AS template_id,
                           COALESCE(section.template_version, '') AS template_version,
                           outcome.id
                    FROM evaluation_outcome AS outcome
                    LEFT JOIN JSON_TABLE(
                      CASE WHEN JSON_VALID(outcome.report_input_json)
                           THEN outcome.report_input_json ELSE JSON_OBJECT() END,
                      '$.InterpretationAssets.ReportSpec.Sections[*]'
                      COLUMNS (
                        template_id VARCHAR(64) PATH '$.TemplateID' NULL ON EMPTY,
                        template_version VARCHAR(64) PATH '$.TemplateVersion' NULL ON EMPTY
                      )
                    ) AS section ON TRUE
                  )
                  SELECT model_kind, decision_kind, template_id, template_version,
                         COUNT(DISTINCT id) AS outcomes
                  FROM report_routes
                  GROUP BY model_kind, decision_kind, template_id, template_version
                  ORDER BY outcomes DESC, model_kind, decision_kind, template_id, template_version;
                "
            echo "✅ MySQL connection and read-only recovery audit OK"
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT || 3306 }}
          MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE != '' && secrets.MYSQL_DATABASE || secrets.MYSQL_DBNAME }}
          AUDIT_FROM: ${{ github.event.inputs.audit_from }}

  mysql-outcome-template-route-governance:
    name: MySQL EvaluationOutcome Template Route Governance
    if: github.event.inputs.operation == 'govern-outcome-template-route' && github.event.inputs.database == 'mysql'
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64, ops]
    timeout-minutes: 180
    environment: production
    steps:
      - name: Checkout immutable governance tool
        uses: actions/checkout@v6

      - name: Set up Go for EvaluationOutcome governance
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # This serialized operations job builds a small one-off binary. Cache
          # upload would keep the production DB-ops queue occupied after the
          # governance command has already finished.
          cache: false

      - name: Build EvaluationOutcome governance tools
        env:
          TOOL_PACKAGE: ./scripts/oneoff/govern_evaluation_outcome_template_routes
        run: |
          set -Eeuo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' \
            -o "$RUNNER_TEMP/outcome-template-route-linux-amd64" "$TOOL_PACKAGE"
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' \
            -o "$RUNNER_TEMP/outcome-template-route-linux-arm64" "$TOOL_PACKAGE"
          chmod 0700 \
            "$RUNNER_TEMP/outcome-template-route-linux-amd64" \
            "$RUNNER_TEMP/outcome-template-route-linux-arm64"

      - name: Validate SSH configuration
        env:
          SVRA_HOST: ${{ vars.SVRA_HOST }}
          SVRA_USERNAME: ${{ vars.SVRA_USERNAME }}
          SVRA_SSH_KEY: ${{ secrets.SVRA_SSH_KEY }}
          SVRA_SSH_PORT: ${{ vars.SVRA_SSH_PORT || 22 }}
          SVRA_SSH_FINGERPRINT: ${{ vars.SVRA_SSH_FINGERPRINT }}
        run: |
          set -Eeuo pipefail
          : "${SVRA_HOST:?SVRA_HOST is empty}"
          : "${SVRA_USERNAME:?SVRA_USERNAME is empty}"
          : "${SVRA_SSH_KEY:?SVRA_SSH_KEY is empty}"
          : "${SVRA_SSH_FINGERPRINT:?SVRA_SSH_FINGERPRINT is empty}"
          if ! [[ "$SVRA_SSH_PORT" =~ ^[0-9]+$ ]] || (( SVRA_SSH_PORT < 1 || SVRA_SSH_PORT > 65535 )); then
            echo "❌ SVRA_SSH_PORT is invalid" >&2
            exit 1
          fi

      - name: Transfer EvaluationOutcome governance tools with pinned host identity
        env:
          SVRA_HOST: ${{ vars.SVRA_HOST }}
          SVRA_USERNAME: ${{ vars.SVRA_USERNAME }}
          SVRA_SSH_KEY: ${{ secrets.SVRA_SSH_KEY }}
          SVRA_SSH_PORT: ${{ vars.SVRA_SSH_PORT || 22 }}
          SVRA_SSH_FINGERPRINT: ${{ vars.SVRA_SSH_FINGERPRINT }}
          GOVERNANCE_RUN_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          if ! [[ "$GOVERNANCE_RUN_TOKEN" =~ ^[0-9]+-[0-9]+$ ]]; then
            echo "❌ Invalid governance run token" >&2
            exit 1
          fi
          KEY_FILE="${RUNNER_TEMP}/qs-svra-outcome-template-${GOVERNANCE_RUN_TOKEN}.key"
          KNOWN_HOSTS_FILE="${RUNNER_TEMP}/qs-svra-outcome-template-${GOVERNANCE_RUN_TOKEN}.known_hosts"
          REMOTE_AMD64="/tmp/qs-server-outcome-template-route-${GOVERNANCE_RUN_TOKEN}-amd64"
          REMOTE_ARM64="/tmp/qs-server-outcome-template-route-${GOVERNANCE_RUN_TOKEN}-arm64"
          cleanup_local_credentials() {
            rm -f -- "$KEY_FILE" "$KNOWN_HOSTS_FILE"
          }
          trap cleanup_local_credentials EXIT

          umask 077
          printf '%s\n' "$SVRA_SSH_KEY" > "$KEY_FILE"
          ssh-keyscan -T 10 -p "$SVRA_SSH_PORT" "$SVRA_HOST" 2>/dev/null > "$KNOWN_HOSTS_FILE"
          if [ ! -s "$KNOWN_HOSTS_FILE" ]; then
            echo "❌ Unable to obtain ServerA SSH host keys" >&2
            exit 1
          fi
          if ! ssh-keygen -lf "$KNOWN_HOSTS_FILE" -E sha256 |
            awk '{print $2}' |
            grep -Fqx -- "$SVRA_SSH_FINGERPRINT"; then
            echo "❌ ServerA SSH fingerprint mismatch" >&2
            exit 1
          fi

          SERVER_ARCH=$(ssh \
            -i "$KEY_FILE" \
            -p "$SVRA_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            "${SVRA_USERNAME}@${SVRA_HOST}" uname -m)
          case "$SERVER_ARCH" in
            x86_64|amd64)
              LOCAL_TOOL="$RUNNER_TEMP/outcome-template-route-linux-amd64"
              REMOTE_TOOL="$REMOTE_AMD64"
              ;;
            aarch64|arm64)
              LOCAL_TOOL="$RUNNER_TEMP/outcome-template-route-linux-arm64"
              REMOTE_TOOL="$REMOTE_ARM64"
              ;;
            *)
              echo "❌ Unsupported ServerA architecture: $SERVER_ARCH" >&2
              exit 1
              ;;
          esac
          scp -q \
            -i "$KEY_FILE" \
            -P "$SVRA_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            "$LOCAL_TOOL" \
            "${SVRA_USERNAME}@${SVRA_HOST}:${REMOTE_TOOL}"
          ssh \
            -i "$KEY_FILE" \
            -p "$SVRA_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            "${SVRA_USERNAME}@${SVRA_HOST}" \
            chmod 0700 "$REMOTE_TOOL"
          echo "✅ EvaluationOutcome governance tool transferred for ${SERVER_ARCH} run ${GOVERNANCE_RUN_TOKEN}"

      - name: Execute manifest-driven EvaluationOutcome template route governance
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.SVRA_HOST }}
          username: ${{ vars.SVRA_USERNAME }}
          key: ${{ secrets.SVRA_SSH_KEY }}
          port: ${{ vars.SVRA_SSH_PORT || 22 }}
          fingerprint: ${{ vars.SVRA_SSH_FINGERPRINT }}
          command_timeout: 175m
          envs: MYSQL_HOST,MYSQL_PORT,MYSQL_USERNAME,MYSQL_PASSWORD,MYSQL_DATABASE,MONGODB_HOST,MONGODB_PORT,MONGODB_USERNAME,MONGODB_PASSWORD,MONGODB_DBNAME,GITHUB_RUN_ID_INPUT,GITHUB_RUN_ATTEMPT_INPUT,OUTCOME_TEMPLATE_ROUTE_OPERATION_INPUT,OUTCOME_TEMPLATE_ROUTE_MANIFEST_INPUT,OUTCOME_TEMPLATE_ROUTE_AFTER_ID_INPUT,OUTCOME_TEMPLATE_ROUTE_MAX_RECORDS_INPUT,OUTCOME_TEMPLATE_ROUTE_REQUIRE_COMPLETE_INPUT,OUTCOME_TEMPLATE_ROUTE_CONFIRM_INPUT
          script: |
            set -Eeuo pipefail
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin${PATH:+:$PATH}"

            : "${MYSQL_HOST:?MYSQL_HOST is empty (check production Environment secrets)}"
            : "${MYSQL_USERNAME:?MYSQL_USERNAME is empty}"
            : "${MYSQL_PASSWORD:?MYSQL_PASSWORD is empty}"
            : "${MYSQL_DATABASE:?MYSQL_DATABASE is empty}"
            : "${MONGODB_HOST:?MONGODB_HOST is empty (check production Environment secrets)}"
            : "${MONGODB_USERNAME:?MONGODB_USERNAME is empty}"
            : "${MONGODB_PASSWORD:?MONGODB_PASSWORD is empty}"
            : "${MONGODB_DBNAME:?MONGODB_DBNAME is empty}"
            if ! [[ "$MYSQL_DATABASE" =~ ^[A-Za-z0-9_-]+$ ]]; then
              echo "❌ MYSQL_DATABASE contains unsupported characters" >&2
              exit 1
            fi
            if ! [[ "$GITHUB_RUN_ID_INPUT" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT_INPUT" =~ ^[0-9]+$ ]]; then
              echo "❌ Invalid GitHub run identity" >&2
              exit 1
            fi
            case "$OUTCOME_TEMPLATE_ROUTE_OPERATION_INPUT" in
              audit|apply|verify|rollback) ;;
              *)
                echo "❌ Unsupported outcome template route operation: $OUTCOME_TEMPLATE_ROUTE_OPERATION_INPUT" >&2
                exit 1
                ;;
            esac
            if ! [[ "$OUTCOME_TEMPLATE_ROUTE_AFTER_ID_INPUT" =~ ^[0-9]+$ && "$OUTCOME_TEMPLATE_ROUTE_MAX_RECORDS_INPUT" =~ ^[0-9]+$ ]]; then
              echo "❌ Invalid outcome template route selection" >&2
              exit 1
            fi
            if ! [[ "$OUTCOME_TEMPLATE_ROUTE_REQUIRE_COMPLETE_INPUT" =~ ^(true|false)$ ]]; then
              echo "❌ Invalid outcome template route require_complete" >&2
              exit 1
            fi
            if ! sudo docker network inspect infra-network >/dev/null 2>&1; then
              echo "❌ infra-network is unavailable" >&2
              exit 1
            fi

            GOVERNANCE_RUN_TOKEN="${GITHUB_RUN_ID_INPUT}-${GITHUB_RUN_ATTEMPT_INPUT}"
            TOOL_AMD64="/tmp/qs-server-outcome-template-route-${GOVERNANCE_RUN_TOKEN}-amd64"
            TOOL_ARM64="/tmp/qs-server-outcome-template-route-${GOVERNANCE_RUN_TOKEN}-arm64"
            case "$(uname -m)" in
              x86_64|amd64) TOOL_FILE="$TOOL_AMD64" ;;
              aarch64|arm64) TOOL_FILE="$TOOL_ARM64" ;;
              *)
                echo "❌ Unsupported ServerA architecture: $(uname -m)" >&2
                exit 1
                ;;
            esac
            MANIFEST_DIR="/opt/backups/qs-server/evaluation-outcome-template-route"
            CONTAINER_NAME="qs-server-outcome-template-route-${GOVERNANCE_RUN_TOKEN}"
            cleanup_governance() {
              sudo docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
              rm -f -- "$TOOL_AMD64" "$TOOL_ARM64"
            }
            trap cleanup_governance EXIT
            if [ ! -s "$TOOL_FILE" ] || [ ! -x "$TOOL_FILE" ]; then
              echo "❌ Transferred EvaluationOutcome governance tool is missing or invalid" >&2
              exit 1
            fi

            sudo install -d -m 0750 "$MANIFEST_DIR"
            if [ "$OUTCOME_TEMPLATE_ROUTE_OPERATION_INPUT" = "audit" ]; then
              MANIFEST_NAME="evaluation-outcome-template-route-${GOVERNANCE_RUN_TOKEN}.json"
              if sudo test -e "$MANIFEST_DIR/$MANIFEST_NAME" || sudo test -e "$MANIFEST_DIR/$MANIFEST_NAME.partial"; then
                echo "❌ Refusing to overwrite an existing EvaluationOutcome governance manifest: $MANIFEST_NAME" >&2
                exit 1
              fi
              MANIFEST_MOUNT="$MANIFEST_DIR:/work"
            else
              MANIFEST_NAME="$OUTCOME_TEMPLATE_ROUTE_MANIFEST_INPUT"
              if ! [[ "$MANIFEST_NAME" =~ ^evaluation-outcome-template-route-[0-9]+-[0-9]+\.json$ ]]; then
                echo "❌ Invalid or missing EvaluationOutcome governance manifest name" >&2
                exit 1
              fi
              if ! sudo test -s "$MANIFEST_DIR/$MANIFEST_NAME" || ! sudo test -s "$MANIFEST_DIR/$MANIFEST_NAME.sha256"; then
                echo "❌ EvaluationOutcome governance manifest or checksum is missing: $MANIFEST_NAME" >&2
                exit 1
              fi
              sudo docker run --rm --network none \
                -v "$MANIFEST_DIR:/work:ro" \
                --entrypoint /bin/sh \
                mongo:7.0 -c 'cd /work && sha256sum --check "$1.sha256"' sh "$MANIFEST_NAME"
              MANIFEST_MOUNT="$MANIFEST_DIR:/work:ro"
            fi

            MYSQL_PORT="${MYSQL_PORT:-3306}"
            MONGODB_PORT="${MONGODB_PORT:-27017}"
            echo "EvaluationOutcome template route operation: $OUTCOME_TEMPLATE_ROUTE_OPERATION_INPUT"
            echo "Table: evaluation_outcome"
            echo "Manifest: $MANIFEST_NAME"

            sudo docker run --rm --network infra-network \
              --name "$CONTAINER_NAME" \
              --label "com.fangcunmount.qs-server.operation=evaluation-outcome-template-route-governance" \
              --label "com.fangcunmount.qs-server.github-run-id=$GITHUB_RUN_ID_INPUT" \
              -v "$TOOL_FILE:/tool/govern:ro" \
              -v "$MANIFEST_MOUNT" \
              -e MYSQL_HOST="$MYSQL_HOST" \
              -e MYSQL_PORT="$MYSQL_PORT" \
              -e MYSQL_USERNAME="$MYSQL_USERNAME" \
              -e MYSQL_PASSWORD="$MYSQL_PASSWORD" \
              -e MYSQL_DATABASE="$MYSQL_DATABASE" \
              -e MONGODB_HOST="$MONGODB_HOST" \
              -e MONGODB_PORT="$MONGODB_PORT" \
              -e MONGODB_USERNAME="$MONGODB_USERNAME" \
              -e MONGODB_PASSWORD="$MONGODB_PASSWORD" \
              -e MONGODB_DBNAME="$MONGODB_DBNAME" \
              -e OUTCOME_TEMPLATE_ROUTE_OPERATION="$OUTCOME_TEMPLATE_ROUTE_OPERATION_INPUT" \
              -e OUTCOME_TEMPLATE_ROUTE_MANIFEST_PATH="/work/$MANIFEST_NAME" \
              -e OUTCOME_TEMPLATE_ROUTE_AFTER_ID="$OUTCOME_TEMPLATE_ROUTE_AFTER_ID_INPUT" \
              -e OUTCOME_TEMPLATE_ROUTE_MAX_RECORDS="$OUTCOME_TEMPLATE_ROUTE_MAX_RECORDS_INPUT" \
              -e OUTCOME_TEMPLATE_ROUTE_REQUIRE_COMPLETE="$OUTCOME_TEMPLATE_ROUTE_REQUIRE_COMPLETE_INPUT" \
              -e OUTCOME_TEMPLATE_ROUTE_CONFIRM="$OUTCOME_TEMPLATE_ROUTE_CONFIRM_INPUT" \
              --entrypoint /usr/bin/timeout \
              mysql:8.0 170m /tool/govern

            if [ "$OUTCOME_TEMPLATE_ROUTE_OPERATION_INPUT" = "audit" ]; then
              if ! sudo test -s "$MANIFEST_DIR/$MANIFEST_NAME"; then
                echo "❌ Audit did not create a non-empty EvaluationOutcome governance manifest" >&2
                exit 1
              fi
              sudo docker run --rm --network none \
                -v "$MANIFEST_DIR:/work" \
                --entrypoint /bin/sh \
                mongo:7.0 -c 'cd /work && sha256sum "$1" > "$1.sha256" && chmod 0440 "$1" "$1.sha256"' sh "$MANIFEST_NAME"
              echo "✅ Immutable EvaluationOutcome governance manifest: $MANIFEST_NAME"
            fi
            echo "✅ EvaluationOutcome template route governance completed"
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT || 3306 }}
          MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE != '' && secrets.MYSQL_DATABASE || secrets.MYSQL_DBNAME }}
          MONGODB_HOST: ${{ secrets.MONGODB_HOST }}
          MONGODB_PORT: ${{ secrets.MONGODB_PORT || 27017 }}
          MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
          MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
          MONGODB_DBNAME: ${{ secrets.MONGODB_DBNAME }}
          GITHUB_RUN_ID_INPUT: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT_INPUT: ${{ github.run_attempt }}
          OUTCOME_TEMPLATE_ROUTE_OPERATION_INPUT: ${{ github.event.inputs.governance_operation }}
          OUTCOME_TEMPLATE_ROUTE_MANIFEST_INPUT: ${{ github.event.inputs.governance_manifest }}
          OUTCOME_TEMPLATE_ROUTE_AFTER_ID_INPUT: ${{ github.event.inputs.presentation_after_id }}
          OUTCOME_TEMPLATE_ROUTE_MAX_RECORDS_INPUT: ${{ github.event.inputs.presentation_max_records }}
          OUTCOME_TEMPLATE_ROUTE_REQUIRE_COMPLETE_INPUT: ${{ github.event.inputs.presentation_require_complete }}
          OUTCOME_TEMPLATE_ROUTE_CONFIRM_INPUT: ${{ github.event.inputs.governance_confirm }}

  redis-status:
    name: Redis Keyspace Status
    if: github.event.inputs.operation == 'status' && (github.event.inputs.database == 'redis' || github.event.inputs.database == 'all')
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64, ops]
    timeout-minutes: 30
    environment: production
    steps:
      - name: Validate SSH configuration
        env:
          SVRA_HOST: ${{ vars.SVRA_HOST }}
          SVRA_USERNAME: ${{ vars.SVRA_USERNAME }}
          SVRA_SSH_KEY: ${{ secrets.SVRA_SSH_KEY }}
          SVRA_SSH_FINGERPRINT: ${{ vars.SVRA_SSH_FINGERPRINT }}
        run: |
          set -Eeuo pipefail
          : "${SVRA_HOST:?SVRA_HOST is empty}"
          : "${SVRA_USERNAME:?SVRA_USERNAME is empty}"
          : "${SVRA_SSH_KEY:?SVRA_SSH_KEY is empty}"
          : "${SVRA_SSH_FINGERPRINT:?SVRA_SSH_FINGERPRINT is empty}"

      - name: Inventory Redis keyspaces without exposing keys
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.SVRA_HOST }}
          username: ${{ vars.SVRA_USERNAME }}
          key: ${{ secrets.SVRA_SSH_KEY }}
          port: ${{ vars.SVRA_SSH_PORT || 22 }}
          fingerprint: ${{ vars.SVRA_SSH_FINGERPRINT }}
          command_timeout: 25m
          envs: REDIS_HOST,REDIS_PORT,REDIS_USERNAME,REDIS_PASSWORD,REDIS_USE_SSL,REDIS_SSL_INSECURE_SKIP_VERIFY
          script: |
            set -Eeuo pipefail
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin${PATH:+:$PATH}"

            : "${REDIS_HOST:?REDIS_HOST is empty}"
            REDIS_PORT="${REDIS_PORT:-6379}"
            REDIS_AUDIT_CONTAINER="qs-server-redis-keyspace-audit"

            if ! sudo docker network inspect infra-network >/dev/null 2>&1; then
              echo "❌ infra-network is unavailable" >&2
              exit 1
            fi

            cleanup_redis_audit_container() {
              sudo docker rm -f "$REDIS_AUDIT_CONTAINER" >/dev/null 2>&1 || true
            }
            trap cleanup_redis_audit_container EXIT

            REDIS_CLI_ARGS=(-h "$REDIS_HOST" -p "$REDIS_PORT" --no-auth-warning --raw)
            if [ -n "${REDIS_USERNAME:-}" ]; then
              REDIS_CLI_ARGS+=(--user "$REDIS_USERNAME")
            fi
            if [ "${REDIS_USE_SSL:-false}" = "true" ]; then
              REDIS_CLI_ARGS+=(--tls)
              if [ "${REDIS_SSL_INSECURE_SKIP_VERIFY:-false}" = "true" ]; then
                REDIS_CLI_ARGS+=(--insecure)
              fi
            fi

            redis_cli() {
              local database="$1"
              shift
              sudo docker run --rm --network infra-network \
                --name "$REDIS_AUDIT_CONTAINER" \
                --label "com.fangcunmount.qs-server.operation=redis-keyspace-audit" \
                --label "com.fangcunmount.qs-server.github-run-id=${{ github.run_id }}" \
                -e REDISCLI_AUTH="${REDIS_PASSWORD:-}" \
                redis:7-alpine redis-cli "${REDIS_CLI_ARGS[@]}" -n "$database" "$@"
            }

            scan_database() {
              local database="$1"
              local db_size scan_total current_questionnaire current_models
              local current_assessment current_testee current_plan current_stats current_statistics_compat
              local current_assess_list current_version current_assessment_list_version_compat
              local current_hotset current_family_other
              local legacy_assessment_list_data_candidate legacy_statistics_data_candidate
              local legacy_unnamespaced_candidate
              local other key scan_dir scan_pid
              scan_total=0
              current_questionnaire=0
              current_models=0
              current_assessment=0
              current_testee=0
              current_plan=0
              current_stats=0
              current_statistics_compat=0
              current_assess_list=0
              current_version=0
              current_assessment_list_version_compat=0
              current_hotset=0
              current_family_other=0
              legacy_assessment_list_data_candidate=0
              legacy_statistics_data_candidate=0
              legacy_unnamespaced_candidate=0
              other=0

              db_size=$(redis_cli "$database" DBSIZE | tr -d '\r')
              scan_dir=$(mktemp -d /tmp/qs-redis-scan.XXXXXX)
              mkfifo "$scan_dir/keys"
              redis_cli "$database" --scan --count 1000 >"$scan_dir/keys" &
              scan_pid=$!
              while IFS= read -r key; do
                [ -n "$key" ] || continue
                scan_total=$((scan_total + 1))
                case "$database:$key" in
                  2:cache:static:questionnaire:*) current_questionnaire=$((current_questionnaire + 1)) ;;
                  2:cache:static:assessment_model:published:*) current_models=$((current_models + 1)) ;;
                  3:cache:object:assessment:detail:*) current_assessment=$((current_assessment + 1)) ;;
                  3:cache:object:testee:info:*) current_testee=$((current_testee + 1)) ;;
                  3:cache:object:plan:info:*) current_plan=$((current_plan + 1)) ;;
                  4:cache:query:query:version:statistics:v2:org:*|4:cache:query:query:data:statistics:v2:org:*)
                    current_stats=$((current_stats + 1))
                    ;;
                  4:query:version:statistics:org:*|4:query:data:statistics:org:*)
                    current_statistics_compat=$((current_statistics_compat + 1))
                    ;;
                  4:cache:query:stats:query:*) legacy_statistics_data_candidate=$((legacy_statistics_data_candidate + 1)) ;;
                  4:cache:query:query:assessment:list:v2:*) current_assess_list=$((current_assess_list + 1)) ;;
                  4:cache:query:assess:list:*|4:cache:query:query:assessment:list:*)
                    legacy_assessment_list_data_candidate=$((legacy_assessment_list_data_candidate + 1))
                    ;;
                  7:cache:meta:query:version:*) current_version=$((current_version + 1)) ;;
                  7:cache:query:query:version:assessment:list:*)
                    current_assessment_list_version_compat=$((current_assessment_list_version_compat + 1))
                    ;;
                  7:cache:meta:warmup:hot:*) current_hotset=$((current_hotset + 1)) ;;
                  0:ops:runtime:*|1:ops:runtime:*|2:cache:static:*|3:cache:object:*|4:cache:query:*|5:cache:sdk:*|6:cache:lock:*|7:cache:meta:*|8:cache:rank:*)
                    current_family_other=$((current_family_other + 1))
                    ;;
                  *:questionnaire:*|*:scale:*|*:assessment_model:*|*:assessment:*|*:assess:*|*:stats:*|*:testee:*|*:plan:*|*:query:*|*:warmup:*|*:answersheet:*)
                    legacy_unnamespaced_candidate=$((legacy_unnamespaced_candidate + 1))
                    ;;
                  *) other=$((other + 1)) ;;
                esac
              done <"$scan_dir/keys"
              if ! wait "$scan_pid"; then
                rm -f -- "$scan_dir/keys"
                rmdir -- "$scan_dir"
                echo "❌ Redis SCAN failed for DB ${database}" >&2
                return 1
              fi
              rm -f -- "$scan_dir/keys"
              rmdir -- "$scan_dir"

              echo "redis_db=${database} dbsize=${db_size} scanned=${scan_total}"
              echo "  current_questionnaire=${current_questionnaire} current_models=${current_models}"
              echo "  current_assessment=${current_assessment} current_testee=${current_testee} current_plan=${current_plan}"
              echo "  current_stats=${current_stats} current_statistics_compat=${current_statistics_compat} current_assess_list=${current_assess_list}"
              echo "  current_version=${current_version} current_assessment_list_version_compat=${current_assessment_list_version_compat}"
              echo "  current_hotset=${current_hotset} current_family_other=${current_family_other}"
              echo "  legacy_assessment_list_data_candidate=${legacy_assessment_list_data_candidate}"
              echo "  legacy_statistics_data_candidate=${legacy_statistics_data_candidate}"
              echo "  legacy_unnamespaced_candidate=${legacy_unnamespaced_candidate} other=${other}"
              if [ "$scan_total" != "$db_size" ]; then
                echo "  note=DBSIZE and SCAN differ because keys may expire during the read-only audit"
              fi
            }

            redis_cli 0 PING >/dev/null
            echo "✅ Redis connection OK"
            echo "Redis server summary:"
            redis_cli 0 INFO server | grep -E '^(redis_version|redis_mode|os|arch_bits):'
            redis_cli 0 INFO memory | grep -E '^(used_memory_human|maxmemory_human|maxmemory_policy|mem_fragmentation_ratio):'

            echo ""
            echo "Redis keyspace inventory (counts only; key names and values are never printed):"
            for database in 0 1 2 3 4 5 6 7 8; do
              scan_database "$database"
            done

            echo ""
            echo "Statistics stale-run recovery preflight (read-only):"
            statistics_task_lock_ttl="$(redis_cli 6 TTL 'cache:lock:statistics:1' | tr -d '\r')"
            if ! [[ "$statistics_task_lock_ttl" =~ ^-?[0-9]+$ ]]; then
              echo "❌ Unexpected TTL response for the Statistics task lock" >&2
              exit 1
            fi
            statistics_task_lock_absent=false
            if [ "$statistics_task_lock_ttl" = "-2" ]; then
              statistics_task_lock_absent=true
            fi
            statistics_rebuild_host_processes="$(
              ps -eo comm= | awk '$1 ~ /^rebuild_statist/ { count++ } END { print count + 0 }'
            )"
            statistics_rebuild_containers="$(
              sudo docker ps --format '{{.Names}}\t{{.Image}}' |
                awk 'tolower($0) ~ /rebuild[-_]?statistics|statistics[-_]?rebuild/ { count++ } END { print count + 0 }'
            )"
            echo "  task_lock_database=6 task_lock_ttl_seconds=${statistics_task_lock_ttl} task_lock_absent=${statistics_task_lock_absent}"
            echo "  standard_host_rebuild_processes=${statistics_rebuild_host_processes} matching_running_containers=${statistics_rebuild_containers}"
            echo "  evidence_boundary=process audit covers standard rebuild_statistics executable names and matching ServerA container names/images"

            cleanup_redis_audit_container
            trap - EXIT
            echo "✅ Redis read-only keyspace audit OK"
        env:
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT || 6379 }}
          REDIS_USERNAME: ${{ secrets.REDIS_USERNAME }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_USE_SSL: ${{ secrets.REDIS_USE_SSL }}
          REDIS_SSL_INSECURE_SKIP_VERIFY: ${{ secrets.REDIS_SSL_INSECURE_SKIP_VERIFY }}
