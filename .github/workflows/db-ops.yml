name: Database Operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Database operation'
        required: true
        type: choice
        options:
          - backup
          - validate
          - restore
          - status
      backup_name:
        description: 'Backup name (for restore operation)'
        required: false
        type: string
      database:
        description: 'Data store to operate on (Redis supports status only)'
        required: true
        type: choice
        options:
          - mongodb
          - mysql
          - redis
          - all
      audit_from:
        description: 'Optional RFC3339 UTC lower bound for read-only recovery audit'
        required: false
        type: string

  schedule:
    - cron: '0 17 * * *'  # 每天 17:00 UTC (北京时间凌晨 01:00) 自动备份

permissions:
  contents: read

# Serialize scheduled and manual production database operations across workflow runs.
concurrency:
  group: qs-server-db-ops-production
  cancel-in-progress: false

jobs:
  mongodb-backup:
    name: MongoDB Backup
    if: |
      (github.event_name == 'schedule') ||
      (github.event.inputs.operation == 'backup' && (github.event.inputs.database == 'mongodb' || github.event.inputs.database == 'all'))
    # SVRA_HOST is a Tailscale address; run inside the qlume tailnet instead of GitHub-hosted.
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64, ops]
    timeout-minutes: 360
    # MONGODB_* 等敏感项在 production Environment；缺此行会导致 secrets 为空、备份静默失败。
    environment: production
    steps:
      - name: Validate SSH configuration
        env:
          SVRA_HOST: ${{ vars.SVRA_HOST }}
          SVRA_USERNAME: ${{ vars.SVRA_USERNAME }}
          SVRA_SSH_KEY: ${{ secrets.SVRA_SSH_KEY }}
          SVRA_SSH_FINGERPRINT: ${{ vars.SVRA_SSH_FINGERPRINT }}
        run: |
          set -Eeuo pipefail
          : "${SVRA_HOST:?SVRA_HOST is empty}"
          : "${SVRA_USERNAME:?SVRA_USERNAME is empty}"
          : "${SVRA_SSH_KEY:?SVRA_SSH_KEY is empty}"
          : "${SVRA_SSH_FINGERPRINT:?SVRA_SSH_FINGERPRINT is empty}"

      - name: Backup MongoDB
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.SVRA_HOST }}
          username: ${{ vars.SVRA_USERNAME }}
          key: ${{ secrets.SVRA_SSH_KEY }}
          port: ${{ vars.SVRA_SSH_PORT || 22 }}
          fingerprint: ${{ vars.SVRA_SSH_FINGERPRINT }}
          command_timeout: 350m
          envs: MONGODB_HOST,MONGODB_PORT,MONGODB_USERNAME,MONGODB_PASSWORD,MONGODB_DBNAME
          script: |
            set -Eeuo pipefail
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin${PATH:+:$PATH}"

            : "${MONGODB_HOST:?MONGODB_HOST is empty (check production Environment secrets)}"
            : "${MONGODB_DBNAME:?MONGODB_DBNAME is empty}"
            : "${MONGODB_USERNAME:?MONGODB_USERNAME is empty}"
            : "${MONGODB_PASSWORD:?MONGODB_PASSWORD is empty}"

            if ! sudo docker network inspect infra-network >/dev/null 2>&1; then
              echo "❌ infra-network is unavailable" >&2
              exit 1
            fi

            BACKUP_DIR="/opt/backups/qs-server/mongodb"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            BACKUP_FILE="qs_mongodb_backup_${TIMESTAMP}.archive.gz"
            PARTIAL_FILE="${BACKUP_FILE}.partial"
            BACKUP_CONTAINER_NAME="qs-server-mongodb-backup"
            MONGODB_PORT="${MONGODB_PORT:-27017}"
            MONGODB_URI="mongodb://${MONGODB_HOST}:${MONGODB_PORT}/?connectTimeoutMS=30000&socketTimeoutMS=0"

            sudo install -d -m 0750 "$BACKUP_DIR"

            mapfile -t RUNNING_MONGO_UTILITIES < <(
              sudo docker ps --filter ancestor=mongo:7.0 --format '{{.ID}}'
            )
            if (( ${#RUNNING_MONGO_UTILITIES[@]} > 0 )); then
              echo "❌ Another MongoDB utility container is already running; refusing concurrent backup" >&2
              sudo docker ps --no-trunc \
                --filter ancestor=mongo:7.0 \
                --format '{{.ID}}\t{{.Names}}\t{{.CreatedAt}}\t{{.Status}}\t{{.Labels}}\t{{.Command}}' >&2
              exit 1
            fi

            cleanup_backup_container() {
              sudo docker rm -f "$BACKUP_CONTAINER_NAME" >/dev/null 2>&1 || true
            }
            trap cleanup_backup_container EXIT

            echo "Starting MongoDB backup..."
            echo "Database: $MONGODB_DBNAME"
            echo "Host: $MONGODB_HOST:$MONGODB_PORT"
            echo "Timestamp: $TIMESTAMP"

            sudo docker run --rm --network infra-network \
              --name "$BACKUP_CONTAINER_NAME" \
              --label "com.fangcunmount.qs-server.operation=mongodb-backup" \
              --label "com.fangcunmount.qs-server.github-run-id=${{ github.run_id }}" \
              -v "$BACKUP_DIR:/backup" \
              -e MONGODB_HOST="$MONGODB_HOST" \
              -e MONGODB_PORT="$MONGODB_PORT" \
              -e MONGODB_USERNAME="$MONGODB_USERNAME" \
              -e MONGODB_PASSWORD="$MONGODB_PASSWORD" \
              -e MONGODB_DBNAME="$MONGODB_DBNAME" \
              -e MONGODB_URI="$MONGODB_URI" \
              -e BACKUP_FILE="$BACKUP_FILE" \
              -e PARTIAL_FILE="$PARTIAL_FILE" \
              --entrypoint /usr/bin/timeout \
              mongo:7.0 345m /bin/bash -Eeuo pipefail -c '
                cleanup_partial() {
                  rm -f -- "/backup/$PARTIAL_FILE"
                }
                trap cleanup_partial EXIT

                rm -f -- "/backup/$PARTIAL_FILE"
                mongodump \
                  --uri="$MONGODB_URI" \
                  --username="$MONGODB_USERNAME" \
                  --password="$MONGODB_PASSWORD" \
                  --authenticationDatabase=admin \
                  --db="$MONGODB_DBNAME" \
                  --numParallelCollections=4 \
                  --gzip \
                  --archive="/backup/$PARTIAL_FILE"

                if [ ! -s "/backup/$PARTIAL_FILE" ]; then
                  echo "❌ MongoDB backup archive is empty" >&2
                  exit 1
                fi
                mv -- "/backup/$PARTIAL_FILE" "/backup/$BACKUP_FILE"
                chmod 0640 "/backup/$BACKUP_FILE"
                trap - EXIT

                BACKUP_SIZE=$(du -h "/backup/$BACKUP_FILE" | cut -f1)
                echo "✅ Backup completed: $BACKUP_FILE"
                echo "Size: $BACKUP_SIZE"

                echo "Cleaning old backups (keeping last 5)..."
                shopt -s nullglob
                BACKUPS=(/backup/qs_mongodb_backup_*.archive.gz)
                if (( ${#BACKUPS[@]} > 5 )); then
                  mapfile -t SORTED_BACKUPS < <(ls -1t -- "${BACKUPS[@]}")
                  rm -f -- "${SORTED_BACKUPS[@]:5}"
                fi

                echo ""
                echo "Current backups:"
                BACKUPS=(/backup/qs_mongodb_backup_*.archive.gz)
                ls -lht -- "${BACKUPS[@]}" | head -6
              '
            trap - EXIT
        env:
          MONGODB_HOST: ${{ secrets.MONGODB_HOST }}
          MONGODB_PORT: ${{ secrets.MONGODB_PORT || 27017 }}
          MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
          MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
          MONGODB_DBNAME: ${{ secrets.MONGODB_DBNAME }}

  mongodb-backup-validate:
    name: MongoDB Backup Validate
    if: github.event.inputs.operation == 'validate' && github.event.inputs.database == 'mongodb'
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64, ops]
    timeout-minutes: 120
    environment: production
    steps:
      - name: Validate SSH configuration
        env:
          SVRA_HOST: ${{ vars.SVRA_HOST }}
          SVRA_USERNAME: ${{ vars.SVRA_USERNAME }}
          SVRA_SSH_KEY: ${{ secrets.SVRA_SSH_KEY }}
          SVRA_SSH_FINGERPRINT: ${{ vars.SVRA_SSH_FINGERPRINT }}
        run: |
          set -Eeuo pipefail
          : "${SVRA_HOST:?SVRA_HOST is empty}"
          : "${SVRA_USERNAME:?SVRA_USERNAME is empty}"
          : "${SVRA_SSH_KEY:?SVRA_SSH_KEY is empty}"
          : "${SVRA_SSH_FINGERPRINT:?SVRA_SSH_FINGERPRINT is empty}"

      - name: Validate MongoDB backup archive
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.SVRA_HOST }}
          username: ${{ vars.SVRA_USERNAME }}
          key: ${{ secrets.SVRA_SSH_KEY }}
          port: ${{ vars.SVRA_SSH_PORT || 22 }}
          fingerprint: ${{ vars.SVRA_SSH_FINGERPRINT }}
          command_timeout: 115m
          envs: MONGODB_HOST,MONGODB_PORT,MONGODB_USERNAME,MONGODB_PASSWORD,MONGODB_DBNAME,BACKUP_FILE_INPUT
          script: |
            set -Eeuo pipefail
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin${PATH:+:$PATH}"

            : "${MONGODB_HOST:?MONGODB_HOST is empty (check production Environment secrets)}"
            : "${MONGODB_DBNAME:?MONGODB_DBNAME is empty}"
            : "${MONGODB_USERNAME:?MONGODB_USERNAME is empty}"
            : "${MONGODB_PASSWORD:?MONGODB_PASSWORD is empty}"

            if ! sudo docker network inspect infra-network >/dev/null 2>&1; then
              echo "❌ infra-network is unavailable" >&2
              exit 1
            fi

            BACKUP_DIR="/opt/backups/qs-server/mongodb"
            BACKUP_FILE="$BACKUP_FILE_INPUT"
            if ! [[ "$BACKUP_FILE" =~ ^qs_mongodb_backup_[0-9]{8}_[0-9]{6}\.archive\.gz$ ]]; then
              echo "❌ Invalid backup name: $BACKUP_FILE" >&2
              exit 1
            fi
            if ! sudo docker run --rm \
              -v "$BACKUP_DIR:/backup:ro" \
              --entrypoint test \
              mongo:7.0 -s "/backup/$BACKUP_FILE"; then
              echo "❌ Backup archive is missing or empty: $BACKUP_FILE" >&2
              exit 1
            fi

            echo "Validating MongoDB backup archive without importing data..."
            sudo docker run --rm --network infra-network \
              -v "$BACKUP_DIR:/backup:ro" \
              --entrypoint /usr/bin/timeout \
              mongo:7.0 110m mongorestore \
                --host="$MONGODB_HOST" \
                --port="${MONGODB_PORT:-27017}" \
                --username="$MONGODB_USERNAME" \
                --password="$MONGODB_PASSWORD" \
                --authenticationDatabase=admin \
                --archive="/backup/$BACKUP_FILE" \
                --gzip \
                --nsInclude="$MONGODB_DBNAME.*" \
                --dryRun \
                --verbose
            echo "✅ MongoDB backup archive dry-run validation succeeded: $BACKUP_FILE"
        env:
          MONGODB_HOST: ${{ secrets.MONGODB_HOST }}
          MONGODB_PORT: ${{ secrets.MONGODB_PORT || 27017 }}
          MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
          MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
          MONGODB_DBNAME: ${{ secrets.MONGODB_DBNAME }}
          BACKUP_FILE_INPUT: ${{ github.event.inputs.backup_name }}

  mongodb-restore:
    name: MongoDB Restore
    if: github.event.inputs.operation == 'restore' && github.event.inputs.database == 'mongodb'
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64, ops]
    timeout-minutes: 360
    environment: production
    steps:
      - name: Validate SSH configuration
        env:
          SVRA_HOST: ${{ vars.SVRA_HOST }}
          SVRA_USERNAME: ${{ vars.SVRA_USERNAME }}
          SVRA_SSH_KEY: ${{ secrets.SVRA_SSH_KEY }}
          SVRA_SSH_FINGERPRINT: ${{ vars.SVRA_SSH_FINGERPRINT }}
        run: |
          set -Eeuo pipefail
          : "${SVRA_HOST:?SVRA_HOST is empty}"
          : "${SVRA_USERNAME:?SVRA_USERNAME is empty}"
          : "${SVRA_SSH_KEY:?SVRA_SSH_KEY is empty}"
          : "${SVRA_SSH_FINGERPRINT:?SVRA_SSH_FINGERPRINT is empty}"

      - name: Restore MongoDB
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.SVRA_HOST }}
          username: ${{ vars.SVRA_USERNAME }}
          key: ${{ secrets.SVRA_SSH_KEY }}
          port: ${{ vars.SVRA_SSH_PORT || 22 }}
          fingerprint: ${{ vars.SVRA_SSH_FINGERPRINT }}
          command_timeout: 350m
          envs: MONGODB_HOST,MONGODB_PORT,MONGODB_USERNAME,MONGODB_PASSWORD,MONGODB_DBNAME,BACKUP_FILE_INPUT
          script: |
            set -Eeuo pipefail
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin${PATH:+:$PATH}"

            : "${MONGODB_HOST:?MONGODB_HOST is empty (check production Environment secrets)}"
            : "${MONGODB_DBNAME:?MONGODB_DBNAME is empty}"
            : "${MONGODB_USERNAME:?MONGODB_USERNAME is empty}"
            : "${MONGODB_PASSWORD:?MONGODB_PASSWORD is empty}"

            if ! sudo docker network inspect infra-network >/dev/null 2>&1; then
              echo "❌ infra-network is unavailable" >&2
              exit 1
            fi

            BACKUP_DIR="/opt/backups/qs-server/mongodb"
            BACKUP_FILE="$BACKUP_FILE_INPUT"
            list_backups() {
              sudo docker run --rm \
                -v "$BACKUP_DIR:/backup:ro" \
                --entrypoint /bin/bash \
                mongo:7.0 -Eeuo pipefail -c '
                  shopt -s nullglob
                  BACKUPS=(/backup/qs_mongodb_backup_*.archive.gz)
                  if (( ${#BACKUPS[@]} == 0 )); then
                    echo "No backups found"
                  else
                    ls -lht -- "${BACKUPS[@]}" | head -10
                  fi
                '
            }

            if [ -z "$BACKUP_FILE" ]; then
              echo "❌ Backup name is required"
              echo ""
              echo "Available backups:"
              list_backups
              exit 1
            fi

            if ! [[ "$BACKUP_FILE" =~ ^qs_mongodb_backup_[0-9]{8}_[0-9]{6}\.archive\.gz$ ]]; then
              echo "❌ Invalid backup name: $BACKUP_FILE" >&2
              exit 1
            fi

            if ! sudo docker run --rm \
              -v "$BACKUP_DIR:/backup:ro" \
              --entrypoint test \
              mongo:7.0 -f "/backup/$BACKUP_FILE"; then
              echo "❌ Backup file not found: $BACKUP_FILE"
              echo ""
              echo "Available backups:"
              list_backups
              exit 1
            fi

            echo "⚠️ WARNING: This will overwrite the current database!"
            echo "Backup file: $BACKUP_FILE"
            echo "Target database: $MONGODB_DBNAME"
            echo "Restoring in 5 seconds..."
            sleep 5

            echo "Restoring database..."
            sudo docker run --rm --network infra-network \
              -v "$BACKUP_DIR:/backup:ro" \
              --entrypoint /usr/bin/timeout \
              mongo:7.0 345m mongorestore \
                --host="$MONGODB_HOST" \
                --port="${MONGODB_PORT:-27017}" \
                --username="$MONGODB_USERNAME" \
                --password="$MONGODB_PASSWORD" \
                --authenticationDatabase=admin \
                --archive="/backup/$BACKUP_FILE" \
                --gzip \
                --drop \
                --nsInclude="$MONGODB_DBNAME.*"

            echo "✅ Database restored successfully from $BACKUP_FILE"
        env:
          MONGODB_HOST: ${{ secrets.MONGODB_HOST }}
          MONGODB_PORT: ${{ secrets.MONGODB_PORT || 27017 }}
          MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
          MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
          MONGODB_DBNAME: ${{ secrets.MONGODB_DBNAME }}
          BACKUP_FILE_INPUT: ${{ github.event.inputs.backup_name }}

  mongodb-status:
    name: MongoDB Status
    if: github.event.inputs.operation == 'status' && (github.event.inputs.database == 'mongodb' || github.event.inputs.database == 'all')
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64, ops]
    environment: production
    steps:
      - name: Validate SSH configuration
        env:
          SVRA_HOST: ${{ vars.SVRA_HOST }}
          SVRA_USERNAME: ${{ vars.SVRA_USERNAME }}
          SVRA_SSH_KEY: ${{ secrets.SVRA_SSH_KEY }}
          SVRA_SSH_FINGERPRINT: ${{ vars.SVRA_SSH_FINGERPRINT }}
        run: |
          set -Eeuo pipefail
          : "${SVRA_HOST:?SVRA_HOST is empty}"
          : "${SVRA_USERNAME:?SVRA_USERNAME is empty}"
          : "${SVRA_SSH_KEY:?SVRA_SSH_KEY is empty}"
          : "${SVRA_SSH_FINGERPRINT:?SVRA_SSH_FINGERPRINT is empty}"

      - name: Check MongoDB Status
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.SVRA_HOST }}
          username: ${{ vars.SVRA_USERNAME }}
          key: ${{ secrets.SVRA_SSH_KEY }}
          port: ${{ vars.SVRA_SSH_PORT || 22 }}
          fingerprint: ${{ vars.SVRA_SSH_FINGERPRINT }}
          envs: MONGODB_HOST,MONGODB_PORT,MONGODB_USERNAME,MONGODB_PASSWORD,MONGODB_DBNAME,AUDIT_FROM
          script: |
            set -Eeuo pipefail
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin${PATH:+:$PATH}"

            : "${MONGODB_HOST:?MONGODB_HOST is empty (check production Environment secrets)}"
            : "${MONGODB_DBNAME:?MONGODB_DBNAME is empty}"
            : "${MONGODB_USERNAME:?MONGODB_USERNAME is empty}"
            : "${MONGODB_PASSWORD:?MONGODB_PASSWORD is empty}"

            echo "=== MongoDB Status ==="

            if ! sudo docker network inspect infra-network >/dev/null 2>&1; then
              echo "❌ infra-network is unavailable" >&2
              exit 1
            fi

            if [ -n "${AUDIT_FROM:-}" ] && ! [[ "$AUDIT_FROM" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
              echo "❌ audit_from must use YYYY-MM-DDTHH:MM:SSZ" >&2
              exit 1
            fi

            MONGO_STATUS_DIR=$(mktemp -d /tmp/qs-mongodb-status.XXXXXX)
            MONGO_STATUS_SCRIPT="$MONGO_STATUS_DIR/status.js"
            cleanup_mongo_status_script() {
              rm -f -- "$MONGO_STATUS_SCRIPT"
              rmdir -- "$MONGO_STATUS_DIR"
            }
            trap cleanup_mongo_status_script EXIT

            cat > "$MONGO_STATUS_SCRIPT" <<'MONGOJS'
            const targetDB = db.getSiblingDB(process.env.MONGODB_DBNAME)
            const collectionNames = targetDB.getCollectionNames().sort()
            const auditFrom = process.env.AUDIT_FROM ? new Date(process.env.AUDIT_FROM) : null
            print(`MongoDB version: ${db.version()}`)
            print("Database statistics:")
            printjson(targetDB.stats())
            print("Schema migration state:")
            printjson(targetDB.getCollection("schema_migrations").findOne({}, {_id: 0, version: 1, dirty: 1}))
            print("Collections:")
            printjson(collectionNames)
            const mongoOutbox = targetDB.getCollection("domain_event_outbox")
            const mongoOutboxFilter = auditFrom
              ? {$or: [
                  {status: {$in: ["pending", "publishing", "failed"]}},
                  {status: "published", created_at: {$gte: auditFrom}}
                ]}
              : {status: {$in: ["pending", "publishing", "failed"]}}
            const mongoOutboxRows = mongoOutbox.aggregate([
              {$match: mongoOutboxFilter},
              {$group: {
                _id: {event_type: "$event_type", status: "$status", retry_disposition: "$retry_disposition"},
                records: {$sum: 1},
                oldest_created_at: {$min: "$created_at"},
                latest_updated_at: {$max: "$updated_at"},
                max_attempt_count: {$max: "$attempt_count"}
              }},
              {$sort: {"_id.event_type": 1, "_id.status": 1, "_id.retry_disposition": 1}}
            ]).toArray()
            const mongoOutboxKnownTypes = [
              "answersheet.submitted",
              "interpretation.report.generated",
              "interpretation.report.failed",
              "interpretation.retry.requested"
            ]
            print("Mongo Outbox active/recent state:")
            printjson({
              audit_from: auditFrom,
              rows: mongoOutboxRows,
              unexpected_active_event_types: mongoOutbox.distinct("event_type", {
                $and: [mongoOutboxFilter, {event_type: {$nin: mongoOutboxKnownTypes}}]
              }).sort(),
              unfinished_missing_org_id: mongoOutbox.countDocuments({
                status: {$in: ["pending", "publishing", "failed"]},
                $or: [{org_id: {$exists: false}}, {org_id: null}]
              })
            })
            print("Retirement candidate collection statistics:")
            printjson(collectionNames
              .filter(name => name === "answersheet_submit_idempotency" ||
                name.includes("_legacy_") ||
                name.includes("__seed_orphan_backup_hist_v1"))
              .map(name => {
                const stats = targetDB.runCommand({collStats: name})
                return {
                  name,
                  count: stats.count,
                  size: stats.size,
                  storage_size: stats.storageSize,
                  total_index_size: stats.totalIndexSize,
                  indexes: stats.nindexes
                }
              }))
            const assessmentModels = targetDB.getCollection("assessment_models")
            print("ModelCatalog compatibility inventory:")
            printjson({
              total: assessmentModels.countDocuments({}),
              heads: assessmentModels.countDocuments({record_role: "head", deleted_at: null}),
              snapshots: assessmentModels.countDocuments({record_role: "published_snapshot", deleted_at: null}),
              missing_record_role: assessmentModels.countDocuments({record_role: {$exists: false}}),
              unknown_record_role: assessmentModels.countDocuments({record_role: {$exists: true, $nin: ["head", "published_snapshot"]}}),
              persisted_legacy_identity_fields: assessmentModels.countDocuments({$or: [
                {sub_kind: {$exists: true}},
                {product_channel: {$exists: true}},
                {algorithm_family: {$exists: true}}
              ]}),
              active_snapshots: assessmentModels.countDocuments({record_role: "published_snapshot", release_status: "active", deleted_at: null}),
              archived_snapshots: assessmentModels.countDocuments({record_role: "published_snapshot", release_status: "archived", deleted_at: null}),
              snapshots_missing_release_status: assessmentModels.countDocuments({record_role: "published_snapshot", deleted_at: null, $or: [
                {release_status: {$exists: false}},
                {release_status: ""}
              ]}),
              snapshots_missing_canonical_identity: assessmentModels.countDocuments({record_role: "published_snapshot", deleted_at: null, $or: [
                {kind: {$exists: false}}, {kind: ""},
                {algorithm: {$exists: false}}, {algorithm: ""},
                {code: {$exists: false}}, {code: ""},
                {release_version: {$exists: false}}, {release_version: ""},
                {decision_kind: {$exists: false}}, {decision_kind: ""}
              ]}),
              snapshots_missing_definition_v2: assessmentModels.countDocuments({record_role: "published_snapshot", deleted_at: null, definition_v2: {$exists: false}}),
              active_identity_duplicates: assessmentModels.aggregate([
                {$match: {record_role: "published_snapshot", release_status: "active", deleted_at: null}},
                {$group: {_id: {kind: "$kind", algorithm: "$algorithm", code: "$code"}, count: {$sum: 1}}},
                {$match: {count: {$gt: 1}}},
                {$count: "groups"}
              ]).toArray()[0]?.groups || 0
            })
            print("ModelCatalog index inventory:")
            printjson(assessmentModels.getIndexes().map(index => ({
              name: index.name,
              key: index.key,
              unique: index.unique === true,
              partial_filter: index.partialFilterExpression || null
            })))
            const assessmentNorms = targetDB.getCollection("assessment_norms")
            print("ModelCatalog norm inventory:")
            printjson({
              total: assessmentNorms.countDocuments({deleted_at: null}),
              missing_table_version: assessmentNorms.countDocuments({deleted_at: null, $or: [
                {table_version: {$exists: false}},
                {table_version: ""}
              ]}),
              missing_runtime_identity: assessmentNorms.countDocuments({deleted_at: null, $or: [
                {kind: {$exists: false}}, {kind: ""},
                {algorithm: {$exists: false}}, {algorithm: ""}
              ]})
            })
            const interpretationCollections = [
              "report_generations",
              "interpretation_runs",
              "interpret_report_artifacts",
              "archived_reports",
              "report_query_catalog",
              "interpretation_admission_failures",
              "interpretation_attention_projections",
              "interpretation_report_templates",
              "interpretation_catalog_repair_plans",
              "interpretation_catalog_audit_checkpoints"
            ]
            const retiredInterpretationCollections = [
              "interpret_reports",
              "published_assessment_models",
              "evaluation_rule_sets",
              "scales"
            ]
            print("Interpretation collection inventory:")
            printjson(interpretationCollections.map(name => ({
              name,
              present: collectionNames.includes(name),
              documents: collectionNames.includes(name) ? targetDB.getCollection(name).countDocuments({}) : null
            })))
            print("Retired Interpretation/ModelCatalog collections still present:")
            printjson(retiredInterpretationCollections.filter(name => collectionNames.includes(name)))

            const generations = targetDB.getCollection("report_generations")
            const runs = targetDB.getCollection("interpretation_runs")
            const artifacts = targetDB.getCollection("interpret_report_artifacts")
            const archives = targetDB.getCollection("archived_reports")
            const reportCatalog = targetDB.getCollection("report_query_catalog")
            const reportTemplates = targetDB.getCollection("interpretation_report_templates")
            const admissionFailures = targetDB.getCollection("interpretation_admission_failures")
            const aggregateCount = (collection, pipeline) =>
              collection.aggregate([...pipeline, {$count: "count"}], {allowDiskUse: true}).toArray()[0]?.count || 0

            print("Interpretation lifecycle status counts:")
            printjson({
              generations: generations.aggregate([
                {$group: {_id: "$status", count: {$sum: 1}}},
                {$sort: {_id: 1}}
              ]).toArray(),
              runs: runs.aggregate([
                {$group: {_id: "$status", count: {$sum: 1}}},
                {$sort: {_id: 1}}
              ]).toArray(),
              expired_running_runs: runs.countDocuments({status: "running", lease_expires_at: {$lte: new Date()}}),
              running_without_lease: runs.countDocuments({status: "running", $or: [
                {lease_expires_at: {$exists: false}},
                {lease_expires_at: null}
              ]})
            })
            print("Interpretation lifecycle consistency inventory:")
            printjson({
              generated_without_report_id: generations.countDocuments({status: "generated", $or: [
                {report_id: {$exists: false}},
                {report_id: 0}
              ]}),
              generated_without_artifact: aggregateCount(generations, [
                {$match: {status: "generated"}},
                {$lookup: {from: "interpret_report_artifacts", localField: "domain_id", foreignField: "generation_id", as: "artifact"}},
                {$match: {artifact: {$size: 0}}}
              ]),
              artifacts_without_generation: aggregateCount(artifacts, [
                {$match: {deleted_at: null}},
                {$lookup: {from: "report_generations", localField: "generation_id", foreignField: "domain_id", as: "generation"}},
                {$match: {generation: {$size: 0}}}
              ]),
              artifact_catalog_sources_missing: aggregateCount(reportCatalog, [
                {$match: {source_kind: "artifact"}},
                {$lookup: {from: "interpret_report_artifacts", localField: "source_id", foreignField: "domain_id", as: "source"}},
                {$match: {source: {$size: 0}}}
              ]),
              archive_catalog_sources_missing: aggregateCount(reportCatalog, [
                {$match: {source_kind: "archive"}},
                {$lookup: {from: "archived_reports", localField: "source_id", foreignField: "domain_id", as: "source"}},
                {$match: {source: {$size: 0}}}
              ])
            })
            print("Interpretation current artifact provenance inventory:")
            printjson({
              active_artifacts: artifacts.countDocuments({deleted_at: null}),
              missing_builder_identity: artifacts.countDocuments({deleted_at: null, $or: [
                {builder_identity: {$exists: false}}, {builder_identity: ""}
              ]}),
              missing_content_schema_version: artifacts.countDocuments({deleted_at: null, $or: [
                {content_schema_version: {$exists: false}}, {content_schema_version: ""}
              ]}),
              missing_presentation_profile: artifacts.countDocuments({deleted_at: null, $or: [
                {presentation_profile: {$exists: false}}, {presentation_profile: null}
              ]})
            })
            print("Interpretation archived report compatibility inventory:")
            printjson({
              active_archives: archives.countDocuments({deleted_at: null}),
              missing_org_id: archives.countDocuments({deleted_at: null, $or: [
                {org_id: {$exists: false}}, {org_id: null}
              ]}),
              missing_outcome_id: archives.countDocuments({deleted_at: null, $or: [
                {outcome_id: {$exists: false}}, {outcome_id: 0}
              ]}),
              missing_model_identity: archives.countDocuments({deleted_at: null, $or: [
                {"model.code": {$exists: false}}, {"model.code": ""},
                {"model.version": {$exists: false}}, {"model.version": ""}
              ]}),
              missing_presentation_profile: archives.countDocuments({deleted_at: null, $or: [
                {presentation_profile: {$exists: false}}, {presentation_profile: null}
              ]})
            })
            print("Interpretation template and admission inventory:")
            printjson({
              templates: reportTemplates.aggregate([
                {$group: {_id: {status: "$status", version: "$template_version"}, count: {$sum: 1}}},
                {$sort: {"_id.status": 1, "_id.version": 1}}
              ]).toArray(),
              admission_failures: admissionFailures.aggregate([
                {$group: {_id: {kind: "$kind", decision: "$decision"}, count: {$sum: 1}, last_occurred_at: {$max: "$occurred_at"}}},
                {$sort: {"_id.kind": 1, "_id.decision": 1}}
              ]).toArray(),
              catalog_audit_checkpoint: targetDB.getCollection("interpretation_catalog_audit_checkpoints").findOne(
                {_id: "report_catalog"},
                {_id: 0, schema_version: 1, revision: 1, phase: 1, updated_at: 1, last_completed: 1}
              )
            })
            print("Attention projection status counts:")
            printjson(targetDB.getCollection("interpretation_attention_projections").aggregate([
              {$group: {_id: "$status", count: {$sum: 1}}},
              {$sort: {_id: 1}}
            ]).toArray())
            if (process.env.AUDIT_FROM) {
              const from = new Date(process.env.AUDIT_FROM)
              if (Number.isNaN(from.getTime())) {
                throw new Error("invalid AUDIT_FROM")
              }
              print(`Report artifact attention coverage since ${process.env.AUDIT_FROM}:`)
              printjson(targetDB.getCollection("interpret_report_artifacts").aggregate([
                {$match: {deleted_at: null, generated_at: {$gte: from}}},
                {$project: {
                  report_id: {$toString: "$domain_id"},
                  risk_level: {$ifNull: ["$risk_level", ""]}
                }},
                {$lookup: {
                  from: "interpretation_attention_projections",
                  localField: "report_id",
                  foreignField: "report_id",
                  as: "projection"
                }},
                {$group: {
                  _id: "$risk_level",
                  artifacts: {$sum: 1},
                  missing: {$sum: {$cond: [{$eq: [{$size: "$projection"}, 0]}, 1, 0]}}
                }},
                {$sort: {_id: 1}}
              ], {allowDiskUse: true}).toArray())
            }
            MONGOJS

            chmod 0755 "$MONGO_STATUS_DIR"
            chmod 0644 "$MONGO_STATUS_SCRIPT"
            sudo docker run --rm --network infra-network \
              -v "$MONGO_STATUS_SCRIPT:/audit/status.js:ro" \
              -e MONGODB_DBNAME="$MONGODB_DBNAME" \
              -e AUDIT_FROM="${AUDIT_FROM:-}" \
              mongo:7.0 mongosh \
                --host "$MONGODB_HOST" \
                --port "${MONGODB_PORT:-27017}" \
                --username "$MONGODB_USERNAME" \
                --password="$MONGODB_PASSWORD" \
                --authenticationDatabase admin \
                --quiet \
                --file /audit/status.js
            cleanup_mongo_status_script
            trap - EXIT

            echo "✅ MongoDB connection and read-only audit OK"

            echo ""
            echo "Running MongoDB utility containers:"
            sudo docker ps \
              --no-trunc \
              --filter ancestor=mongo:7.0 \
              --format '{{.ID}}\t{{.Names}}\t{{.CreatedAt}}\t{{.Status}}\t{{.Labels}}\t{{.Command}}'

            echo ""
            echo "Available backups:"
            sudo docker run --rm \
              -v /opt/backups/qs-server/mongodb:/backup:ro \
              --entrypoint /bin/bash \
              mongo:7.0 -Eeuo pipefail -c '
                shopt -s nullglob
                FILES=(/backup/qs_mongodb_backup_*.archive.gz /backup/qs_mongodb_backup_*.partial)
                if (( ${#FILES[@]} == 0 )); then
                  echo "No backups or partial archives found"
                else
                  ls -lht -- "${FILES[@]}" | head -10
                fi
              '
        env:
          MONGODB_HOST: ${{ secrets.MONGODB_HOST }}
          MONGODB_PORT: ${{ secrets.MONGODB_PORT || 27017 }}
          MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
          MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
          MONGODB_DBNAME: ${{ secrets.MONGODB_DBNAME }}
          AUDIT_FROM: ${{ github.event.inputs.audit_from }}

  mysql-status:
    name: MySQL Status
    if: github.event.inputs.operation == 'status' && (github.event.inputs.database == 'mysql' || github.event.inputs.database == 'all')
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64, ops]
    environment: production
    steps:
      - name: Validate SSH configuration
        env:
          SVRA_HOST: ${{ vars.SVRA_HOST }}
          SVRA_USERNAME: ${{ vars.SVRA_USERNAME }}
          SVRA_SSH_KEY: ${{ secrets.SVRA_SSH_KEY }}
          SVRA_SSH_FINGERPRINT: ${{ vars.SVRA_SSH_FINGERPRINT }}
        run: |
          set -Eeuo pipefail
          : "${SVRA_HOST:?SVRA_HOST is empty}"
          : "${SVRA_USERNAME:?SVRA_USERNAME is empty}"
          : "${SVRA_SSH_KEY:?SVRA_SSH_KEY is empty}"
          : "${SVRA_SSH_FINGERPRINT:?SVRA_SSH_FINGERPRINT is empty}"

      - name: Check MySQL recovery status
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.SVRA_HOST }}
          username: ${{ vars.SVRA_USERNAME }}
          key: ${{ secrets.SVRA_SSH_KEY }}
          port: ${{ vars.SVRA_SSH_PORT || 22 }}
          fingerprint: ${{ vars.SVRA_SSH_FINGERPRINT }}
          envs: MYSQL_HOST,MYSQL_PORT,MYSQL_USERNAME,MYSQL_PASSWORD,MYSQL_DATABASE,AUDIT_FROM
          script: |
            set -Eeuo pipefail
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin${PATH:+:$PATH}"

            : "${MYSQL_HOST:?MYSQL_HOST is empty}"
            : "${MYSQL_USERNAME:?MYSQL_USERNAME is empty}"
            : "${MYSQL_PASSWORD:?MYSQL_PASSWORD is empty}"
            : "${MYSQL_DATABASE:?MYSQL_DATABASE is empty}"

            if ! sudo docker network inspect infra-network >/dev/null 2>&1; then
              echo "❌ infra-network is unavailable" >&2
              exit 1
            fi
            if [ -n "${AUDIT_FROM:-}" ] && ! [[ "$AUDIT_FROM" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
              echo "❌ audit_from must use YYYY-MM-DDTHH:MM:SSZ" >&2
              exit 1
            fi

            audit_clause=""
            event_audit_clause=""
            hold_audit_clause=""
            if [ -n "${AUDIT_FROM:-}" ]; then
              audit_from_mysql="CONVERT_TZ('${AUDIT_FROM%Z}', '+00:00', '+08:00')"
              audit_clause="AND failed_at >= ${audit_from_mysql}"
              event_audit_clause="OR (status = 'published' AND created_at >= ${audit_from_mysql})"
              hold_audit_clause="OR (status = 'replayed' AND updated_at >= ${audit_from_mysql})"
            fi
            sudo docker run --rm --network infra-network \
              -e MYSQL_PWD="$MYSQL_PASSWORD" \
              mysql:8.0 mysql --protocol=tcp \
                --host="$MYSQL_HOST" \
                --port="${MYSQL_PORT:-3306}" \
                --user="$MYSQL_USERNAME" \
                --database="$MYSQL_DATABASE" \
                --batch --raw \
                --execute="
                  SELECT VERSION() AS mysql_version;
                  SELECT @@transaction_isolation AS transaction_isolation;
                  SELECT version AS schema_migration_version, dirty AS schema_migration_dirty
                  FROM schema_migrations
                  LIMIT 1;
                  SELECT table_name, engine, table_rows, data_length, index_length
                  FROM information_schema.tables
                  WHERE table_schema = DATABASE() AND table_type = 'BASE TABLE'
                  ORDER BY table_name;
                  SET SESSION group_concat_max_len = 1048576;
                  SET @legacy_backup_count_sql = (
                    SELECT COALESCE(
                      GROUP_CONCAT(
                        CONCAT(
                          'SELECT ', QUOTE(table_name),
                          ' AS legacy_backup_table, COUNT(*) AS exact_rows FROM ',
                          table_name
                        )
                        ORDER BY table_name SEPARATOR ' UNION ALL '
                      ),
                      'SELECT NULL AS legacy_backup_table, NULL AS exact_rows WHERE 1 = 0'
                    )
                    FROM information_schema.tables
                    WHERE table_schema = DATABASE()
                      AND table_type = 'BASE TABLE'
                      AND table_name REGEXP '^seed_orphan_(outbox|stats)_bak_hist_v1[0-9A-Za-z_]*$'
                  );
                  PREPARE legacy_backup_count_stmt FROM @legacy_backup_count_sql;
                  EXECUTE legacy_backup_count_stmt;
                  DEALLOCATE PREPARE legacy_backup_count_stmt;
                  SELECT 'analytics_scan_watermarks' AS retirement_candidate_table,
                         COUNT(*) AS exact_rows
                  FROM analytics_scan_watermarks;
                  WITH ranked_assessments AS (
                    SELECT assessment.testee_id,
                           COUNT(*) OVER (PARTITION BY assessment.testee_id) AS total_evaluated,
                           assessment.evaluated_at AS last_evaluated_at,
                           COALESCE(assessment.risk_level, '') AS risk_level,
                           ROW_NUMBER() OVER (
                             PARTITION BY assessment.testee_id
                             ORDER BY assessment.evaluated_at DESC, assessment.id DESC
                           ) AS row_num
                    FROM assessment FORCE INDEX (idx_assessment_org_testee_evaluated_summary)
                    WHERE assessment.status = 'evaluated'
                      AND assessment.deleted_at IS NULL
                  ), canonical_assessment_summary AS (
                    SELECT testee_id, total_evaluated, last_evaluated_at, risk_level
                    FROM ranked_assessments
                    WHERE row_num = 1
                  )
                  SELECT COUNT(*) AS active_testees,
                         SUM(testee.total_assessments <> 0) AS legacy_total_non_default,
                         SUM(testee.last_assessment_at IS NOT NULL) AS legacy_last_at_non_default,
                         SUM(COALESCE(testee.last_risk_level, '') <> '') AS legacy_risk_non_default,
                         SUM(testee.total_assessments <> COALESCE(canonical.total_evaluated, 0))
                           AS legacy_total_mismatches,
                         SUM(NOT (testee.last_assessment_at <=> canonical.last_evaluated_at))
                           AS legacy_last_at_mismatches,
                         SUM(COALESCE(testee.last_risk_level, '') <> COALESCE(canonical.risk_level, ''))
                           AS legacy_risk_mismatches
                  FROM testee
                  LEFT JOIN canonical_assessment_summary AS canonical
                    ON canonical.testee_id = testee.id
                  WHERE testee.deleted_at IS NULL;
                  SELECT table_name AS retired_table_still_present
                  FROM information_schema.tables
                  WHERE table_schema = DATABASE()
                    AND table_name IN (
                      'analytics_projector_checkpoint',
                      'evaluation_run',
                      'behavior_footprint',
                      'assessment_episode',
                      'analytics_pending_event',
                      'statistics_daily',
                      'statistics_accumulated',
                      'statistics_plan',
                      'statistics_journey_daily',
                      'statistics_content_daily',
                      'statistics_plan_daily',
                      'statistics_v2_org_snapshot',
                      'seed_backfill_stage',
                      'seed_backfill_stage_attempt',
                      'seed_backfill_rollback_operation',
                      'seed_backfill_rollback_resource',
                      'seed_backfill_rollback_phase_attempt'
                    )
                  ORDER BY table_name;
                  SELECT expected.table_name AS canonical_statistics_table_missing
                  FROM (
                    SELECT 'statistics_access_fact' AS table_name
                    UNION ALL SELECT 'statistics_assessment_fact'
                    UNION ALL SELECT 'statistics_plan_fact'
                    UNION ALL SELECT 'statistics_access_daily'
                    UNION ALL SELECT 'statistics_assessment_daily'
                    UNION ALL SELECT 'statistics_plan_activity_daily'
                    UNION ALL SELECT 'statistics_plan_fulfillment_daily'
                    UNION ALL SELECT 'statistics_org_snapshot'
                    UNION ALL SELECT 'statistics_sync_run'
                  ) AS expected
                  LEFT JOIN information_schema.tables AS actual
                    ON actual.table_schema = DATABASE()
                   AND actual.table_name = expected.table_name
                   AND actual.table_type = 'BASE TABLE'
                  WHERE actual.table_name IS NULL
                  ORDER BY expected.table_name;
                  SELECT event_type, status, COALESCE(retry_disposition, '') AS retry_disposition,
                         COUNT(*) AS records, MIN(created_at) AS oldest_created_at,
                         MAX(updated_at) AS latest_updated_at, MAX(attempt_count) AS max_attempt_count
                  FROM domain_event_outbox
                  WHERE status <> 'published' ${event_audit_clause}
                  GROUP BY event_type, status, retry_disposition
                  ORDER BY event_type, status, retry_disposition;
                  SELECT DISTINCT event_type AS unexpected_active_event_type
                  FROM domain_event_outbox
                  WHERE (status <> 'published' ${event_audit_clause})
                    AND event_type NOT IN (
                      'evaluation.requested',
                      'evaluation.retry.requested',
                      'evaluation.outcome.committed',
                      'evaluation.failed'
                    )
                  ORDER BY event_type;
                  SELECT status, COALESCE(retry_disposition, '') AS retry_disposition,
                         COUNT(*) AS records, MIN(blocked_at) AS oldest_blocked_at,
                         MAX(updated_at) AS latest_updated_at,
                         MAX(replay_attempt_count) AS max_replay_attempt_count
                  FROM retry_event_hold
                  WHERE status <> 'replayed' ${hold_audit_clause}
                  GROUP BY status, retry_disposition
                  ORDER BY status, retry_disposition;
                  SELECT run_mode, status, stage, COUNT(*) AS runs,
                         MIN(started_at) AS first_started_at,
                         MAX(started_at) AS last_started_at
                  FROM statistics_sync_run
                  GROUP BY run_mode, status, stage
                  ORDER BY run_mode, status, stage;
                  WITH latest_publish AS (
                    SELECT org_id, id, as_of_date, status, stage, cache_generation,
                           cache_published_at, started_at, finished_at,
                           ROW_NUMBER() OVER (PARTITION BY org_id ORDER BY id DESC) AS row_num
                    FROM statistics_sync_run
                    WHERE run_mode = 'publish'
                  )
                  SELECT publish.org_id, publish.id AS latest_publish_run_id,
                         publish.as_of_date, publish.status, publish.stage,
                         publish.cache_generation, publish.cache_published_at,
                         publish.started_at, publish.finished_at,
                         snapshot.as_of_date AS snapshot_as_of_date,
                         snapshot.snapshot_at
                  FROM latest_publish AS publish
                  LEFT JOIN statistics_org_snapshot AS snapshot
                    ON snapshot.org_id = publish.org_id
                  WHERE publish.row_num = 1
                  ORDER BY publish.org_id;
                  SELECT id, org_id, run_mode, status, stage, as_of_date,
                         cache_generation, cache_published_at, started_at,
                         data_committed_at, finished_at, error_code
                  FROM statistics_sync_run
                  WHERE (status = 'running' AND started_at < NOW(3) - INTERVAL 30 MINUTE)
                     OR status = 'data_committed'
                  ORDER BY started_at, id;
                  SELECT fact_family, fact_type, COUNT(*) AS records,
                         MIN(occurred_at) AS first_occurred_at,
                         MAX(occurred_at) AS last_occurred_at
                  FROM (
                    SELECT 'access' AS fact_family, fact_type, occurred_at FROM statistics_access_fact
                    UNION ALL
                    SELECT 'assessment' AS fact_family, fact_type, occurred_at FROM statistics_assessment_fact
                    UNION ALL
                    SELECT 'plan' AS fact_family, fact_type, occurred_at FROM statistics_plan_fact
                  ) AS facts
                  GROUP BY fact_family, fact_type
                  ORDER BY fact_family, fact_type;
                  SELECT attribution_mode, COUNT(*) AS records,
                         MIN(occurred_at) AS first_occurred_at,
                         MAX(occurred_at) AS last_occurred_at
                  FROM statistics_assessment_fact
                  GROUP BY attribution_mode
                  ORDER BY attribution_mode;
                  SELECT created.org_id,
                         COUNT(DISTINCT created.task_id) AS task_created_facts,
                         COUNT(DISTINCT CASE WHEN schedule.task_id IS NULL THEN created.task_id END)
                           AS tasks_using_legacy_fulfillment_fallback,
                         COUNT(DISTINCT CASE WHEN schedule.task_id IS NOT NULL THEN created.task_id END)
                           AS tasks_with_revisioned_schedule_fact
                  FROM statistics_plan_fact AS created
                  LEFT JOIN (
                    SELECT org_id, task_id
                    FROM statistics_plan_fact
                    WHERE fact_type = 'task_schedule_defined' AND task_id IS NOT NULL
                    GROUP BY org_id, task_id
                  ) AS schedule
                    ON schedule.org_id = created.org_id
                   AND schedule.task_id = created.task_id
                  WHERE created.fact_type = 'task_created' AND created.task_id IS NOT NULL
                  GROUP BY created.org_id
                  ORDER BY created.org_id;
                  SELECT retry_disposition, COUNT(*) AS records,
                         MIN(failed_at) AS first_failed_at, MAX(failed_at) AS last_failed_at
                  FROM event_delivery_dead_letter
                  WHERE 1 = 1 ${audit_clause}
                  GROUP BY retry_disposition
                  ORDER BY retry_disposition;
                  SELECT id, event_id, org_id, delivery_attempts, retry_disposition, failed_at
                  FROM event_delivery_dead_letter
                  WHERE last_error LIKE '%would create a conflict%' ${audit_clause}
                  ORDER BY failed_at, id;
                  SELECT assessment_id, attempt_no, COUNT(*) AS duplicate_records,
                         GROUP_CONCAT(resource_id ORDER BY id SEPARATOR ',') AS run_ids
                  FROM runtime_checkpoint
                  WHERE scope = 'evaluation_run'
                    AND assessment_id IS NOT NULL
                    AND deleted_at IS NULL
                  GROUP BY assessment_id, attempt_no
                  HAVING COUNT(*) > 1
                  ORDER BY assessment_id, attempt_no;
                  SELECT COUNT(*) AS noncanonical_evaluation_run_identities
                  FROM runtime_checkpoint
                  WHERE scope = 'evaluation_run'
                    AND assessment_id IS NOT NULL
                    AND deleted_at IS NULL
                    AND resource_id <> CONCAT(CAST(assessment_id AS CHAR), ':', CAST(attempt_no AS CHAR));
                  SELECT id, assessment_id, attempt_no, resource_id
                  FROM runtime_checkpoint
                  WHERE scope = 'evaluation_run'
                    AND assessment_id IS NOT NULL
                    AND deleted_at IS NULL
                    AND resource_id <> CONCAT(CAST(assessment_id AS CHAR), ':', CAST(attempt_no AS CHAR))
                  ORDER BY id
                  LIMIT 20;
                  SELECT index_name, non_unique,
                         GROUP_CONCAT(column_name ORDER BY seq_in_index SEPARATOR ',') AS index_columns
                  FROM information_schema.statistics
                  WHERE table_schema = DATABASE()
                    AND table_name = 'runtime_checkpoint'
                  GROUP BY index_name, non_unique
                  ORDER BY index_name;
                  SELECT
                    (SELECT COUNT(*)
                     FROM assessment AS a
                     LEFT JOIN evaluation_outcome AS o ON o.assessment_id = a.id
                     WHERE a.status = 'evaluated' AND a.deleted_at IS NULL AND o.id IS NULL)
                      AS evaluated_assessments_without_outcome,
                    (SELECT COUNT(*)
                     FROM evaluation_outcome AS o
                     LEFT JOIN assessment AS a ON a.id = o.assessment_id AND a.deleted_at IS NULL
                     WHERE a.id IS NULL OR a.status <> 'evaluated')
                      AS outcomes_without_evaluated_assessment,
                    (SELECT COUNT(*)
                     FROM assessment_score
                     WHERE deleted_at IS NULL AND evaluation_outcome_id IS NULL)
                      AS score_rows_without_outcome,
                    (SELECT COUNT(*)
                     FROM evaluation_outcome
                     WHERE model_sub_kind IS NOT NULL AND model_sub_kind <> '')
                      AS outcomes_with_legacy_sub_kind,
                    (SELECT COUNT(*)
                     FROM evaluation_outcome
                     WHERE decision_kind IS NULL OR decision_kind = '')
                      AS outcomes_missing_decision_kind;
                "
            echo "✅ MySQL connection and read-only recovery audit OK"
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT || 3306 }}
          MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE != '' && secrets.MYSQL_DATABASE || secrets.MYSQL_DBNAME }}
          AUDIT_FROM: ${{ github.event.inputs.audit_from }}

  redis-status:
    name: Redis Keyspace Status
    if: github.event.inputs.operation == 'status' && (github.event.inputs.database == 'redis' || github.event.inputs.database == 'all')
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64, ops]
    timeout-minutes: 30
    environment: production
    steps:
      - name: Validate SSH configuration
        env:
          SVRA_HOST: ${{ vars.SVRA_HOST }}
          SVRA_USERNAME: ${{ vars.SVRA_USERNAME }}
          SVRA_SSH_KEY: ${{ secrets.SVRA_SSH_KEY }}
          SVRA_SSH_FINGERPRINT: ${{ vars.SVRA_SSH_FINGERPRINT }}
        run: |
          set -Eeuo pipefail
          : "${SVRA_HOST:?SVRA_HOST is empty}"
          : "${SVRA_USERNAME:?SVRA_USERNAME is empty}"
          : "${SVRA_SSH_KEY:?SVRA_SSH_KEY is empty}"
          : "${SVRA_SSH_FINGERPRINT:?SVRA_SSH_FINGERPRINT is empty}"

      - name: Inventory Redis keyspaces without exposing keys
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.SVRA_HOST }}
          username: ${{ vars.SVRA_USERNAME }}
          key: ${{ secrets.SVRA_SSH_KEY }}
          port: ${{ vars.SVRA_SSH_PORT || 22 }}
          fingerprint: ${{ vars.SVRA_SSH_FINGERPRINT }}
          command_timeout: 25m
          envs: REDIS_HOST,REDIS_PORT,REDIS_USERNAME,REDIS_PASSWORD,REDIS_USE_SSL,REDIS_SSL_INSECURE_SKIP_VERIFY
          script: |
            set -Eeuo pipefail
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin${PATH:+:$PATH}"

            : "${REDIS_HOST:?REDIS_HOST is empty}"
            REDIS_PORT="${REDIS_PORT:-6379}"
            REDIS_AUDIT_CONTAINER="qs-server-redis-keyspace-audit"

            if ! sudo docker network inspect infra-network >/dev/null 2>&1; then
              echo "❌ infra-network is unavailable" >&2
              exit 1
            fi

            cleanup_redis_audit_container() {
              sudo docker rm -f "$REDIS_AUDIT_CONTAINER" >/dev/null 2>&1 || true
            }
            trap cleanup_redis_audit_container EXIT

            REDIS_CLI_ARGS=(-h "$REDIS_HOST" -p "$REDIS_PORT" --no-auth-warning --raw)
            if [ -n "${REDIS_USERNAME:-}" ]; then
              REDIS_CLI_ARGS+=(--user "$REDIS_USERNAME")
            fi
            if [ "${REDIS_USE_SSL:-false}" = "true" ]; then
              REDIS_CLI_ARGS+=(--tls)
              if [ "${REDIS_SSL_INSECURE_SKIP_VERIFY:-false}" = "true" ]; then
                REDIS_CLI_ARGS+=(--insecure)
              fi
            fi

            redis_cli() {
              local database="$1"
              shift
              sudo docker run --rm --network infra-network \
                --name "$REDIS_AUDIT_CONTAINER" \
                --label "com.fangcunmount.qs-server.operation=redis-keyspace-audit" \
                --label "com.fangcunmount.qs-server.github-run-id=${{ github.run_id }}" \
                -e REDISCLI_AUTH="${REDIS_PASSWORD:-}" \
                redis:7-alpine redis-cli "${REDIS_CLI_ARGS[@]}" -n "$database" "$@"
            }

            scan_database() {
              local database="$1"
              local db_size scan_total current_questionnaire current_models
              local current_assessment current_testee current_plan current_stats current_statistics_compat
              local current_assess_list current_version current_assessment_list_version_compat
              local current_hotset current_family_other
              local legacy_assessment_list_data_candidate legacy_statistics_data_candidate
              local legacy_unnamespaced_candidate
              local other key scan_dir scan_pid
              scan_total=0
              current_questionnaire=0
              current_models=0
              current_assessment=0
              current_testee=0
              current_plan=0
              current_stats=0
              current_statistics_compat=0
              current_assess_list=0
              current_version=0
              current_assessment_list_version_compat=0
              current_hotset=0
              current_family_other=0
              legacy_assessment_list_data_candidate=0
              legacy_statistics_data_candidate=0
              legacy_unnamespaced_candidate=0
              other=0

              db_size=$(redis_cli "$database" DBSIZE | tr -d '\r')
              scan_dir=$(mktemp -d /tmp/qs-redis-scan.XXXXXX)
              mkfifo "$scan_dir/keys"
              redis_cli "$database" --scan --count 1000 >"$scan_dir/keys" &
              scan_pid=$!
              while IFS= read -r key; do
                [ -n "$key" ] || continue
                scan_total=$((scan_total + 1))
                case "$database:$key" in
                  2:cache:static:questionnaire:*) current_questionnaire=$((current_questionnaire + 1)) ;;
                  2:cache:static:assessment_model:published:*) current_models=$((current_models + 1)) ;;
                  3:cache:object:assessment:detail:*) current_assessment=$((current_assessment + 1)) ;;
                  3:cache:object:testee:info:*) current_testee=$((current_testee + 1)) ;;
                  3:cache:object:plan:info:*) current_plan=$((current_plan + 1)) ;;
                  4:cache:query:query:version:statistics:v2:org:*|4:cache:query:query:data:statistics:v2:org:*)
                    current_stats=$((current_stats + 1))
                    ;;
                  4:query:version:statistics:org:*|4:query:data:statistics:org:*)
                    current_statistics_compat=$((current_statistics_compat + 1))
                    ;;
                  4:cache:query:stats:query:*) legacy_statistics_data_candidate=$((legacy_statistics_data_candidate + 1)) ;;
                  4:cache:query:query:assessment:list:v2:*) current_assess_list=$((current_assess_list + 1)) ;;
                  4:cache:query:assess:list:*|4:cache:query:query:assessment:list:*)
                    legacy_assessment_list_data_candidate=$((legacy_assessment_list_data_candidate + 1))
                    ;;
                  7:cache:meta:query:version:*) current_version=$((current_version + 1)) ;;
                  7:cache:query:query:version:assessment:list:*)
                    current_assessment_list_version_compat=$((current_assessment_list_version_compat + 1))
                    ;;
                  7:cache:meta:warmup:hot:*) current_hotset=$((current_hotset + 1)) ;;
                  0:ops:runtime:*|1:ops:runtime:*|2:cache:static:*|3:cache:object:*|4:cache:query:*|5:cache:sdk:*|6:cache:lock:*|7:cache:meta:*|8:cache:rank:*)
                    current_family_other=$((current_family_other + 1))
                    ;;
                  *:questionnaire:*|*:scale:*|*:assessment_model:*|*:assessment:*|*:assess:*|*:stats:*|*:testee:*|*:plan:*|*:query:*|*:warmup:*|*:answersheet:*)
                    legacy_unnamespaced_candidate=$((legacy_unnamespaced_candidate + 1))
                    ;;
                  *) other=$((other + 1)) ;;
                esac
              done <"$scan_dir/keys"
              if ! wait "$scan_pid"; then
                rm -f -- "$scan_dir/keys"
                rmdir -- "$scan_dir"
                echo "❌ Redis SCAN failed for DB ${database}" >&2
                return 1
              fi
              rm -f -- "$scan_dir/keys"
              rmdir -- "$scan_dir"

              echo "redis_db=${database} dbsize=${db_size} scanned=${scan_total}"
              echo "  current_questionnaire=${current_questionnaire} current_models=${current_models}"
              echo "  current_assessment=${current_assessment} current_testee=${current_testee} current_plan=${current_plan}"
              echo "  current_stats=${current_stats} current_statistics_compat=${current_statistics_compat} current_assess_list=${current_assess_list}"
              echo "  current_version=${current_version} current_assessment_list_version_compat=${current_assessment_list_version_compat}"
              echo "  current_hotset=${current_hotset} current_family_other=${current_family_other}"
              echo "  legacy_assessment_list_data_candidate=${legacy_assessment_list_data_candidate}"
              echo "  legacy_statistics_data_candidate=${legacy_statistics_data_candidate}"
              echo "  legacy_unnamespaced_candidate=${legacy_unnamespaced_candidate} other=${other}"
              if [ "$scan_total" != "$db_size" ]; then
                echo "  note=DBSIZE and SCAN differ because keys may expire during the read-only audit"
              fi
            }

            redis_cli 0 PING >/dev/null
            echo "✅ Redis connection OK"
            echo "Redis server summary:"
            redis_cli 0 INFO server | grep -E '^(redis_version|redis_mode|os|arch_bits):'
            redis_cli 0 INFO memory | grep -E '^(used_memory_human|maxmemory_human|maxmemory_policy|mem_fragmentation_ratio):'

            echo ""
            echo "Redis keyspace inventory (counts only; key names and values are never printed):"
            for database in 0 1 2 3 4 5 6 7 8; do
              scan_database "$database"
            done

            cleanup_redis_audit_container
            trap - EXIT
            echo "✅ Redis read-only keyspace audit OK"
        env:
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT || 6379 }}
          REDIS_USERNAME: ${{ secrets.REDIS_USERNAME }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_USE_SSL: ${{ secrets.REDIS_USE_SSL }}
          REDIS_SSL_INSECURE_SKIP_VERIFY: ${{ secrets.REDIS_SSL_INSECURE_SKIP_VERIFY }}
