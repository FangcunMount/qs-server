          port: ${{ vars.SVRA_SSH_PORT || 22 }}
          fingerprint: ${{ vars.SVRA_SSH_FINGERPRINT }}
          command_timeout: 85m
          envs: MONGODB_HOST,MONGODB_PORT,MONGODB_USERNAME,MONGODB_PASSWORD,MONGODB_DBNAME,GITHUB_RUN_ID_INPUT,GITHUB_RUN_ATTEMPT_INPUT,MODEL_TEMPLATE_ROUTE_OPERATION_INPUT,MODEL_TEMPLATE_ROUTE_MANIFEST_INPUT,MODEL_TEMPLATE_ROUTE_AFTER_ID_INPUT,MODEL_TEMPLATE_ROUTE_MAX_RECORDS_INPUT,MODEL_TEMPLATE_ROUTE_REQUIRE_COMPLETE_INPUT,MODEL_TEMPLATE_ROUTE_CONFIRM_INPUT,BACKUP_FILE_INPUT
