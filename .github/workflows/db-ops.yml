name: Database Operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Database operation'
        required: true
        type: choice
        options:
          - backup
          - validate
          - restore
          - status
      backup_name:
        description: 'Backup name (for restore operation)'
        required: false
        type: string
      database:
        description: 'Database to operate on'
        required: true
        type: choice
        options:
          - mongodb
          - mysql
          - all
      audit_from:
        description: 'Optional RFC3339 UTC lower bound for read-only recovery audit'
        required: false
        type: string

  schedule:
    - cron: '0 17 * * *'  # 每天 17:00 UTC (北京时间凌晨 01:00) 自动备份

permissions:
  contents: read

# Serialize scheduled and manual production database operations across workflow runs.
concurrency:
  group: qs-server-db-ops-production
  cancel-in-progress: false

jobs:
  mongodb-backup:
    name: MongoDB Backup
    if: |
      (github.event_name == 'schedule') ||
      (github.event.inputs.operation == 'backup' && (github.event.inputs.database == 'mongodb' || github.event.inputs.database == 'all'))
    # SVRA_HOST is a Tailscale address; run inside the qlume tailnet instead of GitHub-hosted.
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64, ops]
    # MONGODB_* 等敏感项在 production Environment；缺此行会导致 secrets 为空、备份静默失败。
    environment: production
    steps:
      - name: Validate SSH configuration
        env:
          SVRA_HOST: ${{ vars.SVRA_HOST }}
          SVRA_USERNAME: ${{ vars.SVRA_USERNAME }}
          SVRA_SSH_KEY: ${{ secrets.SVRA_SSH_KEY }}
          SVRA_SSH_FINGERPRINT: ${{ vars.SVRA_SSH_FINGERPRINT }}
        run: |
          set -Eeuo pipefail
          : "${SVRA_HOST:?SVRA_HOST is empty}"
          : "${SVRA_USERNAME:?SVRA_USERNAME is empty}"
          : "${SVRA_SSH_KEY:?SVRA_SSH_KEY is empty}"
          : "${SVRA_SSH_FINGERPRINT:?SVRA_SSH_FINGERPRINT is empty}"

      - name: Backup MongoDB
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.SVRA_HOST }}
          username: ${{ vars.SVRA_USERNAME }}
          key: ${{ secrets.SVRA_SSH_KEY }}
          port: ${{ vars.SVRA_SSH_PORT || 22 }}
          fingerprint: ${{ vars.SVRA_SSH_FINGERPRINT }}
          command_timeout: 2h
          envs: MONGODB_HOST,MONGODB_PORT,MONGODB_USERNAME,MONGODB_PASSWORD,MONGODB_DBNAME
          script: |
            set -Eeuo pipefail
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin${PATH:+:$PATH}"

            : "${MONGODB_HOST:?MONGODB_HOST is empty (check production Environment secrets)}"
            : "${MONGODB_DBNAME:?MONGODB_DBNAME is empty}"
            : "${MONGODB_USERNAME:?MONGODB_USERNAME is empty}"
            : "${MONGODB_PASSWORD:?MONGODB_PASSWORD is empty}"

            if ! sudo docker network inspect infra-network >/dev/null 2>&1; then
              echo "❌ infra-network is unavailable" >&2
              exit 1
            fi

            BACKUP_DIR="/opt/backups/qs-server/mongodb"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            BACKUP_FILE="qs_mongodb_backup_${TIMESTAMP}.archive.gz"
            PARTIAL_FILE="${BACKUP_FILE}.partial"
            MONGODB_PORT="${MONGODB_PORT:-27017}"
            MONGODB_URI="mongodb://${MONGODB_HOST}:${MONGODB_PORT}/?connectTimeoutMS=30000&socketTimeoutMS=0"

            sudo install -d -m 0750 "$BACKUP_DIR"

            echo "Starting MongoDB backup..."
            echo "Database: $MONGODB_DBNAME"
            echo "Host: $MONGODB_HOST:$MONGODB_PORT"
            echo "Timestamp: $TIMESTAMP"

            sudo docker run --rm --network infra-network \
              -v "$BACKUP_DIR:/backup" \
              -e MONGODB_HOST="$MONGODB_HOST" \
              -e MONGODB_PORT="$MONGODB_PORT" \
              -e MONGODB_USERNAME="$MONGODB_USERNAME" \
              -e MONGODB_PASSWORD="$MONGODB_PASSWORD" \
              -e MONGODB_DBNAME="$MONGODB_DBNAME" \
              -e MONGODB_URI="$MONGODB_URI" \
              -e BACKUP_FILE="$BACKUP_FILE" \
              -e PARTIAL_FILE="$PARTIAL_FILE" \
              --entrypoint /usr/bin/timeout \
              mongo:7.0 115m /bin/bash -Eeuo pipefail -c '
                cleanup_partial() {
                  rm -f -- "/backup/$PARTIAL_FILE"
                }
                trap cleanup_partial EXIT

                for ATTEMPT in 1 2 3; do
                  rm -f -- "/backup/$PARTIAL_FILE"
                  if mongodump \
                    --uri="$MONGODB_URI" \
                    --username="$MONGODB_USERNAME" \
                    --password="$MONGODB_PASSWORD" \
                    --authenticationDatabase=admin \
                    --db="$MONGODB_DBNAME" \
                    --numParallelCollections=1 \
                    --archive | gzip -1 > "/backup/$PARTIAL_FILE"; then
                    break
                  fi
                  if (( ATTEMPT == 3 )); then
                    echo "❌ MongoDB backup failed after $ATTEMPT attempts" >&2
                    exit 1
                  fi
                  echo "⚠️ MongoDB backup attempt $ATTEMPT failed; retrying in 15 seconds" >&2
                  sleep 15
                done

                if [ ! -s "/backup/$PARTIAL_FILE" ]; then
                  echo "❌ MongoDB backup archive is empty" >&2
                  exit 1
                fi
                mv -- "/backup/$PARTIAL_FILE" "/backup/$BACKUP_FILE"
                chmod 0640 "/backup/$BACKUP_FILE"
                trap - EXIT

                BACKUP_SIZE=$(du -h "/backup/$BACKUP_FILE" | cut -f1)
                echo "✅ Backup completed: $BACKUP_FILE"
                echo "Size: $BACKUP_SIZE"

                echo "Cleaning old backups (keeping last 5)..."
                shopt -s nullglob
                BACKUPS=(/backup/qs_mongodb_backup_*.archive.gz)
                if (( ${#BACKUPS[@]} > 5 )); then
                  mapfile -t SORTED_BACKUPS < <(ls -1t -- "${BACKUPS[@]}")
                  rm -f -- "${SORTED_BACKUPS[@]:5}"
                fi

                echo ""
                echo "Current backups:"
                BACKUPS=(/backup/qs_mongodb_backup_*.archive.gz)
                ls -lht -- "${BACKUPS[@]}" | head -6
              '
        env:
          MONGODB_HOST: ${{ secrets.MONGODB_HOST }}
          MONGODB_PORT: ${{ secrets.MONGODB_PORT || 27017 }}
          MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
          MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
          MONGODB_DBNAME: ${{ secrets.MONGODB_DBNAME }}

  mongodb-backup-validate:
    name: MongoDB Backup Validate
    if: github.event.inputs.operation == 'validate' && github.event.inputs.database == 'mongodb'
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64, ops]
    environment: production
    steps:
      - name: Validate SSH configuration
        env:
          SVRA_HOST: ${{ vars.SVRA_HOST }}
          SVRA_USERNAME: ${{ vars.SVRA_USERNAME }}
          SVRA_SSH_KEY: ${{ secrets.SVRA_SSH_KEY }}
          SVRA_SSH_FINGERPRINT: ${{ vars.SVRA_SSH_FINGERPRINT }}
        run: |
          set -Eeuo pipefail
          : "${SVRA_HOST:?SVRA_HOST is empty}"
          : "${SVRA_USERNAME:?SVRA_USERNAME is empty}"
          : "${SVRA_SSH_KEY:?SVRA_SSH_KEY is empty}"
          : "${SVRA_SSH_FINGERPRINT:?SVRA_SSH_FINGERPRINT is empty}"

      - name: Validate MongoDB backup archive
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.SVRA_HOST }}
          username: ${{ vars.SVRA_USERNAME }}
          key: ${{ secrets.SVRA_SSH_KEY }}
          port: ${{ vars.SVRA_SSH_PORT || 22 }}
          fingerprint: ${{ vars.SVRA_SSH_FINGERPRINT }}
          command_timeout: 30m
          envs: MONGODB_HOST,MONGODB_PORT,MONGODB_USERNAME,MONGODB_PASSWORD,MONGODB_DBNAME,BACKUP_FILE_INPUT
          script: |
            set -Eeuo pipefail
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin${PATH:+:$PATH}"

            : "${MONGODB_HOST:?MONGODB_HOST is empty (check production Environment secrets)}"
            : "${MONGODB_DBNAME:?MONGODB_DBNAME is empty}"
            : "${MONGODB_USERNAME:?MONGODB_USERNAME is empty}"
            : "${MONGODB_PASSWORD:?MONGODB_PASSWORD is empty}"

            if ! sudo docker network inspect infra-network >/dev/null 2>&1; then
              echo "❌ infra-network is unavailable" >&2
              exit 1
            fi

            BACKUP_DIR="/opt/backups/qs-server/mongodb"
            BACKUP_FILE="$BACKUP_FILE_INPUT"
            if ! [[ "$BACKUP_FILE" =~ ^qs_mongodb_backup_[0-9]{8}_[0-9]{6}\.archive\.gz$ ]]; then
              echo "❌ Invalid backup name: $BACKUP_FILE" >&2
              exit 1
            fi
            if ! sudo docker run --rm \
              -v "$BACKUP_DIR:/backup:ro" \
              --entrypoint test \
              mongo:7.0 -s "/backup/$BACKUP_FILE"; then
              echo "❌ Backup archive is missing or empty: $BACKUP_FILE" >&2
              exit 1
            fi

            echo "Validating MongoDB backup archive without importing data..."
            sudo docker run --rm --network infra-network \
              -v "$BACKUP_DIR:/backup:ro" \
              --entrypoint /usr/bin/timeout \
              mongo:7.0 25m mongorestore \
                --host="$MONGODB_HOST" \
                --port="${MONGODB_PORT:-27017}" \
                --username="$MONGODB_USERNAME" \
                --password="$MONGODB_PASSWORD" \
                --authenticationDatabase=admin \
                --archive="/backup/$BACKUP_FILE" \
                --gzip \
                --nsInclude="$MONGODB_DBNAME.*" \
                --dryRun \
                --verbose
            echo "✅ MongoDB backup archive dry-run validation succeeded: $BACKUP_FILE"
        env:
          MONGODB_HOST: ${{ secrets.MONGODB_HOST }}
          MONGODB_PORT: ${{ secrets.MONGODB_PORT || 27017 }}
          MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
          MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
          MONGODB_DBNAME: ${{ secrets.MONGODB_DBNAME }}
          BACKUP_FILE_INPUT: ${{ github.event.inputs.backup_name }}

  mongodb-restore:
    name: MongoDB Restore
    if: github.event.inputs.operation == 'restore' && github.event.inputs.database == 'mongodb'
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64, ops]
    environment: production
    steps:
      - name: Validate SSH configuration
        env:
          SVRA_HOST: ${{ vars.SVRA_HOST }}
          SVRA_USERNAME: ${{ vars.SVRA_USERNAME }}
          SVRA_SSH_KEY: ${{ secrets.SVRA_SSH_KEY }}
          SVRA_SSH_FINGERPRINT: ${{ vars.SVRA_SSH_FINGERPRINT }}
        run: |
          set -Eeuo pipefail
          : "${SVRA_HOST:?SVRA_HOST is empty}"
          : "${SVRA_USERNAME:?SVRA_USERNAME is empty}"
          : "${SVRA_SSH_KEY:?SVRA_SSH_KEY is empty}"
          : "${SVRA_SSH_FINGERPRINT:?SVRA_SSH_FINGERPRINT is empty}"

      - name: Restore MongoDB
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.SVRA_HOST }}
          username: ${{ vars.SVRA_USERNAME }}
          key: ${{ secrets.SVRA_SSH_KEY }}
          port: ${{ vars.SVRA_SSH_PORT || 22 }}
          fingerprint: ${{ vars.SVRA_SSH_FINGERPRINT }}
          command_timeout: 2h
          envs: MONGODB_HOST,MONGODB_PORT,MONGODB_USERNAME,MONGODB_PASSWORD,MONGODB_DBNAME,BACKUP_FILE_INPUT
          script: |
            set -Eeuo pipefail
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin${PATH:+:$PATH}"

            : "${MONGODB_HOST:?MONGODB_HOST is empty (check production Environment secrets)}"
            : "${MONGODB_DBNAME:?MONGODB_DBNAME is empty}"
            : "${MONGODB_USERNAME:?MONGODB_USERNAME is empty}"
            : "${MONGODB_PASSWORD:?MONGODB_PASSWORD is empty}"

            if ! sudo docker network inspect infra-network >/dev/null 2>&1; then
              echo "❌ infra-network is unavailable" >&2
              exit 1
            fi

            BACKUP_DIR="/opt/backups/qs-server/mongodb"
            BACKUP_FILE="$BACKUP_FILE_INPUT"
            list_backups() {
              sudo docker run --rm \
                -v "$BACKUP_DIR:/backup:ro" \
                --entrypoint /bin/bash \
                mongo:7.0 -Eeuo pipefail -c '
                  shopt -s nullglob
                  BACKUPS=(/backup/qs_mongodb_backup_*.archive.gz)
                  if (( ${#BACKUPS[@]} == 0 )); then
                    echo "No backups found"
                  else
                    ls -lht -- "${BACKUPS[@]}" | head -10
                  fi
                '
            }

            if [ -z "$BACKUP_FILE" ]; then
              echo "❌ Backup name is required"
              echo ""
              echo "Available backups:"
              list_backups
              exit 1
            fi

            if ! [[ "$BACKUP_FILE" =~ ^qs_mongodb_backup_[0-9]{8}_[0-9]{6}\.archive\.gz$ ]]; then
              echo "❌ Invalid backup name: $BACKUP_FILE" >&2
              exit 1
            fi

            if ! sudo docker run --rm \
              -v "$BACKUP_DIR:/backup:ro" \
              --entrypoint test \
              mongo:7.0 -f "/backup/$BACKUP_FILE"; then
              echo "❌ Backup file not found: $BACKUP_FILE"
              echo ""
              echo "Available backups:"
              list_backups
              exit 1
            fi

            echo "⚠️ WARNING: This will overwrite the current database!"
            echo "Backup file: $BACKUP_FILE"
            echo "Target database: $MONGODB_DBNAME"
            echo "Restoring in 5 seconds..."
            sleep 5

            echo "Restoring database..."
            sudo docker run --rm --network infra-network \
              -v "$BACKUP_DIR:/backup:ro" \
              --entrypoint /usr/bin/timeout \
              mongo:7.0 115m mongorestore \
                --host="$MONGODB_HOST" \
                --port="${MONGODB_PORT:-27017}" \
                --username="$MONGODB_USERNAME" \
                --password="$MONGODB_PASSWORD" \
                --authenticationDatabase=admin \
                --archive="/backup/$BACKUP_FILE" \
                --gzip \
                --drop \
                --nsInclude="$MONGODB_DBNAME.*"

            echo "✅ Database restored successfully from $BACKUP_FILE"
        env:
          MONGODB_HOST: ${{ secrets.MONGODB_HOST }}
          MONGODB_PORT: ${{ secrets.MONGODB_PORT || 27017 }}
          MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
          MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
          MONGODB_DBNAME: ${{ secrets.MONGODB_DBNAME }}
          BACKUP_FILE_INPUT: ${{ github.event.inputs.backup_name }}

  mongodb-status:
    name: MongoDB Status
    if: github.event.inputs.operation == 'status' && (github.event.inputs.database == 'mongodb' || github.event.inputs.database == 'all')
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64, ops]
    environment: production
    steps:
      - name: Validate SSH configuration
        env:
          SVRA_HOST: ${{ vars.SVRA_HOST }}
          SVRA_USERNAME: ${{ vars.SVRA_USERNAME }}
          SVRA_SSH_KEY: ${{ secrets.SVRA_SSH_KEY }}
          SVRA_SSH_FINGERPRINT: ${{ vars.SVRA_SSH_FINGERPRINT }}
        run: |
          set -Eeuo pipefail
          : "${SVRA_HOST:?SVRA_HOST is empty}"
          : "${SVRA_USERNAME:?SVRA_USERNAME is empty}"
          : "${SVRA_SSH_KEY:?SVRA_SSH_KEY is empty}"
          : "${SVRA_SSH_FINGERPRINT:?SVRA_SSH_FINGERPRINT is empty}"

      - name: Check MongoDB Status
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.SVRA_HOST }}
          username: ${{ vars.SVRA_USERNAME }}
          key: ${{ secrets.SVRA_SSH_KEY }}
          port: ${{ vars.SVRA_SSH_PORT || 22 }}
          fingerprint: ${{ vars.SVRA_SSH_FINGERPRINT }}
          envs: MONGODB_HOST,MONGODB_PORT,MONGODB_USERNAME,MONGODB_PASSWORD,MONGODB_DBNAME,AUDIT_FROM
          script: |
            set -Eeuo pipefail
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin${PATH:+:$PATH}"

            : "${MONGODB_HOST:?MONGODB_HOST is empty (check production Environment secrets)}"
            : "${MONGODB_DBNAME:?MONGODB_DBNAME is empty}"
            : "${MONGODB_USERNAME:?MONGODB_USERNAME is empty}"
            : "${MONGODB_PASSWORD:?MONGODB_PASSWORD is empty}"

            echo "=== MongoDB Status ==="

            if ! sudo docker network inspect infra-network >/dev/null 2>&1; then
              echo "❌ infra-network is unavailable" >&2
              exit 1
            fi

            if [ -n "${AUDIT_FROM:-}" ] && ! [[ "$AUDIT_FROM" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
              echo "❌ audit_from must use YYYY-MM-DDTHH:MM:SSZ" >&2
              exit 1
            fi

            sudo docker run --rm -i --network infra-network \
              -e MONGODB_DBNAME="$MONGODB_DBNAME" \
              -e AUDIT_FROM="${AUDIT_FROM:-}" \
              mongo:7.0 mongosh \
                --host "$MONGODB_HOST" \
                --port "${MONGODB_PORT:-27017}" \
                --username "$MONGODB_USERNAME" \
                --password "$MONGODB_PASSWORD" \
                --authenticationDatabase admin \
                --quiet <<'MONGOJS'
            const targetDB = db.getSiblingDB(process.env.MONGODB_DBNAME)
            const collectionNames = targetDB.getCollectionNames().sort()
            print(`MongoDB version: ${db.version()}`)
            print("Database statistics:")
            printjson(targetDB.stats())
            print("Schema migration state:")
            printjson(targetDB.getCollection("schema_migrations").findOne({}, {projection: {_id: 0, version: 1, dirty: 1}}))
            print("Collections:")
            printjson(collectionNames)
            print("Retirement candidate collection statistics:")
            printjson(collectionNames
              .filter(name => name === "answersheet_submit_idempotency" ||
                name.includes("_legacy_") ||
                name.includes("__seed_orphan_backup_hist_v1"))
              .map(name => {
                const stats = targetDB.runCommand({collStats: name})
                return {
                  name,
                  count: stats.count,
                  size: stats.size,
                  storage_size: stats.storageSize,
                  total_index_size: stats.totalIndexSize,
                  indexes: stats.nindexes
                }
              }))
            const assessmentModels = targetDB.getCollection("assessment_models")
            print("ModelCatalog compatibility inventory:")
            printjson({
              total: assessmentModels.countDocuments({}),
              heads: assessmentModels.countDocuments({record_role: "head", deleted_at: null}),
              snapshots: assessmentModels.countDocuments({record_role: "published_snapshot", deleted_at: null}),
              missing_record_role: assessmentModels.countDocuments({record_role: {$exists: false}}),
              unknown_record_role: assessmentModels.countDocuments({record_role: {$exists: true, $nin: ["head", "published_snapshot"]}}),
              persisted_legacy_identity_fields: assessmentModels.countDocuments({$or: [
                {sub_kind: {$exists: true}},
                {product_channel: {$exists: true}},
                {algorithm_family: {$exists: true}}
              ]}),
              active_snapshots: assessmentModels.countDocuments({record_role: "published_snapshot", release_status: "active", deleted_at: null}),
              archived_snapshots: assessmentModels.countDocuments({record_role: "published_snapshot", release_status: "archived", deleted_at: null}),
              snapshots_missing_release_status: assessmentModels.countDocuments({record_role: "published_snapshot", deleted_at: null, $or: [
                {release_status: {$exists: false}},
                {release_status: ""}
              ]}),
              snapshots_missing_canonical_identity: assessmentModels.countDocuments({record_role: "published_snapshot", deleted_at: null, $or: [
                {kind: {$exists: false}}, {kind: ""},
                {algorithm: {$exists: false}}, {algorithm: ""},
                {code: {$exists: false}}, {code: ""},
                {release_version: {$exists: false}}, {release_version: ""},
                {decision_kind: {$exists: false}}, {decision_kind: ""}
              ]}),
              snapshots_missing_definition_v2: assessmentModels.countDocuments({record_role: "published_snapshot", deleted_at: null, definition_v2: {$exists: false}}),
              active_identity_duplicates: assessmentModels.aggregate([
                {$match: {record_role: "published_snapshot", release_status: "active", deleted_at: null}},
                {$group: {_id: {kind: "$kind", algorithm: "$algorithm", code: "$code"}, count: {$sum: 1}}},
                {$match: {count: {$gt: 1}}},
                {$count: "groups"}
              ]).toArray()[0]?.groups || 0
            })
            print("ModelCatalog index inventory:")
            printjson(assessmentModels.getIndexes().map(index => ({
              name: index.name,
              key: index.key,
              unique: index.unique === true,
              partial_filter: index.partialFilterExpression || null
            })))
            const assessmentNorms = targetDB.getCollection("assessment_norms")
            print("ModelCatalog norm inventory:")
            printjson({
              total: assessmentNorms.countDocuments({deleted_at: null}),
              missing_table_version: assessmentNorms.countDocuments({deleted_at: null, $or: [
                {table_version: {$exists: false}},
                {table_version: ""}
              ]}),
              missing_runtime_identity: assessmentNorms.countDocuments({deleted_at: null, $or: [
                {kind: {$exists: false}}, {kind: ""},
                {algorithm: {$exists: false}}, {algorithm: ""}
              ]})
            })
            print("Attention projection status counts:")
            printjson(targetDB.getCollection("interpretation_attention_projections").aggregate([
              {$group: {_id: "$status", count: {$sum: 1}}},
              {$sort: {_id: 1}}
            ]).toArray())
            if (process.env.AUDIT_FROM) {
              const from = new Date(process.env.AUDIT_FROM)
              if (Number.isNaN(from.getTime())) {
                throw new Error("invalid AUDIT_FROM")
              }
              print(`Report artifact attention coverage since ${process.env.AUDIT_FROM}:`)
              printjson(targetDB.getCollection("interpret_report_artifacts").aggregate([
                {$match: {deleted_at: null, generated_at: {$gte: from}}},
                {$project: {
                  report_id: {$toString: "$domain_id"},
                  risk_level: {$ifNull: ["$risk_level", ""]}
                }},
                {$lookup: {
                  from: "interpretation_attention_projections",
                  localField: "report_id",
                  foreignField: "report_id",
                  as: "projection"
                }},
                {$group: {
                  _id: "$risk_level",
                  artifacts: {$sum: 1},
                  missing: {$sum: {$cond: [{$eq: [{$size: "$projection"}, 0]}, 1, 0]}}
                }},
                {$sort: {_id: 1}}
              ], {allowDiskUse: true}).toArray())
            }
            MONGOJS

            echo "✅ MongoDB connection and read-only audit OK"

            echo ""
            echo "Available backups:"
            sudo docker run --rm \
              -v /opt/backups/qs-server/mongodb:/backup:ro \
              --entrypoint /bin/bash \
              mongo:7.0 -Eeuo pipefail -c '
                shopt -s nullglob
                FILES=(/backup/qs_mongodb_backup_*.archive.gz /backup/qs_mongodb_backup_*.partial)
                if (( ${#FILES[@]} == 0 )); then
                  echo "No backups or partial archives found"
                else
                  ls -lht -- "${FILES[@]}" | head -10
                fi
              '
        env:
          MONGODB_HOST: ${{ secrets.MONGODB_HOST }}
          MONGODB_PORT: ${{ secrets.MONGODB_PORT || 27017 }}
          MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
          MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
          MONGODB_DBNAME: ${{ secrets.MONGODB_DBNAME }}
          AUDIT_FROM: ${{ github.event.inputs.audit_from }}

  mysql-status:
    name: MySQL Status
    if: github.event.inputs.operation == 'status' && (github.event.inputs.database == 'mysql' || github.event.inputs.database == 'all')
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64, ops]
    environment: production
    steps:
      - name: Validate SSH configuration
        env:
          SVRA_HOST: ${{ vars.SVRA_HOST }}
          SVRA_USERNAME: ${{ vars.SVRA_USERNAME }}
          SVRA_SSH_KEY: ${{ secrets.SVRA_SSH_KEY }}
          SVRA_SSH_FINGERPRINT: ${{ vars.SVRA_SSH_FINGERPRINT }}
        run: |
          set -Eeuo pipefail
          : "${SVRA_HOST:?SVRA_HOST is empty}"
          : "${SVRA_USERNAME:?SVRA_USERNAME is empty}"
          : "${SVRA_SSH_KEY:?SVRA_SSH_KEY is empty}"
          : "${SVRA_SSH_FINGERPRINT:?SVRA_SSH_FINGERPRINT is empty}"

      - name: Check MySQL recovery status
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.SVRA_HOST }}
          username: ${{ vars.SVRA_USERNAME }}
          key: ${{ secrets.SVRA_SSH_KEY }}
          port: ${{ vars.SVRA_SSH_PORT || 22 }}
          fingerprint: ${{ vars.SVRA_SSH_FINGERPRINT }}
          envs: MYSQL_HOST,MYSQL_PORT,MYSQL_USERNAME,MYSQL_PASSWORD,MYSQL_DATABASE,AUDIT_FROM
          script: |
            set -Eeuo pipefail
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin${PATH:+:$PATH}"

            : "${MYSQL_HOST:?MYSQL_HOST is empty}"
            : "${MYSQL_USERNAME:?MYSQL_USERNAME is empty}"
            : "${MYSQL_PASSWORD:?MYSQL_PASSWORD is empty}"
            : "${MYSQL_DATABASE:?MYSQL_DATABASE is empty}"

            if ! sudo docker network inspect infra-network >/dev/null 2>&1; then
              echo "❌ infra-network is unavailable" >&2
              exit 1
            fi
            if [ -n "${AUDIT_FROM:-}" ] && ! [[ "$AUDIT_FROM" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
              echo "❌ audit_from must use YYYY-MM-DDTHH:MM:SSZ" >&2
              exit 1
            fi

            audit_clause=""
            if [ -n "${AUDIT_FROM:-}" ]; then
              audit_clause="AND failed_at >= '${AUDIT_FROM%Z}'"
            fi
            sudo docker run --rm --network infra-network \
              -e MYSQL_PWD="$MYSQL_PASSWORD" \
              mysql:8.0 mysql --protocol=tcp \
                --host="$MYSQL_HOST" \
                --port="${MYSQL_PORT:-3306}" \
                --user="$MYSQL_USERNAME" \
                --database="$MYSQL_DATABASE" \
                --batch --raw \
                --execute="
                  SELECT VERSION() AS mysql_version;
                  SELECT @@transaction_isolation AS transaction_isolation;
                  SELECT version AS schema_migration_version, dirty AS schema_migration_dirty
                  FROM schema_migrations
                  LIMIT 1;
                  SELECT table_name, engine, table_rows, data_length, index_length
                  FROM information_schema.tables
                  WHERE table_schema = DATABASE() AND table_type = 'BASE TABLE'
                  ORDER BY table_name;
                  SELECT table_name AS retired_table_still_present
                  FROM information_schema.tables
                  WHERE table_schema = DATABASE()
                    AND table_name IN (
                      'analytics_projector_checkpoint',
                      'evaluation_run',
                      'behavior_footprint',
                      'assessment_episode',
                      'analytics_pending_event',
                      'statistics_journey_daily',
                      'statistics_content_daily',
                      'statistics_plan_daily',
                      'seed_backfill_stage',
                      'seed_backfill_stage_attempt',
                      'seed_backfill_rollback_operation',
                      'seed_backfill_rollback_resource',
                      'seed_backfill_rollback_phase_attempt'
                    )
                  ORDER BY table_name;
                  SELECT retry_disposition, COUNT(*) AS records,
                         MIN(failed_at) AS first_failed_at, MAX(failed_at) AS last_failed_at
                  FROM event_delivery_dead_letter
                  WHERE 1 = 1 ${audit_clause}
                  GROUP BY retry_disposition
                  ORDER BY retry_disposition;
                  SELECT id, event_id, org_id, delivery_attempts, retry_disposition, failed_at
                  FROM event_delivery_dead_letter
                  WHERE last_error LIKE '%would create a conflict%' ${audit_clause}
                  ORDER BY failed_at, id;
                  SELECT assessment_id, attempt_no, COUNT(*) AS duplicate_records,
                         GROUP_CONCAT(resource_id ORDER BY id SEPARATOR ',') AS run_ids
                  FROM runtime_checkpoint
                  WHERE scope = 'evaluation_run'
                    AND assessment_id IS NOT NULL
                    AND deleted_at IS NULL
                  GROUP BY assessment_id, attempt_no
                  HAVING COUNT(*) > 1
                  ORDER BY assessment_id, attempt_no;
                  SELECT index_name, non_unique,
                         GROUP_CONCAT(column_name ORDER BY seq_in_index SEPARATOR ',') AS index_columns
                  FROM information_schema.statistics
                  WHERE table_schema = DATABASE()
                    AND table_name = 'runtime_checkpoint'
                  GROUP BY index_name, non_unique
                  ORDER BY index_name;
                  SELECT
                    (SELECT COUNT(*)
                     FROM assessment AS a
                     LEFT JOIN evaluation_outcome AS o ON o.assessment_id = a.id
                     WHERE a.status = 'evaluated' AND a.deleted_at IS NULL AND o.id IS NULL)
                      AS evaluated_assessments_without_outcome,
                    (SELECT COUNT(*)
                     FROM evaluation_outcome AS o
                     LEFT JOIN assessment AS a ON a.id = o.assessment_id AND a.deleted_at IS NULL
                     WHERE a.id IS NULL OR a.status <> 'evaluated')
                      AS outcomes_without_evaluated_assessment,
                    (SELECT COUNT(*)
                     FROM assessment_score
                     WHERE deleted_at IS NULL AND evaluation_outcome_id IS NULL)
                      AS score_rows_without_outcome,
                    (SELECT COUNT(*)
                     FROM evaluation_outcome
                     WHERE model_sub_kind IS NOT NULL AND model_sub_kind <> '')
                      AS outcomes_with_legacy_sub_kind,
                    (SELECT COUNT(*)
                     FROM evaluation_outcome
                     WHERE decision_kind IS NULL OR decision_kind = '')
                      AS outcomes_missing_decision_kind;
                "
            echo "✅ MySQL connection and read-only recovery audit OK"
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT || 3306 }}
          MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE != '' && secrets.MYSQL_DATABASE || secrets.MYSQL_DBNAME }}
          AUDIT_FROM: ${{ github.event.inputs.audit_from }}
