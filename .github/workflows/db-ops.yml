              if ! sudo test -s "$MANIFEST_DIR/$MANIFEST_NAME" || ! sudo test -s "$MANIFEST_DIR/$MANIFEST_NAME.sha256"; then
                echo "❌ Scale catalogue manifest or checksum is missing: $MANIFEST_NAME" >&2
                exit 1
              fi
              sudo docker run --rm --network none \
                -v "$MANIFEST_DIR:/work:ro" \
                --entrypoint /bin/sh \
                mongo:7.0 -c 'cd /work && sha256sum --check "$1.sha256"' sh "$MANIFEST_NAME"
              MANIFEST_MOUNT="$MANIFEST_DIR:/work:ro"
            fi

            if [[ "$SCALE_OPERATION_INPUT" = "apply" || "$SCALE_OPERATION_INPUT" = "rollback" ]]; then
              if ! [[ "$BACKUP_FILE_INPUT" =~ ^qs_mongodb_backup_[0-9]{8}_[0-9]{6}\.archive\.gz$ ]]; then
                echo "❌ A valid MongoDB backup name is required for write operations" >&2
                exit 1
              fi
              if ! sudo test -s "$MONGO_BACKUP_DIR/$BACKUP_FILE_INPUT"; then
                echo "❌ Required MongoDB backup is missing or empty: $BACKUP_FILE_INPUT" >&2
                exit 1
              fi
              echo "Write safety backup: $BACKUP_FILE_INPUT"
            fi

            MONGODB_PORT="${MONGODB_PORT:-27017}"
            MONGODB_URI="mongodb://${MONGODB_HOST}:${MONGODB_PORT}/${MONGODB_DBNAME}?connectTimeoutMS=30000&socketTimeoutMS=0"
            echo "Scale catalogue governance operation: $SCALE_OPERATION_INPUT"
            echo "Collection: assessment_models"
            echo "Manifest: $MANIFEST_NAME"

            sudo docker run --rm --network infra-network \
              --name "$CONTAINER_NAME" \
              --label "com.fangcunmount.qs-server.operation=scale-catalog-metadata-governance" \
              --label "com.fangcunmount.qs-server.github-run-id=$GITHUB_RUN_ID_INPUT" \
              -v "$TOOL_FILE:/tool/govern.js:ro" \
              -v "$MANIFEST_MOUNT" \
              -e SCALE_CATALOG_OPERATION="$SCALE_OPERATION_INPUT" \
              -e SCALE_CATALOG_MANIFEST_PATH="/work/$MANIFEST_NAME" \
              -e SCALE_CATALOG_REQUIRE_COMPLETE="$SCALE_REQUIRE_COMPLETE_INPUT" \
              -e SCALE_CATALOG_CONFIRM="$SCALE_CONFIRM_INPUT" \
              --entrypoint /usr/bin/timeout \
              mongo:7.0 50m mongosh "$MONGODB_URI" \
                --username="$MONGODB_USERNAME" \
                --password="$MONGODB_PASSWORD" \
                --authenticationDatabase=admin \
                --quiet \
                --file=/tool/govern.js

            if [ "$SCALE_OPERATION_INPUT" = "audit" ]; then
              if ! sudo test -s "$MANIFEST_DIR/$MANIFEST_NAME"; then
                echo "❌ Audit did not create a non-empty manifest" >&2
                exit 1
              fi
              sudo docker run --rm --network none \
                -v "$MANIFEST_DIR:/work" \
                --entrypoint /bin/sh \
                mongo:7.0 -c 'cd /work && sha256sum "$1" > "$1.sha256" && chmod 0440 "$1" "$1.sha256"' sh "$MANIFEST_NAME"
              echo "✅ Immutable audit manifest: $MANIFEST_NAME"
            fi
            echo "✅ Scale catalogue metadata governance operation completed"
        env:
          MONGODB_HOST: ${{ secrets.MONGODB_HOST }}
          MONGODB_PORT: ${{ secrets.MONGODB_PORT || 27017 }}
          MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
          MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
          MONGODB_DBNAME: ${{ secrets.MONGODB_DBNAME }}
          GITHUB_RUN_ID_INPUT: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT_INPUT: ${{ github.run_attempt }}
          SCALE_OPERATION_INPUT: ${{ github.event.inputs.governance_operation }}
          SCALE_MANIFEST_INPUT: ${{ github.event.inputs.governance_manifest }}
          SCALE_REQUIRE_COMPLETE_INPUT: ${{ github.event.inputs.presentation_require_complete }}
          SCALE_CONFIRM_INPUT: ${{ github.event.inputs.governance_confirm }}
          BACKUP_FILE_INPUT: ${{ github.event.inputs.backup_name }}

  mongodb-template-release-governance:
    name: MongoDB Interpretation Template Release Governance
    if: (github.event.inputs.operation == 'govern-template-release' || github.event.inputs.operation == 'govern-template-release-current') && github.event.inputs.database == 'mongodb'
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64, ops]
    timeout-minutes: 60
    environment: production
    steps:
      - name: Checkout immutable governance tool
        uses: actions/checkout@v6

      - name: Validate SSH configuration
        env:
          SVRA_HOST: ${{ vars.SVRA_HOST }}
          SVRA_USERNAME: ${{ vars.SVRA_USERNAME }}
          SVRA_SSH_KEY: ${{ secrets.SVRA_SSH_KEY }}
          SVRA_SSH_PORT: ${{ vars.SVRA_SSH_PORT || 22 }}
          SVRA_SSH_FINGERPRINT: ${{ vars.SVRA_SSH_FINGERPRINT }}
        run: |
          set -Eeuo pipefail
          : "${SVRA_HOST:?SVRA_HOST is empty}"
          : "${SVRA_USERNAME:?SVRA_USERNAME is empty}"
          : "${SVRA_SSH_KEY:?SVRA_SSH_KEY is empty}"
          : "${SVRA_SSH_FINGERPRINT:?SVRA_SSH_FINGERPRINT is empty}"
          if ! [[ "$SVRA_SSH_PORT" =~ ^[0-9]+$ ]] || (( SVRA_SSH_PORT < 1 || SVRA_SSH_PORT > 65535 )); then
            echo "❌ SVRA_SSH_PORT is invalid" >&2
            exit 1
          fi

      - name: Transfer template release governance tool with pinned host identity
        env:
          SVRA_HOST: ${{ vars.SVRA_HOST }}
          SVRA_USERNAME: ${{ vars.SVRA_USERNAME }}
          SVRA_SSH_KEY: ${{ secrets.SVRA_SSH_KEY }}
          SVRA_SSH_PORT: ${{ vars.SVRA_SSH_PORT || 22 }}
          SVRA_SSH_FINGERPRINT: ${{ vars.SVRA_SSH_FINGERPRINT }}
          GOVERNANCE_RUN_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          if ! [[ "$GOVERNANCE_RUN_TOKEN" =~ ^[0-9]+-[0-9]+$ ]]; then
            echo "❌ Invalid governance run token" >&2
            exit 1
          fi

          KEY_FILE="${RUNNER_TEMP}/qs-svra-template-${GOVERNANCE_RUN_TOKEN}.key"
          KNOWN_HOSTS_FILE="${RUNNER_TEMP}/qs-svra-template-${GOVERNANCE_RUN_TOKEN}.known_hosts"
          REMOTE_TOOL="/tmp/qs-server-template-release-governance-${GOVERNANCE_RUN_TOKEN}.js"
          cleanup_local_credentials() {
            rm -f -- "$KEY_FILE" "$KNOWN_HOSTS_FILE"
          }
          trap cleanup_local_credentials EXIT

          umask 077
          printf '%s\n' "$SVRA_SSH_KEY" > "$KEY_FILE"
          ssh-keyscan -T 10 -p "$SVRA_SSH_PORT" "$SVRA_HOST" 2>/dev/null > "$KNOWN_HOSTS_FILE"
          if [ ! -s "$KNOWN_HOSTS_FILE" ]; then
            echo "❌ Unable to obtain ServerA SSH host keys" >&2
            exit 1
          fi
          if ! ssh-keygen -lf "$KNOWN_HOSTS_FILE" -E sha256 |
            awk '{print $2}' |
            grep -Fqx -- "$SVRA_SSH_FINGERPRINT"; then
            echo "❌ ServerA SSH fingerprint mismatch" >&2
            exit 1
          fi

          scp -q \
            -i "$KEY_FILE" \
            -P "$SVRA_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            scripts/oneoff/govern_interpretation_template_releases/govern.js \
            "${SVRA_USERNAME}@${SVRA_HOST}:${REMOTE_TOOL}"
          echo "✅ Template release governance tool transferred for run ${GOVERNANCE_RUN_TOKEN}"

      - name: Execute manifest-driven template release governance
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.SVRA_HOST }}
          username: ${{ vars.SVRA_USERNAME }}
          key: ${{ secrets.SVRA_SSH_KEY }}
          port: ${{ vars.SVRA_SSH_PORT || 22 }}
          fingerprint: ${{ vars.SVRA_SSH_FINGERPRINT }}
          command_timeout: 55m
          envs: MONGODB_HOST,MONGODB_PORT,MONGODB_USERNAME,MONGODB_PASSWORD,MONGODB_DBNAME,GITHUB_RUN_ID_INPUT,GITHUB_RUN_ATTEMPT_INPUT,TEMPLATE_RELEASE_OPERATION_INPUT,TEMPLATE_RELEASE_MANIFEST_INPUT,TEMPLATE_RELEASE_CONFIRM_INPUT,TEMPLATE_RELEASE_TARGET_VERSION,BACKUP_FILE_INPUT
          script: |
            set -Eeuo pipefail
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin${PATH:+:$PATH}"

            : "${MONGODB_HOST:?MONGODB_HOST is empty (check production Environment secrets)}"
            : "${MONGODB_DBNAME:?MONGODB_DBNAME is empty}"
            : "${MONGODB_USERNAME:?MONGODB_USERNAME is empty}"
            : "${MONGODB_PASSWORD:?MONGODB_PASSWORD is empty}"
            if ! [[ "$MONGODB_DBNAME" =~ ^[A-Za-z0-9_-]+$ ]]; then
              echo "❌ MONGODB_DBNAME contains unsupported characters" >&2
              exit 1
            fi
            if ! [[ "$GITHUB_RUN_ID_INPUT" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT_INPUT" =~ ^[0-9]+$ ]]; then
              echo "❌ Invalid GitHub run identity" >&2
              exit 1
            fi
            case "$TEMPLATE_RELEASE_OPERATION_INPUT" in
              audit|apply|verify|rollback) ;;
              *)
                echo "❌ Unsupported template release operation: $TEMPLATE_RELEASE_OPERATION_INPUT" >&2
                exit 1
                ;;
            esac
            case "$TEMPLATE_RELEASE_TARGET_VERSION" in
              legacy-v1|2026-08-v1) ;;
              *)
                echo "❌ Unsupported template release target version: $TEMPLATE_RELEASE_TARGET_VERSION" >&2
                exit 1
                ;;
            esac
            if ! sudo docker network inspect infra-network >/dev/null 2>&1; then
              echo "❌ infra-network is unavailable" >&2
              exit 1
            fi

            GOVERNANCE_RUN_TOKEN="${GITHUB_RUN_ID_INPUT}-${GITHUB_RUN_ATTEMPT_INPUT}"
            TOOL_FILE="/tmp/qs-server-template-release-governance-${GOVERNANCE_RUN_TOKEN}.js"
            MANIFEST_DIR="/opt/backups/qs-server/interpretation-template-release"
            MONGO_BACKUP_DIR="/opt/backups/qs-server/mongodb"
            CONTAINER_NAME="qs-server-template-release-governance-${GOVERNANCE_RUN_TOKEN}"
            cleanup_governance() {
              sudo docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
              rm -f -- "$TOOL_FILE"
            }
            trap cleanup_governance EXIT
            if [ ! -s "$TOOL_FILE" ]; then
              echo "❌ Transferred template release governance tool is missing or empty" >&2
              exit 1
            fi

            sudo install -d -m 0750 "$MANIFEST_DIR"
            if [ "$TEMPLATE_RELEASE_OPERATION_INPUT" = "audit" ]; then
              MANIFEST_NAME="interpretation-template-release-${GOVERNANCE_RUN_TOKEN}.json"
              if sudo test -e "$MANIFEST_DIR/$MANIFEST_NAME" || sudo test -e "$MANIFEST_DIR/$MANIFEST_NAME.partial"; then
                echo "❌ Refusing to overwrite an existing template release manifest: $MANIFEST_NAME" >&2
                exit 1
              fi
              MANIFEST_MOUNT="$MANIFEST_DIR:/work"
            else
              MANIFEST_NAME="$TEMPLATE_RELEASE_MANIFEST_INPUT"
              if ! [[ "$MANIFEST_NAME" =~ ^interpretation-template-release-[0-9]+-[0-9]+\.json$ ]]; then
                echo "❌ Invalid or missing template release manifest name" >&2
                exit 1
              fi
              if ! sudo test -s "$MANIFEST_DIR/$MANIFEST_NAME" || ! sudo test -s "$MANIFEST_DIR/$MANIFEST_NAME.sha256"; then
                echo "❌ Template release manifest or checksum is missing: $MANIFEST_NAME" >&2
                exit 1
              fi
              sudo docker run --rm --network none \
                -v "$MANIFEST_DIR:/work:ro" \
                --entrypoint /bin/sh \
                mongo:7.0 -c 'cd /work && sha256sum --check "$1.sha256"' sh "$MANIFEST_NAME"
              MANIFEST_MOUNT="$MANIFEST_DIR:/work:ro"
            fi

            if [[ "$TEMPLATE_RELEASE_OPERATION_INPUT" = "apply" || "$TEMPLATE_RELEASE_OPERATION_INPUT" = "rollback" ]]; then
              if ! [[ "$BACKUP_FILE_INPUT" =~ ^qs_mongodb_backup_[0-9]{8}_[0-9]{6}\.archive\.gz$ ]]; then
                echo "❌ A valid MongoDB backup name is required for write operations" >&2
                exit 1
              fi
              if ! sudo test -s "$MONGO_BACKUP_DIR/$BACKUP_FILE_INPUT"; then
                echo "❌ Required MongoDB backup is missing or empty: $BACKUP_FILE_INPUT" >&2
                exit 1
              fi
              echo "Write safety backup: $BACKUP_FILE_INPUT"
            fi

            MONGODB_PORT="${MONGODB_PORT:-27017}"
            MONGODB_URI="mongodb://${MONGODB_HOST}:${MONGODB_PORT}/${MONGODB_DBNAME}?connectTimeoutMS=30000&socketTimeoutMS=0"
            echo "Template release governance operation: $TEMPLATE_RELEASE_OPERATION_INPUT"
            echo "Template release target version: $TEMPLATE_RELEASE_TARGET_VERSION"
            echo "Collection: interpretation_report_templates"
            echo "Manifest: $MANIFEST_NAME"

            sudo docker run --rm --network infra-network \
              --name "$CONTAINER_NAME" \
              --label "com.fangcunmount.qs-server.operation=interpretation-template-release-governance" \
              --label "com.fangcunmount.qs-server.github-run-id=$GITHUB_RUN_ID_INPUT" \
              -v "$TOOL_FILE:/tool/govern.js:ro" \
              -v "$MANIFEST_MOUNT" \
              -e TEMPLATE_RELEASE_OPERATION="$TEMPLATE_RELEASE_OPERATION_INPUT" \
              -e TEMPLATE_RELEASE_TARGET_VERSION="$TEMPLATE_RELEASE_TARGET_VERSION" \
              -e TEMPLATE_RELEASE_MANIFEST_PATH="/work/$MANIFEST_NAME" \
              -e TEMPLATE_RELEASE_CONFIRM="$TEMPLATE_RELEASE_CONFIRM_INPUT" \
              --entrypoint /usr/bin/timeout \
              mongo:7.0 50m mongosh "$MONGODB_URI" \
                --username="$MONGODB_USERNAME" \
                --password="$MONGODB_PASSWORD" \
                --authenticationDatabase=admin \
                --quiet \
                --file=/tool/govern.js

            if [ "$TEMPLATE_RELEASE_OPERATION_INPUT" = "audit" ]; then
              if ! sudo test -s "$MANIFEST_DIR/$MANIFEST_NAME"; then
                echo "❌ Audit did not create a non-empty template release manifest" >&2
                exit 1
              fi
              sudo docker run --rm --network none \
                -v "$MANIFEST_DIR:/work" \
                --entrypoint /bin/sh \
                mongo:7.0 -c 'cd /work && sha256sum "$1" > "$1.sha256" && chmod 0440 "$1" "$1.sha256"' sh "$MANIFEST_NAME"
              echo "✅ Immutable template release manifest: $MANIFEST_NAME"
            fi
            echo "✅ Template release governance operation completed"
        env:
          MONGODB_HOST: ${{ secrets.MONGODB_HOST }}
          MONGODB_PORT: ${{ secrets.MONGODB_PORT || 27017 }}
          MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
          MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
          MONGODB_DBNAME: ${{ secrets.MONGODB_DBNAME }}
          GITHUB_RUN_ID_INPUT: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT_INPUT: ${{ github.run_attempt }}
          TEMPLATE_RELEASE_OPERATION_INPUT: ${{ github.event.inputs.governance_operation }}
          TEMPLATE_RELEASE_MANIFEST_INPUT: ${{ github.event.inputs.governance_manifest }}
          TEMPLATE_RELEASE_CONFIRM_INPUT: ${{ github.event.inputs.governance_confirm }}
          TEMPLATE_RELEASE_TARGET_VERSION: ${{ github.event.inputs.operation == 'govern-template-release-current' && '2026-08-v1' || 'legacy-v1' }}
          BACKUP_FILE_INPUT: ${{ github.event.inputs.backup_name }}

  mongodb-model-template-route-governance:
    name: MongoDB Interpretation Model Template Route Governance
    if: github.event.inputs.operation == 'govern-model-template-route' && github.event.inputs.database == 'mongodb'
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64, ops]
    timeout-minutes: 90
    environment: production
    steps:
      - name: Checkout immutable governance tool
        uses: actions/checkout@v6

      - name: Set up Go for canonical DefinitionV2 hashing
        if: github.event.inputs.governance_operation == 'audit'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # This short-lived operations job only builds two tiny helpers. Saving
          # the repository-wide Go cache can hold the serialized DB-ops queue
          # for minutes after the database step has already completed.
          cache: false

      - name: Build canonical DefinitionV2 hash helpers
        if: github.event.inputs.governance_operation == 'audit'
        env:
          TOOL_PACKAGE: ./scripts/oneoff/govern_interpretation_model_template_routes
        run: |
          set -Eeuo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' \
            -o "$RUNNER_TEMP/model-template-route-hash-linux-amd64" "$TOOL_PACKAGE"
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' \
            -o "$RUNNER_TEMP/model-template-route-hash-linux-arm64" "$TOOL_PACKAGE"
          chmod 0700 \
            "$RUNNER_TEMP/model-template-route-hash-linux-amd64" \
            "$RUNNER_TEMP/model-template-route-hash-linux-arm64"

      - name: Validate SSH configuration
        env:
          SVRA_HOST: ${{ vars.SVRA_HOST }}
          SVRA_USERNAME: ${{ vars.SVRA_USERNAME }}
          SVRA_SSH_KEY: ${{ secrets.SVRA_SSH_KEY }}
          SVRA_SSH_PORT: ${{ vars.SVRA_SSH_PORT || 22 }}
