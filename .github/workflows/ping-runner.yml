name: M1 ServerD Runner routing probe
on:
  workflow_dispatch:
permissions: {}
jobs:
  legacy-label:
    name: Original ServerD label
    runs-on: ${{ vars.QS_DEPLOY_RUNNER || 'serverd' }}
    timeout-minutes: 2
    steps:
      - name: Read runner identity
        env:
          SELECTED_RUNNER: ${{ runner.name }}
        run: printf 'runner=%s\n' "$SELECTED_RUNNER"
  explicit-group:
    name: Explicit qlume ServerD route
    runs-on:
      group: qlume
      labels: [self-hosted, Linux, X64, "${{ vars.QS_DEPLOY_RUNNER || 'serverd' }}"]
    timeout-minutes: 2
    steps:
      - name: Read runner identity
        env:
          SELECTED_RUNNER: ${{ runner.name }}
        run: printf 'runner=%s\n' "$SELECTED_RUNNER"
