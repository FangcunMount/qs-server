name: Ping Runner

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # 每6小时执行一次

jobs:
  ping-production:
    name: Production Server Check (ServerA)
    # SVRA_HOST is a Tailscale address; run inside the qlume tailnet instead of GitHub-hosted.
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64, ops]
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate SSH configuration
        env:
          SVRA_HOST: ${{ vars.SVRA_HOST }}
          SVRA_USERNAME: ${{ vars.SVRA_USERNAME }}
          SVRA_SSH_KEY: ${{ secrets.SVRA_SSH_KEY }}
          SVRA_SSH_FINGERPRINT: ${{ vars.SVRA_SSH_FINGERPRINT }}
        run: |
          set -Eeuo pipefail
          : "${SVRA_HOST:?SVRA_HOST is empty}"
          : "${SVRA_USERNAME:?SVRA_USERNAME is empty}"
          : "${SVRA_SSH_KEY:?SVRA_SSH_KEY is empty}"
          : "${SVRA_SSH_FINGERPRINT:?SVRA_SSH_FINGERPRINT is empty}"

      - name: System Health Check
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.SVRA_HOST }}
          username: ${{ vars.SVRA_USERNAME }}
          key: ${{ secrets.SVRA_SSH_KEY }}
          port: ${{ vars.SVRA_SSH_PORT || 22 }}
          fingerprint: ${{ vars.SVRA_SSH_FINGERPRINT }}
          script: |
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin${PATH:+:$PATH}"
            echo "=========================================="
            echo "QS-Server - Production Check (ServerA)"
            echo "=========================================="
            echo "Hostname: $(hostname)"
            echo "Uptime: $(uptime)"
            echo "Date: $(date)"
            echo ""
            echo "Memory:"
            free -h | grep -E "Mem|Swap"
            echo ""
            echo "Disk:"
            df -h | grep -E "^/dev/" | head -3
            echo ""
            echo "CPU:"
            top -bn1 | grep "Cpu(s)"
            echo ""
            echo "Load Average:"
            uptime | awk -F'load average:' '{print $2}'
            echo "=========================================="

      - name: Prepare ServerA health checks
        run: |
          set -Eeuo pipefail
          # The governance probe uses the API container identified by the health check.
          cat scripts/cd/verify-servera-qs-health.sh scripts/cd/verify-worker-governance.sh \
            > "$RUNNER_TEMP/qs-servera-health.sh"

      - name: Docker, API and Worker Governance Health Check
        env:
          EXPECTED_COLLECTION_REPLICAS: ${{ vars.QS_COLLECTION_REPLICAS || '2' }}
          EXPECTED_WORKER_REPLICAS: ${{ vars.QS_WORKER_REPLICAS || '3' }}
          WORKER_DNS_NAME: qs-worker-governance
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.SVRA_HOST }}
          username: ${{ vars.SVRA_USERNAME }}
          key: ${{ secrets.SVRA_SSH_KEY }}
          port: ${{ vars.SVRA_SSH_PORT || 22 }}
          fingerprint: ${{ vars.SVRA_SSH_FINGERPRINT }}
          envs: EXPECTED_COLLECTION_REPLICAS,EXPECTED_WORKER_REPLICAS,WORKER_DNS_NAME
          script_path: ${{ runner.temp }}/qs-servera-health.sh

      - name: K6 Observability Reverse Check
        env:
          EXPECTED_COLLECTION_REPLICAS: ${{ vars.QS_COLLECTION_REPLICAS || '2' }}
          EXPECTED_WORKER_REPLICAS: ${{ vars.QS_WORKER_REPLICAS || '3' }}
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ vars.SVRA_HOST }}
          username: ${{ vars.SVRA_USERNAME }}
          key: ${{ secrets.SVRA_SSH_KEY }}
          port: ${{ vars.SVRA_SSH_PORT || 22 }}
          fingerprint: ${{ vars.SVRA_SSH_FINGERPRINT }}
          envs: EXPECTED_COLLECTION_REPLICAS,EXPECTED_WORKER_REPLICAS
          script_path: scripts/cd/verify-observability-nginx.sh

  # ServerD 仍跑 qs-worker；CD deploy 已迁到 Mac mini（qlume），此处只做 worker 主机巡检。
  ping-worker-host:
    name: ServerD Worker Host Check
    runs-on: ${{ vars.QS_DEPLOY_RUNNER || 'serverd' }}
    timeout-minutes: 10

    steps:
      - name: Load runner network environment
        env:
          CONFIGURED_HTTP_PROXY: ${{ vars.QS_DEPLOY_HTTP_PROXY }}
          CONFIGURED_HTTPS_PROXY: ${{ vars.QS_DEPLOY_HTTPS_PROXY }}
          CONFIGURED_ALL_PROXY: ${{ vars.QS_DEPLOY_ALL_PROXY }}
          CONFIGURED_NO_PROXY: ${{ vars.QS_DEPLOY_NO_PROXY }}
        run: |
          for env_file in \
            "${HOME}/.env" \
            "/opt/actions-runner/runner1/.env" \
            "/opt/actions-runner/runner2/.env" \
            "/opt/actions-runner/runner3/.env"; do
            if [ -f "$env_file" ]; then
              set -a
              # shellcheck source=/dev/null
              . "$env_file"
              set +a
              break
            fi
          done
          HTTP_PROXY="${HTTP_PROXY:-${CONFIGURED_HTTP_PROXY:-}}"
          HTTP_PROXY="${HTTP_PROXY:-http://127.0.0.1:7890}"
          HTTPS_PROXY="${HTTPS_PROXY:-${CONFIGURED_HTTPS_PROXY:-}}"
          HTTPS_PROXY="${HTTPS_PROXY:-$HTTP_PROXY}"
          ALL_PROXY="${ALL_PROXY:-${CONFIGURED_ALL_PROXY:-}}"
          ALL_PROXY="${ALL_PROXY:-socks5://127.0.0.1:7891}"
          NO_PROXY="${NO_PROXY:-${CONFIGURED_NO_PROXY:-}}"
          NO_PROXY="${NO_PROXY:-127.0.0.1,localhost}"
          {
            printf 'HTTP_PROXY=%s\n' "$HTTP_PROXY"
            printf 'HTTPS_PROXY=%s\n' "$HTTPS_PROXY"
            printf 'ALL_PROXY=%s\n' "$ALL_PROXY"
            printf 'NO_PROXY=%s\n' "$NO_PROXY"
          } >>"$GITHUB_ENV"
          echo "Runner network environment loaded from local configuration"

      - name: Runner and host info
        run: |
          echo "=========================================="
          echo "ServerD Worker Host"
          echo "=========================================="
          echo "Runner name: ${{ runner.name }}"
          echo "Runner OS:   ${{ runner.os }}"
          echo "Runner arch: ${{ runner.arch }}"
          echo "Hostname:    $(hostname)"
          echo "Uptime:      $(uptime -p 2>/dev/null || uptime)"
          echo "Date:        $(date)"
          echo ""
          echo "Memory:"
          free -h | grep -E "Mem|Swap" || true
          echo ""
          echo "Disk (/ and /tmp):"
          df -h / /tmp 2>/dev/null | grep -E "^/dev/|^Filesystem"
          echo "=========================================="

      - name: Actions Runner service
        run: |
          echo "=========================================="
          echo "Actions Runner Service"
          echo "=========================================="
          if pgrep -f 'Runner.Listener' >/dev/null 2>&1; then
            echo "✅ Runner.Listener process is running"
            pgrep -af 'Runner.Listener' | head -3
          else
            echo "❌ Runner.Listener process not found"
            exit 1
          fi
          echo "=========================================="

      - name: Host tooling
        run: |
          echo "=========================================="
          echo "Host Tooling"
          echo "=========================================="
          missing=0
          for cmd in docker git make gzip ssh scp; do
            if command -v "$cmd" >/dev/null 2>&1; then
              echo "✅ $cmd: $(command -v "$cmd")"
            else
              echo "❌ $cmd: not found"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if ! docker info >/dev/null 2>&1; then
            echo "❌ Docker daemon not accessible for runner user"
            exit 1
          fi
          echo "✅ Docker daemon reachable"
          echo "   Version: $(docker version --format '{{.Server.Version}}' 2>/dev/null || echo unknown)"
          echo "=========================================="

      - name: SSH reachability to ServerA
        env:
          RUNNER_SSH_KEY: ${{ secrets.SVRA_SSH_KEY }}
          RUNNER_SSH_HOST: ${{ vars.SVRA_HOST }}
          RUNNER_SSH_USER: ${{ vars.SVRA_USERNAME }}
          RUNNER_SSH_PORT: ${{ vars.SVRA_SSH_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          key_file=~/.ssh/runner_servera_key
          printf '%s\n' "$RUNNER_SSH_KEY" >"$key_file" && chmod 600 "$key_file"
          touch ~/.ssh/config && chmod 600 ~/.ssh/config
          if ! grep -q '^Host servera$' ~/.ssh/config; then
            {
              echo ""
              echo "Host servera"
              echo "  HostName ${RUNNER_SSH_HOST}"
              echo "  User ${RUNNER_SSH_USER}"
              echo "  Port ${RUNNER_SSH_PORT}"
              echo "  IdentityFile ${key_file}"
              echo "  StrictHostKeyChecking accept-new"
            } >> ~/.ssh/config
          fi
          ssh servera 'echo "✅ SSH to ServerA ($(hostname)) OK"'

      - name: SSH reachability to ServerB
        env:
          RUNNER_SSH_KEY: ${{ secrets.SVRB_SSH_KEY || secrets.SVRA_SSH_KEY }}
          RUNNER_SSH_HOST: ${{ vars.SVRB_HOST }}
          RUNNER_SSH_USER: ${{ vars.SVRB_USERNAME || vars.SVRA_USERNAME }}
          RUNNER_SSH_PORT: ${{ vars.SVRB_SSH_PORT || vars.SVRA_SSH_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          key_file=~/.ssh/runner_serverb_key
          printf '%s\n' "$RUNNER_SSH_KEY" >"$key_file" && chmod 600 "$key_file"
          touch ~/.ssh/config && chmod 600 ~/.ssh/config
          if ! grep -q '^Host serverb$' ~/.ssh/config; then
            {
              echo ""
              echo "Host serverb"
              echo "  HostName ${RUNNER_SSH_HOST}"
              echo "  User ${RUNNER_SSH_USER}"
              echo "  Port ${RUNNER_SSH_PORT}"
              echo "  IdentityFile ${key_file}"
              echo "  StrictHostKeyChecking accept-new"
            } >> ~/.ssh/config
          fi
          ssh serverb 'echo "✅ SSH to ServerB ($(hostname)) OK"'

      - name: Worker containers on ServerD
        run: |
          echo "=========================================="
          echo "Worker Containers (local)"
          echo "=========================================="
          if ! docker info >/dev/null 2>&1; then
            echo "❌ Docker not accessible"
            exit 1
          fi
          docker ps \
            --filter "label=com.docker.compose.project=qs-worker" \
            --filter "label=com.docker.compose.service=runtime" \
            --format "table {{.Names}}\t{{.Status}}" || true
          running="$(docker ps \
            --filter "label=com.docker.compose.project=qs-worker" \
            --filter "label=com.docker.compose.service=runtime" \
            --filter "status=running" \
            -q | wc -l | tr -d ' ')"
          if [ "${running:-0}" -gt 0 ]; then
            echo "✅ ${running} worker container(s) running"
          else
            echo "⚠️  No running qs-worker containers (may be expected if not deployed)"
          fi
          echo "=========================================="

  report:
    name: Status Report
    needs: [ping-production, ping-worker-host]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate Report
        run: |
          echo "=========================================="
          echo "Ping Runner - Status Report"
          echo "=========================================="
          echo "Production (ServerA): ${{ needs.ping-production.result }}"
          echo "Worker host (ServerD): ${{ needs.ping-worker-host.result }}"
          echo "Time: $(date)"
          echo ""

          if [ "${{ needs.ping-production.result }}" != "success" ]; then
            echo "❌ Production check failed!"
            exit 1
          fi

          if [ "${{ needs.ping-worker-host.result }}" != "success" ]; then
            echo "❌ ServerD worker host check failed!"
            exit 1
          fi

          echo "✅ All checks passed"
          echo "=========================================="
