name: M3 fixed images cache only
on:
  workflow_dispatch:
    inputs:
      workflow_sha:
        description: Exact reviewed main workflow SHA; cache fixed images only
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: m3-fixed-images-cache
  cancel-in-progress: false
jobs:
  cache:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64]
    environment: production
    timeout-minutes: 60
    env:
      REVIEWED_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
      PRODUCTION_DEPLOY_PAUSED: ${{ vars.PRODUCTION_DEPLOY_PAUSED }}
      INFRA_SHA: 5139def111e7084eb777f563421aa6b0f6ec0966
      PLAN_SHA256: 56152c3d80db3042e7f61f5be39f487e83d69ad94815d8b99bf87091c3af9c19
    steps:
      - name: Require reviewed main, old Mac mini ingress and continued business pause
        id: guard
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$REVIEWED_WORKFLOW_SHA"
          test "$PRODUCTION_DEPLOY_PAUSED" = true
          python3 - <<'PY'
          import platform,socket
          assert platform.system() == 'Darwin' and socket.gethostname().split('.')[0] == 'macmini-001'
          PY
      - uses: actions/checkout@v6
        with:
          repository: FangcunMount/infra
          ref: 5139def111e7084eb777f563421aa6b0f6ec0966
          fetch-depth: 0
          path: infra-image-cache
          persist-credentials: false
      - name: Verify exact merged transport and fixed plan
        id: source
        run: |
          set -euo pipefail
          test "$(git -C infra-image-cache rev-parse HEAD)" = "$INFRA_SHA"
          git -C infra-image-cache merge-base --is-ancestor "$INFRA_SHA" origin/main
          python3 - <<'PY'
          import os,hashlib,pathlib
          p=pathlib.Path('infra-image-cache/docs/server/evidence/rocketmq-m3-fixed-image-cache-plan-20261025.json')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == os.environ['PLAN_SHA256']
          PY
      - name: Cache five reviewed digests without starting runtimes
        id: cache
        env:
          ALIYUN_ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          ALIYUN_ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
          ALIYUN_ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
          SERVERA_SSH_KEY: ${{ secrets.SVR_MINI_SSH_KEY || secrets.SVRA_SSH_KEY }}
          SERVERD_SSH_KEY: ${{ secrets.SVR_MINI_SSH_KEY || secrets.SVRD_SSH_KEY || secrets.SVRA_SSH_KEY }}
          SERVERA_SUDO_PASSWORD: ${{ secrets.SVRA_SUDO_PASSWORD }}
          SERVERD_SUDO_PASSWORD: ${{ secrets.SVRD_SUDO_PASSWORD || secrets.SVRA_SUDO_PASSWORD }}
        run: |
          set -euo pipefail
          python3 infra-image-cache/scripts/ops/m3_image_cache_runner.py \
            --plan infra-image-cache/docs/server/evidence/rocketmq-m3-fixed-image-cache-plan-20261025.json \
            --plan-sha256 "$PLAN_SHA256" --report image-cache.json
          python3 - <<'PY'
          import json
          r=json.load(open('image-cache.json'))
          assert (r['passed'],r['failed'],r['skipped']) == (5,0,0) and r['complete']
          assert all(r['cleanup'].values()) and not r['runtime_started'] and not r['production_business_cutover']
          PY
      - name: Repeat bounded temporary-auth cleanup on both targets
        if: always() && steps.guard.outcome == 'success' && steps.source.outcome == 'success' && steps.cache.outcome != 'skipped'
        env:
          ALIYUN_ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          ALIYUN_ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
          ALIYUN_ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
          SERVERA_SSH_KEY: ${{ secrets.SVR_MINI_SSH_KEY || secrets.SVRA_SSH_KEY }}
          SERVERD_SSH_KEY: ${{ secrets.SVR_MINI_SSH_KEY || secrets.SVRD_SSH_KEY || secrets.SVRA_SSH_KEY }}
          SERVERA_SUDO_PASSWORD: ${{ secrets.SVRA_SUDO_PASSWORD }}
          SERVERD_SUDO_PASSWORD: ${{ secrets.SVRD_SUDO_PASSWORD || secrets.SVRA_SUDO_PASSWORD }}
        run: |
          python3 infra-image-cache/scripts/ops/m3_image_cache_runner.py \
            --plan infra-image-cache/docs/server/evidence/rocketmq-m3-fixed-image-cache-plan-20261025.json \
            --plan-sha256 "$PLAN_SHA256" --cleanup-only --report image-cache-cleanup.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m3-image-cache-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            image-cache.json
            image-cache-cleanup.json
          if-no-files-found: warn
          retention-days: 90
