name: Migrate Interpretation Runtime Ledgers

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: '输入 MIGRATE_AND_DROP 确认迁移并删除三个 Mongo 源集合'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate and retire Mongo runtime ledgers
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64]
    environment:
      name: production
    timeout-minutes: 120
    steps:
      - name: Validate destructive confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          test "${CONFIRMATION}" = MIGRATE_AND_DROP

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Linux migration command
        run: |
          set -Eeuo pipefail
          migration_binary="${RUNNER_TEMP}/migrate-interpretation-runtime-ledgers"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -o "${migration_binary}" \
            ./scripts/oneoff/migrate_interpretation_runtime_ledgers
          chmod 0755 "${migration_binary}"
          shasum -a 256 "${migration_binary}"
          echo "MIGRATION_BINARY=${migration_binary}" >>"${GITHUB_ENV}"

      - name: Configure serverD SSH
        env:
          RUNNER_SSH_KEY: ${{ secrets.SVR_MINI_SSH_KEY || secrets.SVRD_SSH_KEY || secrets.SVRA_SSH_KEY }}
          RUNNER_SSH_HOST: ${{ vars.SVRD_PUBLIC_HOST || secrets.SVRD_PUBLIC_HOST || vars.SVRD_HOST }}
          RUNNER_SSH_USER: ${{ vars.SVRD_USERNAME || vars.SVRA_USERNAME }}
          RUNNER_SSH_PORT: ${{ vars.SVRD_SSH_PORT || vars.SVRA_SSH_PORT || 22 }}
          RUNNER_SSH_ALIAS: interpretation-ledger-serverd
          DEPLOY_NODE_HOSTNAME: serverD
        run: |
          set -Eeuo pipefail
          ssh_home="${RUNNER_TEMP}/interpretation-ledger-serverd"
          mkdir -p "${ssh_home}"
          RUNNER_SSH_CONFIG="${ssh_home}/config" \
          RUNNER_SSH_KEY_FILE="${ssh_home}/key" \
            bash scripts/cd/setup-runner-ssh.sh
          echo "SERVERD_SSH_CONFIG=${ssh_home}/config" >>"${GITHUB_ENV}"

      - name: Configure serverA SSH
        env:
          RUNNER_SSH_KEY: ${{ secrets.SVR_MINI_SSH_KEY || secrets.SVRA_SSH_KEY }}
          RUNNER_SSH_HOST: ${{ vars.SVRA_PUBLIC_HOST || secrets.SVRA_PUBLIC_HOST || vars.SVRA_HOST }}
          RUNNER_SSH_USER: ${{ vars.SVRA_USERNAME }}
          RUNNER_SSH_PORT: ${{ vars.SVRA_SSH_PORT || 22 }}
          RUNNER_SSH_ALIAS: interpretation-ledger-servera
          DEPLOY_NODE_HOSTNAME: serverA
        run: |
          set -Eeuo pipefail
          ssh_home="${RUNNER_TEMP}/interpretation-ledger-servera"
          mkdir -p "${ssh_home}"
          RUNNER_SSH_CONFIG="${ssh_home}/config" \
          RUNNER_SSH_KEY_FILE="${ssh_home}/key" \
            bash scripts/cd/setup-runner-ssh.sh
          echo "SERVERA_SSH_CONFIG=${ssh_home}/config" >>"${GITHUB_ENV}"

      - name: Upload and verify migration command
        run: |
          set -Eeuo pipefail
          remote_binary=/tmp/migrate-interpretation-runtime-ledgers
          scp -F "${SERVERA_SSH_CONFIG}" \
            "${MIGRATION_BINARY}" \
            "interpretation-ledger-servera:${remote_binary}"
          local_sha="$(shasum -a 256 "${MIGRATION_BINARY}" | awk '{print $1}')"
          remote_sha="$(ssh -F "${SERVERA_SSH_CONFIG}" interpretation-ledger-servera \
            "sha256sum ${remote_binary} | cut -d ' ' -f 1")"
          test "${local_sha}" = "${remote_sha}"
          ssh -F "${SERVERA_SSH_CONFIG}" interpretation-ledger-servera \
            "chmod 0755 ${remote_binary}"

      - name: Stop all worker replicas
        env:
          SUDO_PASSWORD: ${{ secrets.SVRD_SUDO_PASSWORD || secrets.SVRA_SUDO_PASSWORD }}
        run: |
          set -Eeuo pipefail
          bootstrap="$(mktemp)"
          remote_bootstrap=/tmp/stop-interpretation-ledger-workers.sh
          trap 'rm -f "${bootstrap}"' EXIT
          umask 077
          {
            echo '#!/usr/bin/env bash'
            echo 'set -Eeuo pipefail'
            printf 'SUDO_PASSWORD=%q\n' "${SUDO_PASSWORD}"
            cat <<'BOOT'
          sudo_run() {
            if [ "$(id -u)" -eq 0 ]; then
              "$@"
            elif sudo -n true 2>/dev/null; then
              sudo "$@"
            else
              printf '%s\n' "${SUDO_PASSWORD}" | sudo -S -p '' "$@"
            fi
          }
          expected="$(printf '%s\n' qs-worker-runtime-1 qs-worker-runtime-2 qs-worker-runtime-3 | sort)"
          actual="$(sudo_run docker ps \
            --filter label=com.docker.compose.project=qs-worker \
            --filter label=com.docker.compose.service=runtime \
            --format '{{.Names}}' | sort)"
          if [ "${actual}" != "${expected}" ]; then
            echo "worker maintenance precheck failed" >&2
            printf 'expected:\n%s\nactual:\n%s\n' "${expected}" "${actual}" >&2
            exit 1
          fi
          sudo_run docker stop qs-worker-runtime-1 qs-worker-runtime-2 qs-worker-runtime-3
          for name in qs-worker-runtime-1 qs-worker-runtime-2 qs-worker-runtime-3; do
            state="$(sudo_run docker inspect "${name}" --format '{{.State.Status}}')"
            test "${state}" = exited
          done
          BOOT
          } >"${bootstrap}"
          chmod 0600 "${bootstrap}"
          scp -F "${SERVERD_SSH_CONFIG}" "${bootstrap}" \
            "interpretation-ledger-serverd:${remote_bootstrap}"
          ssh -F "${SERVERD_SSH_CONFIG}" interpretation-ledger-serverd \
            "chmod 0600 ${remote_bootstrap} && bash ${remote_bootstrap}; rc=\$?; rm -f ${remote_bootstrap}; exit \$rc"

      - name: Stop apiserver, migrate, drop sources, and restore apiserver
        env:
          SUDO_PASSWORD: ${{ secrets.SVRA_SUDO_PASSWORD }}
        run: |
          set -Eeuo pipefail
          bootstrap="$(mktemp)"
          remote_bootstrap=/tmp/run-interpretation-ledger-migration.sh
          trap 'rm -f "${bootstrap}"' EXIT
          umask 077
          {
            echo '#!/usr/bin/env bash'
            echo 'set -Eeuo pipefail'
            printf 'SUDO_PASSWORD=%q\n' "${SUDO_PASSWORD}"
            cat <<'BOOT'
          sudo_run() {
            if [ "$(id -u)" -eq 0 ]; then
              "$@"
            elif sudo -n true 2>/dev/null; then
              sudo "$@"
            else
              printf '%s\n' "${SUDO_PASSWORD}" | sudo -S -p '' "$@"
            fi
          }
          migration_binary=/tmp/migrate-interpretation-runtime-ledgers
          env_file=/opt/qs-server/qs-apiserver/configs/env/config.prod.env
          apiserver_stopped=0
          restore_apiserver() {
            rc=$?
            trap - EXIT
            if [ "${apiserver_stopped}" -eq 1 ]; then
              sudo_run docker start qs-apiserver >/dev/null || rc=1
              ready=0
              for _ in $(seq 1 60); do
                if curl -fsS http://127.0.0.1:8081/readyz >/dev/null 2>&1; then
                  ready=1
                  break
                fi
                sleep 2
              done
              if [ "${ready}" -ne 1 ]; then
                echo "qs-apiserver did not recover after migration" >&2
                rc=1
              fi
            fi
            sudo_run rm -f "${migration_binary}" || true
            exit "${rc}"
          }
          trap restore_apiserver EXIT
          test -x "${migration_binary}"
          test -r "${env_file}"
          image_ref="$(sudo_run docker inspect qs-apiserver --format '{{.Config.Image}}')"
          case "${image_ref}" in
            ghcr.io/fangcunmount/qs-apiserver:*) ;;
            *) echo "unexpected qs-apiserver image: ${image_ref}" >&2; exit 1 ;;
          esac
          sudo_run docker stop qs-apiserver
          apiserver_stopped=1
          sudo_run docker run --rm \
            --network infra-network \
            --env-file "${env_file}" \
            --entrypoint /tmp/migrate-interpretation-runtime-ledgers \
            -v "${migration_binary}:/tmp/migrate-interpretation-runtime-ledgers:ro" \
            "${image_ref}" \
            --timeout 90m \
            --batch-size 1000 \
            --apply \
            --confirm-services-stopped \
            --drop-source \
            --confirm-drop-source
          BOOT
          } >"${bootstrap}"
          chmod 0600 "${bootstrap}"
          scp -F "${SERVERA_SSH_CONFIG}" "${bootstrap}" \
            "interpretation-ledger-servera:${remote_bootstrap}"
          ssh -F "${SERVERA_SSH_CONFIG}" interpretation-ledger-servera \
            "chmod 0600 ${remote_bootstrap} && bash ${remote_bootstrap}; rc=\$?; rm -f ${remote_bootstrap}; exit \$rc"

      - name: Restore and verify all worker replicas
        if: always()
        env:
          SUDO_PASSWORD: ${{ secrets.SVRD_SUDO_PASSWORD || secrets.SVRA_SUDO_PASSWORD }}
        run: |
          set -Eeuo pipefail
          bootstrap="$(mktemp)"
          remote_bootstrap=/tmp/restore-interpretation-ledger-workers.sh
          trap 'rm -f "${bootstrap}"' EXIT
          umask 077
          {
            echo '#!/usr/bin/env bash'
            echo 'set -Eeuo pipefail'
            printf 'SUDO_PASSWORD=%q\n' "${SUDO_PASSWORD}"
            cat <<'BOOT'
          sudo_run() {
            if [ "$(id -u)" -eq 0 ]; then
              "$@"
            elif sudo -n true 2>/dev/null; then
              sudo "$@"
            else
              printf '%s\n' "${SUDO_PASSWORD}" | sudo -S -p '' "$@"
            fi
          }
          sudo_run docker start qs-worker-runtime-1 qs-worker-runtime-2 qs-worker-runtime-3 >/dev/null
          for name in qs-worker-runtime-1 qs-worker-runtime-2 qs-worker-runtime-3; do
            ready=0
            for _ in $(seq 1 60); do
              state="$(sudo_run docker inspect "${name}" --format '{{.State.Status}}')"
              health="$(sudo_run docker inspect "${name}" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}')"
              if [ "${state}" = running ] && { [ "${health}" = healthy ] || [ "${health}" = none ]; }; then
                ready=1
                break
              fi
              sleep 2
            done
            if [ "${ready}" -ne 1 ]; then
              echo "worker did not recover: ${name}" >&2
              exit 1
            fi
            sudo_run docker inspect "${name}" --format 'container={{.Name}} state={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} image={{.Config.Image}}'
          done
          BOOT
          } >"${bootstrap}"
          chmod 0600 "${bootstrap}"
          scp -F "${SERVERD_SSH_CONFIG}" "${bootstrap}" \
            "interpretation-ledger-serverd:${remote_bootstrap}"
          ssh -F "${SERVERD_SSH_CONFIG}" interpretation-ledger-serverd \
            "chmod 0600 ${remote_bootstrap} && bash ${remote_bootstrap}; rc=\$?; rm -f ${remote_bootstrap}; exit \$rc"

      - name: Verify public readiness
        run: |
          set -Eeuo pipefail
          curl -fsS --retry 10 --retry-delay 3 https://qs.fangcunmount.cn/readyz
          curl -fsS --retry 10 --retry-delay 3 https://worker.fangcunmount.cn/readyz

      - name: Cleanup SSH material
        if: always()
        run: |
          rm -rf \
            "${RUNNER_TEMP}/interpretation-ledger-servera" \
            "${RUNNER_TEMP}/interpretation-ledger-serverd"
