name: Attention Reconcile Apply Audit

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Expected deployed worker SHA'
        required: true
        type: string
      expected_created:
        description: 'Exact target projections settled by this apply deployment'
        required: true
        type: string
        default: '91'
      expected_target_fingerprint:
        description: 'Expected lowercase SHA-256 target manifest fingerprint'
        required: true
        type: string
        default: '75bc40d269404a337ccd3fabae57fec2768424fc660e1e9b76796bb3a3404a09'

permissions:
  contents: read

jobs:
  audit:
    name: Audit Production Worker Apply Metrics
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64, ops]
    environment:
      name: production
    timeout-minutes: 5
    env:
      EXPECTED_WORKER_REPLICAS: ${{ vars.QS_WORKER_REPLICAS || '3' }}
      EXPECTED_DEPLOY_SHA: ${{ inputs.expected_sha }}
      MIN_SUCCESSFUL_ROUNDS: '1'
      MIN_MISSING: '0'
      EXPECTED_MISSING: ''
      EXPECTED_DRY_RUN: 'false'
      EXPECTED_CREATED: ${{ inputs.expected_created }}
      EXPECTED_RECONCILE_FROM: '2026-08-01T00:00:00Z'
      EXPECTED_TARGET_COUNT: '91'
      EXPECTED_TARGET_FINGERPRINT: ${{ inputs.expected_target_fingerprint }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup worker audit SSH
        env:
          RUNNER_SSH_KEY: ${{ secrets.SVR_MINI_SSH_KEY || secrets.SVRD_SSH_KEY || secrets.SVRA_SSH_KEY }}
          RUNNER_SSH_HOST: ${{ vars.SVRD_PUBLIC_HOST || secrets.SVRD_PUBLIC_HOST || vars.SVRD_HOST }}
          RUNNER_SSH_USER: ${{ vars.SVRD_USERNAME || vars.SVRA_USERNAME }}
          RUNNER_SSH_PORT: ${{ vars.SVRD_SSH_PORT || vars.SVRA_SSH_PORT || 22 }}
          RUNNER_SSH_ALIAS: audit-attention-worker
          DEPLOY_NODE_HOSTNAME: serverD
        run: bash scripts/cd/setup-runner-ssh.sh

      - name: Audit Attention reconcile apply metrics
        env:
          RUNNER_SSH_ALIAS: audit-attention-worker
        run: |
          set -Eeuo pipefail
          if ! [[ "${EXPECTED_DEPLOY_SHA}" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "Invalid EXPECTED_DEPLOY_SHA=${EXPECTED_DEPLOY_SHA}" >&2
            exit 1
          fi
          for value in "${EXPECTED_WORKER_REPLICAS}" "${MIN_SUCCESSFUL_ROUNDS}" "${MIN_MISSING}" "${EXPECTED_TARGET_COUNT}" "${EXPECTED_CREATED}"; do
            if ! [[ "${value}" =~ ^[0-9]+$ ]]; then
              echo "Invalid numeric audit input=${value}" >&2
              exit 1
            fi
          done
          if ! [[ "${EXPECTED_TARGET_FINGERPRINT}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid EXPECTED_TARGET_FINGERPRINT" >&2
            exit 1
          fi
          ssh -F "${RUNNER_SSH_CONFIG}" "${RUNNER_SSH_ALIAS}" \
            "EXPECTED_WORKER_REPLICAS=${EXPECTED_WORKER_REPLICAS} EXPECTED_DEPLOY_SHA=${EXPECTED_DEPLOY_SHA} MIN_SUCCESSFUL_ROUNDS=${MIN_SUCCESSFUL_ROUNDS} MIN_MISSING=${MIN_MISSING} EXPECTED_MISSING=${EXPECTED_MISSING} EXPECTED_DRY_RUN=${EXPECTED_DRY_RUN} EXPECTED_CREATED=${EXPECTED_CREATED} EXPECTED_RECONCILE_FROM=${EXPECTED_RECONCILE_FROM} EXPECTED_TARGET_COUNT=${EXPECTED_TARGET_COUNT} EXPECTED_TARGET_FINGERPRINT=${EXPECTED_TARGET_FINGERPRINT} PRIVILEGE_RUNNER=sudo bash -s" \
            < scripts/cd/audit-attention-reconcile-dry-run.sh

      - name: Cleanup worker audit SSH
        if: always()
        run: rm -f "${RUNNER_SSH_KEY_FILE:-}" "${RUNNER_SSH_CONFIG:-}" 2>/dev/null || true
