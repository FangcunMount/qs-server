name: Production AuthZ v3 Matrix

on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * *' # Beijing 02:30, after the scheduled backup window starts.

permissions:
  contents: read

concurrency:
  group: qs-server-authz-production-matrix
  cancel-in-progress: false

jobs:
  verify:
    name: Verify role x origin_type with production subjects
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64, ops]
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate SSH configuration
        env:
          SVRA_HOST: ${{ vars.SVRA_HOST }}
          SVRA_USERNAME: ${{ vars.SVRA_USERNAME }}
          SVRA_SSH_KEY: ${{ secrets.SVRA_SSH_KEY }}
          SVRA_SSH_FINGERPRINT: ${{ vars.SVRA_SSH_FINGERPRINT }}
        run: |
          set -Eeuo pipefail
          : "${SVRA_HOST:?SVRA_HOST is empty}"
          : "${SVRA_USERNAME:?SVRA_USERNAME is empty}"
          : "${SVRA_SSH_KEY:?SVRA_SSH_KEY is empty}"
          : "${SVRA_SSH_FINGERPRINT:?SVRA_SSH_FINGERPRINT is empty}"

      - name: Execute read-only production AuthZ matrix
        uses: appleboy/ssh-action@v1.2.2
        env:
          PRIVILEGE_RUNNER: sudo
        with:
          host: ${{ vars.SVRA_HOST }}
          username: ${{ vars.SVRA_USERNAME }}
          key: ${{ secrets.SVRA_SSH_KEY }}
          port: ${{ vars.SVRA_SSH_PORT || 22 }}
          fingerprint: ${{ vars.SVRA_SSH_FINGERPRINT }}
          envs: PRIVILEGE_RUNNER
          script_path: scripts/cd/verify-authz-production-matrix.sh
