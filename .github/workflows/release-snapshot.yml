name: Read-only release snapshot
on:
  workflow_dispatch:
    inputs:
      messaging_retirement_inventory:
        description: Bounded read-only retained messaging inventory; no backup, replay, retirement or DDL
        type: boolean
        default: false
      protocol_observation:
        description: Read original QS protocol metadata; never certifies Broker backlog or writer exclusion
        type: boolean
        default: false
      reviewed_source:
        description: Exact reviewed source SHA, required for messaging inventory
        type: string
        required: false
      maintenance_transport:
        description: Explicit M5 Docker permission preflight or idle container staging; no application/DB execution
        type: choice
        options: [none, preflight, stage]
        default: none
      maintenance_image_id:
        description: Reviewed original QS API local immutable image ID (sha256); required for maintenance transport
        type: string
        required: false
      maintenance_container:
        description: Optional already staged owned QS maintenance container for inventory with API stopped
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  maintenance-transport:
    if: inputs.maintenance_transport != 'none' && inputs.maintenance_transport != ''
    environment: production
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    env:
      RUNNER_SSH_KEY: ${{ secrets.SVR_MINI_SSH_KEY || secrets.SVRA_SSH_KEY }}
      RUNNER_SSH_HOST: ${{ vars.SVRA_PUBLIC_HOST || secrets.SVRA_PUBLIC_HOST || vars.SVRA_HOST }}
      RUNNER_SSH_USER: ${{ vars.SVRA_USERNAME }}
      RUNNER_SSH_PORT: ${{ vars.SVRA_SSH_PORT || '22' }}
      RUNNER_SSH_ALIAS: qs-m5-maintenance-serverA
      DEPLOY_NODE_HOSTNAME: serverA
      REVIEWED_SOURCE: ${{ inputs.reviewed_source }}
      MAINTENANCE_IMAGE: ${{ inputs.maintenance_image_id }}
      MAINTENANCE_MODE: ${{ inputs.maintenance_transport }}
      SUDO_PASSWORD: ${{ secrets.SVRA_SUDO_PASSWORD }}
      INVENTORY_REQUESTED: ${{ inputs.messaging_retirement_inventory }}
      PROTOCOL_REQUESTED: ${{ inputs.protocol_observation }}
      EXISTING_MAINTENANCE: ${{ inputs.maintenance_container }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify separate exact-source maintenance operation
        run: |
          test "$REVIEWED_SOURCE" = "$GITHUB_SHA"
          test "$INVENTORY_REQUESTED" != true
          test "$PROTOCOL_REQUESTED" != true
          test -z "$EXISTING_MAINTENANCE"
          [[ "$MAINTENANCE_IMAGE" =~ ^sha256:[0-9a-f]{64}$ ]]
          case "$MAINTENANCE_MODE" in preflight|stage) ;; *) exit 1 ;; esac
      - name: Establish existing release SSH transport
        run: bash scripts/cd/setup-runner-ssh.sh
      - name: Explicit maintenance transport only
        run: |
          set -Eeuo pipefail
          bash scripts/cd/run-m5-maintenance-ssh.sh > m5-maintenance-transport.json
      - uses: actions/upload-artifact@v7
        with:
          name: m5-maintenance-transport-${{ github.run_id }}
          path: m5-maintenance-transport.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove only owned local SSH key and receipt
        if: always()
        run: rm -f "${RUNNER_SSH_KEY_FILE:-}" m5-maintenance-transport.json
  snapshot:
    if: inputs.messaging_retirement_inventory != true && (inputs.maintenance_transport == 'none' || inputs.maintenance_transport == '')
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        host: [SVRA, SVRB, SVRD]
    env:
      RUNNER_SSH_KEY: ${{ secrets.SVR_MINI_SSH_KEY || secrets[format('{0}_SSH_KEY', matrix.host)] || secrets.SVRA_SSH_KEY }}
      RUNNER_SSH_HOST: ${{ vars[format('{0}_PUBLIC_HOST', matrix.host)] || secrets[format('{0}_PUBLIC_HOST', matrix.host)] || vars[format('{0}_HOST', matrix.host)] }}
      RUNNER_SSH_USER: ${{ vars[format('{0}_USERNAME', matrix.host)] }}
      RUNNER_SSH_PORT: ${{ vars[format('{0}_SSH_PORT', matrix.host)] || '22' }}
      RUNNER_SSH_ALIAS: release-snapshot-${{ matrix.host }}
      DEPLOY_NODE_HOSTNAME: ${{ matrix.host == 'SVRA' && 'serverA' || matrix.host == 'SVRB' && 'serverB' || 'serverD' }}
    steps:
      - uses: actions/checkout@v6
      - name: Establish existing release SSH transport
        run: bash scripts/cd/setup-runner-ssh.sh
      - name: Read running image identities and configuration fingerprints
        run: |
          set -Eeuo pipefail
          ssh -F "$RUNNER_SSH_CONFIG" -o ConnectTimeout=20 "$RUNNER_SSH_ALIAS" \
            'sudo -n python3 -' < scripts/cd/release-snapshot.py > release-snapshot.json
          python3 -c 'import json; x=json.load(open("release-snapshot.json")); assert x["read_only"] is True and x["containers"]'
      - uses: actions/upload-artifact@v7
        with:
          name: release-snapshot-${{ matrix.host }}-${{ github.run_id }}
          path: release-snapshot.json
          if-no-files-found: error
          retention-days: 90
      - name: Cleanup private runner SSH key
        if: always()
        run: rm -f "${RUNNER_SSH_KEY_FILE:-}" release-snapshot.json

  inventory-reader:
    if: inputs.messaging_retirement_inventory == true
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.identity.outputs.digest }}
      mongo_digest: ${{ steps.identity.outputs.mongo_digest }}
      offline_digest: ${{ steps.identity.outputs.offline_digest }}
    steps:
      - name: Refuse unreviewed source
        env:
          REVIEWED_SOURCE: ${{ inputs.reviewed_source }}
        run: test "$REVIEWED_SOURCE" = "$GITHUB_SHA"
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check and build the fixed-owner read-only reader
        run: |
          set -Eeuo pipefail
          go test -count=1 ./scripts/oneoff/messaging_retirement_inventory
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-X main.sourceSHA=$GITHUB_SHA" -o messaging-retirement-inventory ./scripts/oneoff/messaging_retirement_inventory
          go test -count=1 ./scripts/oneoff/mongodb_metadata_profile
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-X main.retirementSourceSHA=$GITHUB_SHA" -o messaging-retirement-mongo-inventory ./scripts/oneoff/mongodb_metadata_profile
          go test -count=1 ./scripts/maintenance/qs-migrate-offline
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-X github.com/FangcunMount/qs-server/pkg/version.GitCommit=$GITHUB_SHA" -o qs-migrate-offline ./scripts/maintenance/qs-migrate-offline
      - id: identity
        run: |
          {
            echo "digest=$(sha256sum messaging-retirement-inventory | cut -d ' ' -f1)"
            echo "mongo_digest=$(sha256sum messaging-retirement-mongo-inventory | cut -d ' ' -f1)"
            echo "offline_digest=$(sha256sum qs-migrate-offline | cut -d ' ' -f1)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: messaging-retirement-reader-${{ github.run_id }}
          path: |
            messaging-retirement-inventory
            messaging-retirement-mongo-inventory
            qs-migrate-offline
          if-no-files-found: error

  messaging-inventory:
    if: inputs.messaging_retirement_inventory == true
    needs: inventory-reader
    environment: production
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        owner: [iam.mysql, qs.mysql, ai.mysql, qs.mongo]
    env:
      RUNNER_SSH_KEY: ${{ secrets.SVR_MINI_SSH_KEY || secrets.SVRA_SSH_KEY }}
      RUNNER_SSH_HOST: ${{ vars.SVRA_PUBLIC_HOST || secrets.SVRA_PUBLIC_HOST || vars.SVRA_HOST }}
      RUNNER_SSH_USER: ${{ vars.SVRA_USERNAME }}
      RUNNER_SSH_PORT: ${{ vars.SVRA_SSH_PORT || '22' }}
      RUNNER_SSH_ALIAS: messaging-retirement-serverA
      DEPLOY_NODE_HOSTNAME: serverA
      INVENTORY_OWNER: ${{ matrix.owner }}
      EXPECTED_DIGEST: ${{ needs.inventory-reader.outputs.digest }}
      EXPECTED_MONGO_DIGEST: ${{ needs.inventory-reader.outputs.mongo_digest }}
      EXPECTED_OFFLINE_DIGEST: ${{ needs.inventory-reader.outputs.offline_digest }}
      QS_MAINTENANCE_CONTAINER: ${{ inputs.maintenance_container }}
      QS_MAINTENANCE_IMAGE_ID: ${{ inputs.maintenance_image_id }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: messaging-retirement-reader-${{ github.run_id }}
          path: inventory-companion
      - name: Establish existing read-only SSH transport
        run: bash scripts/cd/setup-runner-ssh.sh
      - name: Read retained messaging facts without changing application or database state
        run: python3 scripts/cd/run-messaging-retirement-inventory.py
      - name: Inspect the exact canonical offline plan without applying or approving it
        if: matrix.owner == 'qs.mysql'
        run: python3 scripts/cd/run-offline-preview.py
      - name: Read original QS transaction primaries without sending or mutating
        if: matrix.owner == 'qs.mysql' && inputs.protocol_observation == true
        env:
          PROTOCOL_OBSERVATION: 'true'
        run: python3 scripts/cd/run-offline-preview.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: messaging-retirement-${{ matrix.owner }}-${{ github.run_id }}
          path: |
            messaging-retirement-inventory.json
            messaging-retirement-original-ai-publisher.sql
            messaging-retirement-original-ai-publisher.jsonl
            messaging-retirement-offline-preview.json
            messaging-retirement-protocol.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove owned local key and companion
        if: always()
        run: rm -f "${RUNNER_SSH_KEY_FILE:-}" messaging-retirement-inventory.json messaging-retirement-original-ai-publisher.sql messaging-retirement-original-ai-publisher.jsonl messaging-retirement-offline-preview.json messaging-retirement-protocol.json inventory-companion/messaging-retirement-inventory inventory-companion/messaging-retirement-mongo-inventory inventory-companion/qs-migrate-offline
