name: Read-only release snapshot
on:
  workflow_dispatch:
    inputs:
      worker_restore_only:
        description: Restore the previously verified frozen Worker profile after failed deployment
        type: boolean
        default: false
      business_observation_only:
        description: Reuse existing read-only application metrics snapshot; return error category only
        type: boolean
        default: false
      deployment_policy_only:
        description: Read-only ServerA sudo command policy; no root tool execution
        type: boolean
        default: false
      monitoring_only:
        description: 'Read local Mac mini monitoring identity/config hashes only; no SSH or service changes'
        type: boolean
        default: false
      image_binding_diagnostics:
        description: Runner-only image metadata diagnosis; no SSH or services
        type: boolean
        default: false
      candidate_images:
        description: 'Optional six service SHA/digest/config identities as JSON'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  snapshot:
    if: inputs.monitoring_only != true && inputs.image_binding_diagnostics != true && inputs.deployment_policy_only != true && inputs.business_observation_only != true && inputs.worker_restore_only != true
    environment: production
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        host: [SVRA, SVRB, SVRD]
    env:
      RUNNER_SSH_KEY: ${{ secrets.SVR_MINI_SSH_KEY || secrets[format('{0}_SSH_KEY', matrix.host)] || secrets.SVRA_SSH_KEY }}
      RUNNER_SSH_HOST: ${{ vars[format('{0}_PUBLIC_HOST', matrix.host)] || secrets[format('{0}_PUBLIC_HOST', matrix.host)] || vars[format('{0}_HOST', matrix.host)] }}
      RUNNER_SSH_USER: ${{ vars[format('{0}_USERNAME', matrix.host)] }}
      RUNNER_SSH_PORT: ${{ vars[format('{0}_SSH_PORT', matrix.host)] || '22' }}
      SUDO_PASSWORD: ${{ matrix.host == 'SVRA' && secrets.SVRA_SUDO_PASSWORD || '' }}
      RUNNER_SSH_ALIAS: release-snapshot-${{ matrix.host }}
      DEPLOY_NODE_HOSTNAME: ${{ matrix.host == 'SVRA' && 'serverA' || matrix.host == 'SVRB' && 'serverB' || 'serverD' }}
    steps:
      - uses: actions/checkout@v6
      - name: Establish existing release SSH transport
        run: bash scripts/cd/setup-runner-ssh.sh
      - name: Read running image identities and configuration fingerprints
        run: |
          set -Eeuo pipefail
          bash scripts/cd/run-release-snapshot-ssh.sh > release-snapshot.json
          python3 -c 'import json; x=json.load(open("release-snapshot.json")); assert x["read_only"] is True and x["containers"]'
      - uses: actions/upload-artifact@v7
        with:
          name: release-snapshot-${{ matrix.host }}-${{ github.run_id }}
          path: release-snapshot.json
          if-no-files-found: error
          retention-days: 90
      - name: Cleanup private runner SSH key
        if: always()
        run: rm -f "${RUNNER_SSH_KEY_FILE:-}" release-snapshot.json

  monitoring:
    if: inputs.monitoring_only == true
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Read local monitoring runtime identity and asset hashes
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, pathlib, platform, socket, subprocess, urllib.request
          runtime = pathlib.Path.home() / 'infra-monitoring'
          private = pathlib.Path.home() / '.config/infra-monitoring'
          result = dict(read_only=True, deployment_verified=False, host=socket.gethostname(),
                        observed_at=datetime.datetime.now(datetime.timezone.utc).isoformat(),
                        runtime_present=runtime.is_dir(), private_env_present=(private / 'runtime.env').is_file(),
                        containers=[], asset_sha256={}, prometheus_ready=False, grafana_ready=False)
          def run(*args):
              return subprocess.check_output(args, text=True, stderr=subprocess.DEVNULL, timeout=20)
          result['standard_cli_plugin_directories'] = []
          for name in ('/usr/local/lib/docker/cli-plugins', '/usr/local/libexec/docker/cli-plugins', '/usr/lib/docker/cli-plugins', '/usr/libexec/docker/cli-plugins'):
              target = pathlib.Path(name); ancestor = target
              while not ancestor.exists(): ancestor = ancestor.parent
              result['standard_cli_plugin_directories'].append(dict(path=name, exists=target.is_dir(), parent_writable=__import__('os').access(ancestor, __import__('os').W_OK), buildx_exists=(target / 'docker-buildx').exists()))
          try:
              if platform.system() != 'Darwin':
                  raise ValueError('Expected Mac mini')
              result['memory_bytes'] = int(run('sysctl', '-n', 'hw.memsize'))
              ids = run('docker', 'ps', '-a', '-q', '--filter', 'label=com.docker.compose.project=macmini-monitoring').split()
              for cid in ids:
                  template = '{"name":{{json .Name}},"image_id":{{json .Image}},"running":{{json .State.Running}},"mounts":{{json .Mounts}}}'
                  result['containers'].append(json.loads(run('docker', 'inspect', '--format', template, cid)))
              for pattern in ('config/rules/*.yml', 'config/grafana/dashboards/event*.json', 'config/prometheus.yml'):
                  for path in sorted(runtime.glob(pattern)):
                      if not path.is_symlink() and path.is_file() and path.stat().st_size <= 1048576:
                          result['asset_sha256'][str(path.relative_to(runtime))] = hashlib.sha256(path.read_bytes()).hexdigest()
              for name, url in (('prometheus_ready', 'http://127.0.0.1:19090/-/ready'), ('grafana_ready', 'http://127.0.0.1:13000/api/health')):
                  try:
                      with urllib.request.urlopen(url, timeout=5) as response:
                          result[name] = response.status == 200
                  except Exception:
                      pass
          except Exception as error:
              result['unavailable_type'] = type(error).__name__
          pathlib.Path('monitoring-snapshot.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: monitoring-snapshot-${{ github.run_id }}
          path: monitoring-snapshot.json
          if-no-files-found: error
          retention-days: 90

  verify-candidates:
    if: inputs.candidate_images != '' && inputs.image_binding_diagnostics != true
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Verify image identity contracts
        run: python3 scripts/cd/test_release_images.py
      - uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}
      - name: Read immutable candidate images
        env:
          CANDIDATE_IMAGES: ${{ inputs.candidate_images }}
          ALIYUN_ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          ALIYUN_ACR_NAMESPACE: ${{ secrets.ALIYUN_ACR_NAMESPACE }}
        run: python3 scripts/cd/verify-release-images.py
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-image-verification-${{ github.run_id }}
          path: candidate-image-verification.json
          if-no-files-found: error
          retention-days: 90

  image-binding-diagnostics:
    if: inputs.image_binding_diagnostics == true
    environment: production
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Prepare isolated runner registry authentication
        env:
          ALIYUN_ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          ALIYUN_ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
          ALIYUN_ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
        run: |
          python3 - <<'PYAUTH'
          import base64,json,os,pathlib
          directory=pathlib.Path(os.environ['RUNNER_TEMP'])/('image-binding-auth-'+os.environ['GITHUB_RUN_ID'])
          directory.mkdir(mode=0o700)
          auth=base64.b64encode((os.environ['ALIYUN_ACR_USERNAME']+':'+os.environ['ALIYUN_ACR_PASSWORD']).encode()).decode()
          path=directory/'config.json'
          with path.open('x') as stream: json.dump({'auths':{os.environ['ALIYUN_ACR_REGISTRY']:{'auth':auth}}},stream)
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as stream:stream.write('DOCKER_CONFIG='+str(directory)+'\n')
          PYAUTH
      - name: Compare real registry and local image metadata
        env:
          CANDIDATE_IMAGES: ${{ inputs.candidate_images }}
          ALIYUN_ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          ALIYUN_ACR_NAMESPACE: ${{ secrets.ALIYUN_ACR_NAMESPACE }}
        run: python3 scripts/cd/diagnose-image-binding.py
      - uses: actions/upload-artifact@v7
        with:
          name: image-binding-diagnostics-${{ github.run_id }}
          path: image-binding-diagnostics.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove owned registry authentication
        if: always()
        run: rm -rf "${RUNNER_TEMP}/image-binding-auth-${GITHUB_RUN_ID}"

  deployment-policy:
    if: inputs.deployment_policy_only == true
    environment: production
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    env:
      RUNNER_SSH_KEY: ${{ secrets.SVR_MINI_SSH_KEY || secrets.SVRA_SSH_KEY }}
      RUNNER_SSH_HOST: ${{ vars.SVRA_PUBLIC_HOST || secrets.SVRA_PUBLIC_HOST || vars.SVRA_HOST }}
      RUNNER_SSH_USER: ${{ vars.SVRA_USERNAME }}
      RUNNER_SSH_PORT: ${{ vars.SVRA_SSH_PORT || '22' }}
      RUNNER_SSH_ALIAS: release-policy-serverA
      DEPLOY_NODE_HOSTNAME: serverA
      SUDO_PASSWORD: ${{ secrets.SVRA_SUDO_PASSWORD }}
      WWW_UID: ${{ secrets.WWW_UID }}
      WWW_GID: ${{ secrets.WWW_GID }}
    steps:
      - uses: actions/checkout@v6
      - name: Establish existing read-only SSH transport
        run: bash scripts/cd/setup-runner-ssh.sh
      - name: Read allowed Python tool commands without executing them
        run: |
          python3 - <<'PYPOLICY'
          import json, os, pathlib, subprocess
          result = subprocess.run(['ssh', '-F', os.environ['RUNNER_SSH_CONFIG'], '-o', 'ConnectTimeout=20', os.environ['RUNNER_SSH_ALIAS'], 'sudo -S -p "" -l'], input=os.environ['SUDO_PASSWORD']+'\n', capture_output=True, text=True, timeout=45)
          commands = [line.strip() for line in result.stdout.splitlines() if '/usr/bin/python3' in line or 'ai-mq-tools' in line or 'material-tools' in line]
          receipt = dict(read_only=True, root_tool_executed=False, returncode=result.returncode, python_tool_policy=commands, configured_uid_is_2000=os.environ['WWW_UID']=='2000', configured_gid_is_2000=os.environ['WWW_GID']=='2000')
          pathlib.Path('deployment-policy.json').write_text(json.dumps(receipt, indent=2)+'\n')
          if result.returncode: raise SystemExit('Read-only sudo policy query failed; no root tool executed')
          PYPOLICY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deployment-policy-${{ github.run_id }}
          path: deployment-policy.json
          if-no-files-found: error
      - name: Remove owned SSH key and policy projection
        if: always()
        run: rm -f "${RUNNER_SSH_KEY_FILE:-}" deployment-policy.json

  build-business-observation:
    if: inputs.business_observation_only == true
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.identity.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile existing read-only snapshot companion
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o mq-observation-inspect ./scripts/oneoff/mq_observation_inspect
      - id: identity
        run: echo "digest=$(sha256sum mq-observation-inspect | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: mq-observation-inspect-${{ github.run_id }}
          path: mq-observation-inspect
          if-no-files-found: error

  business-observation:
    if: inputs.business_observation_only == true
    needs: build-business-observation
    environment: production
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    env:
      RUNNER_SSH_KEY: ${{ secrets.SVR_MINI_SSH_KEY || secrets.SVRA_SSH_KEY }}
      RUNNER_SSH_HOST: ${{ vars.SVRA_PUBLIC_HOST || secrets.SVRA_PUBLIC_HOST || vars.SVRA_HOST }}
      RUNNER_SSH_USER: ${{ vars.SVRA_USERNAME }}
      RUNNER_SSH_PORT: ${{ vars.SVRA_SSH_PORT || '22' }}
      RUNNER_SSH_ALIAS: business-observation-serverA
      DEPLOY_NODE_HOSTNAME: serverA
      EXPECTED_DIGEST: ${{ needs.build-business-observation.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: mq-observation-inspect-${{ github.run_id }}
          path: observation-companion
      - name: Establish existing read-only SSH transport
        run: bash scripts/cd/setup-runner-ssh.sh
      - name: Run bounded snapshot as the existing application UID
        run: |
          python3 - <<'PYREAD'
          import hashlib, json, os, pathlib, shlex, subprocess
          binary = pathlib.Path('observation-companion/mq-observation-inspect')
          assert hashlib.sha256(binary.read_bytes()).hexdigest() == os.environ['EXPECTED_DIGEST']
          run = os.environ['GITHUB_RUN_ID']; assert run.isdecimal()
          temporary = '/tmp/qs-mq-observation-' + run
          script = 'set -eu; umask 077; p=' + shlex.quote(temporary) + """; trap 'rm -f "$p"' EXIT; cat > "$p"; chmod 0700 "$p"; "$p" """
          command = shlex.join(['sudo', '-n', 'docker', 'exec', '--user', '2000:2000', '-i', 'qs-apiserver', 'sh', '-c', script])
          with binary.open('rb') as stream:
              result = subprocess.run(['ssh', '-F', os.environ['RUNNER_SSH_CONFIG'], os.environ['RUNNER_SSH_ALIAS'], command], stdin=stream, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, timeout=60)
          assert result.returncode == 0
          value = json.loads(result.stdout); assert value['read_only'] is True and value['mutation'] is False
          pathlib.Path('business-observation.json').write_text(json.dumps(value, indent=2)+'\n')
          PYREAD
      - uses: actions/upload-artifact@v7
        with:
          name: business-observation-${{ github.run_id }}
          path: business-observation.json
          if-no-files-found: error
      - name: Remove owned local artifacts
        if: always()
        run: rm -f "${RUNNER_SSH_KEY_FILE:-}" business-observation.json observation-companion/mq-observation-inspect

  restore-verified-worker:
    if: inputs.worker_restore_only == true
    environment: production
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    env:
      RUNNER_SSH_KEY: ${{ secrets.SVR_MINI_SSH_KEY || secrets.SVRD_SSH_KEY || secrets.SVRA_SSH_KEY }}
      RUNNER_SSH_HOST: ${{ vars.SVRD_PUBLIC_HOST || secrets.SVRD_PUBLIC_HOST || vars.SVRD_HOST }}
      RUNNER_SSH_USER: ${{ vars.SVRD_USERNAME }}
      RUNNER_SSH_PORT: ${{ vars.SVRD_SSH_PORT || '22' }}
      RUNNER_SSH_ALIAS: restore-verified-worker
      DEPLOY_NODE_HOSTNAME: serverD
    steps:
      - uses: actions/checkout@v6
      - name: Establish existing deployment SSH transport
        run: bash scripts/cd/setup-runner-ssh.sh
      - name: Restore only the exact verified old Worker profile
        run: |
          ssh -F "$RUNNER_SSH_CONFIG" "$RUNNER_SSH_ALIAS" 'python3 -' > worker-restore.json <<'PYRESTORE'
          import json, pathlib, re, subprocess, time
          root = pathlib.Path('/opt/fangcun-readable-names/releases/readable-20261028-v2/closed/qs-worker')
          expected = 'sha256:b637bd1a84a4657b8452332d72629288c54665d9e0bd7faf5d1a1757dd9a72b6'
          def run(*args):
              return subprocess.check_output(args, text=True, stderr=subprocess.DEVNULL, timeout=120)
          docker = ['sudo', '-n', 'docker']
          compose = docker + ['compose', '-p', 'qs-worker', '--env-file', str(root/'runtime.env'), '-f', str(root/'compose.json')]
          value = json.loads(run(*compose, 'config', '--format', 'json'))
          assert set(value['services']) == {'runtime'}
          service = value['services']['runtime']
          assert run(*docker, 'image', 'inspect', '--format', '{{.Id}}', service['image']).strip() == expected
          assert any(v.get('source') == '/data/infra/ssl/mysql/ca-chain.pem' and v.get('target') == '/etc/qlume/mysql/ca-chain.pem' and v.get('read_only') is True for v in service['volumes'])
          run(*compose, 'up', '-d', '--no-build', '--pull', 'never', '--scale', 'runtime=3', 'runtime')
          ready = []
          for attempt in range(20):
              ids = run(*compose, 'ps', '--status', 'running', '-q', 'runtime').split()
              ready = []
              for cid in ids:
                  try:
                      assert run(*docker, 'inspect', '--format', '{{.Image}}', cid).strip() == expected
                      run(*docker, 'exec', cid, 'wget', '-q', '-O', '/dev/null', '-T', '3', 'http://127.0.0.1:9092/readyz')
                      version = run(*docker, 'exec', cid, '/app/qs-worker', '--version=true', '--config=/app/configs/worker.prod.yaml')
                      assert re.search(r'gitCommit:\s*f783f40473295dbcd70c7de4f11d25a61d1876c0', version)
                      ready.append(cid)
                  except (AssertionError, subprocess.SubprocessError):
                      pass
              if len(ids) == len(ready) == 3: break
              time.sleep(3)
          assert len(ready) == 3, 'Old Worker profile did not restore three ready replicas'
          print(json.dumps(dict(restored=True, expected_image=expected, expected_source='f783f40473295dbcd70c7de4f11d25a61d1876c0', ready_replicas=3, operator_database_mutation=False)))
          PYRESTORE
      - uses: actions/upload-artifact@v7
        with:
          name: worker-restore-${{ github.run_id }}
          path: worker-restore.json
          if-no-files-found: error
      - name: Remove owned SSH key
        if: always()
        run: rm -f "${RUNNER_SSH_KEY_FILE:-}"
