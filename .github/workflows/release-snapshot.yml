name: Read-only release snapshot
on:
  workflow_dispatch:
    inputs:
      monitoring_only:
        description: 'Read local Mac mini monitoring identity/config hashes only; no SSH or service changes'
        type: boolean
        default: false
      image_binding_diagnostics:
        description: Runner-only image metadata diagnosis; no SSH or services
        type: boolean
        default: false
      candidate_images:
        description: 'Optional six service SHA/digest/config identities as JSON'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  snapshot:
    if: inputs.monitoring_only != true && inputs.image_binding_diagnostics != true
    environment: production
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        host: [SVRA, SVRB, SVRD]
    env:
      RUNNER_SSH_KEY: ${{ secrets.SVR_MINI_SSH_KEY || secrets[format('{0}_SSH_KEY', matrix.host)] || secrets.SVRA_SSH_KEY }}
      RUNNER_SSH_HOST: ${{ vars[format('{0}_PUBLIC_HOST', matrix.host)] || secrets[format('{0}_PUBLIC_HOST', matrix.host)] || vars[format('{0}_HOST', matrix.host)] }}
      RUNNER_SSH_USER: ${{ vars[format('{0}_USERNAME', matrix.host)] }}
      RUNNER_SSH_PORT: ${{ vars[format('{0}_SSH_PORT', matrix.host)] || '22' }}
      SUDO_PASSWORD: ${{ matrix.host == 'SVRA' && secrets.SVRA_SUDO_PASSWORD || '' }}
      RUNNER_SSH_ALIAS: release-snapshot-${{ matrix.host }}
      DEPLOY_NODE_HOSTNAME: ${{ matrix.host == 'SVRA' && 'serverA' || matrix.host == 'SVRB' && 'serverB' || 'serverD' }}
    steps:
      - uses: actions/checkout@v6
      - name: Establish existing release SSH transport
        run: bash scripts/cd/setup-runner-ssh.sh
      - name: Read running image identities and configuration fingerprints
        run: |
          set -Eeuo pipefail
          bash scripts/cd/run-release-snapshot-ssh.sh > release-snapshot.json
          python3 -c 'import json; x=json.load(open("release-snapshot.json")); assert x["read_only"] is True and x["containers"]'
      - uses: actions/upload-artifact@v7
        with:
          name: release-snapshot-${{ matrix.host }}-${{ github.run_id }}
          path: release-snapshot.json
          if-no-files-found: error
          retention-days: 90
      - name: Cleanup private runner SSH key
        if: always()
        run: rm -f "${RUNNER_SSH_KEY_FILE:-}" release-snapshot.json

  monitoring:
    if: inputs.monitoring_only == true
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Read local monitoring runtime identity and asset hashes
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, pathlib, platform, socket, subprocess, urllib.request
          runtime = pathlib.Path.home() / 'infra-monitoring'
          private = pathlib.Path.home() / '.config/infra-monitoring'
          result = dict(read_only=True, deployment_verified=False, host=socket.gethostname(),
                        observed_at=datetime.datetime.now(datetime.timezone.utc).isoformat(),
                        runtime_present=runtime.is_dir(), private_env_present=(private / 'runtime.env').is_file(),
                        containers=[], asset_sha256={}, prometheus_ready=False, grafana_ready=False)
          def run(*args):
              return subprocess.check_output(args, text=True, stderr=subprocess.DEVNULL, timeout=20)
          result['standard_cli_plugin_directories'] = []
          for name in ('/usr/local/lib/docker/cli-plugins', '/usr/local/libexec/docker/cli-plugins', '/usr/lib/docker/cli-plugins', '/usr/libexec/docker/cli-plugins'):
              target = pathlib.Path(name); ancestor = target
              while not ancestor.exists(): ancestor = ancestor.parent
              result['standard_cli_plugin_directories'].append(dict(path=name, exists=target.is_dir(), parent_writable=__import__('os').access(ancestor, __import__('os').W_OK), buildx_exists=(target / 'docker-buildx').exists()))
          try:
              if platform.system() != 'Darwin':
                  raise ValueError('Expected Mac mini')
              result['memory_bytes'] = int(run('sysctl', '-n', 'hw.memsize'))
              ids = run('docker', 'ps', '-a', '-q', '--filter', 'label=com.docker.compose.project=macmini-monitoring').split()
              for cid in ids:
                  template = '{"name":{{json .Name}},"image_id":{{json .Image}},"running":{{json .State.Running}},"mounts":{{json .Mounts}}}'
                  result['containers'].append(json.loads(run('docker', 'inspect', '--format', template, cid)))
              for pattern in ('config/rules/*.yml', 'config/grafana/dashboards/event*.json', 'config/prometheus.yml'):
                  for path in sorted(runtime.glob(pattern)):
                      if not path.is_symlink() and path.is_file() and path.stat().st_size <= 1048576:
                          result['asset_sha256'][str(path.relative_to(runtime))] = hashlib.sha256(path.read_bytes()).hexdigest()
              for name, url in (('prometheus_ready', 'http://127.0.0.1:19090/-/ready'), ('grafana_ready', 'http://127.0.0.1:13000/api/health')):
                  try:
                      with urllib.request.urlopen(url, timeout=5) as response:
                          result[name] = response.status == 200
                  except Exception:
                      pass
          except Exception as error:
              result['unavailable_type'] = type(error).__name__
          pathlib.Path('monitoring-snapshot.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: monitoring-snapshot-${{ github.run_id }}
          path: monitoring-snapshot.json
          if-no-files-found: error
          retention-days: 90

  verify-candidates:
    if: inputs.candidate_images != '' && inputs.image_binding_diagnostics != true
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Verify image identity contracts
        run: python3 scripts/cd/test_release_images.py
      - uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}
      - name: Read immutable candidate images
        env:
          CANDIDATE_IMAGES: ${{ inputs.candidate_images }}
          ALIYUN_ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          ALIYUN_ACR_NAMESPACE: ${{ secrets.ALIYUN_ACR_NAMESPACE }}
        run: python3 scripts/cd/verify-release-images.py
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-image-verification-${{ github.run_id }}
          path: candidate-image-verification.json
          if-no-files-found: error
          retention-days: 90

  image-binding-diagnostics:
    if: inputs.image_binding_diagnostics == true
    environment: production
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Prepare isolated runner registry authentication
        env:
          ALIYUN_ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          ALIYUN_ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
          ALIYUN_ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
        run: |
          python3 - <<'PYAUTH'
          import base64,json,os,pathlib
          directory=pathlib.Path(os.environ['RUNNER_TEMP'])/('image-binding-auth-'+os.environ['GITHUB_RUN_ID'])
          directory.mkdir(mode=0o700)
          auth=base64.b64encode((os.environ['ALIYUN_ACR_USERNAME']+':'+os.environ['ALIYUN_ACR_PASSWORD']).encode()).decode()
          path=directory/'config.json'
          with path.open('x') as stream: json.dump({'auths':{os.environ['ALIYUN_ACR_REGISTRY']:{'auth':auth}}},stream)
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as stream:stream.write('DOCKER_CONFIG='+str(directory)+'\n')
          PYAUTH
      - name: Compare real registry and local image metadata
        env:
          CANDIDATE_IMAGES: ${{ inputs.candidate_images }}
          ALIYUN_ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          ALIYUN_ACR_NAMESPACE: ${{ secrets.ALIYUN_ACR_NAMESPACE }}
        run: python3 scripts/cd/diagnose-image-binding.py
      - uses: actions/upload-artifact@v7
        with:
          name: image-binding-diagnostics-${{ github.run_id }}
          path: image-binding-diagnostics.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove owned registry authentication
        if: always()
        run: rm -rf "${RUNNER_TEMP}/image-binding-auth-${GITHUB_RUN_ID}"
