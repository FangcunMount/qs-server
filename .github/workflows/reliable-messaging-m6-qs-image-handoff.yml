name: QS M6 image handoff isolation

on:
  pull_request:
    paths:
      - .github/workflows/reliable-messaging-m6-qs-image-handoff.yml
      - scripts/testing/m6-qs-worker-image-*.yaml
      - scripts/testing/m6-qs-worker-image-handoff.sh
      - scripts/testing/m6-qs-api-image-*.yaml
      - scripts/testing/m6-qs-api-image-schema90-handoff.sh
      - scripts/testing/m6_api_ai_result_probe/**
  workflow_dispatch:
    inputs:
      target:
        description: Published image handoff to verify
        required: true
        type: choice
        options: [api, worker]

permissions:
  contents: read
  packages: read

jobs:
  worker-image-handoff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout the reviewed harness
        uses: actions/checkout@v6
        with:
          path: harness
      - name: Checkout the current production Worker source
        uses: actions/checkout@v6
        with:
          ref: 2e106d085406a83ec7ec52f060cba926d084a410
          path: current
      - name: Checkout the retained fallback Worker source
        uses: actions/checkout@v6
        with:
          ref: 7c0c919e621d3cc93cb82dca668bd6077f7a1446
          path: fallback
      - name: Verify source identities
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C current rev-parse HEAD)" = 2e106d085406a83ec7ec52f060cba926d084a410
          test "$(git -C fallback rev-parse HEAD)" = 7c0c919e621d3cc93cb82dca668bd6077f7a1446
      - name: Build actual Worker process images without publication
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build -f current/build/docker/Dockerfile.qs-worker \
            --label org.opencontainers.image.revision=2e106d085406a83ec7ec52f060cba926d084a410 \
            --build-arg GIT_COMMIT=2e106d085406a83ec7ec52f060cba926d084a410 \
            -t qs-m6-current:2e106d08 current
          docker build -f fallback/build/docker/Dockerfile.qs-worker \
            --label org.opencontainers.image.revision=7c0c919e621d3cc93cb82dca668bd6077f7a1446 \
            --build-arg GIT_COMMIT=7c0c919e621d3cc93cb82dca668bd6077f7a1446 \
            -t qs-m6-fallback:7c0c919e fallback
      - name: Handoff fallback to current and back on disposable dependencies
        shell: bash
        run: |
          bash harness/scripts/testing/m6-qs-worker-image-handoff.sh \
            "$GITHUB_WORKSPACE/harness" "$GITHUB_WORKSPACE/current" \
            qs-m6-current:2e106d08 qs-m6-fallback:7c0c919e

  api-schema90-image-handoff:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && inputs.target == 'api')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated harness
        uses: actions/checkout@v6
        with:
          path: harness
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache-dependency-path: harness/go.sum
      - name: Login to GHCR for exact published images
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull production-tagged and fallback API images
        shell: bash
        run: |
          set -Eeuo pipefail
          current=ghcr.io/fangcunmount/qs-apiserver:672950465f887293e33690915cbf3a32416ccd09
          docker pull --platform linux/amd64 "$current"
          # Compare all decompressed layer identities to the current running serverA image.
          expected=57149f1c06b2860905a2b31cd0f4de27f8e0f7e781a6db7e95c9aeb89521b37a
          actual=$(docker image inspect "$current" --format '{{json .RootFS.Layers}}' | sha256sum | cut -d ' ' -f1)
          test "$actual" = "$expected"
          printf 'production layer identity: %s\n' "$actual"
          docker pull --platform linux/amd64 ghcr.io/fangcunmount/qs-apiserver@sha256:8d26be7461300148bb11a82c1130305f3ba8103cbbfe2c384a5c3970714dbefc
      - name: Run API schema 90/36 image handoff
        shell: bash
        run: |
          bash harness/scripts/testing/m6-qs-api-image-schema90-handoff.sh \
            "$GITHUB_WORKSPACE/harness" \
            ghcr.io/fangcunmount/qs-apiserver:672950465f887293e33690915cbf3a32416ccd09 \
            ghcr.io/fangcunmount/qs-apiserver@sha256:8d26be7461300148bb11a82c1130305f3ba8103cbbfe2c384a5c3970714dbefc

  worker-published-image-handoff:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && inputs.target == 'worker'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
    steps:
      - name: Checkout isolated harness
        uses: actions/checkout@v6
        with:
          path: harness
      - name: Checkout current production Worker source
        uses: actions/checkout@v6
        with:
          ref: 2e106d085406a83ec7ec52f060cba926d084a410
          path: current
      - name: Verify current source identity
        run: test "$(git -C current rev-parse HEAD)" = 2e106d085406a83ec7ec52f060cba926d084a410
      - name: Login to GHCR for exact published images
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Login to ACR for deployed Worker image
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}
      - name: Pull current and retained fallback Worker images
        shell: bash
        run: |
          set -Eeuo pipefail
          current=crpi-x3r4i68cpfmwtcll.cn-beijing.personal.cr.aliyuncs.com/fangcunmount/qs-worker:2e106d085406a83ec7ec52f060cba926d084a410
          fallback=ghcr.io/fangcunmount/qs-worker:m6-rollback-2b3e426a876431235d4b0717e7046b22ca2da074d9785735325500083f6a26c3
          docker pull --platform linux/amd64 "$current"
          docker pull --platform linux/amd64 "$fallback"
          # Production uses Docker's containerd image store after an ACR tarball
          # load; its reported image ID is the manifest digest, while this runner
          # reports the config digest. Compare manifest, rootfs and runtime fields.
          current_digests=$(docker image inspect "$current" --format '{{range .RepoDigests}}{{println .}}{{end}}')
          current_layers=$(docker image inspect "$current" --format '{{json .RootFS.Layers}}' | sha256sum | cut -d ' ' -f1)
          current_runtime=$(docker image inspect "$current" --format '{{.Os}}/{{.Architecture}} {{.Config.User}} {{json .Config.Entrypoint}} {{json .Config.Cmd}} {{.Config.WorkingDir}} {{json .Config.Env}}')
          printf 'Current Worker RepoDigests: %s\nRootFS layers: %s\nRuntime: %s\n' "$current_digests" "$current_layers" "$current_runtime"
          printf '%s\n' "$current_digests" |
            grep -Fqx crpi-x3r4i68cpfmwtcll.cn-beijing.personal.cr.aliyuncs.com/fangcunmount/qs-worker@sha256:5e859070739c59334fbd0de1753e9e220ae71f8b8986ab2e3c3100cdc4deae9f
          test "$current_layers" = d78fbff399dce8b39e2bbe1dde48bd92e57cb00ebdd23deb20871eb80efa6973
          test "$current_runtime" = 'linux/amd64 www ["/app/qs-worker"] ["--config=/app/configs/worker.prod.yaml"] /app ["PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin","TZ=Asia/Shanghai"]'
          fallback_digests=$(docker image inspect "$fallback" --format '{{range .RepoDigests}}{{println .}}{{end}}')
          printf 'Fallback Worker RepoDigests: %s\n' "$fallback_digests"
          printf '%s\n' "$fallback_digests" |
            grep -Fqx ghcr.io/fangcunmount/qs-worker@sha256:2b3e426a876431235d4b0717e7046b22ca2da074d9785735325500083f6a26c3
      - name: Handoff durable unknown-event audit across Worker images
        shell: bash
        run: |
          bash harness/scripts/testing/m6-qs-worker-image-handoff.sh \
            "$GITHUB_WORKSPACE/harness" "$GITHUB_WORKSPACE/current" \
            crpi-x3r4i68cpfmwtcll.cn-beijing.personal.cr.aliyuncs.com/fangcunmount/qs-worker:2e106d085406a83ec7ec52f060cba926d084a410 \
            ghcr.io/fangcunmount/qs-worker:m6-rollback-2b3e426a876431235d4b0717e7046b22ca2da074d9785735325500083f6a26c3 \
            - -
      - name: Export verified fallback Worker for controlled host staging
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP"
          docker save ghcr.io/fangcunmount/qs-worker:m6-rollback-2b3e426a876431235d4b0717e7046b22ca2da074d9785735325500083f6a26c3 |
            gzip > qs-m6-worker-fallback.tar.gz
          sha256sum qs-m6-worker-fallback.tar.gz > qs-m6-worker-fallback.tar.gz.sha256
      - name: Retain verified fallback archive for two days
        uses: actions/upload-artifact@v4
        with:
          name: qs-m6-worker-fallback-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/qs-m6-worker-fallback.tar.gz
            ${{ runner.temp }}/qs-m6-worker-fallback.tar.gz.sha256
          if-no-files-found: error
          retention-days: 2
