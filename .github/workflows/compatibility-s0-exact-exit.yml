name: Exact failed S0 material exit

on:
  workflow_dispatch:
    inputs:
      approval_json:
        description: Independently reviewed canonical fixed S0 exit authorization; real baseline and successful production receipt required
        required: true
        type: string
      approval_sha256:
        description: Exact authorization bytes plus LF SHA256
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  exit:
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64, ops]
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind real producer terminal state and successful native owner receipt before SSH
        id: proof
        uses: actions/github-script@v8
        env:
          S0_APPROVAL_JSON: ${{ inputs.approval_json }}
          S0_APPROVAL_SHA256: ${{ inputs.approval_sha256 }}
        with:
          script: |
            const fail=()=>{throw new Error('s0_actual_authorization_rejected');};
            const fs=require('fs'),crypto=require('crypto'),path=require('path');
            const digest=x=>crypto.createHash('sha256').update(x).digest('hex');
            const raw=process.env.S0_APPROVAL_JSON;
            if(context.eventName!=='workflow_dispatch'||context.ref!=='refs/heads/main'||context.repo.owner!=='FangcunMount'||context.repo.repo!=='qs-server'||process.env.GITHUB_WORKFLOW_REF!=='FangcunMount/qs-server/.github/workflows/compatibility-s0-exact-exit.yml@refs/heads/main'||!raw||raw.length>8192||!/^[0-9a-f]{64}$/.test(process.env.S0_APPROVAL_SHA256||''))fail();
            let a;try{a=JSON.parse(raw);}catch{fail();}
            const keys=['protocol','source_sha','operator_sha256','helper_sha256','pin_sha256','baseline_sha256','baseline_observing_source_sha','baseline_observing_run_id','completion_source_sha','tool_source_sha','completion_run_id','completion_operation_id','completion_job_id','completion_footer_sha256','classifier_sha256','native_stdout_sha256','workflow_scope_sha256','manifest_sha256','request_sha256','independent_acceptance_sha256','producer_workflow_id','total_seconds'].sort();
            if(!a||Object.keys(a).sort().join(',')!==keys.join(',')||JSON.stringify(Object.fromEntries(keys.map(k=>[k,a[k]])))!==raw||digest(raw+'\n')!==process.env.S0_APPROVAL_SHA256||a.source_sha!==context.sha||a.protocol!=='qs-s0-exact-physical-exit/v1')fail();
            for(const k of keys){if(k.endsWith('_sha256')&&!/^[0-9a-f]{64}$/.test(a[k]))fail();if(k.endsWith('_source_sha')&&!/^[0-9a-f]{40}$/.test(a[k]))fail();if(k.endsWith('_run_id')&&!/^[1-9][0-9]{0,19}-[1-9][0-9]{0,3}$/.test(a[k]))fail();}
            if(!Number.isSafeInteger(a.producer_workflow_id)||a.producer_workflow_id<1||!Number.isSafeInteger(a.completion_job_id)||a.completion_job_id<1||a.total_seconds!==600||a.pin_sha256!=='0d64be53c7c692e3d766c2f5495f3fe974a8185b54b0f9b981303515886f41ff')fail();
            const main=await github.rest.repos.getBranch({...context.repo,branch:'main'});
            if(main.data.commit.sha!==context.sha)fail();
            for(const [p,k] of [['scripts/database/compatibility-s0-exact-exit.py','operator_sha256'],['scripts/database/compatibility-retirement.py','helper_sha256'],['scripts/database/compatibility-host-inventory-action.py','pin_sha256']]){if(digest(fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE,p)))!==a[k])fail();}
            const producer=(await github.rest.actions.getWorkflowRun({...context.repo,run_id:38025045551})).data;
            const [run,attempt]=a.completion_run_id.split('-').map(Number);
            if(!Number.isSafeInteger(run)||!Number.isSafeInteger(attempt)||run===context.runId)fail();
            const completion=(await github.rest.actions.getWorkflowRunAttempt({...context.repo,run_id:run,attempt_number:attempt})).data;
            const workflow=(await github.rest.actions.getWorkflow({...context.repo,workflow_id:a.producer_workflow_id})).data;
            if(producer.run_attempt!==1||producer.status!=='completed'||producer.head_sha!=='ae807219ffee37c1f060f1bfca25dd7c408ef9fd'||producer.workflow_id!==workflow.id||workflow.state!=='disabled_manually'||producer.path!==workflow.path||completion.status!=='completed'||completion.conclusion!=='success'||completion.head_sha!==a.completion_source_sha||completion.path!=='.github/workflows/compatibility-retirement.yml'||completion.event!=='workflow_dispatch')fail();
            // Fresh complete queue enumeration; a capped/unknown queue is refused.
            let ended=false;
            for(let page=1;page<=10;page++){
              const rows=(await github.rest.actions.listWorkflowRuns({...context.repo,workflow_id:workflow.id,per_page:100,page})).data.workflow_runs;
              if(rows.some(r=>r.status!=='completed'))fail();
              if(rows.length<100){ended=true;break;}
            }
            if(!ended)fail();
            const jobs=(await github.rest.actions.listJobsForWorkflowRunAttempt({...context.repo,run_id:run,attempt_number:attempt,per_page:100})).data.jobs;
            const job=jobs.find(j=>j.id===a.completion_job_id);
            if(!job||job.name!=='Retire exact private lifecycle stage with workflow quarantine'||job.status!=='completed'||job.conclusion!=='success')fail();
            const classifier=(await github.rest.repos.getContent({...context.repo,path:'scripts/database/compatibility-platform-window-action.py',ref:a.completion_source_sha})).data;
            if(classifier.type!=='file'||classifier.encoding!=='base64'||digest(Buffer.from(classifier.content,'base64'))!==a.classifier_sha256)fail();
            // Octokit obtains this exact job's log from its GitHub-origin endpoint.
            // Only the unique original armored footer crosses into the operator.
            const logs=(await github.rest.actions.downloadJobLogsForWorkflowRun({...context.repo,job_id:job.id})).data;
            const text=typeof logs==='string'?logs:Buffer.from(logs).toString('utf8');
            if(Buffer.byteLength(text)>4194304)fail();
            // Armor is not plain JSON; select its exact Unicode marker pair.
            const candidates=text.split('\n').filter(l=>[...l].some(c=>[0xe100,0xe300,0xe500].includes(c.codePointAt(0))));
            if(candidates.length!==1)fail();
            const footer=candidates[0];
            const project=r=>Object.fromEntries(['id','run_attempt','status','conclusion','head_sha','event','path','workflow_id'].map(k=>[k,r[k]]));
            const proof={producer:project(producer),completion:project(completion),workflow:{id:workflow.id,path:workflow.path,state:workflow.state},active_runs:[],footer,classifier_sha256:a.classifier_sha256};
            const finalMain=(await github.rest.repos.getBranch({...context.repo,branch:'main'})).data;
            const finalWorkflow=(await github.rest.actions.getWorkflow({...context.repo,workflow_id:a.producer_workflow_id})).data;
            if(finalMain.commit.sha!==context.sha||finalWorkflow.state!=='disabled_manually'||finalWorkflow.path!==workflow.path)fail();
            const base=fs.mkdtempSync(path.join(process.env.RUNNER_TEMP,'s0-exit-authority-'));fs.chmodSync(base,0o700);
            const approval=path.join(base,'approval.json'),out=path.join(base,'authority.json');
            fs.writeFileSync(approval,raw+'\n',{mode:0o600,flag:'wx'});fs.writeFileSync(out,JSON.stringify(proof)+'\n',{mode:0o600,flag:'wx'});
            core.setOutput('approval',approval);core.setOutput('proof',out);
      - name: Exact S0 physical exit through the original pinned A route
        env:
          HOST_INVENTORY_SSH_HOST: ${{ vars.SVRA_HOST }}
          HOST_INVENTORY_SSH_USERNAME: ${{ vars.SVRA_USERNAME }}
          HOST_INVENTORY_SSH_PORT: ${{ vars.SVRA_SSH_PORT || 22 }}
          HOST_INVENTORY_SSH_KEY: ${{ secrets.SVRA_SSH_KEY }}
          HOST_INVENTORY_SSH_FINGERPRINT: ${{ vars.SVRA_SSH_FINGERPRINT }}
          S0_APPROVAL_PATH: ${{ steps.proof.outputs.approval }}
          S0_PROOF_PATH: ${{ steps.proof.outputs.proof }}
          S0_APPROVAL_SHA256: ${{ inputs.approval_sha256 }}
        run: python3 scripts/database/compatibility-s0-exact-exit.py --repo "$GITHUB_WORKSPACE" --approval "$S0_APPROVAL_PATH" --proof "$S0_PROOF_PATH" --approval-sha256 "$S0_APPROVAL_SHA256"
