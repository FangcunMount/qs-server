name: Exact Compatibility Retirement

# A-stage preparation observes sources or explicitly performs prewindow evidence
# CAS. Neither is a retirement verdict. DDL/restore/release/purge stay
# fail-closed until their independent, actual preparation gates exist.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Exact four-object lifecycle stage'
        required: true
        type: choice
        options: [prepare, apply, verify, recover, purge]
      database:
        description: 'This workflow always binds three MySQL tables and one Mongo collection'
        required: true
        type: choice
        options: [mysql-and-mongodb]
      approved_source_sha:
        description: 'Exact approved current main source SHA'
        required: true
        type: string
      operation_id:
        description: 'Approved private operation ID (numeric run-attempt form)'
        required: true
        type: string
      manifest_sha256:
        description: 'Non-prepare stages: SHA256 of the immutable private manifest'
        required: false
        default: ''
        type: string
      inventory_request_sha256:
        description: 'Prepare bounds/inventory only: independently approved private request SHA256'
        required: false
        default: ''
        type: string
      prepare_mode:
        description: 'Observe sources, persist prewindow historical evidence, or diagnose an existing boundary report'
        required: false
        type: choice
        options: [identity, bootstrap-bounds, bounds, bootstrap-inventory, inventory, bootstrap-history, bootstrap-history-metadata, bootstrap-history-parent, bootstrap-ai-bounds, bootstrap-ai-verify, historical-evidence-write, historical-ai-bounds, report-diagnostic, lifecycle, prepare-facts, host-writer-scope, db-writer-census, window-tool]
        default: inventory
      identity_request_sha256:
        description: 'Prepare identity only: independently computed canonical request SHA256'
        required: false
        default: ''
        type: string
      bootstrap_approval_json:
        description: 'Canonical public bootstrap, diagnostic or window-tool approval; no credentials or BSON tokens'
        required: false
        default: ''
        type: string
      bootstrap_approval_sha256:
        description: 'Bootstrap/report-diagnostic: independently approved canonical JSON plus LF SHA256'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

# Same lock as CD and every non-metadata db-ops operation. B deployment must
# run directly inside this run; dispatching CD and waiting would deadlock.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate approved main and exact stage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tool_source_sha: ${{ steps.approved-tool.outputs.tool_source_sha }}
    steps:
      - name: Reject unknown inputs and stale source before production credentials
        id: approved-tool
        uses: actions/github-script@v8
        with:
          script: |
            const raw = context.payload.inputs ?? {};
            const expectedKeys = ['operation', 'database', 'approved_source_sha', 'operation_id', 'manifest_sha256', 'inventory_request_sha256', 'prepare_mode', 'identity_request_sha256', 'bootstrap_approval_json', 'bootstrap_approval_sha256'].sort();
            if (Object.keys(raw).some(key => !expectedKeys.includes(key))) {
              throw new Error('compatibility_retirement_unknown_input');
            }
            // GitHub omits optional empty strings in workflow_dispatch payloads.
            // Only declared optional inputs have defaults; required fields and
            // supplied values still pass the complete strict stage validation.
            const input = {manifest_sha256: '', inventory_request_sha256: '', prepare_mode: 'inventory', identity_request_sha256: '', bootstrap_approval_json: '', bootstrap_approval_sha256: '', ...raw};
            const keys = Object.keys(input).sort();
            const windowTool = input.prepare_mode === 'window-tool';
            const diagnostic = input.prepare_mode === 'report-diagnostic';
            const bootstrap = ['bootstrap-bounds', 'bootstrap-inventory', 'bootstrap-history', 'bootstrap-history-metadata', 'bootstrap-history-parent', 'bootstrap-ai-bounds', 'bootstrap-ai-verify', 'historical-evidence-write', 'historical-ai-bounds'].includes(input.prepare_mode);
            const prepareFacts = input.prepare_mode === 'prepare-facts';
            const hostScope = input.prepare_mode === 'host-writer-scope';
            const dbCensus = input.prepare_mode === 'db-writer-census';
            const descriptor = bootstrap || diagnostic || prepareFacts || hostScope || dbCensus || windowTool;
            if (JSON.stringify(keys) !== JSON.stringify(expectedKeys) ||
                !['prepare', 'apply', 'verify', 'recover', 'purge'].includes(input.operation) ||
                input.database !== 'mysql-and-mongodb' ||
                !/^[0-9a-f]{40}$/.test(input.approved_source_sha) ||
                !/^[0-9]{1,20}-[0-9]{1,4}$/.test(input.operation_id) ||
                !['identity', 'bounds', 'inventory', 'bootstrap-bounds', 'bootstrap-inventory', 'bootstrap-history', 'bootstrap-history-metadata', 'bootstrap-history-parent', 'bootstrap-ai-bounds', 'bootstrap-ai-verify', 'historical-evidence-write', 'historical-ai-bounds', 'report-diagnostic', 'lifecycle', 'prepare-facts', 'host-writer-scope', 'db-writer-census', 'window-tool'].includes(input.prepare_mode) ||
                (windowTool
                  ? (typeof input.bootstrap_approval_json !== 'string' || !/^[\x20-\x7e]{1,4096}$/.test(input.bootstrap_approval_json) || !/^[0-9a-f]{64}$/.test(input.bootstrap_approval_sha256))
                  : descriptor
                  ? (input.operation !== 'prepare' || input.manifest_sha256 !== '' || input.inventory_request_sha256 !== '' || input.identity_request_sha256 !== '' || typeof input.bootstrap_approval_json !== 'string' || !/^[\x20-\x7e]{1,4096}$/.test(input.bootstrap_approval_json) || !/^[0-9a-f]{64}$/.test(input.bootstrap_approval_sha256))
                  : (input.bootstrap_approval_json !== '' || input.bootstrap_approval_sha256 !== '')) ||
                (windowTool
                  ? (!/^[0-9a-f]{64}$/.test(input.manifest_sha256) || !/^[0-9a-f]{64}$/.test(input.inventory_request_sha256) || input.identity_request_sha256 !== '')
                  : input.prepare_mode === 'lifecycle'
                  ? (input.operation !== 'prepare' || !/^[0-9a-f]{64}$/.test(input.manifest_sha256) || !/^[0-9a-f]{64}$/.test(input.inventory_request_sha256) || input.identity_request_sha256 !== '')
                  : (input.operation === 'prepare'
                  ? (input.manifest_sha256 !== '' || (!descriptor && (input.prepare_mode === 'identity'
                      ? (!/^[0-9a-f]{64}$/.test(input.identity_request_sha256) || input.inventory_request_sha256 !== '')
                      : (!/^[0-9a-f]{64}$/.test(input.inventory_request_sha256) || input.identity_request_sha256 !== ''))))
                  : (!/^[0-9a-f]{64}$/.test(input.manifest_sha256) || input.inventory_request_sha256 !== '' || input.identity_request_sha256 !== '' || input.prepare_mode !== 'inventory'))) ||
                context.ref !== 'refs/heads/main' || input.approved_source_sha !== context.sha) {
              throw new Error('compatibility_retirement_input_or_source_rejected');
            }
            let toolSource = context.sha;
            if (windowTool) {
              const reject = () => {throw new Error('compatibility_retirement_window_tool_approval_rejected');};
              const object = v => v !== null && typeof v === 'object' && !Array.isArray(v);
              const exact = (v, keys) => object(v) && JSON.stringify(Object.keys(v).sort()) === JSON.stringify(keys.slice().sort());
              const canonical = v => object(v) ? Object.fromEntries(Object.keys(v).sort().map(k => [k, canonical(v[k])])) : v;
              const hash = v => typeof v === 'string' && /^[0-9a-f]{64}$/.test(v);
              const sha = v => typeof v === 'string' && /^[0-9a-f]{40}$/.test(v);
              let a;
              try {a = JSON.parse(input.bootstrap_approval_json);} catch {reject();}
              const prepare = input.operation === 'prepare';
              const keys = ['format_version','kind','dispatcher_source_sha','tool_source_sha','original_source_sha','operation_id','original_run_id','stage','target_hash','manifest_sha256','request_template_sha256','tool_binary_sha256','b_image_id','b_program_sha256'];
              const preparedServices = prepare && Object.hasOwn(a ?? {}, 'local_descriptor_sha256');
              if (!exact(a, prepare ? [...keys,...(preparedServices ? ['local_descriptor_sha256'] : [])] : [...keys,'workflow_scope']) ||
                  (preparedServices && !hash(a.local_descriptor_sha256)) ||
                  a.format_version !== 1 || a.kind !== 'independent_compatibility_window_tool_approval' || a.dispatcher_source_sha !== context.sha ||
                  !sha(a.tool_source_sha) || (prepare && a.tool_source_sha !== context.sha) || !sha(a.original_source_sha) || a.operation_id !== input.operation_id ||
                  typeof a.original_run_id !== 'string' || !/^[1-9][0-9]{0,19}-[1-9][0-9]{0,3}$/.test(a.original_run_id) || a.original_run_id === String(context.runId)+'-'+String(process.env.GITHUB_RUN_ATTEMPT) ||
                  a.stage !== input.operation || a.target_hash !== '4e09444409d1cfab3c9df383ed80a0999419fcbbd2f4e80d2e5dac1cf7dfcfb8' ||
                  a.manifest_sha256 !== input.manifest_sha256 || a.request_template_sha256 !== input.inventory_request_sha256 ||
                  !exact(a.tool_binary_sha256,['amd64','arm64']) || !hash(a.tool_binary_sha256.amd64) || !hash(a.tool_binary_sha256.arm64) ||
                  (!/^sha256:[0-9a-f]{64}$/.test(a.b_image_id ?? '') || !hash(a.b_program_sha256))) {reject();}
              if (!prepare) {
                const p = a.workflow_scope;
                if (!exact(p,['format_version','kind','dispatcher_source_sha','tool_source_sha','original_source_sha','operation_id','original_run_id','manifest_sha256','repository_id','owner_id','actor_id','workflow_id','workflow_ids','job_name','runner_id']) || p.format_version !== 1 || p.kind !== 'approved_runner_workflow_quarantine_scope' ||
                    ['dispatcher_source_sha','tool_source_sha','original_source_sha','operation_id','original_run_id','manifest_sha256'].some(k => p[k] !== a[k]) ||
                    ['repository_id','owner_id','actor_id'].some(k => typeof p[k] !== 'string' || !/^[1-9][0-9]{0,19}$/.test(p[k])) ||
                    !Number.isSafeInteger(p.workflow_id) || p.workflow_id <= 0 || !Number.isSafeInteger(p.runner_id) || p.runner_id <= 0 ||
                    !Array.isArray(p.workflow_ids) || p.workflow_ids.length < 1 || p.workflow_ids.length > 1000 || p.workflow_ids.some((v,i,vs) => !Number.isSafeInteger(v) || v <= 0 || (i > 0 && v <= vs[i-1])) || !p.workflow_ids.includes(p.workflow_id) ||
                    p.job_name !== 'Retire exact private lifecycle stage with workflow quarantine') {reject();}
              }
              const line = JSON.stringify(canonical(a));
              if (line !== input.bootstrap_approval_json || require('crypto').createHash('sha256').update(line+'\n','ascii').digest('hex') !== input.bootstrap_approval_sha256) {reject();}
              const selected = await github.rest.repos.getCommit({...context.repo, ref: a.tool_source_sha});
              if (selected.data.sha !== a.tool_source_sha) {reject();}
              const response = await github.rest.actions.listWorkflowRuns({...context.repo, workflow_id: 'ci.yml', head_sha: a.tool_source_sha, per_page: 100});
              const runs = response.data.workflow_runs.filter(run => run.head_sha === a.tool_source_sha && run.path === '.github/workflows/ci.yml' && ['push','pull_request'].includes(run.event));
              runs.sort((a,b) => b.id-a.id);
              if (!runs.length || runs[0].status !== 'completed' || runs[0].conclusion !== 'success') {reject();}
              toolSource = a.tool_source_sha;
              core.setOutput('tool_source_sha', toolSource);
            }
            if (dbCensus) {
              const reject=()=>{throw new Error('compatibility_retirement_db_census_descriptor_rejected');};
              const object=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);
              const exact=(v,keys)=>object(v)&&JSON.stringify(Object.keys(v).sort())===JSON.stringify(keys.slice().sort());
              const canonical=v=>object(v)?Object.fromEntries(Object.keys(v).sort().map(k=>[k,canonical(v[k])])):v;
              const hash=v=>typeof v==='string'&&/^[0-9a-f]{64}$/.test(v);
              const sha=v=>typeof v==='string'&&/^[0-9a-f]{40}$/.test(v);
              let v;try {v=JSON.parse(input.bootstrap_approval_json);}catch {reject();}
              if (!exact(v,['format_version','kind','prepare_mode','source_sha','operation_id','target_hash','database_scope','identity_report'])||
                  v.format_version!==1||v.kind!=='readonly_db_writer_census_descriptor'||v.prepare_mode!=='db-writer-census'||v.source_sha!==context.sha||v.operation_id!==input.operation_id||v.database_scope!=='mysql-and-mongodb'||v.target_hash!=='4e09444409d1cfab3c9df383ed80a0999419fcbbd2f4e80d2e5dac1cf7dfcfb8'||
                  !exact(v.identity_report,['operation_id','run_id','source_sha','sha256','request_sha256'])||v.identity_report.operation_id!==input.operation_id||!sha(v.identity_report.source_sha)||!hash(v.identity_report.sha256)||!hash(v.identity_report.request_sha256)||typeof v.identity_report.run_id!=='string'||!/^[1-9][0-9]{0,19}-[1-9][0-9]{0,3}$/.test(v.identity_report.run_id)||v.identity_report.run_id===String(context.runId)+'-'+String(process.env.GITHUB_RUN_ATTEMPT)) {reject();}
              const line=JSON.stringify(canonical(v));if (line!==input.bootstrap_approval_json||require('crypto').createHash('sha256').update(line+'\n','ascii').digest('hex')!==input.bootstrap_approval_sha256) {reject();}
            }
            if (hostScope) {
              const reject = () => {throw new Error('compatibility_retirement_host_scope_descriptor_rejected');};
              const object = v => v !== null && typeof v === 'object' && !Array.isArray(v);
              const exact = (v, keys) => object(v) && JSON.stringify(Object.keys(v).sort()) === JSON.stringify(keys.slice().sort());
              let v;
              try {v = JSON.parse(input.bootstrap_approval_json);} catch {reject();}
              if (!exact(v,['format_version','kind','prepare_mode','source_sha','operation_id','target_hash','host_role']) ||
                  v.format_version !== 1 || v.kind !== 'readonly_host_writer_scope_descriptor' || v.prepare_mode !== 'host-writer-scope' ||
                  v.source_sha !== context.sha || v.operation_id !== input.operation_id || v.host_role !== 'server_a' ||
                  v.target_hash !== '4e09444409d1cfab3c9df383ed80a0999419fcbbd2f4e80d2e5dac1cf7dfcfb8') {reject();}
              const line = JSON.stringify(Object.fromEntries(Object.keys(v).sort().map(k=>[k,v[k]])));
              if (line !== input.bootstrap_approval_json || require('crypto').createHash('sha256').update(line+'\n','ascii').digest('hex') !== input.bootstrap_approval_sha256) {reject();}
              // A fixed root observer is read only and cannot approve this catalog.
            }
            if (prepareFacts) {
              const reject = () => {throw new Error('compatibility_retirement_prepare_facts_descriptor_rejected');};
              const object = v => v !== null && typeof v === 'object' && !Array.isArray(v);
              const exact = (v, keys) => object(v) && JSON.stringify(Object.keys(v).sort()) === JSON.stringify(keys.slice().sort());
              const canonical = v => Array.isArray(v) ? v.map(canonical) : object(v) ? Object.fromEntries(Object.keys(v).sort().map(k => [k, canonical(v[k])])) : v;
              let v;
              try {v = JSON.parse(input.bootstrap_approval_json);} catch {reject();}
              if (!exact(v, ['format_version','kind','prepare_mode','source_sha','operation_id','target_hash','database_scope','inventory_report','restore_engines','archive_directory']) ||
                  v.format_version !== 1 || v.kind !== 'readonly_prepare_facts_observation_descriptor' || v.prepare_mode !== 'prepare-facts' ||
                  v.source_sha !== input.approved_source_sha || v.operation_id !== input.operation_id ||
                  v.target_hash !== '4e09444409d1cfab3c9df383ed80a0999419fcbbd2f4e80d2e5dac1cf7dfcfb8' || v.database_scope !== 'mysql-and-mongodb') {reject();}
              const p = v.inventory_report, e = v.restore_engines;
              const currentRun = String(context.runId)+'-'+String(process.env.GITHUB_RUN_ATTEMPT);
              if (!exact(p, ['operation_id','run_id','source_sha','sha256','request_sha256']) || p.operation_id !== v.operation_id ||
                  typeof p.run_id !== 'string' || !/^[0-9]{1,20}-[0-9]{1,4}$/.test(p.run_id) || p.run_id === currentRun ||
                  typeof p.source_sha !== 'string' || !/^[0-9a-f]{40}$/.test(p.source_sha) ||
                  typeof p.sha256 !== 'string' || !/^[0-9a-f]{64}$/.test(p.sha256) ||
                  typeof p.request_sha256 !== 'string' || !/^[0-9a-f]{64}$/.test(p.request_sha256) ||
                  !exact(e, ['mysql_image_id','mongodb_image_id','architecture']) ||
                  typeof e.mysql_image_id !== 'string' || !/^sha256:[0-9a-f]{64}$/.test(e.mysql_image_id) ||
                  typeof e.mongodb_image_id !== 'string' || !/^sha256:[0-9a-f]{64}$/.test(e.mongodb_image_id) ||
                  e.mysql_image_id === e.mongodb_image_id || !['amd64','arm64'].includes(e.architecture)) {reject();}
              const root = '/opt/backups/qs-server/compatibility-retirement/'+v.operation_id+'/';
              const path = v.archive_directory;
              if (typeof path !== 'string' || path.length > 1024 || !path.startsWith(root) || path.length <= root.length ||
                  /[\u0000\r\n]/.test(path) || path.endsWith('/') || path.split('/').some((part,i) => i > 0 && (!part || part === '.' || part === '..')) ||
                  path === root+'inventory-'+p.run_id || path.startsWith(root+'inventory-'+p.run_id+'/')) {reject();}
              const line = JSON.stringify(canonical(v));
              if (line !== input.bootstrap_approval_json || require('crypto').createHash('sha256').update(line+'\n','ascii').digest('hex') !== input.bootstrap_approval_sha256) {reject();}
              // Returned BSON/image/capacity facts require separate review. This
              // descriptor cannot approve a manifest, backup or DROP capability.
            }
            if (diagnostic) {
              const reject = () => {throw new Error('compatibility_retirement_report_diagnostic_approval_rejected');};
              const object = value => value !== null && typeof value === 'object' && !Array.isArray(value);
              const exact = (value, keys) => object(value) && JSON.stringify(Object.keys(value).sort()) === JSON.stringify(keys.slice().sort());
              const canonical = value => Array.isArray(value) ? value.map(canonical) : object(value) ? Object.fromEntries(Object.keys(value).sort().map(key => [key, canonical(value[key])])) : value;
              let approval;
              try {approval = JSON.parse(input.bootstrap_approval_json);} catch {reject();}
              const failedCleanup = object(approval) && approval.kind === 'cleanup_only_failed_inventory_baseline_approval';
              const inventoryReport = failedCleanup || (object(approval) && approval.kind === 'readonly_existing_inventory_report_approval');
              const referenceKey = inventoryReport ? 'inventory_report' : 'boundary_report';
              if (!exact(approval, ['format_version','kind','prepare_mode','source_sha','operation_id','target_hash','database_scope',referenceKey]) ||
                  approval.format_version !== 1 || approval.kind !== (failedCleanup ? 'cleanup_only_failed_inventory_baseline_approval' : inventoryReport ? 'readonly_existing_inventory_report_approval' : 'readonly_existing_boundary_report_approval') || approval.prepare_mode !== 'report-diagnostic' ||
                  approval.source_sha !== input.approved_source_sha || approval.operation_id !== input.operation_id ||
                  approval.target_hash !== '4e09444409d1cfab3c9df383ed80a0999419fcbbd2f4e80d2e5dac1cf7dfcfb8' || approval.database_scope !== 'mysql-and-mongodb') {reject();}
              const report = approval[referenceKey];
              const currentRun = String(context.runId)+'-'+String(process.env.GITHUB_RUN_ATTEMPT);
              if (!exact(report, ['run_id','source_sha','sha256','request_sha256']) || typeof report.run_id !== 'string' || !/^[0-9]{1,20}-[0-9]{1,4}$/.test(report.run_id) ||
                  typeof report.source_sha !== 'string' || !/^[0-9a-f]{40}$/.test(report.source_sha) ||
                  typeof report.sha256 !== 'string' || !/^[0-9a-f]{64}$/.test(report.sha256) ||
                  typeof report.request_sha256 !== 'string' || !/^[0-9a-f]{64}$/.test(report.request_sha256) ||
                  !/^[0-9]{1,20}-[0-9]{1,4}$/.test(currentRun) || report.run_id === currentRun) {reject();}
              if (failedCleanup && (approval.operation_id !== '38019009876-1' || report.run_id !== '38025045551-1' || report.source_sha !== 'ae807219ffee37c1f060f1bfca25dd7c408ef9fd' || report.request_sha256 !== 'e5d29b674698dbfe4d8f85932fad0d8bba445e3b6823028cd78db4a150f16962' || report.sha256 !== '3983779a5fab8be6e027390491a3c9215cdf1270c03316ed8ebcc614793777c8')) {reject();}
              const line = JSON.stringify(canonical(approval));
              if (line !== input.bootstrap_approval_json || require('crypto').createHash('sha256').update(line+'\n','ascii').digest('hex') !== input.bootstrap_approval_sha256) {reject();}
            }
            if (bootstrap && !['bootstrap-history', 'bootstrap-history-metadata', 'bootstrap-history-parent', 'bootstrap-ai-bounds', 'bootstrap-ai-verify', 'historical-evidence-write', 'historical-ai-bounds'].includes(input.prepare_mode)) {
              const reject = () => {throw new Error('compatibility_retirement_bootstrap_approval_rejected');};
              const object = value => value !== null && typeof value === 'object' && !Array.isArray(value);
              const exact = (value, keys) => object(value) && JSON.stringify(Object.keys(value).sort()) === JSON.stringify(keys.slice().sort());
              const canonical = value => Array.isArray(value) ? value.map(canonical) : object(value) ? Object.fromEntries(Object.keys(value).sort().map(key => [key, canonical(value[key])])) : value;
              let approval;
              try {approval = JSON.parse(input.bootstrap_approval_json);} catch {reject();}
              const core = ['format_version', 'kind', 'prepare_mode', 'operation_id', 'source_sha', 'target_hash', 'database_scope', 'identity_report', 'identity_hashes', 'expected_migrations', 'limits'];
              const namespace = Object.prototype.hasOwnProperty.call(approval ?? {}, 'mongodb_namespace_anchor');
              const keys = input.prepare_mode === 'bootstrap-inventory' ? [...core, 'boundary_report'] : core;
              if (!exact(approval, namespace ? [...keys, 'mongodb_namespace_anchor'] : keys) ||
                  approval.format_version !== 1 || approval.kind !== 'readonly_request_bootstrap_approval' || approval.prepare_mode !== input.prepare_mode ||
                  approval.operation_id !== input.operation_id || approval.source_sha !== input.approved_source_sha ||
                  approval.target_hash !== '4e09444409d1cfab3c9df383ed80a0999419fcbbd2f4e80d2e5dac1cf7dfcfb8' || approval.database_scope !== 'mysql-and-mongodb' ||
                  !exact(approval.identity_hashes, ['mysql', 'mongodb']) || !exact(approval.expected_migrations, ['mysql', 'mongodb']) ||
                  approval.identity_hashes.mysql === approval.identity_hashes.mongodb) {reject();}
              for (const database of ['mysql', 'mongodb']) {
                if (typeof approval.identity_hashes[database] !== 'string' || !/^[0-9a-f]{64}$/.test(approval.identity_hashes[database]) || !Number.isSafeInteger(approval.expected_migrations[database]) || approval.expected_migrations[database] < 1) {reject();}
              }
              if (namespace) {
                const anchor = approval.mongodb_namespace_anchor;
                if (exact(anchor, ['kind', 'hash'])) {
                  if (anchor.kind !== 'selected_namespace_kept_uuids_v1' || typeof anchor.hash !== 'string' || !/^[0-9a-f]{64}$/.test(anchor.hash)) {reject();}
                } else {
                  const names = ['answersheets', 'interpret_report_artifacts', 'interpretation_runs', 'report_generations'];
                  if (!exact(anchor, ['kind', 'hash', 'endpoint_sha256', 'database', 'replica_set_name', 'collections']) || anchor.kind !== 'selected_namespace_kept_uuids_v1' || !/^[0-9a-f]{64}$/.test(anchor.hash ?? '') || !/^[0-9a-f]{64}$/.test(anchor.endpoint_sha256 ?? '') || !Array.isArray(anchor.collections) || anchor.collections.length !== names.length) {reject();}
                  for (const value of [anchor.database, anchor.replica_set_name]) {
                    if (typeof value !== 'string' || !value || Buffer.byteLength(value, 'utf8') > 128 || /[\u0000\r\n]/.test(value)) {reject();}
                  }
                  const parts = [anchor.kind, anchor.endpoint_sha256, anchor.database, anchor.replica_set_name];
                  const seen = new Set();
                  for (let i = 0; i < names.length; i++) {
                    const item = anchor.collections[i];
                    if (!exact(item, ['name', 'present', 'uuid']) || item.name !== names[i] || typeof item.present !== 'boolean' || typeof item.uuid !== 'string') {reject();}
                    if (item.present) {
                      if (!/^[0-9a-f]{32}$/.test(item.uuid) || item.uuid === '0'.repeat(32) || seen.has(item.uuid)) {reject();}
                      seen.add(item.uuid);
                    } else if (item.uuid !== '') {reject();}
                    parts.push(item.name, item.present ? 'present' : 'absent', item.uuid);
                  }
