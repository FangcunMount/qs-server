            }
            trap cleanup_tools EXIT
            tar -xzf "$archive" -C "$tool_dir" --no-same-owner compatibility-retirement.py compatibility-history-prepare.py compatibility-retirement-entrypoints.json receipt-transport.py
            chmod 0700 "$tool_dir"
            chmod 0600 "$tool_dir/compatibility-retirement.py" "$tool_dir/compatibility-history-prepare.py" "$tool_dir/compatibility-retirement-entrypoints.json" "$tool_dir/receipt-transport.py"
            python3 -B "$tool_dir/compatibility-retirement.py" \
