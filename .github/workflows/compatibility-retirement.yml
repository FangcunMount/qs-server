    permissions:
      contents: read
      packages: read
    steps:
      - name: Validate pinned production SSH binding
        env:
          RETIREMENT_SSH_HOST: ${{ vars.SVRA_HOST }}
          RETIREMENT_SSH_USER: ${{ vars.SVRA_USERNAME }}
          RETIREMENT_SSH_PORT: ${{ vars.SVRA_SSH_PORT || 22 }}
          RETIREMENT_SSH_KEY: ${{ secrets.SVRA_SSH_KEY }}
          RETIREMENT_SSH_FINGERPRINT: ${{ vars.SVRA_SSH_FINGERPRINT }}
        run: |
          set -Eeuo pipefail
          : "${RETIREMENT_SSH_HOST:?production_host_missing}"
          : "${RETIREMENT_SSH_USER:?production_user_missing}"
          : "${RETIREMENT_SSH_KEY:?production_key_missing}"
          : "${RETIREMENT_SSH_FINGERPRINT:?production_fingerprint_missing}"
