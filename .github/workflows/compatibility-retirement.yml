          key: ${{ secrets.SVRA_SSH_KEY }}
          port: ${{ vars.SVRA_SSH_PORT || 22 }}
          fingerprint: ${{ vars.SVRA_SSH_FINGERPRINT }}
          command_timeout: 20m
          envs: RETIREMENT_OPERATION,RETIREMENT_OPERATION_ID,RETIREMENT_PREPARE_MODE,RETIREMENT_BOOTSTRAP_APPROVAL_JSON,RETIREMENT_BOOTSTRAP_APPROVAL_SHA256,RETIREMENT_APPROVED_SHA,RETIREMENT_ACTUAL_SHA,RETIREMENT_RUN_ID,RETIREMENT_PACKAGE_SHA256
          script: |
            set -Eeuo pipefail
            umask 077
            [[ "$RETIREMENT_RUN_ID" =~ ^[0-9]{1,20}-[0-9]{1,4}$ ]] || exit 1
            [[ "$RETIREMENT_PACKAGE_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
            [[ "$RETIREMENT_OPERATION" == "prepare" && "$RETIREMENT_PREPARE_MODE" == "bootstrap-history-parent" ]] || exit 1
            archive="/tmp/qs-compatibility-retirement-${RETIREMENT_RUN_ID}.tar.gz"
            [[ "$(sha256sum "$archive" | awk '{print $1}')" == "$RETIREMENT_PACKAGE_SHA256" ]] || exit 1
            tool_dir=$(mktemp -d /tmp/qs-compatibility-retirement.XXXXXX)
            cleanup_tools() {
              rm -f -- "$tool_dir/compatibility-retirement.py" "$tool_dir/compatibility-history-prepare.py" "$tool_dir/compatibility-history-parent.py" "$tool_dir/compatibility-retirement-entrypoints.json" "$tool_dir/receipt-transport.py" "$archive"
              rmdir -- "$tool_dir"
            }
            trap cleanup_tools EXIT
            tar -xzf "$archive" -C "$tool_dir" --no-same-owner compatibility-retirement.py compatibility-history-prepare.py compatibility-history-parent.py compatibility-retirement-entrypoints.json receipt-transport.py
            chmod 0700 "$tool_dir"
            chmod 0600 "$tool_dir/compatibility-retirement.py" "$tool_dir/compatibility-history-prepare.py" "$tool_dir/compatibility-history-parent.py" "$tool_dir/compatibility-retirement-entrypoints.json" "$tool_dir/receipt-transport.py"
            python3 -B "$tool_dir/compatibility-retirement.py" \
              --operation "$RETIREMENT_OPERATION" \
              --operation-id "$RETIREMENT_OPERATION_ID" \
              --approved-source-sha "$RETIREMENT_APPROVED_SHA" \
              --actual-source-sha "$RETIREMENT_ACTUAL_SHA" \
              --run-id "$RETIREMENT_RUN_ID" \
              --bootstrap-approval-json "$RETIREMENT_BOOTSTRAP_APPROVAL_JSON" \
              --bootstrap-approval-hash "$RETIREMENT_BOOTSTRAP_APPROVAL_SHA256" \
              --prepare-mode "$RETIREMENT_PREPARE_MODE"
      - name: Invoke approved independent window tool on the still-A database
        if: inputs.prepare_mode == 'window-tool'
        uses: appleboy/ssh-action@v1.2.2
        env:
          SUDO_PASSWORD: ${{ secrets.SVRA_SUDO_PASSWORD }}
          RETIREMENT_OPERATION: ${{ inputs.operation }}
          RETIREMENT_OPERATION_ID: ${{ inputs.operation_id }}
          RETIREMENT_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          RETIREMENT_TEMPLATE_SHA256: ${{ inputs.inventory_request_sha256 }}
          RETIREMENT_DISPATCHER_SHA: ${{ github.sha }}
          RETIREMENT_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          RETIREMENT_BOOTSTRAP_APPROVAL_JSON: ${{ inputs.bootstrap_approval_json }}
          RETIREMENT_BOOTSTRAP_APPROVAL_SHA256: ${{ inputs.bootstrap_approval_sha256 }}
          RETIREMENT_PACKAGE_SHA256: ${{ steps.package.outputs.sha256 }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT || 3306 }}
          MYSQL_USERNAME: ${{ secrets.MYSQL_METADATA_ADMIN_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_METADATA_ADMIN_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE != '' && secrets.MYSQL_DATABASE || secrets.MYSQL_DBNAME }}
          MONGODB_HOST: ${{ secrets.MONGODB_HOST }}
          MONGODB_PORT: ${{ secrets.MONGODB_PORT || 27017 }}
          MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
          MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
          MONGODB_DBNAME: ${{ secrets.MONGODB_DBNAME }}
          MONGODB_METADATA_ADMIN_USERNAME: ${{ secrets.MONGODB_METADATA_ADMIN_USERNAME }}
          MONGODB_METADATA_ADMIN_PASSWORD: ${{ secrets.MONGODB_METADATA_ADMIN_PASSWORD }}
        with:
          host: ${{ vars.SVRA_HOST }}
          username: ${{ vars.SVRA_USERNAME }}
          key: ${{ secrets.SVRA_SSH_KEY }}
          port: ${{ vars.SVRA_SSH_PORT || 22 }}
          fingerprint: ${{ vars.SVRA_SSH_FINGERPRINT }}
          command_timeout: 115m
          envs: RETIREMENT_OPERATION,RETIREMENT_OPERATION_ID,RETIREMENT_MANIFEST_SHA256,RETIREMENT_TEMPLATE_SHA256,RETIREMENT_DISPATCHER_SHA,RETIREMENT_RUN_ID,RETIREMENT_BOOTSTRAP_APPROVAL_JSON,RETIREMENT_BOOTSTRAP_APPROVAL_SHA256,RETIREMENT_PACKAGE_SHA256,MYSQL_HOST,MYSQL_PORT,MYSQL_USERNAME,MYSQL_PASSWORD,MYSQL_DATABASE,MONGODB_HOST,MONGODB_PORT,MONGODB_USERNAME,MONGODB_PASSWORD,MONGODB_DBNAME,MONGODB_METADATA_ADMIN_USERNAME,MONGODB_METADATA_ADMIN_PASSWORD,SUDO_PASSWORD
          script: |
            set -Eeuo pipefail
            umask 077
            [[ "$RETIREMENT_RUN_ID" =~ ^[1-9][0-9]{0,19}-[1-9][0-9]{0,3}$ ]] || exit 1
            [[ "$RETIREMENT_PACKAGE_SHA256" =~ ^[0-9a-f]{64}$ ]] || exit 1
            archive="/tmp/qs-compatibility-retirement-${RETIREMENT_RUN_ID}.tar.gz"
            [[ "$(sha256sum "$archive" | awk '{print $1}')" == "$RETIREMENT_PACKAGE_SHA256" ]] || exit 1
            chmod 0600 "$archive"
            tool_dir=$(mktemp -d /tmp/qs-independent-window-tool.XXXXXX)
            # Unknown work is retained in the exact batch intent; purge owns it.
            tar -xzf "$archive" -C "$tool_dir" --no-same-owner compatibility-window-tool.py receipt-transport.py
            chmod 0700 "$tool_dir"
            chmod 0600 "$tool_dir/compatibility-window-tool.py" "$tool_dir/receipt-transport.py"
            python3 -B "$tool_dir/compatibility-window-tool.py" \
              --operation "$RETIREMENT_OPERATION" --operation-id "$RETIREMENT_OPERATION_ID" \
              --run-id "$RETIREMENT_RUN_ID" --dispatcher-sha "$RETIREMENT_DISPATCHER_SHA" \
              --manifest-hash "$RETIREMENT_MANIFEST_SHA256" --template-hash "$RETIREMENT_TEMPLATE_SHA256"

  controlled-window-mutation:
    name: Retire exact private lifecycle stage with workflow quarantine
    if: inputs.prepare_mode == 'window-tool' && inputs.operation != 'prepare'
    needs: validate
    permissions:
      contents: read
      actions: write
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64, ops]
    environment: production
    timeout-minutes: 115
    steps:
      - name: Checkout exact dispatcher source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: dispatcher
          persist-credentials: false
      - name: Checkout approved standalone B tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tool_source_sha }}
          path: standalone-tool
          persist-credentials: false
      - name: Set up exact toolchain for standalone tooling
        uses: actions/setup-go@v6
        with:
          go-version-file: standalone-tool/go.mod
      - name: Build the independently approved two architectures
        id: tool-binaries
        working-directory: standalone-tool
        env:
          RETIREMENT_TOOL_SOURCE_SHA: ${{ needs.validate.outputs.tool_source_sha }}
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$RETIREMENT_TOOL_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$RETIREMENT_TOOL_SOURCE_SHA" ]] || exit 1
          binary_dir=$(mktemp -d "$RUNNER_TEMP/qs-retirement-window-binaries.XXXXXX")
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags="-s -w -X main.sourceSHA=$RETIREMENT_TOOL_SOURCE_SHA -X github.com/FangcunMount/qs-server/pkg/version.GitCommit=$RETIREMENT_TOOL_SOURCE_SHA" -o "$binary_dir/inventory-linux-amd64" ./cmd/qs-compatibility-retirement
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags="-s -w -X main.sourceSHA=$RETIREMENT_TOOL_SOURCE_SHA -X github.com/FangcunMount/qs-server/pkg/version.GitCommit=$RETIREMENT_TOOL_SOURCE_SHA" -o "$binary_dir/inventory-linux-arm64" ./cmd/qs-compatibility-retirement
          echo "directory=$binary_dir" >> "$GITHUB_OUTPUT"
      - name: Hold same-run workflow owner through native acceptance or recovery
        env:
          SUDO_PASSWORD: ${{ secrets.SVRA_SUDO_PASSWORD }}
          RETIREMENT_PLATFORM_TOKEN: ${{ github.token }}
          RETIREMENT_OPERATION: ${{ inputs.operation }}
          RETIREMENT_OPERATION_ID: ${{ inputs.operation_id }}
          RETIREMENT_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          RETIREMENT_TEMPLATE_SHA256: ${{ inputs.inventory_request_sha256 }}
          RETIREMENT_TOOL_SOURCE_SHA: ${{ needs.validate.outputs.tool_source_sha }}
          RETIREMENT_BOOTSTRAP_APPROVAL_JSON: ${{ inputs.bootstrap_approval_json }}
          RETIREMENT_BOOTSTRAP_APPROVAL_SHA256: ${{ inputs.bootstrap_approval_sha256 }}
          HOST_INVENTORY_SSH_HOST: ${{ vars.SVRA_HOST }}
          HOST_INVENTORY_SSH_USERNAME: ${{ vars.SVRA_USERNAME }}
          HOST_INVENTORY_SSH_PORT: ${{ vars.SVRA_SSH_PORT || 22 }}
          HOST_INVENTORY_SSH_KEY: ${{ secrets.SVRA_SSH_KEY }}
          HOST_INVENTORY_SSH_FINGERPRINT: ${{ vars.SVRA_SSH_FINGERPRINT }}
          # Reuse the ordinary worker deploy route/key and its existing pin.
          # These credentials remain in the bounded private management packet.
          RETIREMENT_SERVICE_SSH_HOST: ${{ vars.SVRD_HOST || vars.SVRD_PUBLIC_HOST || secrets.SVRD_PUBLIC_HOST }}
          RETIREMENT_SERVICE_SSH_USERNAME: ${{ vars.SVRD_USERNAME || vars.SVRA_USERNAME }}
          RETIREMENT_SERVICE_SSH_PORT: ${{ vars.SVRD_SSH_PORT || vars.SVRA_SSH_PORT || 22 }}
          RETIREMENT_SERVICE_SSH_KEY: ${{ secrets.SVR_MINI_SSH_KEY || secrets.SVRD_SSH_KEY || secrets.SVRA_SSH_KEY }}
          RETIREMENT_SERVICE_SSH_FINGERPRINT: ${{ vars.SVRD_SSH_FINGERPRINT }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT || 3306 }}
          MYSQL_USERNAME: ${{ secrets.MYSQL_METADATA_ADMIN_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_METADATA_ADMIN_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE != '' && secrets.MYSQL_DATABASE || secrets.MYSQL_DBNAME }}
          MONGODB_HOST: ${{ secrets.MONGODB_HOST }}
          MONGODB_PORT: ${{ secrets.MONGODB_PORT || 27017 }}
          MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
          MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
          MONGODB_DBNAME: ${{ secrets.MONGODB_DBNAME }}
          MONGODB_METADATA_ADMIN_USERNAME: ${{ secrets.MONGODB_METADATA_ADMIN_USERNAME }}
          MONGODB_METADATA_ADMIN_PASSWORD: ${{ secrets.MONGODB_METADATA_ADMIN_PASSWORD }}
          RETIREMENT_BINARY_DIRECTORY: ${{ steps.tool-binaries.outputs.directory }}
        run: |
          set -Eeuo pipefail
          umask 077
          python3 -B dispatcher/scripts/database/compatibility-platform-window-action.py --dispatcher-repo "$GITHUB_WORKSPACE/dispatcher" --tool-repo "$GITHUB_WORKSPACE/standalone-tool" --binary-directory "$RETIREMENT_BINARY_DIRECTORY"
