name: Statistics Stale Run Settlement

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type SETTLE-6-STATISTICS-RUNS after owner approval'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: qs-server-db-ops-production
  cancel-in-progress: false

jobs:
  settle-exact-runs:
    name: Settle Six Exact Statistics Runs
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64, ops]
    environment: production
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate authorization and SSH configuration
        env:
          CONFIRM_SETTLEMENT: ${{ inputs.confirmation }}
          SVRA_HOST: ${{ vars.SVRA_HOST }}
          SVRA_USERNAME: ${{ vars.SVRA_USERNAME }}
          SVRA_SSH_KEY: ${{ secrets.SVRA_SSH_KEY }}
          SVRA_SSH_FINGERPRINT: ${{ vars.SVRA_SSH_FINGERPRINT }}
        run: |
          set -Eeuo pipefail
          [ "$CONFIRM_SETTLEMENT" = 'SETTLE-6-STATISTICS-RUNS' ]
          : "${SVRA_HOST:?SVRA_HOST is empty}"
          : "${SVRA_USERNAME:?SVRA_USERNAME is empty}"
          : "${SVRA_SSH_KEY:?SVRA_SSH_KEY is empty}"
          : "${SVRA_SSH_FINGERPRINT:?SVRA_SSH_FINGERPRINT is empty}"

      - name: Settle six exact stale runs
        uses: appleboy/ssh-action@v1.2.2
        env:
          CONFIRM_SETTLEMENT: ${{ inputs.confirmation }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT || 3306 }}
          MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE != '' && secrets.MYSQL_DATABASE || secrets.MYSQL_DBNAME }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT || 6379 }}
          REDIS_USERNAME: ${{ secrets.REDIS_USERNAME }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_USE_SSL: ${{ secrets.REDIS_USE_SSL }}
          REDIS_SSL_INSECURE_SKIP_VERIFY: ${{ secrets.REDIS_SSL_INSECURE_SKIP_VERIFY }}
          PRIVILEGE_RUNNER: sudo
        with:
          host: ${{ vars.SVRA_HOST }}
          username: ${{ vars.SVRA_USERNAME }}
          key: ${{ secrets.SVRA_SSH_KEY }}
          port: ${{ vars.SVRA_SSH_PORT || 22 }}
          fingerprint: ${{ vars.SVRA_SSH_FINGERPRINT }}
          command_timeout: 8m
          envs: CONFIRM_SETTLEMENT,MYSQL_HOST,MYSQL_PORT,MYSQL_USERNAME,MYSQL_PASSWORD,MYSQL_DATABASE,REDIS_HOST,REDIS_PORT,REDIS_USERNAME,REDIS_PASSWORD,REDIS_USE_SSL,REDIS_SSL_INSECURE_SKIP_VERIFY,PRIVILEGE_RUNNER
          script_path: scripts/cd/settle-statistics-stale-runs.sh
