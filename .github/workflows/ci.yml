name: CI

on:
  workflow_dispatch:
    inputs:
      m4_a_formal_carrier:
        description: 'Also run the optional owned A Linux/root/512MiB carrier qualification; no production action'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: '1.25.12'
  GOTOOLCHAIN: auto
  # Only availability is shared; credentials stay in the service/login inputs.
  CI_DOCKERHUB_LOGIN: ${{ secrets.DOCKERHUB_USERNAME != '' || secrets.DOCKERHUB_TOKEN != '' }}

jobs:
  m4-a-formal-carrier:
    name: Optional A Original Linux Carrier
    if: github.event_name == 'workflow_dispatch' && inputs.m4_a_formal_carrier == true && github.repository == 'FangcunMount/qs-server'
    runs-on: ubuntu-latest
    # Step caps sum80m:1+2+1+2+22+1+1+4+42+1+3;5m action-post reserve.
    # actual runtime remains2340s +120s cleanup; original carrier limits unchanged.
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        timeout-minutes: 2
        with:
          go-version: '1.25.12'
          cache: true
      - name: Test fixed qualification and default isolation
        timeout-minutes: 1
        run: |
          set -Eeuo pipefail
          python3 -m pip install --quiet pyyaml
          python3 -B scripts/testing/m4-a-formal-carrier/test_source.py
      - name: Resolve the fixed source dependencies
        timeout-minutes: 2
        run: |
          set -Eeuo pipefail
          umask 077
          for source in 602710eb2f6ee383923230890c4bdb4a3bcada3a 51163edab7038adcdb6b8f1712d6dc434f361dc6; do
            [[ "$(git rev-parse "$source^{commit}")" == "$source" ]]
            source_root="${RUNNER_TEMP}/a-carrier-deps-${source}"
            mkdir -m 700 "$source_root"
            git archive "$source" | tar -x -C "$source_root"
            (cd "$source_root" && GOTOOLCHAIN=local GOMAXPROCS=2 go mod download)
          done
      - name: Reproduce the exact immutable Tool and build the fixed fixture
        timeout-minutes: 22
        run: |
          set -Eeuo pipefail
          umask 077
          python3 -B scripts/testing/m4-a-formal-carrier/prepare.py "${RUNNER_TEMP}/a-carrier-build"
      - name: Read the original M2 API from the existing ACR
        timeout-minutes: 1
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}
          logout: true
      - name: Read fixture images with the existing Docker Hub credential contract
        timeout-minutes: 1
        if: env.CI_DOCKERHUB_LOGIN == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          logout: true
      - name: Read only the fixed images without replacement
        timeout-minutes: 4
        run: |
          set -Eeuo pipefail
          docker pull --platform=linux/amd64 crpi-x3r4i68cpfmwtcll.cn-beijing.personal.cr.aliyuncs.com/fangcunmount/qs-apiserver@sha256:1de02c4a3f7a12c7bc9c656b0be3eefeda15f8bd4674444e3aac1df7f407b816
          docker pull --platform=linux/amd64 mysql:8.0.36
          docker pull --platform=linux/amd64 mongo@sha256:43fddee7e532a920f3dfdee9e8f4834398c155c26bcb92d790cc1cd3c630fc40
      - name: Exercise the unchanged V10 native carrier with owned synthetic data
        timeout-minutes: 42
        env:
          QS_M4_A_CARRIER_ACK: isolated_original_V10_carrier_only
        run: |
          set -Eeuo pipefail
          sudo --preserve-env=GITHUB_ACTIONS,GITHUB_REPOSITORY,QS_M4_A_CARRIER_ACK \
            python3 -B scripts/testing/m4-a-formal-carrier/run.py \
            --run --build "${RUNNER_TEMP}/a-carrier-build" --output "${RUNNER_TEMP}/a-carrier-actual"
      - name: Preserve synthetic original evidence without changing its Linux ownership
        timeout-minutes: 1
        if: always()
        run: |
          set -Eeuo pipefail
          umask 077
          if sudo test -d "${RUNNER_TEMP}/a-carrier-actual"; then
            sudo tar -C "${RUNNER_TEMP}/a-carrier-actual" -cf - . > "${RUNNER_TEMP}/a-carrier-actual.tar"
          fi
      - name: Upload isolated carrier evidence; Mac custody remains separate
        timeout-minutes: 3
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m4-a-formal-carrier-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/a-carrier-actual.tar
            ${{ runner.temp }}/a-carrier-build/build.json
          if-no-files-found: warn
          retention-days: 30

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Get dependencies
        run: |
          go mod download
          go mod verify

      - name: Check retired service authentication
        run: python3 scripts/check_service_token_retirement.py

      - name: Run tests
        id: go_tests
        run: |
          set -Eeuo pipefail
          umask 077
          test_log="$(mktemp "${RUNNER_TEMP}/qs-go-tests.XXXXXX")"
          printf 'log_path=%s\n' "$test_log" >> "$GITHUB_OUTPUT"
          set +e
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./... 2>&1 | tee "$test_log"
          test_status=("${PIPESTATUS[@]}")
          set -e
          if (( test_status[0] != 0 || test_status[1] != 0 )); then
            summary_status=0
            python3 - "$test_log" <<'PY' || summary_status=$?
          import json, pathlib, re, sys
          lines = pathlib.Path(sys.argv[1]).read_bytes().splitlines()
          failure = re.compile(rb'(^\s*--- FAIL:|^FAIL(?:\s|$)|^panic:|^fatal error:|^WARNING: DATA RACE(?:\s|$))')
          hits = [i for i, line in enumerate(lines) if failure.search(line)]
          anchor_kind = 'hard_failure'
          if not hits:
              diagnostic = re.compile(rb'^[^\s:]+\.go:[0-9]+(?::[0-9]+)?:')
              hits = [i for i, line in enumerate(lines) if diagnostic.search(line)]
              anchor_kind = 'compiler_fallback'
          windows = []
          for i in hits:
              start, end = max(0, i - 16), min(len(lines), i + 17)
              if windows and start <= windows[-1][1]: windows[-1][1] = max(end, windows[-1][1])
              else: windows.append([start, end])
          body, cap, emitted, truncated, clipped = bytearray(), 64000, 0, False, 0
          for start, end in windows:
              chunk = ('--- lines %d-%d ---\n' % (start + 1, end)).encode()
              for line in lines[start:end]:
                  clipped += len(line) > 1024
                  chunk += b'| ' + line[:1024] + (b' [line clipped to 1024 bytes]' if len(line) > 1024 else b'') + b'\n'
              remaining = cap - len(body)
              body.extend(chunk[:remaining]); emitted += 1; truncated = len(chunk) > remaining
              if truncated or len(body) == cap: break
          truncated = truncated or emitted < len(windows) or clipped > 0
          header = {'kind':'go_test_failure_context', 'anchor_kind':anchor_kind, 'source_lines':len(lines), 'matched_lines':len(hits), 'context_windows':len(windows), 'emitted_windows':emitted, 'truncated':truncated, 'clipped_lines_in_examined_windows':clipped, 'source_line_limit_bytes':1024, 'context_bytes':len(body), 'output_limit_bytes':65536}
          sys.stdout.buffer.write(b'GO_TEST_FAILURE_SUMMARY_BEGIN\n' + json.dumps(header).encode() + b'\n' + body + b'\nGO_TEST_FAILURE_SUMMARY_END\n')
          PY
            printf 'GO_TEST_EXIT=%s TEE_EXIT=%s SUMMARY_EXIT=%s\n' "${test_status[0]}" "${test_status[1]}" "$summary_status"
            if (( test_status[0] != 0 )); then exit "${test_status[0]}"; fi
            exit "${test_status[1]}"
          fi

      - name: Upload failed ordinary test log
        if: failure() && steps.go_tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: ordinary-go-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.go_tests.outputs.log_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Compile all integration-tag contracts
        run: |
          go test -tags=integration -run '^$' ./...

      - name: Verify M4 standard Outbox build
        run: |
          go build -tags=reliable_messaging_m4 ./cmd/qs-apiserver ./cmd/collection-server ./cmd/qs-worker
          go test -tags=reliable_messaging_m4 ./internal/apiserver/application/systemgovernance ./internal/apiserver/infra/mysql/systemgovernance ./internal/apiserver/transport/rest ./internal/apiserver/process
          go vet -tags=reliable_messaging_m4 ./internal/apiserver/application/systemgovernance ./internal/apiserver/infra/mysql/systemgovernance ./internal/apiserver/transport/rest ./internal/apiserver/process

      - name: Generate coverage report
        run: |
          go tool cover -func=coverage.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

  metadata-readiness-mysql-native:
    name: MySQL Native Metadata and Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0.36
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          MYSQL_ROOT_PASSWORD: m4-owned-mysql-fixture
        ports:
          - 3306/tcp
        options: >-
          --memory=1g --cpus=1
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pm4-owned-mysql-fixture"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run wrapper and receipt contracts
        run: |
          python3 -B scripts/testing/test-m4-metadata-readiness-native-proof.py
          python3 -B scripts/dbops/test-mysql-metadata-readiness.py
          python3 -B scripts/dbops/test-mysql-retirement-inventory.py
          python3 -B scripts/dbops/test-mysql-metadata-profile.py
          python3 -B scripts/dbops/test-mysql-metadata-profile-ssh.py
          python3 -B scripts/dbops/test-receipt-transport.py
      - name: Verify owned MySQL metadata selectors really run
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          MYSQL_HOST: '127.0.0.1'
          MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
          MYSQL_USERNAME: root
          MYSQL_PASSWORD: m4-owned-mysql-fixture
          QS_METADATA_PROFILE_NATIVE_REQUIRED: '1'
        run: |
          set -Eeuo pipefail
          export MYSQL_DATABASE="qs_profile_owned_${GITHUB_RUN_ID}"
          [[ "$MYSQL_DATABASE" =~ ^qs_profile_owned_[a-z0-9]{8,24}$ && "$MYSQL_PORT" != 3306 ]] || exit 1
          docker exec --env MYSQL_PWD="$MYSQL_PASSWORD" "$MYSQL_CONTAINER" mysql -uroot -e \
            "CREATE DATABASE $MYSQL_DATABASE; SET GLOBAL partial_revokes=ON; UPDATE performance_schema.setup_instruments SET ENABLED='YES', TIMED='YES' WHERE NAME='wait/lock/metadata/sql/mdl';"
          QS_METADATA_PROFILE_NATIVE_UUID="$(docker exec --env MYSQL_PWD="$MYSQL_PASSWORD" "$MYSQL_CONTAINER" mysql -uroot -N -e 'SELECT @@server_uuid')"
          export QS_METADATA_PROFILE_NATIVE_UUID
          make test-metadata-readiness-mysql-native

  metadata-readiness-mongodb-native:
    name: MongoDB Authenticated Native Metadata
    runs-on: ubuntu-latest
    # 7 x 8m tests + 7 x (2 x 45 x 2s) readiness sleeps + 20m setup/proof/cleanup = 97m; ceil100.
    timeout-minutes: 100
    services:
      mysql:
        image: mysql:8.0.36
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          MYSQL_ROOT_PASSWORD: m4-owned-object-fixture
        ports:
          - 3306/tcp
        options: >-
          --memory=1g --cpus=1
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pm4-owned-object-fixture"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Log in for the pinned fixture image
        if: env.CI_DOCKERHUB_LOGIN == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          logout: true
      - name: Run MongoDB wrapper and receipt contracts
        run: |
          python3 -B scripts/testing/test-m4-metadata-readiness-native-proof.py
          python3 -B scripts/dbops/test-mongodb-metadata-profile.py
          python3 -B scripts/dbops/test-receipt-transport.py
      - name: Verify an owned authenticated MongoDB 7.0.31 replica set
        env:
          OBJECT_MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: |
          set -Eeuo pipefail
          fixture_run_owner="${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          [[ "$fixture_run_owner" =~ ^[a-z0-9]{8,24}$ ]] || exit 1
          fixture_owner=''
          fixture_name=''
          fixture_network=''
          fixture_phase=''
          fixture_cid=''
          fixture_network_created=false
          d_native_tmp=''
          fixture_image='mongo@sha256:43fddee7e532a920f3dfdee9e8f4834398c155c26bcb92d790cc1cd3c630fc40'
          cleanup_owned_fixture() {
            fixture_status=$?
            fixture_state_evidence=true
            if [ -n "$fixture_cid" ]; then
              [[ "$fixture_cid" =~ ^[0-9a-f]{64}$ ]] || return 1
              [[ "$(docker inspect --format '{{index .Config.Labels "qs.mongo-metadata.fixture"}}' "$fixture_cid")" == "$fixture_owner" ]] || return 1
              [[ "$(docker inspect --format '{{.Name}}' "$fixture_cid")" == "/$fixture_name" ]] || return 1
              printf 'B_MONGO_OWNED_PHASE %s\n' "$fixture_phase"
              if fixture_state_json="$(docker inspect --type container --format '{"id":{{json .Id}},"running":{{json .State.Running}},"exit_code":{{json .State.ExitCode}},"oom_killed":{{json .State.OOMKilled}},"error_present":{{ne .State.Error ""}},"memory":{{json .HostConfig.Memory}},"memory_swap":{{json .HostConfig.MemorySwap}}}' "$fixture_cid")"; then
                printf 'B_MONGO_OWNED_STATE %s\n' "$fixture_state_json"
                if ! python3 -c 'import json,sys; s=json.load(sys.stdin); sys.exit(0 if s.get("running") is True and s.get("oom_killed") is False and s.get("error_present") is False else 1)' <<< "$fixture_state_json"; then
                  fixture_state_evidence=false
                fi
              else
                fixture_state_evidence=false
              fi
              if ! docker exec "$fixture_cid" df -kP /data/db /data/configdb 2>/dev/null | awk '
                NR == 1 { next }
                { if (NF < 6 || $2 !~ /^[0-9]+$/ || $3 !~ /^[0-9]+$/ || $4 !~ /^[0-9]+$/) bad=1; count++; blocks[count]=$2; used[count]=$3; available[count]=$4 }
                END { if (bad || count != 2) exit 1; for (i=1; i<=2; i++) printf "B_MONGO_OWNED_TMPFS {\"ordinal\":%d,\"blocks_1k\":%.0f,\"used_1k\":%.0f,\"available_1k\":%.0f}\n", i, blocks[i], used[i], available[i] }'; then
                printf '%s\n' 'B_MONGO_OWNED_TMPFS_UNAVAILABLE'
              fi
              docker rm -f "$fixture_cid" >/dev/null
              fixture_remaining="$(docker ps --all --no-trunc --filter "id=$fixture_cid" --format '{{.ID}}')" || return 1
              [[ -z "$fixture_remaining" ]] || return 1
            fi
            if [ "$fixture_network_created" == true ]; then
              [[ "$(docker network inspect --format '{{index .Labels "qs.mongo-metadata.fixture"}}' "$fixture_network")" == "$fixture_owner" ]] || return 1
              [[ "$(docker network inspect --format '{{len .Containers}}' "$fixture_network")" == 0 ]] || return 1
              docker network rm "$fixture_network" >/dev/null
              fixture_remaining="$(docker network ls --filter "label=qs.mongo-metadata.fixture=$fixture_owner" --format '{{.Name}}')" || return 1
              [[ -z "$fixture_remaining" ]] || return 1
            fi
            fixture_cid=''
            fixture_network_created=false
            fixture_owner=''
            fixture_name=''
            fixture_network=''
            fixture_phase=''
            if [ -n "$d_native_tmp" ]; then
              [[ "$d_native_tmp" == "$HOME/qs-m4-d-native-${fixture_run_owner}."* ]] || return 1
              [[ -d "$d_native_tmp" && ! -L "$d_native_tmp" && "$(stat -c '%u:%a' "$d_native_tmp")" == "$(id -u):700" ]] || return 1
              rm -rf -- "$d_native_tmp"
              [[ ! -e "$d_native_tmp" && ! -L "$d_native_tmp" ]] || return 1
              d_native_tmp=''
            fi
            [[ "$fixture_state_evidence" == true ]] || return 1
            return "$fixture_status"
          }
          trap cleanup_owned_fixture EXIT
          start_owned_fixture() {
            [[ -z "$fixture_cid" && "$fixture_network_created" == false && -z "$fixture_owner" && -z "$fixture_name" && -z "$fixture_network" ]] || exit 1
            case "$1" in m|a|b|c|d|g|h) fixture_phase="$1" ;; *) exit 1 ;; esac
            fixture_owner="${fixture_run_owner}${fixture_phase}"
            [[ "$fixture_owner" =~ ^[a-z0-9]{8,24}$ ]] || exit 1
            fixture_name="qs-mongo-profile-owned-${fixture_owner}"
            fixture_network="$fixture_name"
            if docker inspect "$fixture_name" >/dev/null 2>&1 || docker network inspect "$fixture_network" >/dev/null 2>&1; then exit 1; fi
            docker network create --label "qs.mongo-metadata.fixture=$fixture_owner" "$fixture_network" >/dev/null
            fixture_network_created=true
            fixture_cid="$(docker run --detach --name "$fixture_name" \
              --label "qs.mongo-metadata.fixture=$fixture_owner" \
              --network "$fixture_network" --network-alias mongo \
              --publish 127.0.0.1::27017 --memory=2g --memory-swap=2g --cpus=1 \
              --tmpfs /data/db:rw,nosuid,nodev,size=1g \
              --tmpfs /data/configdb:rw,nosuid,nodev,size=128m \
              --env MONGO_INITDB_ROOT_USERNAME=metadata_fixture \
              --env MONGO_INITDB_ROOT_PASSWORD=m4-owned-mongo-fixture \
              --entrypoint bash "$fixture_image" -c \
              'set -Eeuo pipefail; umask 077; head -c 512 /dev/urandom | base64 > /tmp/metadata-fixture.key; chown 999:999 /tmp/metadata-fixture.key; chmod 0400 /tmp/metadata-fixture.key; exec /usr/local/bin/docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /tmp/metadata-fixture.key --wiredTigerCacheSizeGB 0.25')"
            [[ "$fixture_cid" =~ ^[0-9a-f]{64}$ ]] || exit 1
            fixture_shell='const admin=db.getSiblingDB("admin"); const auth=admin.auth(process.env.MONGO_INITDB_ROOT_USERNAME,process.env.MONGO_INITDB_ROOT_PASSWORD); if(!(auth===1||auth.ok===1))quit(1);'
            fixture_ready=false
            fixture_attempt=0
            while (( fixture_attempt < 45 )); do
              fixture_attempt=$((fixture_attempt + 1))
              if docker exec "$fixture_cid" mongosh --quiet --eval "$fixture_shell quit(admin.runCommand({ping:1}).ok===1?0:1)" >/dev/null 2>&1; then fixture_ready=true; break; fi
              sleep 2
            done
            [[ "$fixture_ready" == true ]] || exit 1
            docker exec "$fixture_cid" mongosh --quiet --eval "$fixture_shell const build=admin.runCommand({buildInfo:1}); const h=admin.runCommand({hello:1}); if(build.version!=='7.0.31'||h.isreplicaset!==true||h.setName)quit(1); admin.runCommand({replSetInitiate:{_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}})" >/dev/null
            fixture_ready=false
            fixture_attempt=0
            while (( fixture_attempt < 45 )); do
              fixture_attempt=$((fixture_attempt + 1))
              if docker exec "$fixture_cid" mongosh --quiet --eval "$fixture_shell quit(admin.runCommand({hello:1}).isWritablePrimary?0:1)" >/dev/null 2>&1; then fixture_ready=true; break; fi
              sleep 2
            done
            [[ "$fixture_ready" == true ]] || exit 1
            export QS_MONGO_METADATA_NATIVE_REQUIRED=1
            export QS_MONGO_METADATA_NATIVE_OWNER="$fixture_owner"
            export QS_MONGO_METADATA_NATIVE_CONTAINER="$fixture_name"
            QS_MONGO_METADATA_NATIVE_PORT="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "27017/tcp") 0).HostPort}}' "$fixture_cid")"
            export QS_MONGO_METADATA_NATIVE_PORT
            export QS_MONGO_METADATA_NATIVE_PASSWORD=m4-owned-mongo-fixture
            export QS_M4_OBJECT_NATIVE_MONGO_URI="mongodb://metadata_fixture:m4-owned-mongo-fixture@127.0.0.1:${QS_MONGO_METADATA_NATIVE_PORT}/?replicaSet=rs0&directConnection=true&authSource=admin"
          }
          start_owned_fixture m
          make test-metadata-readiness-mongodb-native
          cleanup_owned_fixture
          # Each phase uses a fresh owned Mongo process/tmpfs; MySQL schemas stay job-owned.
          [[ "$OBJECT_MYSQL_PORT" =~ ^[0-9]+$ && "$OBJECT_MYSQL_PORT" != 3306 ]] || exit 1
          export QS_M4_OBJECT_NATIVE_REQUIRED=1
          export QS_M4_OBJECT_NATIVE_DISPOSABLE_ACK=owned_synthetic_dependencies_only
          export QS_M4_OBJECT_NATIVE_MYSQL_DSN="root:m4-owned-object-fixture@tcp(127.0.0.1:${OBJECT_MYSQL_PORT})/mysql?multiStatements=true"
          object_source="$(git rev-parse HEAD)"
          [[ "$object_source" =~ ^[0-9a-f]{40}$ ]] || exit 1
          start_owned_fixture a
          GOMAXPROCS=2 go test -p=2 -race -tags=integration -count=1 -timeout=8m -json \
            -ldflags="-X github.com/FangcunMount/qs-server/pkg/version.GitCommit=$object_source" \
            -run='^TestM4SQLObjectNative' ./scripts/oneoff/m4_sql_historical_protection | tee object-native.jsonl
          python3 - object-native.jsonl <<'PY_OBJECT_PROOF'
          import json, sys
          expected = {
              'TestM4SQLObjectNativeCaptureAndTargetVerification',
              'TestM4SQLObjectNativeCharsetBoundRecovery',
              'TestM4SQLObjectNativeCharsetBoundRecovery/UTF8MB3CleanBothDDLToolMB4',
              'TestM4SQLObjectNativeCharsetBoundRecovery/UTF8MB3DirtyFirstDDLToolMB4',
              'TestM4SQLObjectNativeCharsetBoundRecovery/UTF8MB4CleanBothDDLToolMB3',
              'TestM4SQLObjectNativeCharsetBoundRecovery/UTF8MB4DirtyFirstDDLToolMB3',
              'TestM4SQLObjectNativeCommitResponseLossRemainsUnknown',
              'TestM4SQLObjectNativeCompleteCountBudgets',
              'TestM4SQLObjectNativeCompleteCountBudgets/actual_count_mismatch',
              'TestM4SQLObjectNativeCompleteCountBudgets/earlier_action_deadline',
              'TestM4SQLObjectNativeCompleteCountBudgets/pending_over_five_seconds_then_complete',
              'TestM4SQLObjectNativeExistingEncodingMismatchRefusedBeforeClaim',
              'TestM4SQLObjectNativeOriginalDefinitionDriftRefused',
              'TestM4SQLObjectNativeOriginalDefinitionDriftRefused/CheckChanged',
