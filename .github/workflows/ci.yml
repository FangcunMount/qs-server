name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: '1.25.12'
  GOTOOLCHAIN: auto

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Get dependencies
        run: |
          go mod download
          go mod verify

      - name: Check retired service authentication
        run: python3 scripts/check_service_token_retirement.py

      - name: Run tests
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Compile all integration-tag contracts
        run: |
          go test -tags=integration -run '^$' ./...

      - name: Generate coverage report
        run: |
          go tool cover -func=coverage.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

  action-audit-mysql:
    name: Action audit MySQL JSON lifecycle
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: action_audit_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verify claim completion and replay against JSON columns
        env:
          QS_ACTION_AUDIT_REQUIRE_MYSQL: 'true'
          QS_SERVER_TEST_MYSQL_DSN: 'root:root@tcp(127.0.0.1:3306)/action_audit_test?parseTime=true'
        run: go test ./internal/apiserver/infra/mysql/systemgovernance -run TestActionAuditLifecycleWithJSONColumns -count=1 -v

  actor-store-mysql:
    name: Actor Store MySQL Transactions
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verify store migration and transaction rollback
        env:
          QS_STORE_REQUIRE_MYSQL: 'true'
          QS_SERVER_TEST_MYSQL_DSN: 'root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true'
        run: go test ./internal/apiserver/infra/mysql/actor/store -run TestMySQLStore -count=1 -v
      - name: Verify testee store ownership and transaction rollback
        env:
          QS_TESTEE_STORE_REQUIRE_MYSQL: 'true'
          QS_SERVER_TEST_MYSQL_DSN: 'root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true'
        run: go test ./internal/apiserver/infra/mysql/actor/testeestore -count=1 -v
      - name: Verify operator retirement and audited recovery atomicity
        env:
          QS_OPERATOR_RETIREMENT_REQUIRE_MYSQL: 'true'
          QS_SERVER_TEST_MYSQL_DSN: 'root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true'
        run: go test ./internal/apiserver/infra/mysql/actor/operatorretirement ./internal/apiserver/maintenance/operatorretire ./internal/apiserver/maintenance/operatorrecovery ./internal/apiserver/maintenance/operatorprepare -count=1 -v
      - name: Verify scoped statistics on MySQL
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          QS_SCOPE_MYSQL_REQUIRED: '1'
          QS_SCOPE_MYSQL_DSN: 'root:root@tcp(127.0.0.1:3306)/qs_scope_test_ci?parseTime=true&loc=UTC'
        run: |
          docker exec "$MYSQL_CONTAINER" mysql -uroot -proot -e 'CREATE DATABASE qs_scope_test_ci'
          trap 'docker exec "$MYSQL_CONTAINER" mysql -uroot -proot -e "DROP DATABASE qs_scope_test_ci"' EXIT
          go test ./internal/apiserver/infra/mysql/statistics -run '^TestScopedOverviewMySQL$' -count=1 -v
      - name: Verify Actor activity persistence and current-read serialization
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          QS_SCOPE_MYSQL_REQUIRED: '1'
          QS_SCOPE_MYSQL_DSN: 'root:root@tcp(127.0.0.1:3306)/qs_scope_test_edit?parseTime=true&loc=UTC'
        run: |
          docker exec "$MYSQL_CONTAINER" mysql -uroot -proot -e 'CREATE DATABASE qs_scope_test_edit'
          trap 'docker exec "$MYSQL_CONTAINER" mysql -uroot -proot -e "DROP DATABASE qs_scope_test_edit"' EXIT
          go test ./internal/apiserver/infra/mysql/actor -run '^Test(OperatorActivityRoundTrip|TesteeEditWaitsForTransfer|RelationLockReadsCurrentStateAfterConcurrentUnbind)MySQL$' -count=1 -v

      - name: Verify plan enrollment ownership transaction
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          QS_SCOPE_MYSQL_REQUIRED: '1'
          QS_SCOPE_MYSQL_DSN: 'root:root@tcp(127.0.0.1:3306)/qs_scope_test_enrollment?parseTime=true&loc=UTC'
        run: |
          docker exec "$MYSQL_CONTAINER" mysql -uroot -proot -e 'CREATE DATABASE qs_scope_test_enrollment'
          trap 'docker exec "$MYSQL_CONTAINER" mysql -uroot -proot -e "DROP DATABASE qs_scope_test_enrollment"' EXIT
          go test ./internal/apiserver/infra/mysql/plan -run '^TestPlanEnrollmentOwnershipConcurrencyMySQL$' -count=1 -v

  runtime-closure-e2e:
    name: Seeddata Retirement and Current Runtime E2E
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Start Mongo Replica Set
        run: |
          docker run --detach --rm \
            --name qs-runtime-closure-e2e-mongo \
            --publish 27017:27017 \
            mongo:7.0 --replSet rs0 --bind_ip_all --setParameter ttlMonitorSleepSecs=1
          for attempt in $(seq 1 30); do
            if docker exec qs-runtime-closure-e2e-mongo mongosh --quiet --eval 'db.adminCommand({ping: 1})' >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs qs-runtime-closure-e2e-mongo
              exit 1
            fi
            sleep 2
          done
          docker exec qs-runtime-closure-e2e-mongo mongosh --quiet --eval \
            'rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec qs-runtime-closure-e2e-mongo mongosh --quiet --eval \
              'quit(db.hello().isWritablePrimary ? 0 : 1)' >/dev/null 2>&1; then
              exit 0
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs qs-runtime-closure-e2e-mongo
              exit 1
            fi
            sleep 2
          done

      - name: Run seeddata retirement migration integration tests
        env:
          MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true&multiStatements=true&loc=Asia%2FShanghai
          QS_SERVER_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          QS_SERVER_TEST_MONGO_DB_PREFIX: qs_retire_seeddata_test
        run: |
          go test -tags=integration \
            -run '^TestRetire' \
            -count=1 -timeout=15m -v ./internal/pkg/migration

      - name: Verify answering starts and durable submission against real databases
        env:
          QS_SERVER_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true&multiStatements=true
          QS_TESTEE_STORE_REQUIRE_MYSQL: 'true'
          QS_SERVER_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          STATISTICS_DATABASE_REQUIRED: '1'
        run: |
          test -n "$QS_SERVER_TEST_MYSQL_DSN" && test -n "$QS_SERVER_TEST_MONGO_URI"
          go test -count=1 -timeout=5m -run 'TestMySQLAnsweringStart|TestAnsweringStartUnique|TestStoreActivityRealDatabase' ./internal/apiserver/infra/mysql/actor/testeestore ./internal/apiserver/infra/mongo/answersheet ./internal/apiserver/infra/mysql/statistics

      - name: Run Statistics migration and cold-start integration contracts
        env:
          MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true&multiStatements=true&loc=Asia%2FShanghai
          QS_SERVER_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          QS_SERVER_TEST_MONGO_DB_PREFIX: qs_statistics_ci_test
          QS_SERVER_TEST_REDIS_URL: redis://127.0.0.1:6379/14
        run: |
          go test -tags=integration \
            -run '^(TestStatisticsCanonicalSchemaFromEmptyDatabaseAndRetirementRollback|TestStatisticsAuditMigrationReplaysAfterInitialSchema|TestStatisticsMongoCollectorIndexesUpDown|TestStatisticsColdStartPublishIdempotencyAndRedisFailure)$' \
            -count=1 -timeout=15m -v ./internal/pkg/migration

      - name: Run Survey and ModelCatalog Mongo integration contracts
        env:
          QS_SERVER_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          QS_SERVER_TEST_MONGO_DB: qs_survey_ci_test
          QS_SERVER_TEST_MONGO_DB_PREFIX: qs_survey_ci_test
        run: |
          go test -tags=integration \
            -run '^(TestDurableSubmissionTransactionAgainstMongoReplicaSet|TestRepositoryConcurrentWritersUseRevisionCAS|TestDraftRepositoryConcurrentWritersUseRevisionCAS|TestStandaloneQuestionnaireLifecycleRollsBackOnPartialFailure|TestMongoReleasePairRollsBackEveryFailureBoundary|TestPublishReleaseRollsBackEveryPersistedBoundary)$' \
            -count=1 -timeout=10m -v \
            ./internal/apiserver/infra/mongo/answersheet \
            ./internal/apiserver/infra/mongo/questionnaire \
            ./internal/apiserver/infra/mongo/modelcatalog \
            ./internal/apiserver/container/modules/modelcatalog

      - name: Run Mongo runtime-ledger retirement guards
        env:
          QS_SERVER_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          QS_SERVER_TEST_MONGO_DB_PREFIX: qs_runtime_ledger_retirement_test
        run: |
          go test -tags=integration \
            -run '^(TestCompatibilityRetirementPreconditionRejectsLiveDataAndArchiveReferences|TestRuntimeLedgerRetirementPreconditionRejectsAnySourceDocument|TestRuntimeLedgerRetirementFromVersion22WithSourcesAlreadyDropped)$' \
            -count=1 -timeout=5m -v \
            ./internal/pkg/migration

      - name: Run Mongo transaction consistency integration contracts
        env:
          MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true&multiStatements=true&loc=Asia%2FShanghai
          QS_SERVER_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          QS_SERVER_TEST_MONGO_DB_PREFIX: qs_mongo_consistency_test
        run: |
          go test -tags=integration \
            -run '^(TestInterpretationSuccessRollsBackEveryPersistedBoundary|TestInterpretationFailureAndScheduledRetryRollBackTogether|TestScannerDetectsEverySupportedDriftAgainstReplicaSet|TestScannerAcceptsMarkedHealthyTransactionsAgainstReplicaSet|TestScannerPagesSubmittedOutboxAcrossAggregateIDDigitWidths|TestMongoTransactionAuditIndexesUpDown|TestMongoConsistencyAuditCheckpointMySQLMigrationUpDown)$' \
            -count=1 -timeout=10m -v \
            ./internal/apiserver/infra/mongo/interpretation \
            ./internal/apiserver/infra/mongo/mongoconsistency \
            ./internal/pkg/migration

      - name: Run AI explanation Mongo transaction and schema contracts
        env:
          QS_SERVER_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          QS_SERVER_TEST_MONGO_DB_PREFIX: qs_ai_explanation_ci_test
          QS_SERVER_TEST_MONGO_TTL_TIMEOUT: 15s
        run: |
          go test -tags=integration \
            -run '^(TestAIExplanation.*(IsAtomic|Converge)OnReplicaSet|TestAIExplanationGovernanceCatalogsPageStableScopedRecordsOnReplicaSet|TestAIExplanationMongo(ColdStartEnforcesRuntimeSchema|TTLMonitorDeletesExpiredRecords)|TestPromptEvaluationEvidenceV2Repository(UsesSameCollectionWithVersionIsolationAndCAS|RoundTripsNearMongoLimit)|TestAIExplanationPromptEvaluationSizeAuditReadsRawBSONWithoutReencoding)$' \
            -count=1 -timeout=10m -v \
            ./internal/apiserver/infra/mongo/interpretation/aiexplanation \
            ./internal/pkg/migration \
            ./scripts/oneoff/audit_ai_explanation_prompt_evaluation_size

      - name: Run current runtime closure E2E
        env:
          MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true&multiStatements=true&loc=Asia%2FShanghai
          QS_SERVER_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          QS_SERVER_TEST_MONGO_DB_PREFIX: qs_runtime_closure_test
          QS_SERVER_TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: |
          go test -tags=integration \
            -run '^TestCurrentRuntimeClosure$' \
            -count=1 -timeout=15m -v ./internal/apiserver/integration/runtimeclosure

      - name: Stop Mongo Replica Set
        if: always()
        run: docker stop qs-runtime-closure-e2e-mongo || true

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Install dependencies
        run: |
          go mod download

      - name: Check formatting
        run: |
          make fmt-check

      - name: golangci-lint (pull request diff)
        if: github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.5.0
          only-new-issues: false
          args: --timeout=5m --new-from-rev=${{ github.event.pull_request.base.sha }}

      - name: golangci-lint (push diff)
        if: github.event_name != 'pull_request'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.5.0
          only-new-issues: true
          args: --timeout=5m

  lint-boundaries:
    name: Layer Boundaries (depguard)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: golangci-lint (depguard)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.5.0
          args: --config=.golangci-depguard.yml --timeout=5m

  deployment-contracts:
    name: Deployment Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Validate GitHub Actions
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"

      - name: Validate GitHub Action runtime contract
        run: bash scripts/cd/test-github-action-runtimes.sh

      - name: Validate AI evaluation size audit contract
        run: bash scripts/cd/test-ai-evaluation-size-audit-workflow.sh

      - name: Validate deployment shell scripts
        run: bash -n scripts/cd/*.sh

      - name: Validate runner network contract
        run: bash scripts/cd/test-setup-runner-network.sh

      - name: Validate deployment package contract
        run: bash scripts/cd/test-prepare-package.sh

      - name: Validate deployment image export contract
        run: bash scripts/cd/test-export-image.sh

      - name: Validate deployment planning contract
        run: bash scripts/cd/test-plan-services.sh

      - name: Validate production network exposure contract
        run: bash scripts/cd/test-production-compose-network-exposure.sh

      - name: Validate worker deployment readiness gate
        run: bash scripts/cd/test-wait-worker-readiness.sh

      - name: Validate worker dependency preflight gate
        run: bash scripts/cd/test-verify-worker-dependencies.sh

      - name: Validate worker governance convergence gate
        run: bash scripts/cd/test-verify-worker-governance.sh

      - name: Validate public observability convergence gate
        run: bash scripts/cd/test-verify-observability-nginx.sh

      - name: Validate Attention reconcile dry-run/apply audit contract
        run: bash scripts/cd/test-attention-reconcile-audit.sh

      - name: Validate compatibility observation contract
        run: bash scripts/cd/test-compatibility-observation.sh

      - name: Validate production AuthZ matrix contract
        run: bash scripts/cd/test-verify-authz-production-matrix.sh

      - name: Validate production AuthZ matrix evaluator provisioning contract
        run: bash scripts/cd/test-provision-authz-production-matrix-evaluator.sh

      - name: Validate production Compose
        run: |
          printf '%s\n' \
            'services:' \
            '  qs-apiserver:' \
            '    env_file: !reset []' \
            '  server:' \
            '    env_file: !reset []' \
            '  runtime:' \
            '    env_file: !reset []' |
            docker compose -f build/docker/docker-compose.prod.yml -f - config -q

  security:
    name: Security Scan (Advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Download dependencies
        run: |
          go mod download

      - name: Install security tools
        run: |
          make install-security-tools

      - name: Run govulncheck (advisory)
        continue-on-error: true
        run: |
          make security-govulncheck-ci

      - name: Run gosec (advisory)
        continue-on-error: true
        run: |
          make security-gosec-ci

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: tmp/security/
          retention-days: 7

  maintainability:
    name: Maintainability Scan (Advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Download dependencies
        run: |
          go mod download

      - name: Install golangci-lint
        run: |
          GOBIN="$(pwd)/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0
          echo "$(pwd)/bin" >> "$GITHUB_PATH"

      - name: Run maintainability advisory
        continue-on-error: true
        run: |
          make maintainability-lint-ci

      - name: Upload maintainability reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maintainability-reports
          path: tmp/maintainability/
          retention-days: 7

  tier1-test-policy:
    name: Tier 1 Test Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Tier 1 package policy
        run: |
          make tier1-test-policy

  docs:
    name: Docs Hygiene & Facts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with history for source-baseline verification
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run offline documentation gates
        run: |
          make docs-check

  docs-api-sync:
    name: Docs & API Generated Sync
    if: ${{ vars.DOCS_VERIFY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Install PyYAML
        run: |
          python -m pip install --quiet pyyaml

      - name: Install swagger toolchain
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.4

      - name: Download dependencies
        run: |
          go mod download

      - name: Verify generated API contracts
        run: |
          make docs-api-verify

      - name: Ensure no doc drift
        run: |
          git diff --exit-code

  build:
    name: Build Applications
    needs: [test, actor-store-mysql, runtime-closure-e2e, lint, lint-boundaries, deployment-contracts, tier1-test-policy, docs]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [apiserver, collection, worker]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Build ${{ matrix.service }}
        run: |
          make build-${{ matrix.service }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: qs-${{ matrix.service }}
          path: bin/*
          retention-days: 7
