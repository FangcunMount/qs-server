  runtime-closure-e2e:
    name: Seeddata Retirement and Current Runtime E2E
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Log in for CI image pulls
        if: env.CI_DOCKERHUB_LOGIN == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          logout: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Start Mongo Replica Set
        run: |
          set -euo pipefail
          mongo_cid="$(docker run --detach \
            --name qs-runtime-closure-e2e-mongo \
            --publish 27017:27017 \
            mongo:7.0 --replSet rs0 --bind_ip_all --setParameter ttlMonitorSleepSecs=1)"
          [[ "$mongo_cid" =~ ^[0-9a-f]{64}$ ]]
          printf 'QS_RUNTIME_CLOSURE_MONGO_CONTAINER=%s\n' "$mongo_cid" >> "$GITHUB_ENV"
          mongo_startup_diagnostics() {
            docker inspect --format 'status={{.State.Status}} exit_code={{.State.ExitCode}} oom_killed={{.State.OOMKilled}} error={{json .State.Error}}' "$mongo_cid" || true
            docker logs "$mongo_cid" || true
          }
          trap 'mongo_exit=$?; if [ "$mongo_exit" -ne 0 ]; then mongo_startup_diagnostics; fi' EXIT
          # Shell state must stay outside the entrypoint chown of /data/db.
          for attempt in $(seq 1 30); do
            if docker exec --env HOME=/tmp/qs-runtime-closure-mongosh --env XDG_CONFIG_HOME=/tmp/qs-runtime-closure-mongosh/config "$mongo_cid" mongosh --quiet --eval 'db.adminCommand({ping: 1})' >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              exit 1
            fi
            sleep 2
          done
          docker exec --env HOME=/tmp/qs-runtime-closure-mongosh --env XDG_CONFIG_HOME=/tmp/qs-runtime-closure-mongosh/config "$mongo_cid" mongosh --quiet --eval \
            'rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec --env HOME=/tmp/qs-runtime-closure-mongosh --env XDG_CONFIG_HOME=/tmp/qs-runtime-closure-mongosh/config "$mongo_cid" mongosh --quiet --eval \
              'quit(db.hello().isWritablePrimary ? 0 : 1)' >/dev/null 2>&1; then
              exit 0
            fi
            if [ "$attempt" -eq 30 ]; then
              exit 1
            fi
            sleep 2
          done

      - name: Run retirement and retry persistence integration tests
        env:
          MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true&multiStatements=true&loc=Asia%2FShanghai
          QS_SERVER_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          QS_SERVER_TEST_MONGO_DB_PREFIX: qs_retire_seeddata_test
        run: |
          go test -tags=integration \
            -run '^TestRetire|^TestRetryGovernanceMySQLMigrationsUpDown$' \
            -count=1 -timeout=15m -v ./internal/pkg/migration

      - name: Verify answering starts and durable submission against real databases
        env:
          QS_SERVER_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true&multiStatements=true
          QS_TESTEE_STORE_REQUIRE_MYSQL: 'true'
          QS_SERVER_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          STATISTICS_DATABASE_REQUIRED: '1'
        run: |
          test -n "$QS_SERVER_TEST_MYSQL_DSN" && test -n "$QS_SERVER_TEST_MONGO_URI"
          go test -count=1 -timeout=5m -run 'TestMySQLAnsweringStart|TestAnsweringStartUnique|TestStoreActivityRealDatabase' ./internal/apiserver/infra/mysql/actor/testeestore ./internal/apiserver/infra/mongo/answersheet ./internal/apiserver/infra/mysql/statistics

      - name: Run Statistics migration and cold-start integration contracts
        env:
          MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true&multiStatements=true&loc=Asia%2FShanghai
          QS_SERVER_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          QS_SERVER_TEST_MONGO_DB_PREFIX: qs_statistics_ci_test
          QS_SERVER_TEST_REDIS_URL: redis://127.0.0.1:6379/14
        run: |
          go test -tags=integration \
            -run '^(TestStatisticsCanonicalSchemaFromEmptyDatabaseAndRetirementRollback|TestStatisticsAuditMigrationReplaysAfterInitialSchema|TestStatisticsMongoCollectorIndexesUpDown|TestStatisticsColdStartPublishIdempotencyAndRedisFailure)$' \
            -count=1 -timeout=15m -v ./internal/pkg/migration

      - name: Verify schema pair forward migration and disabled DDL guards
        env:
          QS_M3_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true&multiStatements=true
          QS_M3_REQUIRE_DATABASE: '1'
          QS_SERVER_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          QS_SERVER_TEST_MONGO_DB_PREFIX: qs_m3_test
        run: |
          set -euo pipefail
          go test -race -tags=integration -count=1 -timeout=8m \
            -run '^(TestHistoricalEvidenceNative|TestSchemaPairNative|TestDisabledDDLNative)' -v \
            ./internal/pkg/migration ./internal/apiserver/bootstrap \
            | tee "${RUNNER_TEMP}/schema-pair.log"
          for test_name in \
            TestHistoricalEvidenceNativeSQLOnlyUpgradeAndRestart \
            TestHistoricalEvidenceNativePartialDDLRemainsDirtyAndRefusesDown \
            TestHistoricalEvidenceNativeSchemaObjectRestoreWithSyntheticNonNull \
            TestHistoricalEvidenceNativeDirtyObjectBackupRestore \
            TestSchemaPairNativeColdBootstrapAndRestart \
            TestDisabledDDLNativeValidatesCurrentHeadsAndNeverCreatesMetadata; do
            if ! grep -q -- "--- PASS: ${test_name} " "${RUNNER_TEMP}/schema-pair.log"; then
              echo "Required schema pair test did not pass: ${test_name}" >&2
              exit 1
            fi
          done
          if grep -q -- '--- SKIP:' "${RUNNER_TEMP}/schema-pair.log"; then
            echo 'Schema pair verification must not skip' >&2
            exit 1
          fi

      - name: Verify approved offline execution and interrupted paired DDL
        env:
          QS_M3_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true&multiStatements=true
          QS_M3_REQUIRE_DATABASE: '1'
          QS_SERVER_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          QS_SERVER_TEST_MONGO_DB_PREFIX: qs_offline_test
        run: |
          set -euo pipefail
          proof_log=$(mktemp)
          trap 'rm -f "$proof_log"' EXIT
          go test -race -tags=integration -count=1 -timeout=8m -v \
            -run '^TestOfflineNative' ./internal/pkg/migration | tee "$proof_log"
          for required in \
            TestOfflineNativeUpgradeAndFreshNoop \
            TestOfflineNativeSQLPartialFailureRemainsDirty \
            TestOfflineNativeMongoPartialFailureRemainsDirty \
            TestOfflineNativeMongoCancellationRetainsPartialState \
            TestOfflineNativeSQLDeadlineRetainsUnknownPartialState \
            TestOfflineNativeMissingRecoveryAndPristineRefusedBeforeDDL \
            TestOfflineNativeMissingBoundResourcesRefusedBeforeDDL; do
            grep -F -- "--- PASS: $required " "$proof_log" >/dev/null
          done
          if grep -E -- '^--- SKIP:' "$proof_log"; then exit 1; fi

      - name: Verify four historical Mongo index retirement and auth failure
        env:
          QS_M3_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true&multiStatements=true
          QS_M3_REQUIRE_DATABASE: '1'
          QS_SERVER_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          QS_SERVER_TEST_MONGO_DB_PREFIX: qs_m4_index_ci_test
        run: |
          set -euo pipefail
          QS_M4_AUTH_PASSWORD="$(openssl rand -hex 24)"
          export QS_M4_AUTH_PASSWORD
          echo "::add-mask::${QS_M4_AUTH_PASSWORD}"
          auth_cid="$(docker run --detach \
            --name qs-m4-index-auth --label qs.cleanup.owner=m4-index-ci \
            --cpus 2 --memory 1g \
            --tmpfs /data/db:rw,nosuid,size=536870912 \
            --tmpfs /data/configdb:rw,nosuid,size=16777216 \
            --tmpfs /run/qs-m4-keydir:rw,nosuid,size=1048576 \
            --publish 127.0.0.1:27018:27017 --entrypoint bash \
            --env MONGO_INITDB_ROOT_USERNAME=qs_m4_ci_root \
            --env "MONGO_INITDB_ROOT_PASSWORD=${QS_M4_AUTH_PASSWORD}" \
            mongo:7.0 -ceu \
            'umask 077; openssl rand -base64 756 > /run/qs-m4-keydir/key; chown mongodb:mongodb /run/qs-m4-keydir/key; chmod 400 /run/qs-m4-keydir/key; exec docker-entrypoint.sh "$@"' \
            -- mongod --replSet qs-m4-auth-rs --keyFile /run/qs-m4-keydir/key --bind_ip_all)"
          [[ "$auth_cid" =~ ^[0-9a-f]{64}$ ]]
          printf 'QS_M4_MONGO_AUTH_CONTAINER=%s\n' "$auth_cid" >> "$GITHUB_ENV"
          auth_shell() {
            docker exec "$auth_cid" mongosh --quiet --username qs_m4_ci_root \
              --password "$QS_M4_AUTH_PASSWORD" --authenticationDatabase admin --eval "$1"
          }
          ready=false
          for attempt in $(seq 1 60); do
            if auth_shell 'rs.initiate({_id:"qs-m4-auth-rs",members:[{_id:0,host:"127.0.0.1:27017"}]})' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "Owned auth fixture initialization failed after ${attempt} attempts" >&2
            exit 1
          fi
          ready=false
          for attempt in $(seq 1 60); do
            if auth_shell 'quit(db.hello().isWritablePrimary ? 0 : 1)' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "Owned auth fixture primary unavailable after ${attempt} attempts" >&2
            exit 1
          fi
          auth_shell 'print(db.version())'
          export QS_M4_TEST_MONGO_AUTH_CONFIG="${RUNNER_TEMP}/qs-m4-auth-config.json"
          python3 - <<'PYCONFIG'
          import json, os
          fd = os.open(os.environ["QS_M4_TEST_MONGO_AUTH_CONFIG"], os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, "w") as output:
              json.dump({"mongo_uri": "mongodb://qs_m4_ci_root:" + os.environ["QS_M4_AUTH_PASSWORD"] + "@127.0.0.1:27018/?authSource=admin&replicaSet=qs-m4-auth-rs&directConnection=true"}, output)
          PYCONFIG
          go test -race -tags=integration -count=1 -timeout=8m -v \
            -run '^TestHistoricalIndexNative' ./internal/pkg/migration \
            | tee "${RUNNER_TEMP}/historical-index.log"
          for test_name in \
            TestHistoricalIndexNativeMongoOnlyUpgradeAndRestart \
            TestHistoricalIndexNativeExactObjectRestoreAndConstraints \
            TestHistoricalIndexNativeDirtyObjectBackupRestore \
            TestHistoricalIndexNativePartialFailureAndDirtyRefuseRepairByForce \
            TestHistoricalIndexNativeUnknownMetadataStopsBeforeDDL \
            TestHistoricalIndexNativePermissionDeniedAfterMetadataWrite; do
            grep -q -- "--- PASS: ${test_name} " "${RUNNER_TEMP}/historical-index.log"
          done
          if grep -q -- '--- SKIP:' "${RUNNER_TEMP}/historical-index.log"; then
            echo 'Historical index retirement proof must not skip' >&2
            exit 1
          fi

      - name: Verify Actor SQL102 retirement and guarded object material restoration
        env:
          QS_M3_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true&multiStatements=true
          QS_M3_REQUIRE_DATABASE: '1'
          QS_SERVER_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          QS_SERVER_TEST_MONGO_DB_PREFIX: qs_m4_actor_ci_test
        run: |
          set -euo pipefail
          go test -race -tags=integration -count=1 -timeout=8m -v \
            -run '^TestActorColumnsNative' ./internal/pkg/migration \
            | tee "${RUNNER_TEMP}/actor-columns.log"
          for test_name in \
            TestActorColumnsNativeUpgradeRestartAndHistoricalArchive \
            TestActorColumnsNativePartialDDLRefusesRestartForceAndDown \
            TestActorColumnsNativeExactObjectValueRestoration \
            TestActorColumnsNativeOtherObjectScopesRefusedBeforeClaim \
            TestActorColumnsNativeOtherObjectScopesRefusedBeforeClaim/m4_sql_historical_columns \
            TestActorColumnsNativeOtherObjectScopesRefusedBeforeClaim/m4_mongo_historical_indexes \
            TestActorColumnsNativeDirtyObjectBackupRestore \
            TestActorColumnsNativeDirtyObjectBackupRestore/restore \
            TestActorColumnsNativeDirtyObjectBackupRestore/wrong_backup \
            TestActorColumnsNativeDirtyObjectBackupRestore/retained_fact_changed \
            TestActorColumnsNativeDirtyObjectBackupRestore/value_restore_failed \
            TestActorColumnsNativeDirtyObjectBackupRestore/ledger_replay_failed; do
            grep -q -- "=== RUN   ${test_name}$" "${RUNNER_TEMP}/actor-columns.log"
            grep -q -- "--- PASS: ${test_name} " "${RUNNER_TEMP}/actor-columns.log"
          done
          if grep -q -- '--- SKIP:' "${RUNNER_TEMP}/actor-columns.log"; then
            echo 'Actor retirement proof must not skip' >&2
            exit 1
          fi

      - name: Verify SQL103 legacy maintenance retirement and original object recovery
        env:
          QS_M3_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true&multiStatements=true
          QS_M3_REQUIRE_DATABASE: '1'
          QS_SERVER_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          QS_SERVER_TEST_MONGO_DB_PREFIX: qs_m4_maintenance_ci_test
        run: |
          set -euo pipefail
          go test -race -tags=integration -count=1 -timeout=8m -v \
            -run '^TestLegacyMaintenanceNative' ./internal/pkg/migration \
            | tee "${RUNNER_TEMP}/legacy-maintenance.log"
          for test_name in \
            TestLegacyMaintenanceNativeUpgradeRestartAndCurrentWrites \
            TestLegacyMaintenanceNativePartialDDLRefusesRestartForceAndDown \
            TestLegacyMaintenanceNativeDirtyObjectBackupRestore \
            TestLegacyMaintenanceNativeDirtyObjectBackupRestore/restore \
            TestLegacyMaintenanceNativeDirtyObjectBackupRestore/wrong_backup \
            TestLegacyMaintenanceNativeDirtyObjectBackupRestore/retained_fact_changed \
            TestLegacyMaintenanceNativeDirtyObjectBackupRestore/object_restore_failed \
            TestLegacyMaintenanceNativeDirtyObjectBackupRestore/before_ledger_interrupted \
            TestLegacyMaintenanceNativeDirtyObjectBackupRestore/ledger_replay_failed \
            TestLegacyMaintenanceNativeDirtyObjectBackupRestore/runtime_started \
            TestLegacyMaintenanceNativeWrongObjectScopesRefusedBeforeClaim \
            TestLegacyMaintenanceNativeWrongObjectScopesRefusedBeforeClaim/m4_sql_historical_columns \
            TestLegacyMaintenanceNativeWrongObjectScopesRefusedBeforeClaim/m4_mongo_historical_indexes \
            TestLegacyMaintenanceNativeWrongObjectScopesRefusedBeforeClaim/m4_actor_columns \
            TestLegacyMaintenanceNativeReappearedTableFailsClosed; do
            grep -q -- "=== RUN   ${test_name}$" "${RUNNER_TEMP}/legacy-maintenance.log"
            grep -q -- "--- PASS: ${test_name} " "${RUNNER_TEMP}/legacy-maintenance.log"
          done
          if grep -q -- '--- SKIP:' "${RUNNER_TEMP}/legacy-maintenance.log"; then
            echo 'Maintenance retirement proof must not skip' >&2
            exit 1
          fi

      - name: Stop owned Mongo index auth fixture
        if: always()
        run: |
          set -euo pipefail
          auth_cid="${QS_M4_MONGO_AUTH_CONTAINER:-}"
          if [ -n "$auth_cid" ]; then
            [[ "$auth_cid" =~ ^[0-9a-f]{64}$ ]]
            [ "$(docker inspect --format '{{ index .Config.Labels "qs.cleanup.owner" }}' "$auth_cid")" = m4-index-ci ]
            docker rm --force --volumes "$auth_cid"
          fi
          rm --force "${RUNNER_TEMP}/qs-m4-auth-config.json"

      - name: Verify committed evidence, retry governance and retirement A on real databases
        env:
          QS_COMPAT_OUTCOME_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true&multiStatements=true
          QS_COMPAT_REQUIRE_DATABASE: '1'
          MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true&multiStatements=true
          MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          QS_SERVER_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
        run: |
          go test -race -tags=integration -count=1 -timeout=5m ./internal/apiserver/infra/mysql/evaluation -run '^TestCommittedEvidenceAtomicNativeMySQL$'
          go test -race -tags=integration -count=1 -timeout=5m ./internal/apiserver/infra/retrygovernance
          go test -race -tags=integration -count=1 -timeout=5m ./internal/pkg/migration -run '^TestCompatibilityRetirementA'

      - name: Run Survey and ModelCatalog Mongo integration contracts
        env:
          QS_SERVER_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          QS_SERVER_TEST_MONGO_DB: qs_survey_ci_test
          QS_SERVER_TEST_MONGO_DB_PREFIX: qs_survey_ci_test
        run: |
          go test -tags=integration \
            -run '^(TestDurableSubmissionTransactionAgainstMongoReplicaSet|TestRepositoryConcurrentWritersUseRevisionCAS|TestDraftRepositoryConcurrentWritersUseRevisionCAS|TestStandaloneQuestionnaireLifecycleRollsBackOnPartialFailure|TestMongoReleasePairRollsBackEveryFailureBoundary|TestPublishReleaseRollsBackEveryPersistedBoundary)$' \
            -count=1 -timeout=10m -v \
            ./internal/apiserver/infra/mongo/answersheet \
            ./internal/apiserver/infra/mongo/questionnaire \
            ./internal/apiserver/infra/mongo/modelcatalog \
            ./internal/apiserver/container/modules/modelcatalog

      - name: Run Mongo runtime-ledger retirement guards
        env:
          QS_SERVER_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          QS_SERVER_TEST_MONGO_DB_PREFIX: qs_runtime_ledger_retirement_test
        run: |
          go test -tags=integration \
            -run '^(TestCompatibilityRetirementPreconditionRejectsLiveDataAndArchiveReferences|TestRuntimeLedgerRetirementPreconditionRejectsAnySourceDocument|TestRuntimeLedgerRetirementFromVersion22WithSourcesAlreadyDropped)$' \
            -count=1 -timeout=5m -v \
            ./internal/pkg/migration

      - name: Run Mongo transaction consistency integration contracts
        env:
          MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true&multiStatements=true&loc=Asia%2FShanghai
          QS_SERVER_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          QS_SERVER_TEST_MONGO_DB_PREFIX: qs_mongo_consistency_test
          QS_SERVER_TEST_MONGO_DB: qs_m5_resolution_fact_ci
        run: |
          go test -tags=integration \
            -run '^(TestInterpretationSuccessRollsBackEveryPersistedBoundary|TestInterpretationFailureAndScheduledRetryRollBackTogether|TestCurrentReportMetadataCarriesVerifiedSourceIdentityAgainstMongo|TestScannerDetectsEverySupportedDriftAgainstReplicaSet|TestScannerAcceptsMarkedHealthyTransactionsAgainstReplicaSet|TestScannerPagesSubmittedOutboxAcrossAggregateIDDigitWidths|TestMongoTransactionAuditIndexesUpDown|TestMongoConsistencyAuditCheckpointMySQLMigrationUpDown)$' \
            -count=1 -timeout=10m -v \
            ./internal/apiserver/infra/mongo/interpretation \
            ./internal/apiserver/infra/mongo/mongoconsistency \
            ./internal/pkg/migration

      - name: Run current runtime closure E2E
        env:
          MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true&multiStatements=true&loc=Asia%2FShanghai
          QS_SERVER_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          QS_SERVER_TEST_MONGO_DB_PREFIX: qs_runtime_closure_test
          QS_SERVER_TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: |
          go test -tags=integration \
            -ldflags "-X github.com/FangcunMount/qs-server/pkg/version.GitCommit=$(git rev-parse HEAD)" \
            -run '^TestCurrentRuntimeClosure$' \
            -count=1 -timeout=15m -v ./internal/apiserver/integration/runtimeclosure

      - name: Verify hot-rank and attention original-source recovery after broker loss
        env:
          M6_HOTRANK_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
          M6_HOTRANK_REDIS_ADDRESS: 127.0.0.1:6379
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          M6_ATTENTION_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/m6_attention_test?parseTime=true&loc=Asia%2FShanghai
        run: |
          set -euo pipefail
          M6_HOTRANK_OWNER="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          export M6_HOTRANK_OWNER
          export M6_HOTRANK_NSQ_CONTAINER="m6-hotrank-${M6_HOTRANK_OWNER}-nsq"
          nsq_volume="${M6_HOTRANK_NSQ_CONTAINER}-data"
          owner_label="m6-hotrank-proof-owner=${M6_HOTRANK_OWNER}"
          cleanup() {
            if docker container inspect "$M6_HOTRANK_NSQ_CONTAINER" >/dev/null 2>&1; then
              test "$(docker inspect --format '{{index .Config.Labels "m6-hotrank-proof-owner"}}' "$M6_HOTRANK_NSQ_CONTAINER")" = "$M6_HOTRANK_OWNER"
              docker rm -f "$M6_HOTRANK_NSQ_CONTAINER"
            fi
            if docker volume inspect "$nsq_volume" >/dev/null 2>&1; then
              test "$(docker volume inspect --format '{{index .Labels "m6-hotrank-proof-owner"}}' "$nsq_volume")" = "$M6_HOTRANK_OWNER"
              docker volume rm "$nsq_volume"
            fi
            docker exec "$MYSQL_CONTAINER" mysql -uroot -proot -e 'DROP DATABASE IF EXISTS m6_attention_test'
          }
          trap cleanup EXIT
          docker exec "$MYSQL_CONTAINER" mysql -uroot -proot -e 'CREATE DATABASE m6_attention_test'
          docker volume create --label "$owner_label" "$nsq_volume"
          docker run -d --name "$M6_HOTRANK_NSQ_CONTAINER" --label "$owner_label" \
            --memory 128m --cpus 0.5 --volume "$nsq_volume:/data" \
            -p 127.0.0.1::4150 -p 127.0.0.1::4151 \
            nsqio/nsq@sha256:1a369c146af71bc95c25d54b375a2b98452478c1eaf4e85f8fcb01da20f2c78a \
            /nsqd --data-path=/data --mem-queue-size=1000 --sync-every=1000 --sync-timeout=1h --broadcast-address=127.0.0.1
          tcp_port="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "4150/tcp") 0).HostPort}}' "$M6_HOTRANK_NSQ_CONTAINER")"
          http_port="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "4151/tcp") 0).HostPort}}' "$M6_HOTRANK_NSQ_CONTAINER")"
          export M6_HOTRANK_NSQ_ADDRESS="127.0.0.1:${tcp_port}"
          export M6_HOTRANK_NSQ_HTTP="http://127.0.0.1:${http_port}"
          export M6_HOTRANK_TOOL="${RUNNER_TEMP}/hotrank-day-rebuild"
          go build -o "$M6_HOTRANK_TOOL" ./scripts/oneoff/hotrank_day_rebuild
          go test -tags='integration reliable_messaging_m4' -run '^TestHotRankDayRecoveryAfterActualNSQConfirmationLoss$' \
            -count=1 -timeout=2m -v ./internal/apiserver/integration/runtimeclosure | tee "${RUNNER_TEMP}/hotrank-recovery.log"
          if grep -q -- '--- SKIP:' "${RUNNER_TEMP}/hotrank-recovery.log"; then
            echo 'Actual hot-rank recovery proof unexpectedly skipped' >&2
            exit 1
          fi
          grep -q -- '--- PASS: TestHotRankDayRecoveryAfterActualNSQConfirmationLoss' "${RUNNER_TEMP}/hotrank-recovery.log"
          # Run after the hot-rank proof: Attention creates a real channel,
          # while the hot-rank loss fixture intentionally starts without one.
          # The same-container restart may allocate new ephemeral host ports.
          tcp_port="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "4150/tcp") 0).HostPort}}' "$M6_HOTRANK_NSQ_CONTAINER")"
          http_port="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "4151/tcp") 0).HostPort}}' "$M6_HOTRANK_NSQ_CONTAINER")"
          export M6_HOTRANK_NSQ_ADDRESS="127.0.0.1:${tcp_port}"
          export M6_HOTRANK_NSQ_HTTP="http://127.0.0.1:${http_port}"
          go test -tags='integration reliable_messaging_m4' -run '^TestAttentionFactRecoveryAfterActualNSQConfirmationLoss$' \
            -count=1 -timeout=2m -v ./internal/apiserver/integration/runtimeclosure | tee "${RUNNER_TEMP}/attention-recovery.log"
          if grep -q -- '--- SKIP:' "${RUNNER_TEMP}/attention-recovery.log"; then
            echo 'Actual attention recovery proof unexpectedly skipped' >&2
            exit 1
          fi
          grep -q -- '--- PASS: TestAttentionFactRecoveryAfterActualNSQConfirmationLoss' "${RUNNER_TEMP}/attention-recovery.log"

      - name: Verify original-authority report retry recovery after broker loss
        env:
          M6_HOTRANK_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
        run: |
          set -euo pipefail
          # Use a fresh owned broker: prior Attention proof leaves a channel,
          # while this fault requires confirmed messages still in topic memory.
          M6_HOTRANK_OWNER="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          export M6_HOTRANK_OWNER
          export M6_HOTRANK_NSQ_CONTAINER="m6-hotrank-${M6_HOTRANK_OWNER}-nsq"
          nsq_volume="${M6_HOTRANK_NSQ_CONTAINER}-data"
          owner_label="m6-hotrank-proof-owner=${M6_HOTRANK_OWNER}"
          cleanup() {
            if docker container inspect "$M6_HOTRANK_NSQ_CONTAINER" >/dev/null 2>&1; then
              test "$(docker inspect --format '{{index .Config.Labels "m6-hotrank-proof-owner"}}' "$M6_HOTRANK_NSQ_CONTAINER")" = "$M6_HOTRANK_OWNER"
              docker rm -f "$M6_HOTRANK_NSQ_CONTAINER"
            fi
            if docker volume inspect "$nsq_volume" >/dev/null 2>&1; then
              test "$(docker volume inspect --format '{{index .Labels "m6-hotrank-proof-owner"}}' "$nsq_volume")" = "$M6_HOTRANK_OWNER"
              docker volume rm "$nsq_volume"
            fi
          }
          trap cleanup EXIT
          docker volume create --label "$owner_label" "$nsq_volume"
          docker run -d --name "$M6_HOTRANK_NSQ_CONTAINER" --label "$owner_label" \
            --memory 128m --cpus 0.5 --volume "$nsq_volume:/data" \
            -p 127.0.0.1::4150 -p 127.0.0.1::4151 \
            nsqio/nsq@sha256:1a369c146af71bc95c25d54b375a2b98452478c1eaf4e85f8fcb01da20f2c78a \
            /nsqd --data-path=/data --mem-queue-size=1000 --sync-every=1000 --sync-timeout=1h --broadcast-address=127.0.0.1
          tcp_port="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "4150/tcp") 0).HostPort}}' "$M6_HOTRANK_NSQ_CONTAINER")"
          http_port="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "4151/tcp") 0).HostPort}}' "$M6_HOTRANK_NSQ_CONTAINER")"
          export M6_HOTRANK_NSQ_ADDRESS="127.0.0.1:${tcp_port}"
          export M6_HOTRANK_NSQ_HTTP="http://127.0.0.1:${http_port}"
          export M6_RETRY_RECOVERY_TOOL="${RUNNER_TEMP}/interpretation-retry-recover"
          go build -o "$M6_RETRY_RECOVERY_TOOL" ./scripts/oneoff/interpretation_retry_recover
          go test -tags='integration reliable_messaging_m4' -run '^TestOriginalReportRetryRecoveryAfterActualNSQConfirmationLoss$' \
            -count=1 -timeout=2m -v ./internal/apiserver/integration/runtimeclosure | tee "${RUNNER_TEMP}/original-retry-recovery.log"
          if grep -q -- '--- SKIP:' "${RUNNER_TEMP}/original-retry-recovery.log"; then
            echo 'Actual original-authority retry recovery proof unexpectedly skipped' >&2
            exit 1
          fi
          grep -q -- '--- PASS: TestOriginalReportRetryRecoveryAfterActualNSQConfirmationLoss' "${RUNNER_TEMP}/original-retry-recovery.log"

      - name: Stop Mongo Replica Set
        if: always()
        run: |
          set -euo pipefail
          mongo_cid="${QS_RUNTIME_CLOSURE_MONGO_CONTAINER:-}"
          if [ -z "$mongo_cid" ]; then exit 0; fi
          [[ "$mongo_cid" =~ ^[0-9a-f]{64}$ ]]
          docker rm --force --volumes "$mongo_cid"

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Install dependencies
        run: |
          go mod download

      - name: Check formatting
        run: |
          make fmt-check

      - name: golangci-lint (pull request diff)
        if: github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.5.0
          only-new-issues: false
          args: --timeout=5m --new-from-rev=${{ github.event.pull_request.base.sha }}

      - name: golangci-lint (push diff)
        if: github.event_name != 'pull_request'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.5.0
          only-new-issues: true
          args: --timeout=5m

  lint-boundaries:
    name: Layer Boundaries (depguard)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: golangci-lint (depguard)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.5.0
          args: --config=.golangci-depguard.yml --timeout=5m

  deployment-contracts:
    name: Deployment Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Validate GitHub Actions
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"

      - name: Validate GitHub Action runtime contract
        run: bash scripts/cd/test-github-action-runtimes.sh


      - name: Test deployment lock bootstrap
        run: python3 scripts/cd/test_image_deploy_lock.py

      - name: Test per-instance deployment evidence
        run: python3 scripts/cd/test-runtime-evidence.py

      - name: Validate deployment shell scripts
        run: bash -n scripts/cd/*.sh

      - name: Validate runner network contract
        run: bash scripts/cd/test-setup-runner-network.sh

      - name: Validate deployment package contract
        run: bash scripts/cd/test-prepare-package.sh

      - name: Validate direct registry deployment contract
        run: python3 scripts/cd/test-direct-registry-deploy.py

      - name: Validate deployment image export contract
        run: bash scripts/cd/test-export-image.sh

      - name: Validate deployment planning contract
        run: bash scripts/cd/test-plan-services.sh

      - name: Validate production network exposure contract
        run: bash scripts/cd/test-production-compose-network-exposure.sh

      - name: Validate worker deployment readiness gate
        run: bash scripts/cd/test-wait-worker-readiness.sh

      - name: Validate worker dependency preflight gate
        run: bash scripts/cd/test-verify-worker-dependencies.sh

      - name: Validate worker governance convergence gate
        run: bash scripts/cd/test-verify-worker-governance.sh

      - name: Validate public observability convergence gate
        run: bash scripts/cd/test-verify-observability-nginx.sh

      - name: Validate Attention reconcile dry-run/apply audit contract
        run: bash scripts/cd/test-attention-reconcile-audit.sh

      - name: Validate compatibility observation contract
        run: bash scripts/cd/test-compatibility-observation.sh

      - name: Validate production AuthZ matrix contract
        run: bash scripts/cd/test-verify-authz-production-matrix.sh

      - name: Validate production AuthZ matrix evaluator provisioning contract
        run: bash scripts/cd/test-provision-authz-production-matrix-evaluator.sh

      - name: Validate production Compose
        run: |
          printf '%s\n' \
            'services:' \
            '  qs-apiserver:' \
            '    env_file: !reset []' \
            '  server:' \
            '    env_file: !reset []' \
            '  runtime:' \
            '    env_file: !reset []' |
            docker compose -f build/docker/docker-compose.prod.yml -f - config -q

  security:
    name: Security Scan (Advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Download dependencies
        run: |
          go mod download

      - name: Install security tools
        run: |
          make install-security-tools

      - name: Run govulncheck (advisory)
        continue-on-error: true
        run: |
          make security-govulncheck-ci

      - name: Run gosec (advisory)
        continue-on-error: true
        run: |
          make security-gosec-ci

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: tmp/security/
          retention-days: 7

  maintainability:
    name: Maintainability Scan (Advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Download dependencies
        run: |
          go mod download

      - name: Install golangci-lint
        run: |
          GOBIN="$(pwd)/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0
          echo "$(pwd)/bin" >> "$GITHUB_PATH"

      - name: Run maintainability advisory
        continue-on-error: true
        run: |
          make maintainability-lint-ci

      - name: Upload maintainability reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maintainability-reports
          path: tmp/maintainability/
          retention-days: 7

  tier1-test-policy:
    name: Tier 1 Test Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Tier 1 package policy
        run: |
          make tier1-test-policy

  docs:
    name: Docs Hygiene & Facts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with history for source-baseline verification
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run offline documentation gates
        run: |
          make docs-check

  docs-api-sync:
    name: Docs & API Generated Sync
    if: ${{ vars.DOCS_VERIFY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Install PyYAML
        run: |
          python -m pip install --quiet pyyaml

      - name: Install swagger toolchain
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.4

      - name: Download dependencies
        run: |
          go mod download

      - name: Verify generated API contracts
        run: |
          make docs-api-verify

      - name: Ensure no doc drift
        run: |
          git diff --exit-code

  build:
    name: Build Applications
    needs: [test, actor-store-mysql, runtime-closure-e2e, lint, lint-boundaries, deployment-contracts, tier1-test-policy, docs]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [apiserver, collection, worker]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Build ${{ matrix.service }}
        run: |
          make build-${{ matrix.service }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: qs-${{ matrix.service }}
          path: bin/*
          retention-days: 7

  qs03-original-effect-recovery:
    name: QS-03 original effect recovery after actual broker loss
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Log in for CI image pulls
        if: env.CI_DOCKERHUB_LOGIN == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          logout: true
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Prove original recovery command and normal late Worker deliveries
        run: bash scripts/testing/m6-qs03-original-recovery-proof.sh "${RUNNER_TEMP}/qs03-original-effect-proof"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qs03-original-effect-proof
          path: ${{ runner.temp }}/qs03-original-effect-proof
          if-no-files-found: error
          retention-days: 14

  original-effects-recovery:
    name: QS-05/06 original business effects after actual broker loss
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Log in for CI image pulls
        if: env.CI_DOCKERHUB_LOGIN == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          logout: true
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Prove original grant and frozen initial report via actual operator command
        run: bash scripts/testing/m6-original-effects-recovery-proof.sh "${RUNNER_TEMP}/original-effects-proof"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: original-effects-proof
          path: ${{ runner.temp }}/original-effects-proof
          if-no-files-found: error
          retention-days: 14
