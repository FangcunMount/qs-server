name: CI

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: '1.25.12'
  GOTOOLCHAIN: auto
  # Only availability is shared; credentials stay in the service/login inputs.
  CI_DOCKERHUB_LOGIN: ${{ secrets.DOCKERHUB_USERNAME != '' || secrets.DOCKERHUB_TOKEN != '' }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Get dependencies
        run: |
          go mod download
          go mod verify

      - name: Check retired service authentication
        run: python3 scripts/check_service_token_retirement.py

      - name: Run tests
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Compile all integration-tag contracts
        run: |
          go test -tags=integration -run '^$' ./...

      - name: Verify M4 standard Outbox build
        run: |
          go build -tags=reliable_messaging_m4 ./cmd/qs-apiserver ./cmd/collection-server ./cmd/qs-worker
          go test -tags=reliable_messaging_m4 ./internal/apiserver/application/systemgovernance ./internal/apiserver/infra/mysql/systemgovernance ./internal/apiserver/transport/rest ./internal/apiserver/process
          go vet -tags=reliable_messaging_m4 ./internal/apiserver/application/systemgovernance ./internal/apiserver/infra/mysql/systemgovernance ./internal/apiserver/transport/rest ./internal/apiserver/process

      - name: Generate coverage report
        run: |
          go tool cover -func=coverage.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 14

  metadata-readiness-mysql-native:
    name: MySQL Native Metadata and Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0.36
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          MYSQL_ROOT_PASSWORD: m4-owned-mysql-fixture
        ports:
          - 3306/tcp
        options: >-
          --memory=1g --cpus=1
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pm4-owned-mysql-fixture"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run wrapper and receipt contracts
        run: |
          python3 -B scripts/testing/test-m4-metadata-readiness-native-proof.py
          python3 -B scripts/dbops/test-mysql-metadata-readiness.py
          python3 -B scripts/dbops/test-mysql-retirement-inventory.py
          python3 -B scripts/dbops/test-mysql-metadata-profile.py
          python3 -B scripts/dbops/test-mysql-metadata-profile-ssh.py
          python3 -B scripts/dbops/test-receipt-transport.py
      - name: Verify owned MySQL metadata selectors really run
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          MYSQL_HOST: '127.0.0.1'
          MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
          MYSQL_USERNAME: root
          MYSQL_PASSWORD: m4-owned-mysql-fixture
          QS_METADATA_PROFILE_NATIVE_REQUIRED: '1'
        run: |
          set -Eeuo pipefail
          export MYSQL_DATABASE="qs_profile_owned_${GITHUB_RUN_ID}"
          [[ "$MYSQL_DATABASE" =~ ^qs_profile_owned_[a-z0-9]{8,24}$ && "$MYSQL_PORT" != 3306 ]] || exit 1
          docker exec --env MYSQL_PWD="$MYSQL_PASSWORD" "$MYSQL_CONTAINER" mysql -uroot -e \
            "CREATE DATABASE $MYSQL_DATABASE; SET GLOBAL partial_revokes=ON; UPDATE performance_schema.setup_instruments SET ENABLED='YES', TIMED='YES' WHERE NAME='wait/lock/metadata/sql/mdl';"
          QS_METADATA_PROFILE_NATIVE_UUID="$(docker exec --env MYSQL_PWD="$MYSQL_PASSWORD" "$MYSQL_CONTAINER" mysql -uroot -N -e 'SELECT @@server_uuid')"
          export QS_METADATA_PROFILE_NATIVE_UUID
          make test-metadata-readiness-mysql-native

  metadata-readiness-mongodb-native:
    name: MongoDB Authenticated Native Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0.36
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          MYSQL_ROOT_PASSWORD: m4-owned-object-fixture
        ports:
          - 3306/tcp
        options: >-
          --memory=1g --cpus=1
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pm4-owned-object-fixture"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Log in for the pinned fixture image
        if: env.CI_DOCKERHUB_LOGIN == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          logout: true
      - name: Run MongoDB wrapper and receipt contracts
        run: |
          python3 -B scripts/testing/test-m4-metadata-readiness-native-proof.py
          python3 -B scripts/dbops/test-mongodb-metadata-profile.py
          python3 -B scripts/dbops/test-receipt-transport.py
      - name: Verify an owned authenticated MongoDB 7.0.31 replica set
        env:
          OBJECT_MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: |
          set -Eeuo pipefail
          fixture_owner="${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          [[ "$fixture_owner" =~ ^[a-z0-9]{8,24}$ ]] || exit 1
          fixture_name="qs-mongo-profile-owned-${fixture_owner}"
          fixture_network="$fixture_name"
          fixture_cid=''
          fixture_network_created=false
          fixture_image='mongo@sha256:43fddee7e532a920f3dfdee9e8f4834398c155c26bcb92d790cc1cd3c630fc40'
          cleanup_owned_fixture() {
            fixture_status=$?
            if [ -n "$fixture_cid" ]; then
              [[ "$fixture_cid" =~ ^[0-9a-f]{64}$ ]] || return 1
              [[ "$(docker inspect --format '{{index .Config.Labels "qs.mongo-metadata.fixture"}}' "$fixture_cid")" == "$fixture_owner" ]] || return 1
              [[ "$(docker inspect --format '{{.Name}}' "$fixture_cid")" == "/$fixture_name" ]] || return 1
              docker rm -f "$fixture_cid" >/dev/null
              fixture_remaining="$(docker ps --all --no-trunc --filter "id=$fixture_cid" --format '{{.ID}}')" || return 1
              [[ -z "$fixture_remaining" ]] || return 1
            fi
            if [ "$fixture_network_created" == true ]; then
              [[ "$(docker network inspect --format '{{index .Labels "qs.mongo-metadata.fixture"}}' "$fixture_network")" == "$fixture_owner" ]] || return 1
              [[ "$(docker network inspect --format '{{len .Containers}}' "$fixture_network")" == 0 ]] || return 1
              docker network rm "$fixture_network" >/dev/null
            fi
            return "$fixture_status"
          }
          trap cleanup_owned_fixture EXIT
          if docker inspect "$fixture_name" >/dev/null 2>&1 || docker network inspect "$fixture_network" >/dev/null 2>&1; then exit 1; fi
          docker network create --label "qs.mongo-metadata.fixture=$fixture_owner" "$fixture_network" >/dev/null
          fixture_network_created=true
          fixture_cid="$(docker run --detach --name "$fixture_name" \
            --label "qs.mongo-metadata.fixture=$fixture_owner" \
            --network "$fixture_network" --network-alias mongo \
            --publish 127.0.0.1::27017 --memory=2g --memory-swap=2g --cpus=1 \
            --tmpfs /data/db:rw,nosuid,nodev,size=1g \
            --tmpfs /data/configdb:rw,nosuid,nodev,size=128m \
            --env MONGO_INITDB_ROOT_USERNAME=metadata_fixture \
            --env MONGO_INITDB_ROOT_PASSWORD=m4-owned-mongo-fixture \
            --entrypoint bash "$fixture_image" -c \
            'set -Eeuo pipefail; umask 077; head -c 512 /dev/urandom | base64 > /tmp/metadata-fixture.key; chown 999:999 /tmp/metadata-fixture.key; chmod 0400 /tmp/metadata-fixture.key; exec /usr/local/bin/docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /tmp/metadata-fixture.key --wiredTigerCacheSizeGB 0.25')"
          [[ "$fixture_cid" =~ ^[0-9a-f]{64}$ ]] || exit 1
          fixture_shell='const admin=db.getSiblingDB("admin"); const auth=admin.auth(process.env.MONGO_INITDB_ROOT_USERNAME,process.env.MONGO_INITDB_ROOT_PASSWORD); if(!(auth===1||auth.ok===1))quit(1);'
          fixture_ready=false
          fixture_attempt=0
          while (( fixture_attempt < 45 )); do
            fixture_attempt=$((fixture_attempt + 1))
            if docker exec "$fixture_cid" mongosh --quiet --eval "$fixture_shell quit(admin.runCommand({ping:1}).ok===1?0:1)" >/dev/null 2>&1; then fixture_ready=true; break; fi
            sleep 2
          done
          [[ "$fixture_ready" == true ]] || exit 1
          docker exec "$fixture_cid" mongosh --quiet --eval "$fixture_shell const build=admin.runCommand({buildInfo:1}); const h=admin.runCommand({hello:1}); if(build.version!=='7.0.31'||h.isreplicaset!==true||h.setName)quit(1); admin.runCommand({replSetInitiate:{_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}})" >/dev/null
          fixture_ready=false
          fixture_attempt=0
          while (( fixture_attempt < 45 )); do
            fixture_attempt=$((fixture_attempt + 1))
            if docker exec "$fixture_cid" mongosh --quiet --eval "$fixture_shell quit(admin.runCommand({hello:1}).isWritablePrimary?0:1)" >/dev/null 2>&1; then fixture_ready=true; break; fi
            sleep 2
          done
          [[ "$fixture_ready" == true ]] || exit 1
          export QS_MONGO_METADATA_NATIVE_REQUIRED=1
          export QS_MONGO_METADATA_NATIVE_OWNER="$fixture_owner"
          export QS_MONGO_METADATA_NATIVE_CONTAINER="$fixture_name"
          QS_MONGO_METADATA_NATIVE_PORT="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "27017/tcp") 0).HostPort}}' "$fixture_cid")"
          export QS_MONGO_METADATA_NATIVE_PORT
          export QS_MONGO_METADATA_NATIVE_PASSWORD=m4-owned-mongo-fixture
          make test-metadata-readiness-mongodb-native
          # Reuse this owned replica set and the job-owned MySQL for the fixed A/B object tools.
          [[ "$OBJECT_MYSQL_PORT" =~ ^[0-9]+$ && "$OBJECT_MYSQL_PORT" != 3306 ]] || exit 1
          export QS_M4_OBJECT_NATIVE_REQUIRED=1
          export QS_M4_OBJECT_NATIVE_DISPOSABLE_ACK=owned_synthetic_dependencies_only
          export QS_M4_OBJECT_NATIVE_MYSQL_DSN="root:m4-owned-object-fixture@tcp(127.0.0.1:${OBJECT_MYSQL_PORT})/mysql?multiStatements=true"
          export QS_M4_OBJECT_NATIVE_MONGO_URI="mongodb://metadata_fixture:m4-owned-mongo-fixture@127.0.0.1:${QS_MONGO_METADATA_NATIVE_PORT}/?replicaSet=rs0&directConnection=true&authSource=admin"
          object_source="$(git rev-parse HEAD)"
          [[ "$object_source" =~ ^[0-9a-f]{40}$ ]] || exit 1
          GOMAXPROCS=2 go test -p=2 -race -tags=integration -count=1 -timeout=8m -json \
            -ldflags="-X github.com/FangcunMount/qs-server/pkg/version.GitCommit=$object_source" \
            -run='^TestM4SQLObjectNative' ./scripts/oneoff/m4_sql_historical_protection | tee object-native.jsonl
          python3 - object-native.jsonl <<'PY_OBJECT_PROOF'
          import json, sys
          expected = {
              'TestM4SQLObjectNativeCaptureAndTargetVerification',
              'TestM4SQLObjectNativeOriginalDefinitionDriftRefused',
              'TestM4SQLObjectNativeRecoveryMatrix',
              'TestM4SQLObjectNativePermissionAndLedgerFailure',
              'TestM4SQLObjectNativePostStartNewFactsAndNonNullRefused',
              'TestM4SQLObjectNativeCommitResponseLossRemainsUnknown',
              'TestM4SQLObjectNativeUnsignedBoundaryAndMandatoryEOF',
              'TestM4SQLObjectNativeCharsetBoundRecovery',
              'TestM4SQLObjectNativeCharsetBoundRecovery/UTF8MB3DirtyFirstDDLToolMB4',
              'TestM4SQLObjectNativeCharsetBoundRecovery/UTF8MB3CleanBothDDLToolMB4',
              'TestM4SQLObjectNativeCharsetBoundRecovery/UTF8MB4DirtyFirstDDLToolMB3',
              'TestM4SQLObjectNativeCharsetBoundRecovery/UTF8MB4CleanBothDDLToolMB3',
              'TestM4SQLObjectNativeExistingEncodingMismatchRefusedBeforeClaim',
              'TestM4SQLObjectNativeRestoreDDLDeadlines',
              'TestM4SQLObjectNativeRestoreDDLDeadlines/pending_over_five_seconds_then_complete',
              'TestM4SQLObjectNativeRestoreDDLDeadlines/earlier_approval_deadline',
              'TestM4SQLObjectNativeRestoreDDLDeadlines/earlier_approval_expiry',
          }
          events = [json.loads(line) for line in open(sys.argv[1], encoding='utf-8')]
          if any(event.get('Action') in ('skip', 'fail') for event in events):
              raise SystemExit('A object native proof cannot skip or fail')
          for action in ('run', 'pass'):
              actual = {event.get('Test') for event in events if event.get('Action') == action and event.get('Test') in expected}
              if actual != expected:
                  raise SystemExit('A object native selectors did not all RUN/PASS')
          print('A object native: ten top-level, four cross-charset and three deadline selectors RUN/PASS; zero SKIP')
          PY_OBJECT_PROOF
          # B reuses the same owned pair only after the A process has exited.
          GOMAXPROCS=2 go test -p=2 -race -tags=integration -count=1 -timeout=8m -json \
            -ldflags="-X github.com/FangcunMount/qs-server/pkg/version.GitCommit=$object_source" \
            -run='^TestM4MongoObjectNative' ./scripts/oneoff/m4_mongo_historical_protection | tee mongo-object-native.jsonl
          python3 - mongo-object-native.jsonl "$object_source" <<'PY_MONGO_OBJECT_PROOF'
          import json, sys
          expected = {
              'TestM4MongoObjectNativeCaptureUpgradeVerify',
              'TestM4MongoObjectNativeRestoreMatrix',
              'TestM4MongoObjectNativeRestoreMatrix/DirtyPrefix0',
              'TestM4MongoObjectNativeRestoreMatrix/DirtyPrefix1',
              'TestM4MongoObjectNativeRestoreMatrix/DirtyPrefix2',
              'TestM4MongoObjectNativeRestoreMatrix/DirtyPrefix3',
              'TestM4MongoObjectNativeRestoreMatrix/DirtyPrefix4',
              'TestM4MongoObjectNativeRestoreMatrix/CleanAll4',
              'TestM4MongoObjectNativeIndexConflictKeepsDirty',
              'TestM4MongoObjectNativeInterruptedLedgerTransaction',
              'TestM4MongoObjectNativeCommitResponseLossUnknown',
              'TestM4MongoObjectNativePreclaimBoundaries',
              'TestM4MongoObjectNativePreclaimBoundaries/FirstRuntimeMarker',
              'TestM4MongoObjectNativePreclaimBoundaries/ChangedExternalMaterial',
              'TestM4MongoObjectNativePreclaimBoundaries/ExpiredApproval',
              'TestM4MongoObjectNativePreclaimBoundaries/RepeatedUse',
              'TestM4MongoObjectNativePreclaimBoundaries/FutureSQL102',
              'TestM4MongoObjectNativeInterruptedIndexRestoreResumesWithNewApproval',
              'TestM4MongoObjectNativeInterruptedIndexRestoreResumesWithNewApproval/DirtyAfterACK1',
              'TestM4MongoObjectNativeInterruptedIndexRestoreResumesWithNewApproval/DirtyAfterACK2',
              'TestM4MongoObjectNativeInterruptedIndexRestoreResumesWithNewApproval/DirtyAfterACK3',
              'TestM4MongoObjectNativeInterruptedIndexRestoreResumesWithNewApproval/DirtyAfterACK4',
              'TestM4MongoObjectNativeInterruptedIndexRestoreResumesWithNewApproval/CleanAfterACK1',
              'TestM4MongoObjectNativeInterruptedIndexRestoreResumesWithNewApproval/CleanAfterACK2',
              'TestM4MongoObjectNativeInterruptedIndexRestoreResumesWithNewApproval/CleanAfterACK3',
              'TestM4MongoObjectNativeInterruptedIndexRestoreResumesWithNewApproval/CleanAfterACK4',
              'TestM4MongoObjectNativeRecoveryApprovalIdentityAndBoundary',
              'TestM4MongoObjectNativeRecoveryApprovalIdentityAndBoundary/CopiedApprovalPath',
              'TestM4MongoObjectNativeRecoveryApprovalIdentityAndBoundary/ReencodedSameOperation',
              'TestM4MongoObjectNativeRecoveryApprovalIdentityAndBoundary/ExtendedDeadline',
              'TestM4MongoObjectNativeRecoveryApprovalIdentityAndBoundary/ChangedDecision',
              'TestM4MongoObjectNativeRecoveryApprovalIdentityAndBoundary/ChangedMarkerAfterFirstRuntime',
              'TestM4MongoObjectNativeRecoveryApprovalIdentityAndBoundary/CopiedMaterialPath',
              'TestM4MongoObjectNativeRecoveryApprovalIdentityAndBoundary/MissingBoundaryAfterClaim',
              'TestM4MongoObjectNativeRecoveryApprovalIdentityAndBoundary/CorruptBoundary',
              'TestM4MongoObjectNativeFirstRuntimeDuringFinalSQLRead',
          }
          events = [json.loads(line) for line in open(sys.argv[1], encoding='utf-8')]
          matched = {action: sorted({event.get('Test') for event in events if event.get('Action') == action and event.get('Test') in expected}) for action in ('run', 'pass')}
          failures = sum(event.get('Action') == 'fail' for event in events)
          skips = sum(event.get('Action') == 'skip' for event in events)
          sources = {event['Output'].strip().split('native compiled tool source: ', 1)[1] for event in events if 'native compiled tool source: ' in event.get('Output', '')}
          print(json.dumps({'proof': 'B object native', 'compiled_tool_sources': sorted(sources), 'required': len(expected), 'matched': matched, 'fail_events': failures, 'skip_events': skips}, sort_keys=True))
          if failures or skips:
              raise SystemExit('B object native proof cannot skip or fail')
          if sources != {sys.argv[2]}:
              raise SystemExit('B object native compiled source differs from actual checkout')
          for action in ('run', 'pass'):
              if set(matched[action]) != expected:
                  raise SystemExit('B object native selectors did not all RUN/PASS')
          PY_MONGO_OBJECT_PROOF

  action-audit-mysql:
    name: Action audit MySQL JSON lifecycle
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: action_audit_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verify action audit and delivery reconciliation against MySQL
        env:
          QS_ACTION_AUDIT_REQUIRE_MYSQL: 'true'
          QS_SERVER_TEST_MYSQL_DSN: 'root:root@tcp(127.0.0.1:3306)/action_audit_test?parseTime=true'
        run: go test ./internal/apiserver/infra/mysql/systemgovernance -run '^(TestActionAuditLifecycleWithJSONColumns|TestDeliveryReplayReviewsKeepStaleAuditsVisibleWithoutCrossOrgRows|TestDeliveryResolutionRequiresCompleteEvidenceAndCommitsAtomicallyMySQL|TestDeliveryResolutionConcurrentOperatorsSettleOnceMySQL|TestReportGeneratedResolutionRequiresEveryDurableEffectMySQL)$' -count=1 -v
      - name: Verify transport replay batch guard against MySQL
        env:
          MYSQL_DSN: 'root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true&loc=Asia%2FShanghai'
        run: go test -tags=integration ./internal/apiserver/infra/mysql/eventdelivery -run '^TestDeliveryReplayClaimsAreScopedAndUncertainClaimsAreNotResent$' -count=1 -v
      - name: Verify attention projection evidence identity against MySQL
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          QS_ATTENTION_LEDGER_MYSQL_REQUIRED: '1'
          QS_ATTENTION_LEDGER_MYSQL_DSN: 'root:root@tcp(127.0.0.1:3306)/attention_ledger_ci?parseTime=true&loc=Asia%2FShanghai'
        run: |
          docker exec "$MYSQL_CONTAINER" mysql -uroot -proot -e 'CREATE DATABASE attention_ledger_ci'
          trap 'docker exec "$MYSQL_CONTAINER" mysql -uroot -proot -e "DROP DATABASE attention_ledger_ci"' EXIT
          go test -tags=integration ./internal/pkg/attentionprojection -run '^TestAttentionProjectionEvidenceIdentityAndSuccessAreStableMySQL$' -count=1 -v

  authz-guard-two-process-mysql:
    name: AuthZ committed version two-process MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: qs_authz_guard_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verify committed revocation across two QS authorization processes
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          QS_SERVER_TEST_IAM_VERSION_DSN: 'root:root@tcp(127.0.0.1:3306)/qs_authz_guard_test?parseTime=true&loc=Asia%2FShanghai'
        run: |
          docker exec "$MYSQL_CONTAINER" mysql -uroot -proot -e "SET GLOBAL time_zone='+08:00'"
          go test -race -tags=integration ./internal/pkg/iamauth -run '^TestTwoProcessCommittedRevocationWithoutNotification$' -count=1 -v

  actor-store-mysql:
    name: Actor Store MySQL Transactions
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verify store migration and transaction rollback
        env:
          QS_STORE_REQUIRE_MYSQL: 'true'
          QS_SERVER_TEST_MYSQL_DSN: 'root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true'
        run: go test ./internal/apiserver/infra/mysql/actor/store -run TestMySQLStore -count=1 -v
      - name: Verify testee store ownership and transaction rollback
        env:
          QS_TESTEE_STORE_REQUIRE_MYSQL: 'true'
          QS_SERVER_TEST_MYSQL_DSN: 'root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true'
        run: go test ./internal/apiserver/infra/mysql/actor/testeestore -count=1 -v
      - name: Verify operator retirement and audited recovery atomicity
        env:
          QS_OPERATOR_RETIREMENT_REQUIRE_MYSQL: 'true'
          QS_SERVER_TEST_MYSQL_DSN: 'root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true'
        run: go test ./internal/apiserver/infra/mysql/actor/operatorretirement ./internal/apiserver/maintenance/operatorretire ./internal/apiserver/maintenance/operatorrecovery ./internal/apiserver/maintenance/operatorprepare -count=1 -v
      - name: Verify scoped statistics on MySQL
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          QS_SCOPE_MYSQL_REQUIRED: '1'
          QS_SCOPE_MYSQL_DSN: 'root:root@tcp(127.0.0.1:3306)/qs_scope_test_ci?parseTime=true&loc=UTC'
        run: |
          docker exec "$MYSQL_CONTAINER" mysql -uroot -proot -e 'CREATE DATABASE qs_scope_test_ci'
          trap 'docker exec "$MYSQL_CONTAINER" mysql -uroot -proot -e "DROP DATABASE qs_scope_test_ci"' EXIT
          go test ./internal/apiserver/infra/mysql/statistics -run '^TestScoped(Overview|ClinicianAnalysis)MySQL$' -count=1 -v
      - name: Verify Actor activity persistence and current-read serialization
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          QS_SCOPE_MYSQL_REQUIRED: '1'
          QS_SCOPE_MYSQL_DSN: 'root:root@tcp(127.0.0.1:3306)/qs_scope_test_edit?parseTime=true&loc=UTC'
        run: |
          docker exec "$MYSQL_CONTAINER" mysql -uroot -proot -e 'CREATE DATABASE qs_scope_test_edit'
          trap 'docker exec "$MYSQL_CONTAINER" mysql -uroot -proot -e "DROP DATABASE qs_scope_test_edit"' EXIT
          go test ./internal/apiserver/infra/mysql/actor -run '^Test(OperatorActivityRoundTrip|TesteeEditWaitsForTransfer|RelationLockReadsCurrentStateAfterConcurrentUnbind)MySQL$' -count=1 -v

      - name: Verify plan enrollment ownership transaction
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          QS_SCOPE_MYSQL_REQUIRED: '1'
          QS_SCOPE_MYSQL_DSN: 'root:root@tcp(127.0.0.1:3306)/qs_scope_test_enrollment?parseTime=true&loc=UTC'
        run: |
          docker exec "$MYSQL_CONTAINER" mysql -uroot -proot -e 'CREATE DATABASE qs_scope_test_enrollment'
          trap 'docker exec "$MYSQL_CONTAINER" mysql -uroot -proot -e "DROP DATABASE qs_scope_test_enrollment"' EXIT
          go test ./internal/apiserver/infra/mysql/plan -run '^TestPlanEnrollmentOwnershipConcurrencyMySQL$' -count=1 -v

      - name: Verify Plan opening CAS and atomic reminder intent on MySQL
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          QS_M5_TASK_OPEN_MYSQL_REQUIRED: '1'
          QS_M5_TASK_OPEN_MYSQL_DSN: 'root:root@tcp(127.0.0.1:3306)/qs_m5_task_open_test_ci?parseTime=true&loc=UTC'
        run: |
          set -euo pipefail
          docker exec "$MYSQL_CONTAINER" mysql -uroot -proot -e 'CREATE DATABASE qs_m5_task_open_test_ci'
          trap 'docker exec "$MYSQL_CONTAINER" mysql -uroot -proot -e "DROP DATABASE qs_m5_task_open_test_ci"' EXIT
          bash scripts/testing/m5-plan-open-cas-proof.sh

      - name: Verify durable reminder ledger and recipient-set freeze on MySQL
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          QS_M5_REMINDER_LEDGER_MYSQL_REQUIRED: '1'
          QS_M5_REMINDER_LEDGER_MYSQL_DSN: 'root:root@tcp(127.0.0.1:3306)/qs_m5_reminder_ledger_test_ci?parseTime=true&loc=Asia%2FShanghai'
        run: |
          docker exec "$MYSQL_CONTAINER" mysql -uroot -proot -e 'CREATE DATABASE qs_m5_reminder_ledger_test_ci'
          trap 'docker exec "$MYSQL_CONTAINER" mysql -uroot -proot -e "DROP DATABASE qs_m5_reminder_ledger_test_ci"' EXIT
          go test ./internal/apiserver/infra/mysql/notification -run '^TestReminder(BatchFreezesCompleteRecipientSetAcrossConsumers|DeliveryLedgerSurvivesCompetingConsumersAndUnknownSend)$' -count=1 -v


      - name: Verify reminder manual resolution transaction on MySQL
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          QS_REMINDER_RESOLUTION_MYSQL_REQUIRED: '1'
          QS_REMINDER_RESOLUTION_MYSQL_DSN: 'root:root@tcp(127.0.0.1:3306)/qs_m5_reminder_resolution_test_ci?parseTime=true&loc=Asia%2FShanghai'
          QS_DELIVERY_REPLAY_HTTP_MYSQL_REQUIRED: '1'
          QS_DELIVERY_REPLAY_HTTP_MYSQL_DSN: 'root:root@tcp(127.0.0.1:3306)/qs_m5_delivery_http_test_ci?parseTime=true&loc=Asia%2FShanghai'
          QS_REMINDER_GAP_MYSQL_REQUIRED: '1'
          QS_REMINDER_GAP_MYSQL_DSN: 'root:root@tcp(127.0.0.1:3306)/qs_m6_reminder_gap_test_ci?parseTime=true&loc=Asia%2FShanghai'
        run: |
          docker exec "$MYSQL_CONTAINER" mysql -uroot -proot -e 'CREATE DATABASE qs_m5_reminder_resolution_test_ci; CREATE DATABASE qs_m5_delivery_http_test_ci; CREATE DATABASE qs_m6_reminder_gap_test_ci'
          trap 'docker exec "$MYSQL_CONTAINER" mysql -uroot -proot -e "DROP DATABASE qs_m5_reminder_resolution_test_ci; DROP DATABASE qs_m5_delivery_http_test_ci; DROP DATABASE qs_m6_reminder_gap_test_ci"' EXIT
          go test ./internal/apiserver/infra/mysql/systemgovernance -run '^TestReminderResolutionAtomicAndNoResendMySQL$' -count=1 -v
          go test ./internal/apiserver/infra/mysql/systemgovernance -run '^TestReminderGapRecoveryAtomicOriginalIdentityMySQL$' -count=1 -v
          go test ./internal/apiserver/transport/rest -run '^(TestReminderResolutionHTTPReceiptMySQL|TestDeliveryReplayHTTPAuditMySQL)$' -count=1 -v

  runtime-closure-e2e:
    name: Seeddata Retirement and Current Runtime E2E
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Log in for CI image pulls
        if: env.CI_DOCKERHUB_LOGIN == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          logout: true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Start Mongo Replica Set
        run: |
          set -euo pipefail
          mongo_cid="$(docker run --detach \
            --name qs-runtime-closure-e2e-mongo \
            --publish 27017:27017 \
            mongo:7.0 --replSet rs0 --bind_ip_all --setParameter ttlMonitorSleepSecs=1)"
          [[ "$mongo_cid" =~ ^[0-9a-f]{64}$ ]]
          printf 'QS_RUNTIME_CLOSURE_MONGO_CONTAINER=%s\n' "$mongo_cid" >> "$GITHUB_ENV"
          mongo_startup_diagnostics() {
            docker inspect --format 'status={{.State.Status}} exit_code={{.State.ExitCode}} oom_killed={{.State.OOMKilled}} error={{json .State.Error}}' "$mongo_cid" || true
            docker logs "$mongo_cid" || true
          }
          trap 'mongo_exit=$?; if [ "$mongo_exit" -ne 0 ]; then mongo_startup_diagnostics; fi' EXIT
          # Shell state must stay outside the entrypoint chown of /data/db.
          for attempt in $(seq 1 30); do
            if docker exec --env HOME=/tmp/qs-runtime-closure-mongosh --env XDG_CONFIG_HOME=/tmp/qs-runtime-closure-mongosh/config "$mongo_cid" mongosh --quiet --eval 'db.adminCommand({ping: 1})' >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              exit 1
            fi
            sleep 2
          done
          docker exec --env HOME=/tmp/qs-runtime-closure-mongosh --env XDG_CONFIG_HOME=/tmp/qs-runtime-closure-mongosh/config "$mongo_cid" mongosh --quiet --eval \
            'rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec --env HOME=/tmp/qs-runtime-closure-mongosh --env XDG_CONFIG_HOME=/tmp/qs-runtime-closure-mongosh/config "$mongo_cid" mongosh --quiet --eval \
              'quit(db.hello().isWritablePrimary ? 0 : 1)' >/dev/null 2>&1; then
              exit 0
            fi
            if [ "$attempt" -eq 30 ]; then
              exit 1
            fi
            sleep 2
          done

      - name: Run retirement and retry persistence integration tests
        env:
          MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true&multiStatements=true&loc=Asia%2FShanghai
          QS_SERVER_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          QS_SERVER_TEST_MONGO_DB_PREFIX: qs_retire_seeddata_test
        run: |
          go test -tags=integration \
            -run '^TestRetire|^TestRetryGovernanceMySQLMigrationsUpDown$' \
            -count=1 -timeout=15m -v ./internal/pkg/migration

      - name: Verify answering starts and durable submission against real databases
        env:
          QS_SERVER_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true&multiStatements=true
          QS_TESTEE_STORE_REQUIRE_MYSQL: 'true'
          QS_SERVER_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          STATISTICS_DATABASE_REQUIRED: '1'
        run: |
          test -n "$QS_SERVER_TEST_MYSQL_DSN" && test -n "$QS_SERVER_TEST_MONGO_URI"
          go test -count=1 -timeout=5m -run 'TestMySQLAnsweringStart|TestAnsweringStartUnique|TestStoreActivityRealDatabase' ./internal/apiserver/infra/mysql/actor/testeestore ./internal/apiserver/infra/mongo/answersheet ./internal/apiserver/infra/mysql/statistics

      - name: Run Statistics migration and cold-start integration contracts
        env:
          MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true&multiStatements=true&loc=Asia%2FShanghai
          QS_SERVER_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          QS_SERVER_TEST_MONGO_DB_PREFIX: qs_statistics_ci_test
          QS_SERVER_TEST_REDIS_URL: redis://127.0.0.1:6379/14
        run: |
          go test -tags=integration \
            -run '^(TestStatisticsCanonicalSchemaFromEmptyDatabaseAndRetirementRollback|TestStatisticsAuditMigrationReplaysAfterInitialSchema|TestStatisticsMongoCollectorIndexesUpDown|TestStatisticsColdStartPublishIdempotencyAndRedisFailure)$' \
            -count=1 -timeout=15m -v ./internal/pkg/migration

      - name: Verify schema pair forward migration and disabled DDL guards
        env:
          QS_M3_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true&multiStatements=true
          QS_M3_REQUIRE_DATABASE: '1'
          QS_SERVER_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          QS_SERVER_TEST_MONGO_DB_PREFIX: qs_m3_test
        run: |
          set -euo pipefail
          go test -race -tags=integration -count=1 -timeout=8m \
            -run '^(TestHistoricalEvidenceNative|TestSchemaPairNative|TestDisabledDDLNative)' -v \
            ./internal/pkg/migration ./internal/apiserver/bootstrap \
            | tee "${RUNNER_TEMP}/schema-pair.log"
          for test_name in \
            TestHistoricalEvidenceNativeSQLOnlyUpgradeAndRestart \
            TestHistoricalEvidenceNativePartialDDLRemainsDirtyAndRefusesDown \
            TestHistoricalEvidenceNativeSchemaObjectRestoreWithSyntheticNonNull \
            TestHistoricalEvidenceNativeDirtyObjectBackupRestore \
            TestSchemaPairNativeColdBootstrapAndRestart \
            TestDisabledDDLNativeValidatesCurrentHeadsAndNeverCreatesMetadata; do
            if ! grep -q -- "--- PASS: ${test_name} " "${RUNNER_TEMP}/schema-pair.log"; then
              echo "Required schema pair test did not pass: ${test_name}" >&2
              exit 1
            fi
          done
          if grep -q -- '--- SKIP:' "${RUNNER_TEMP}/schema-pair.log"; then
            echo 'Schema pair verification must not skip' >&2
            exit 1
          fi

      - name: Verify approved offline execution and interrupted paired DDL
        env:
          QS_M3_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true&multiStatements=true
          QS_M3_REQUIRE_DATABASE: '1'
          QS_SERVER_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          QS_SERVER_TEST_MONGO_DB_PREFIX: qs_offline_test
        run: |
          set -euo pipefail
          proof_log=$(mktemp)
          trap 'rm -f "$proof_log"' EXIT
          go test -race -tags=integration -count=1 -timeout=8m -v \
            -run '^TestOfflineNative' ./internal/pkg/migration | tee "$proof_log"
          for required in \
            TestOfflineNativeUpgradeAndFreshNoop \
            TestOfflineNativeSQLPartialFailureRemainsDirty \
            TestOfflineNativeMongoPartialFailureRemainsDirty \
            TestOfflineNativeMongoCancellationRetainsPartialState \
            TestOfflineNativeSQLDeadlineRetainsUnknownPartialState \
            TestOfflineNativeMissingRecoveryAndPristineRefusedBeforeDDL \
            TestOfflineNativeMissingBoundResourcesRefusedBeforeDDL; do
            grep -F -- "--- PASS: $required " "$proof_log" >/dev/null
          done
          if grep -E -- '^--- SKIP:' "$proof_log"; then exit 1; fi

      - name: Verify four historical Mongo index retirement and auth failure
        env:
          QS_M3_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true&multiStatements=true
          QS_M3_REQUIRE_DATABASE: '1'
          QS_SERVER_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          QS_SERVER_TEST_MONGO_DB_PREFIX: qs_m4_index_ci_test
        run: |
          set -euo pipefail
          QS_M4_AUTH_PASSWORD="$(openssl rand -hex 24)"
          export QS_M4_AUTH_PASSWORD
          echo "::add-mask::${QS_M4_AUTH_PASSWORD}"
          auth_cid="$(docker run --detach \
            --name qs-m4-index-auth --label qs.cleanup.owner=m4-index-ci \
            --cpus 2 --memory 1g \
            --tmpfs /data/db:rw,nosuid,size=536870912 \
            --tmpfs /data/configdb:rw,nosuid,size=16777216 \
            --tmpfs /run/qs-m4-keydir:rw,nosuid,size=1048576 \
            --publish 127.0.0.1:27018:27017 --entrypoint bash \
            --env MONGO_INITDB_ROOT_USERNAME=qs_m4_ci_root \
            --env "MONGO_INITDB_ROOT_PASSWORD=${QS_M4_AUTH_PASSWORD}" \
            mongo:7.0 -ceu \
            'umask 077; openssl rand -base64 756 > /run/qs-m4-keydir/key; chown mongodb:mongodb /run/qs-m4-keydir/key; chmod 400 /run/qs-m4-keydir/key; exec docker-entrypoint.sh "$@"' \
            -- mongod --replSet qs-m4-auth-rs --keyFile /run/qs-m4-keydir/key --bind_ip_all)"
          [[ "$auth_cid" =~ ^[0-9a-f]{64}$ ]]
          printf 'QS_M4_MONGO_AUTH_CONTAINER=%s\n' "$auth_cid" >> "$GITHUB_ENV"
          auth_shell() {
            docker exec "$auth_cid" mongosh --quiet --username qs_m4_ci_root \
              --password "$QS_M4_AUTH_PASSWORD" --authenticationDatabase admin --eval "$1"
          }
          ready=false
          for attempt in $(seq 1 60); do
            if auth_shell 'rs.initiate({_id:"qs-m4-auth-rs",members:[{_id:0,host:"127.0.0.1:27017"}]})' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "Owned auth fixture initialization failed after ${attempt} attempts" >&2
            exit 1
          fi
          ready=false
          for attempt in $(seq 1 60); do
            if auth_shell 'quit(db.hello().isWritablePrimary ? 0 : 1)' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "Owned auth fixture primary unavailable after ${attempt} attempts" >&2
            exit 1
          fi
          auth_shell 'print(db.version())'
          export QS_M4_TEST_MONGO_AUTH_CONFIG="${RUNNER_TEMP}/qs-m4-auth-config.json"
          python3 - <<'PYCONFIG'
          import json, os
          fd = os.open(os.environ["QS_M4_TEST_MONGO_AUTH_CONFIG"], os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, "w") as output:
              json.dump({"mongo_uri": "mongodb://qs_m4_ci_root:" + os.environ["QS_M4_AUTH_PASSWORD"] + "@127.0.0.1:27018/?authSource=admin&replicaSet=qs-m4-auth-rs&directConnection=true"}, output)
          PYCONFIG
          go test -race -tags=integration -count=1 -timeout=8m -v \
            -run '^TestHistoricalIndexNative' ./internal/pkg/migration \
            | tee "${RUNNER_TEMP}/historical-index.log"
          for test_name in \
            TestHistoricalIndexNativeMongoOnlyUpgradeAndRestart \
            TestHistoricalIndexNativeExactObjectRestoreAndConstraints \
            TestHistoricalIndexNativeDirtyObjectBackupRestore \
            TestHistoricalIndexNativePartialFailureAndDirtyRefuseRepairByForce \
            TestHistoricalIndexNativeUnknownMetadataStopsBeforeDDL \
            TestHistoricalIndexNativePermissionDeniedAfterMetadataWrite; do
            grep -q -- "--- PASS: ${test_name} " "${RUNNER_TEMP}/historical-index.log"
          done
          if grep -q -- '--- SKIP:' "${RUNNER_TEMP}/historical-index.log"; then
            echo 'Historical index retirement proof must not skip' >&2
            exit 1
          fi

      - name: Verify Actor SQL102 retirement and guarded object material restoration
        env:
          QS_M3_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true&multiStatements=true
          QS_M3_REQUIRE_DATABASE: '1'
          QS_SERVER_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          QS_SERVER_TEST_MONGO_DB_PREFIX: qs_m4_actor_ci_test
        run: |
          set -euo pipefail
          go test -race -tags=integration -count=1 -timeout=8m -v \
            -run '^TestActorColumnsNative' ./internal/pkg/migration \
            | tee "${RUNNER_TEMP}/actor-columns.log"
          for test_name in \
            TestActorColumnsNativeUpgradeRestartAndHistoricalArchive \
            TestActorColumnsNativePartialDDLRefusesRestartForceAndDown \
            TestActorColumnsNativeExactObjectValueRestoration \
            TestActorColumnsNativeOtherObjectScopesRefusedBeforeClaim \
            TestActorColumnsNativeOtherObjectScopesRefusedBeforeClaim/m4_sql_historical_columns \
            TestActorColumnsNativeOtherObjectScopesRefusedBeforeClaim/m4_mongo_historical_indexes \
            TestActorColumnsNativeDirtyObjectBackupRestore \
            TestActorColumnsNativeDirtyObjectBackupRestore/restore \
            TestActorColumnsNativeDirtyObjectBackupRestore/wrong_backup \
            TestActorColumnsNativeDirtyObjectBackupRestore/retained_fact_changed \
            TestActorColumnsNativeDirtyObjectBackupRestore/value_restore_failed \
            TestActorColumnsNativeDirtyObjectBackupRestore/ledger_replay_failed; do
            grep -q -- "=== RUN   ${test_name}$" "${RUNNER_TEMP}/actor-columns.log"
            grep -q -- "--- PASS: ${test_name} " "${RUNNER_TEMP}/actor-columns.log"
          done
          if grep -q -- '--- SKIP:' "${RUNNER_TEMP}/actor-columns.log"; then
            echo 'Actor retirement proof must not skip' >&2
            exit 1
          fi

      - name: Verify SQL103 legacy maintenance retirement and original object recovery
        env:
          QS_M3_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true&multiStatements=true
          QS_M3_REQUIRE_DATABASE: '1'
          QS_SERVER_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          QS_SERVER_TEST_MONGO_DB_PREFIX: qs_m4_maintenance_ci_test
        run: |
          set -euo pipefail
          go test -race -tags=integration -count=1 -timeout=8m -v \
            -run '^TestLegacyMaintenanceNative' ./internal/pkg/migration \
            | tee "${RUNNER_TEMP}/legacy-maintenance.log"
          for test_name in \
            TestLegacyMaintenanceNativeUpgradeRestartAndCurrentWrites \
            TestLegacyMaintenanceNativePartialDDLRefusesRestartForceAndDown \
            TestLegacyMaintenanceNativeDirtyObjectBackupRestore \
            TestLegacyMaintenanceNativeDirtyObjectBackupRestore/restore \
            TestLegacyMaintenanceNativeDirtyObjectBackupRestore/wrong_backup \
            TestLegacyMaintenanceNativeDirtyObjectBackupRestore/retained_fact_changed \
            TestLegacyMaintenanceNativeDirtyObjectBackupRestore/object_restore_failed \
            TestLegacyMaintenanceNativeDirtyObjectBackupRestore/before_ledger_interrupted \
            TestLegacyMaintenanceNativeDirtyObjectBackupRestore/ledger_replay_failed \
            TestLegacyMaintenanceNativeDirtyObjectBackupRestore/runtime_started \
            TestLegacyMaintenanceNativeWrongObjectScopesRefusedBeforeClaim \
            TestLegacyMaintenanceNativeWrongObjectScopesRefusedBeforeClaim/m4_sql_historical_columns \
            TestLegacyMaintenanceNativeWrongObjectScopesRefusedBeforeClaim/m4_mongo_historical_indexes \
            TestLegacyMaintenanceNativeWrongObjectScopesRefusedBeforeClaim/m4_actor_columns \
            TestLegacyMaintenanceNativeReappearedTableFailsClosed; do
            grep -q -- "=== RUN   ${test_name}$" "${RUNNER_TEMP}/legacy-maintenance.log"
            grep -q -- "--- PASS: ${test_name} " "${RUNNER_TEMP}/legacy-maintenance.log"
          done
          if grep -q -- '--- SKIP:' "${RUNNER_TEMP}/legacy-maintenance.log"; then
            echo 'Maintenance retirement proof must not skip' >&2
            exit 1
          fi

      - name: Stop owned Mongo index auth fixture
        if: always()
        run: |
          set -euo pipefail
          auth_cid="${QS_M4_MONGO_AUTH_CONTAINER:-}"
          if [ -n "$auth_cid" ]; then
            [[ "$auth_cid" =~ ^[0-9a-f]{64}$ ]]
            [ "$(docker inspect --format '{{ index .Config.Labels "qs.cleanup.owner" }}' "$auth_cid")" = m4-index-ci ]
            docker rm --force --volumes "$auth_cid"
          fi
          rm --force "${RUNNER_TEMP}/qs-m4-auth-config.json"

      - name: Verify committed evidence, retry governance and retirement A on real databases
        env:
          QS_COMPAT_OUTCOME_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true&multiStatements=true
          QS_COMPAT_REQUIRE_DATABASE: '1'
          MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true&multiStatements=true
          MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          QS_SERVER_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
        run: |
          go test -race -tags=integration -count=1 -timeout=5m ./internal/apiserver/infra/mysql/evaluation -run '^TestCommittedEvidenceAtomicNativeMySQL$'
          go test -race -tags=integration -count=1 -timeout=5m ./internal/apiserver/infra/retrygovernance
          go test -race -tags=integration -count=1 -timeout=5m ./internal/pkg/migration -run '^TestCompatibilityRetirementA'

      - name: Run Survey and ModelCatalog Mongo integration contracts
        env:
          QS_SERVER_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          QS_SERVER_TEST_MONGO_DB: qs_survey_ci_test
          QS_SERVER_TEST_MONGO_DB_PREFIX: qs_survey_ci_test
        run: |
          go test -tags=integration \
            -run '^(TestDurableSubmissionTransactionAgainstMongoReplicaSet|TestRepositoryConcurrentWritersUseRevisionCAS|TestDraftRepositoryConcurrentWritersUseRevisionCAS|TestStandaloneQuestionnaireLifecycleRollsBackOnPartialFailure|TestMongoReleasePairRollsBackEveryFailureBoundary|TestPublishReleaseRollsBackEveryPersistedBoundary)$' \
            -count=1 -timeout=10m -v \
            ./internal/apiserver/infra/mongo/answersheet \
            ./internal/apiserver/infra/mongo/questionnaire \
            ./internal/apiserver/infra/mongo/modelcatalog \
            ./internal/apiserver/container/modules/modelcatalog

      - name: Run Mongo runtime-ledger retirement guards
        env:
          QS_SERVER_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          QS_SERVER_TEST_MONGO_DB_PREFIX: qs_runtime_ledger_retirement_test
        run: |
          go test -tags=integration \
            -run '^(TestCompatibilityRetirementPreconditionRejectsLiveDataAndArchiveReferences|TestRuntimeLedgerRetirementPreconditionRejectsAnySourceDocument|TestRuntimeLedgerRetirementFromVersion22WithSourcesAlreadyDropped)$' \
            -count=1 -timeout=5m -v \
            ./internal/pkg/migration

      - name: Run Mongo transaction consistency integration contracts
        env:
          MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true&multiStatements=true&loc=Asia%2FShanghai
          QS_SERVER_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          QS_SERVER_TEST_MONGO_DB_PREFIX: qs_mongo_consistency_test
          QS_SERVER_TEST_MONGO_DB: qs_m5_resolution_fact_ci
        run: |
          go test -tags=integration \
            -run '^(TestInterpretationSuccessRollsBackEveryPersistedBoundary|TestInterpretationFailureAndScheduledRetryRollBackTogether|TestCurrentReportMetadataCarriesVerifiedSourceIdentityAgainstMongo|TestScannerDetectsEverySupportedDriftAgainstReplicaSet|TestScannerAcceptsMarkedHealthyTransactionsAgainstReplicaSet|TestScannerPagesSubmittedOutboxAcrossAggregateIDDigitWidths|TestMongoTransactionAuditIndexesUpDown|TestMongoConsistencyAuditCheckpointMySQLMigrationUpDown)$' \
            -count=1 -timeout=10m -v \
            ./internal/apiserver/infra/mongo/interpretation \
            ./internal/apiserver/infra/mongo/mongoconsistency \
            ./internal/pkg/migration

      - name: Run current runtime closure E2E
        env:
          MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/mysql?parseTime=true&multiStatements=true&loc=Asia%2FShanghai
          QS_SERVER_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          QS_SERVER_TEST_MONGO_DB_PREFIX: qs_runtime_closure_test
          QS_SERVER_TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: |
          go test -tags=integration \
            -ldflags "-X github.com/FangcunMount/qs-server/pkg/version.GitCommit=$(git rev-parse HEAD)" \
            -run '^TestCurrentRuntimeClosure$' \
            -count=1 -timeout=15m -v ./internal/apiserver/integration/runtimeclosure

      - name: Verify hot-rank and attention original-source recovery after broker loss
        env:
          M6_HOTRANK_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
          M6_HOTRANK_REDIS_ADDRESS: 127.0.0.1:6379
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          M6_ATTENTION_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/m6_attention_test?parseTime=true&loc=Asia%2FShanghai
        run: |
          set -euo pipefail
          M6_HOTRANK_OWNER="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          export M6_HOTRANK_OWNER
          export M6_HOTRANK_NSQ_CONTAINER="m6-hotrank-${M6_HOTRANK_OWNER}-nsq"
          nsq_volume="${M6_HOTRANK_NSQ_CONTAINER}-data"
          owner_label="m6-hotrank-proof-owner=${M6_HOTRANK_OWNER}"
          cleanup() {
            if docker container inspect "$M6_HOTRANK_NSQ_CONTAINER" >/dev/null 2>&1; then
              test "$(docker inspect --format '{{index .Config.Labels "m6-hotrank-proof-owner"}}' "$M6_HOTRANK_NSQ_CONTAINER")" = "$M6_HOTRANK_OWNER"
              docker rm -f "$M6_HOTRANK_NSQ_CONTAINER"
            fi
            if docker volume inspect "$nsq_volume" >/dev/null 2>&1; then
              test "$(docker volume inspect --format '{{index .Labels "m6-hotrank-proof-owner"}}' "$nsq_volume")" = "$M6_HOTRANK_OWNER"
              docker volume rm "$nsq_volume"
            fi
            docker exec "$MYSQL_CONTAINER" mysql -uroot -proot -e 'DROP DATABASE IF EXISTS m6_attention_test'
          }
          trap cleanup EXIT
          docker exec "$MYSQL_CONTAINER" mysql -uroot -proot -e 'CREATE DATABASE m6_attention_test'
          docker volume create --label "$owner_label" "$nsq_volume"
          docker run -d --name "$M6_HOTRANK_NSQ_CONTAINER" --label "$owner_label" \
            --memory 128m --cpus 0.5 --volume "$nsq_volume:/data" \
            -p 127.0.0.1::4150 -p 127.0.0.1::4151 \
            nsqio/nsq@sha256:1a369c146af71bc95c25d54b375a2b98452478c1eaf4e85f8fcb01da20f2c78a \
            /nsqd --data-path=/data --mem-queue-size=1000 --sync-every=1000 --sync-timeout=1h --broadcast-address=127.0.0.1
          tcp_port="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "4150/tcp") 0).HostPort}}' "$M6_HOTRANK_NSQ_CONTAINER")"
          http_port="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "4151/tcp") 0).HostPort}}' "$M6_HOTRANK_NSQ_CONTAINER")"
          export M6_HOTRANK_NSQ_ADDRESS="127.0.0.1:${tcp_port}"
          export M6_HOTRANK_NSQ_HTTP="http://127.0.0.1:${http_port}"
          export M6_HOTRANK_TOOL="${RUNNER_TEMP}/hotrank-day-rebuild"
          go build -o "$M6_HOTRANK_TOOL" ./scripts/oneoff/hotrank_day_rebuild
          go test -tags='integration reliable_messaging_m4' -run '^TestHotRankDayRecoveryAfterActualNSQConfirmationLoss$' \
            -count=1 -timeout=2m -v ./internal/apiserver/integration/runtimeclosure | tee "${RUNNER_TEMP}/hotrank-recovery.log"
          if grep -q -- '--- SKIP:' "${RUNNER_TEMP}/hotrank-recovery.log"; then
            echo 'Actual hot-rank recovery proof unexpectedly skipped' >&2
            exit 1
          fi
          grep -q -- '--- PASS: TestHotRankDayRecoveryAfterActualNSQConfirmationLoss' "${RUNNER_TEMP}/hotrank-recovery.log"
          # Run after the hot-rank proof: Attention creates a real channel,
          # while the hot-rank loss fixture intentionally starts without one.
          # The same-container restart may allocate new ephemeral host ports.
          tcp_port="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "4150/tcp") 0).HostPort}}' "$M6_HOTRANK_NSQ_CONTAINER")"
          http_port="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "4151/tcp") 0).HostPort}}' "$M6_HOTRANK_NSQ_CONTAINER")"
          export M6_HOTRANK_NSQ_ADDRESS="127.0.0.1:${tcp_port}"
          export M6_HOTRANK_NSQ_HTTP="http://127.0.0.1:${http_port}"
          go test -tags='integration reliable_messaging_m4' -run '^TestAttentionFactRecoveryAfterActualNSQConfirmationLoss$' \
            -count=1 -timeout=2m -v ./internal/apiserver/integration/runtimeclosure | tee "${RUNNER_TEMP}/attention-recovery.log"
          if grep -q -- '--- SKIP:' "${RUNNER_TEMP}/attention-recovery.log"; then
            echo 'Actual attention recovery proof unexpectedly skipped' >&2
            exit 1
          fi
          grep -q -- '--- PASS: TestAttentionFactRecoveryAfterActualNSQConfirmationLoss' "${RUNNER_TEMP}/attention-recovery.log"

      - name: Verify original-authority report retry recovery after broker loss
        env:
          M6_HOTRANK_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
        run: |
          set -euo pipefail
          # Use a fresh owned broker: prior Attention proof leaves a channel,
          # while this fault requires confirmed messages still in topic memory.
          M6_HOTRANK_OWNER="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          export M6_HOTRANK_OWNER
          export M6_HOTRANK_NSQ_CONTAINER="m6-hotrank-${M6_HOTRANK_OWNER}-nsq"
          nsq_volume="${M6_HOTRANK_NSQ_CONTAINER}-data"
          owner_label="m6-hotrank-proof-owner=${M6_HOTRANK_OWNER}"
          cleanup() {
            if docker container inspect "$M6_HOTRANK_NSQ_CONTAINER" >/dev/null 2>&1; then
              test "$(docker inspect --format '{{index .Config.Labels "m6-hotrank-proof-owner"}}' "$M6_HOTRANK_NSQ_CONTAINER")" = "$M6_HOTRANK_OWNER"
              docker rm -f "$M6_HOTRANK_NSQ_CONTAINER"
            fi
            if docker volume inspect "$nsq_volume" >/dev/null 2>&1; then
              test "$(docker volume inspect --format '{{index .Labels "m6-hotrank-proof-owner"}}' "$nsq_volume")" = "$M6_HOTRANK_OWNER"
              docker volume rm "$nsq_volume"
            fi
          }
          trap cleanup EXIT
          docker volume create --label "$owner_label" "$nsq_volume"
          docker run -d --name "$M6_HOTRANK_NSQ_CONTAINER" --label "$owner_label" \
            --memory 128m --cpus 0.5 --volume "$nsq_volume:/data" \
            -p 127.0.0.1::4150 -p 127.0.0.1::4151 \
            nsqio/nsq@sha256:1a369c146af71bc95c25d54b375a2b98452478c1eaf4e85f8fcb01da20f2c78a \
            /nsqd --data-path=/data --mem-queue-size=1000 --sync-every=1000 --sync-timeout=1h --broadcast-address=127.0.0.1
          tcp_port="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "4150/tcp") 0).HostPort}}' "$M6_HOTRANK_NSQ_CONTAINER")"
          http_port="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "4151/tcp") 0).HostPort}}' "$M6_HOTRANK_NSQ_CONTAINER")"
          export M6_HOTRANK_NSQ_ADDRESS="127.0.0.1:${tcp_port}"
          export M6_HOTRANK_NSQ_HTTP="http://127.0.0.1:${http_port}"
          export M6_RETRY_RECOVERY_TOOL="${RUNNER_TEMP}/interpretation-retry-recover"
          go build -o "$M6_RETRY_RECOVERY_TOOL" ./scripts/oneoff/interpretation_retry_recover
          go test -tags='integration reliable_messaging_m4' -run '^TestOriginalReportRetryRecoveryAfterActualNSQConfirmationLoss$' \
            -count=1 -timeout=2m -v ./internal/apiserver/integration/runtimeclosure | tee "${RUNNER_TEMP}/original-retry-recovery.log"
          if grep -q -- '--- SKIP:' "${RUNNER_TEMP}/original-retry-recovery.log"; then
            echo 'Actual original-authority retry recovery proof unexpectedly skipped' >&2
            exit 1
          fi
          grep -q -- '--- PASS: TestOriginalReportRetryRecoveryAfterActualNSQConfirmationLoss' "${RUNNER_TEMP}/original-retry-recovery.log"

      - name: Stop Mongo Replica Set
        if: always()
        run: |
          set -euo pipefail
          mongo_cid="${QS_RUNTIME_CLOSURE_MONGO_CONTAINER:-}"
          if [ -z "$mongo_cid" ]; then exit 0; fi
          [[ "$mongo_cid" =~ ^[0-9a-f]{64}$ ]]
          docker rm --force --volumes "$mongo_cid"

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Install dependencies
        run: |
          go mod download

      - name: Check formatting
        run: |
          make fmt-check

      - name: golangci-lint (pull request diff)
        if: github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.5.0
          only-new-issues: false
          args: --timeout=5m --new-from-rev=${{ github.event.pull_request.base.sha }}

      - name: golangci-lint (push diff)
        if: github.event_name != 'pull_request'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.5.0
          only-new-issues: true
          args: --timeout=5m

  lint-boundaries:
    name: Layer Boundaries (depguard)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: golangci-lint (depguard)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.5.0
          args: --config=.golangci-depguard.yml --timeout=5m

  deployment-contracts:
    name: Deployment Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Validate GitHub Actions
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"

      - name: Validate GitHub Action runtime contract
        run: bash scripts/cd/test-github-action-runtimes.sh


      - name: Test deployment lock bootstrap
        run: python3 scripts/cd/test_image_deploy_lock.py

      - name: Test per-instance deployment evidence
        run: python3 scripts/cd/test-runtime-evidence.py

      - name: Validate deployment shell scripts
        run: bash -n scripts/cd/*.sh

      - name: Validate runner network contract
        run: bash scripts/cd/test-setup-runner-network.sh

      - name: Validate deployment package contract
        run: bash scripts/cd/test-prepare-package.sh

      - name: Validate direct registry deployment contract
        run: python3 scripts/cd/test-direct-registry-deploy.py

      - name: Validate deployment image export contract
        run: bash scripts/cd/test-export-image.sh

      - name: Validate deployment planning contract
        run: bash scripts/cd/test-plan-services.sh

      - name: Validate production network exposure contract
        run: bash scripts/cd/test-production-compose-network-exposure.sh

      - name: Validate worker deployment readiness gate
        run: bash scripts/cd/test-wait-worker-readiness.sh

      - name: Validate worker dependency preflight gate
        run: bash scripts/cd/test-verify-worker-dependencies.sh

      - name: Validate worker governance convergence gate
        run: bash scripts/cd/test-verify-worker-governance.sh

      - name: Validate public observability convergence gate
        run: bash scripts/cd/test-verify-observability-nginx.sh

      - name: Validate Attention reconcile dry-run/apply audit contract
        run: bash scripts/cd/test-attention-reconcile-audit.sh

      - name: Validate compatibility observation contract
        run: bash scripts/cd/test-compatibility-observation.sh

      - name: Validate production AuthZ matrix contract
        run: bash scripts/cd/test-verify-authz-production-matrix.sh

      - name: Validate production AuthZ matrix evaluator provisioning contract
        run: bash scripts/cd/test-provision-authz-production-matrix-evaluator.sh

      - name: Validate production Compose
        run: |
          printf '%s\n' \
            'services:' \
            '  qs-apiserver:' \
            '    env_file: !reset []' \
            '  server:' \
            '    env_file: !reset []' \
            '  runtime:' \
            '    env_file: !reset []' |
            docker compose -f build/docker/docker-compose.prod.yml -f - config -q

  security:
    name: Security Scan (Advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Download dependencies
        run: |
          go mod download

      - name: Install security tools
        run: |
          make install-security-tools

      - name: Run govulncheck (advisory)
        continue-on-error: true
        run: |
          make security-govulncheck-ci

      - name: Run gosec (advisory)
        continue-on-error: true
        run: |
          make security-gosec-ci

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: tmp/security/
          retention-days: 7

  maintainability:
    name: Maintainability Scan (Advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Download dependencies
        run: |
          go mod download

      - name: Install golangci-lint
        run: |
          GOBIN="$(pwd)/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0
          echo "$(pwd)/bin" >> "$GITHUB_PATH"

      - name: Run maintainability advisory
        continue-on-error: true
        run: |
          make maintainability-lint-ci

      - name: Upload maintainability reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maintainability-reports
          path: tmp/maintainability/
          retention-days: 7

  tier1-test-policy:
    name: Tier 1 Test Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Tier 1 package policy
        run: |
          make tier1-test-policy

  docs:
    name: Docs Hygiene & Facts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with history for source-baseline verification
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run offline documentation gates
        run: |
          make docs-check

  docs-api-sync:
    name: Docs & API Generated Sync
    if: ${{ vars.DOCS_VERIFY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Install PyYAML
        run: |
          python -m pip install --quiet pyyaml

      - name: Install swagger toolchain
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.4

      - name: Download dependencies
        run: |
          go mod download

      - name: Verify generated API contracts
        run: |
          make docs-api-verify

      - name: Ensure no doc drift
        run: |
          git diff --exit-code

  build:
    name: Build Applications
    needs: [test, actor-store-mysql, runtime-closure-e2e, lint, lint-boundaries, deployment-contracts, tier1-test-policy, docs]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [apiserver, collection, worker]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Build ${{ matrix.service }}
        run: |
          make build-${{ matrix.service }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: qs-${{ matrix.service }}
          path: bin/*
          retention-days: 7

  qs03-original-effect-recovery:
    name: QS-03 original effect recovery after actual broker loss
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Log in for CI image pulls
        if: env.CI_DOCKERHUB_LOGIN == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          logout: true
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Prove original recovery command and normal late Worker deliveries
        run: bash scripts/testing/m6-qs03-original-recovery-proof.sh "${RUNNER_TEMP}/qs03-original-effect-proof"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qs03-original-effect-proof
          path: ${{ runner.temp }}/qs03-original-effect-proof
          if-no-files-found: error
          retention-days: 14

  original-effects-recovery:
    name: QS-05/06 original business effects after actual broker loss
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Log in for CI image pulls
        if: env.CI_DOCKERHUB_LOGIN == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          logout: true
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Prove original grant and frozen initial report via actual operator command
        run: bash scripts/testing/m6-original-effects-recovery-proof.sh "${RUNNER_TEMP}/original-effects-proof"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: original-effects-proof
          path: ${{ runner.temp }}/original-effects-proof
          if-no-files-found: error
          retention-days: 14
