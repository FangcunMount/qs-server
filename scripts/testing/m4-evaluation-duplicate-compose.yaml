services:
  mysql:
    image: mysql@sha256:f37951fc3753a6a22d6c7bf6978c5e5fefcf6f31814d98c582524f98eae52b21
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    tmpfs:
      - /var/lib/mysql:size=1g
    healthcheck:
      test: [CMD-SHELL, "mysql --protocol=TCP -h127.0.0.1 -uroot -N -e 'SELECT 1' | grep -qx 1"]
      interval: 2s
      timeout: 5s
      retries: 60
  mongo:
    image: mongo@sha256:340c1c56fb10e95cf79ff547f8664b96bc6ead9909bc355238cbf865a9695a6f
    command: [mongod, --replSet, rm-test, --bind_ip_all]
    tmpfs:
      - /data/db:size=512m
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "if (db.runCommand({ping:1}).ok !== 1) quit(1)"]
      interval: 2s
      timeout: 5s
      retries: 60
  redis:
    image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command: [redis-server, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 5s
      retries: 60
networks:
  default:
    internal: true
