services:
  mysql:
    image: mysql@sha256:f37951fc3753a6a22d6c7bf6978c5e5fefcf6f31814d98c582524f98eae52b21
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    tmpfs:
      - /var/lib/mysql:size=1g
    healthcheck:
      test: [CMD-SHELL, "mysql --protocol=TCP -h127.0.0.1 -uroot -N -e 'SELECT 1' | grep -qx 1"]
      interval: 2s
      timeout: 5s
      retries: 60
  nsqlookupd:
    image: nsqio/nsq@sha256:1a369c146af71bc95c25d54b375a2b98452478c1eaf4e85f8fcb01da20f2c78a
    command: [/nsqlookupd]
  nsqd:
    image: nsqio/nsq@sha256:1a369c146af71bc95c25d54b375a2b98452478c1eaf4e85f8fcb01da20f2c78a
    command: [/nsqd, --data-path=/data, --broadcast-address=nsqd, --lookupd-tcp-address=nsqlookupd:4160]
    volumes:
      - nsq-data:/data
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:4151/ping | grep -qx OK"]
      interval: 2s
      timeout: 5s
      retries: 60
networks:
  default:
    internal: true
volumes:
  nsq-data: {}
