services:
  nsqd:
    image: nsqio/nsq@sha256:1a369c146af71bc95c25d54b375a2b98452478c1eaf4e85f8fcb01da20f2c78a
    command: [/nsqd, --data-path=/data, --broadcast-address=nsqd, --lookupd-tcp-address=nsqlookupd:4160, --mem-queue-size=3000]
    depends_on:
      nsqlookupd:
        condition: service_healthy
    volumes:
      - nsq-data:/data
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:4151/ping | grep -qx OK"]
      interval: 2s
      timeout: 5s
      retries: 60
  nsqlookupd:
    image: nsqio/nsq@sha256:1a369c146af71bc95c25d54b375a2b98452478c1eaf4e85f8fcb01da20f2c78a
    command: [/nsqlookupd]
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:4161/ping | grep -qx OK"]
      interval: 2s
      timeout: 5s
      retries: 60
volumes:
  nsq-data: {}
