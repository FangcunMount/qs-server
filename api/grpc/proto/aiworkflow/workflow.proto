syntax = "proto3";
package qsai.workflow.v1;
option go_package = "github.com/FangcunMount/qs-server/api/grpc/gen/aiworkflow";
service Commands {
 rpc Start(StartCommand) returns (Receipt);
 rpc Change(ChangeCommand) returns (Receipt);
}
service Results {
 rpc Accept(StateEvent) returns (Acknowledgement);
}
message Actor { string org_id = 1; string subject_id = 2; }
message StartCommand {
 string request_id = 1; Actor actor = 2; string testee_id = 3;
 repeated string assessment_ids = 4; string goal = 5;
 repeated EvidenceItem evidence = 6;
}
message ChangeCommand {
 string command_id = 1; string session_id = 2; Actor actor = 3;
 string action = 4; int64 expected_version = 5; string question_id = 6;
 optional string answer = 7; bool skip = 8;
}
message Receipt { string session_id = 1; string run_id = 2; string status = 3; int64 version = 4; }
// Snapshot event. Intermediate versions may be skipped; newer versions never regress.
message StateEvent {
 string event_id = 1; string request_id = 2; string session_id = 3;
 Actor actor = 4; string testee_id = 5; int64 version = 6; string status = 7;
 string question_id = 8; string question = 9; bool can_skip = 10; string failure_code = 11;
 // Complete immutable ArtifactCandidate envelope; required only for completed.
 string artifact_json = 12;
}
message Acknowledgement { string event_id = 1; }

message Fact { string ref = 1; string value = 2; }
message EvidenceItem {
 string assessment_id = 1; string testee_id = 2; string report_id = 3;
 string source_version = 4; repeated Fact facts = 5;
}

// Trusted QS backend only. QS authorizes governance writes and candidate audit reads.
service EvaluationManagement {
 // Current organization daily reservation and active-run usage; read only.
 rpc GetCapacity(PublicationScope) returns (EvaluationCapacitySnapshot);
 // Organization-scoped summary pages; never schedules work or authorizes mutations.
 rpc List(EvaluationCatalogQuery) returns (EvaluationCatalogPage);
 // Resolve all eleven immutable references and policy budgets; no creation or scheduling.
 rpc Prepare(EvaluationPlanQuery) returns (EvaluationPlan);
 // The caller reuses scope.run_id for retries of the identical creation request.
 rpc Create(EvaluationCreateCommand) returns (EvaluationState);
 // Explicitly schedules an existing frozen requested Run; does not call a model inline.
 rpc Start(EvaluationStartCommand) returns (EvaluationState);
 // Stop future work; dispatched/unknown calls must be completed or resolved first.
 rpc Cancel(EvaluationCancelCommand) returns (EvaluationState);
 rpc Get(EvaluationQuery) returns (EvaluationState);
 // Read-only version-bound uncertain calls and frozen budget; never authorizes a retry.
 rpc ListUnknownExecutions(EvaluationUnknownQuery) returns (EvaluationUnknownIndex);
 rpc ResolveUnknown(UnknownResolutionCommand) returns (EvaluationState);
 // QS authorizes the selected review role; AI records the trusted operator and server time.
 rpc Review(EvaluationReviewCommand) returns (EvaluationState);
 rpc ListCandidates(EvaluationQuery) returns (EvaluationCandidateIndex);
 rpc GetCandidate(EvaluationCandidateQuery) returns (EvaluationCandidateEvidence);
 // Read original execution evidence, including failures without candidates. Never retries.
 rpc ListExecutions(EvaluationExecutionQuery) returns (EvaluationExecutionPage);
 rpc GetExecutionOutput(EvaluationExecutionQuery) returns (EvaluationExecutionOutput);
 // Read-only complete gate preview; does not approve the Run or publish a release.
 rpc PreviewGates(EvaluationGateQuery) returns (EvaluationGatePreview);
 // Recompute gates under CAS; this records approval/rejection, never publishes a release.
 rpc Finalize(EvaluationFinalizeCommand) returns (EvaluationState);
 // Reopen eligible semantic-review signatures, preserving the complete previous round.
 rpc ReopenReview(EvaluationReopenCommand) returns (EvaluationState);
}
message EvaluationExecutionQuery {
 EvaluationQuery scope = 1;
 int64 expected_version = 2;
 string cursor = 3;
 int32 limit = 4;
 string execution_id = 5;
}
message EvaluationExecutionSummary {
 string execution_id = 1;
 string invocation_id = 2;
 string kind = 3;
 string case_id = 4;
 int32 slot_ordinal = 5;
 int32 execution_ordinal = 6;
 string status = 7;
 int64 raw_output_bytes = 8;
 int64 normalized_output_bytes = 9;
 string evidence_json = 10;
}
message EvaluationExecutionPage {
 string run_id = 1;
 int64 version = 2;
 repeated EvaluationExecutionSummary executions = 3;
 string next_cursor = 4;
}
message EvaluationExecutionOutput {
 string run_id = 1;
 int64 version = 2;
 EvaluationExecutionSummary execution = 3;
 bytes raw_output = 4;
 bytes normalized_output = 5;
 string raw_sha256 = 6;
 string normalized_sha256 = 7;
}
message EvaluationPlanQuery {
 PublicationScope scope = 1;
 FrozenEvaluationRef suite = 2;
 FrozenEvaluationRef generation_route = 3;
 FrozenEvaluationRef semantic_route = 4;
}
message EvaluationPlan {
 string schema_version = 1;
 string plan_json = 2;
}
message EvaluationReopenCommand {
 EvaluationQuery scope = 1;
 int64 expected_version = 2;
 string reason = 3;
 bool confirm = 4;
}
message EvaluationCancelCommand {
 EvaluationQuery scope = 1;
 int64 expected_version = 2;
 string reason = 3;
 bool confirm = 4;
 // Explicit false for ordinary cancellation; true only to discard awaiting-review work.
 optional bool discard = 5;
}
message EvaluationFinalizeCommand {
 EvaluationQuery scope = 1;
 int64 expected_version = 2;
 // Presence is mandatory; false explicitly confirms the previewed rejection.
 optional bool expected_passed = 3;
 string reason = 4;
 bool confirm = 5;
}
message EvaluationGateQuery {
 EvaluationQuery scope = 1;
 int64 expected_version = 2;
}
message EvaluationGatePreview {
 string run_id = 1;
 int64 version = 2;
 string release_fingerprint = 3;
 string gate_result_json = 4;
}
message EvaluationCandidateSummary {
 string candidate_id = 1;
 string case_id = 2;
 int32 slot_ordinal = 3;
}
message EvaluationCandidateIndex {
 string run_id = 1;
 int64 version = 2;
 repeated EvaluationCandidateSummary candidates = 3;
}
message EvaluationCandidateQuery {
 EvaluationQuery scope = 1;
 string candidate_id = 2;
 int64 expected_version = 3;
}
message EvaluationCandidateEvidence {
 string run_id = 1;
 int64 version = 2;
 string candidate_id = 3;
 bytes normalized_output = 4;
 bytes semantic_output = 5;
 string evidence_json = 6;
}
message EvaluationQuery {
 string run_id = 1;
 int64 organization_id = 2;
 int64 operator_user_id = 3;
}
message UnknownResolutionCommand {
 EvaluationQuery scope = 1;
 int64 expected_version = 2;
 string execution_id = 3;
 string decision = 4;
 string reason = 5;
 bool confirm = 6;
 bool acknowledged_duplicate_call_and_cost_risk = 7;
}
message EvaluationUnknownQuery {
 EvaluationQuery scope = 1;
 int64 expected_version = 2;
}
message EvaluationUnknownExecution {
 string execution_id = 1;
 string invocation_id = 2;
 string kind = 3;
 string case_id = 4;
 int32 slot_ordinal = 5;
 // Empty for a generation call that never produced an accepted candidate.
 string candidate_id = 6;
 int32 execution_ordinal = 7;
 string started_at = 8;
 string finished_at = 9;
 int32 provider_call_count = 10;
 string failure_stage = 11;
 string failure_code = 12;
 int32 target_execution_count = 13;
 int32 target_execution_limit = 14;
 int32 stage_execution_count = 15;
 int32 stage_execution_limit = 16;
 // Eligibility at this version only; resolution and dispatch reservation recheck.
 bool replacement_allowed = 17;
}
message EvaluationUnknownIndex {
 string run_id = 1;
 int64 version = 2;
 string release_fingerprint = 3;
 string status = 4;
 int32 unresolved_result_unknown_count = 5;
 bool can_resolve = 6;
 // At most 140, no prompt, raw model output, credential or provider error body.
 repeated EvaluationUnknownExecution executions = 7;
}
message EvaluationState {
 string run_id = 1;
 int64 version = 2;
 string status = 3;
 int64 unresolved_result_unknown_count = 4;
 // Audit-only decisions, excluding prompts, reports, model output and credentials.
 string resolutions_json = 5;
 // Append-only human audit records, including bounded contradiction-review excerpts.
 string reviews_json = 6;
 // Revalidated final gate, release identity, actor, reason, server time and version.
 string finalization_json = 7;
 // At most three prior finalizations and review rounds, revalidated against original evidence.
 string reopenings_json = 8;
 // Immutable creation receipt for read-only recovery, without executable asset bodies.
 // qs-ai-evaluation-creation-receipt/v1; absent on older servers.
 string creation_json = 9;
 // Audited general cancellation, distinct from an unknown-call resolution.
 string cancellation_json = 10;
 // Qualification at this Run version, computed from the original evidence.
 // Not authorization: ReopenReview rechecks scope, CAS and domain policy.
 // Absent on older servers; false is an explicit ineligible result.
 optional bool can_reopen_review = 11;
}

message SemanticContradictionReview {
 string policy_version = 1;
 string execution_id = 2;
 string output_fingerprint = 3;
 int32 assertion_ordinal = 4;
 string original_detail = 5;
 string candidate_excerpt = 6;
 string reason = 7;
}
message CandidateReviewItem {
 string candidate_id = 1;
 string decision = 2;
 string reason = 3;
 SemanticContradictionReview semantic_review = 4;
}
message EvaluationReviewCommand {
 EvaluationQuery scope = 1;
 int64 expected_version = 2;
 string role = 3;
 repeated CandidateReviewItem reviews = 4;
}

message EvaluationStartCommand {
 EvaluationQuery scope = 1;
 int64 expected_version = 2;
 string reason = 3;
 bool confirm = 4;
}

message FrozenEvaluationRef { string id = 1; string version = 2; string fingerprint = 3; }
message EvaluationRelease {
 FrozenEvaluationRef suite = 1;
 FrozenEvaluationRef prompt = 2;
 FrozenEvaluationRef profile = 3;
 FrozenEvaluationRef input_schema = 4;
 FrozenEvaluationRef output_schema = 5;
 FrozenEvaluationRef generation_route = 6;
 FrozenEvaluationRef semantic_prompt = 7;
 FrozenEvaluationRef semantic_output_schema = 8;
 FrozenEvaluationRef semantic_route = 9;
 FrozenEvaluationRef execution_policy = 10;
 FrozenEvaluationRef gate_policy = 11;
}
message EvaluationCreateCommand {
 EvaluationQuery scope = 1;
 EvaluationRelease release = 2;
 string reason = 3;
 bool confirm = 4;
}

// Shared configuration catalog. QS authorizes each operator before delegation.
// Server timestamps and immutable evaluation proof are never supplied by callers.
service PublicationManagement {
 rpc Publish(PublicationPublishCommand) returns (PublicationReceipt);
 rpc Rollback(PublicationRollbackCommand) returns (PublicationReceipt);
 rpc Disable(PublicationDisableCommand) returns (PublicationReceipt);
 rpc Get(PublicationQuery) returns (PublicationState);
 // Same authorized organization/operator that submitted the command; read-only.
 rpc GetReceipt(PublicationReceiptQuery) returns (PublicationReceipt);
 // QS audit-authorized global configuration history; preserves original actors.
 // These reads never replay commands or select an active publication.
 rpc ListHistory(PublicationHistoryQuery) returns (PublicationHistoryPage);
 rpc GetHistory(PublicationHistoryVersionQuery) returns (PublicationReceipt);
}
message PublicationScope {
 int64 organization_id = 1;
 int64 operator_user_id = 2;
}
message PublicationSelector {
 string audience = 1;
 string model_kind = 2;
 string decision_kind = 3;
 optional string model_code = 4;
 optional string model_version = 5;
}
message PublicationExpectation {
 PublicationSelector selector = 1;
 int64 version = 2;
 // Empty only when explicitly confirming an inactive or never-published slot.
 string active_publication_id = 3;
}
message PublicationPublishCommand {
 PublicationScope scope = 1;
 string command_id = 2;
 PublicationExpectation expected = 3;
 string reason = 4;
 bool confirm = 5;
 string run_id = 6;
 int64 run_version = 7;
 string release_fingerprint = 8;
}
message PublicationRollbackCommand {
 PublicationScope scope = 1;
 string command_id = 2;
 PublicationExpectation expected = 3;
 string reason = 4;
 bool confirm = 5;
 string target_publication_id = 6;
}
message PublicationDisableCommand {
 PublicationScope scope = 1;
 string command_id = 2;
 PublicationExpectation expected = 3;
 string reason = 4;
 bool confirm = 5;
}
message PublicationQuery {
 PublicationScope scope = 1;
 PublicationSelector selector = 2;
}
message PublicationReceiptQuery {
 PublicationScope scope = 1;
 string command_id = 2;
}
message PublicationHistoryQuery {
 PublicationScope scope = 1;
 PublicationSelector selector = 2;
 int64 before_version = 3; // Exclusive cursor; zero starts at the newest change.
 int32 limit = 4; // Required range 1..20.
}
message PublicationHistoryVersionQuery {
 PublicationScope scope = 1;
 PublicationSelector selector = 2;
 int64 version = 3;
}
message PublicationHistoryPage {
 string schema_version = 1;
 // qs-ai-publication-history/v1 summaries, no executable Prompt or Profile body.
 string payload_json = 2;
}
message PublicationState {
 PublicationSelector selector = 1;
 int64 version = 2;
 string active_publication_id = 3;
 // Canonical qs-ai-publication/v1 record. Empty if no active publication.
 string publication_json = 4;
 string changed_at = 5;
}
message PublicationReceipt {
 string command_id = 1;
 PublicationState previous = 2;
 PublicationState current = 3;
 string action = 4;
 string actor = 5;
 string reason = 6;
 string changed_at = 7;
}

// Draft revisions are editable governance records, never published Prompt assets.
// QS authorizes each operation. Receipt lookup is restricted to the original actor.
service PromptDraftManagement {
 rpc Create(PromptDraftCreateCommand) returns (PromptDraftState);
 rpc Revise(PromptDraftReviseCommand) returns (PromptDraftState);
 rpc Get(PromptDraftQuery) returns (PromptDraftState);
 // Latest head and freeze state from one snapshot. Revision selectors are rejected.
 // Read-only status does not grant a lease or authorize a later modification.
 rpc GetLifecycle(PromptDraftQuery) returns (PromptDraftLifecycle);
 rpc GetReceipt(PromptDraftReceiptQuery) returns (PromptDraftState);
 // Freeze validated template syntax into a native immutable asset, not a release.
 rpc Freeze(PromptDraftFreezeCommand) returns (PromptDraftFreezeReceipt);
 rpc GetFreezeReceipt(PromptDraftReceiptQuery) returns (PromptDraftFreezeReceipt);
}
message PromptDraftFreezeCommand {
 PublicationScope scope = 1;
 string draft_id = 2;
 string command_id = 3;
 int64 expected_revision = 4;
 string reason = 5;
}
message PromptDraftFreezeReceipt {
 string schema_version = 1;
 string command_id = 2;
 string receipt_json = 3;
}
message PromptDraftSource {
 string identity = 1;
 string version = 2;
 string fingerprint = 3;
 string content_sha256 = 4;
}
message PromptDraftContent {
 string system_message = 1;
 string task_template = 2;
 string data_preamble = 3;
 repeated string allowed_placeholders = 4;
}
message PromptDraftCreateCommand {
 PublicationScope scope = 1;
 string draft_id = 2;
 string command_id = 3;
 PromptDraftSource source = 4;
 string template_id = 5;
 string target_version = 6;
 string reason = 7;
}
message PromptDraftReviseCommand {
 PublicationScope scope = 1;
 string draft_id = 2;
 string command_id = 3;
 int64 expected_revision = 4;
 PromptDraftContent content = 5;
 string reason = 6;
}
message PromptDraftQuery {
 PublicationScope scope = 1;
 string draft_id = 2;
 // Absent reads current revision. Present values must be positive.
 optional int64 revision = 3;
}
message PromptDraftReceiptQuery {
 PublicationScope scope = 1;
 string command_id = 2;
}
message PromptDraftState {
 string schema_version = 1;
 string draft_id = 2;
 int64 revision = 3;
 // Complete immutable revision, original source and actor/time/reason audit.
 string snapshot_json = 4;
}
message PromptDraftLifecycle {
 string schema_version = 1;
 PromptDraftState draft = 2;
 // Explicit editable or frozen; consumers must reject unknown status.
 string status = 3;
 // Present exactly when status is frozen. No original freeze command audit.
 PromptDraftFrozenVersion frozen = 4;
}
message PromptDraftFrozenVersion {
 PromptDraftSource asset = 1;
 int64 revision = 2;
 string frozen_at = 3;
}

// Register a validated immutable Profile; this does not approve or publish it.
// QS authorizes writes and reads; original command receipts retain actor scope.
service ProfileManagement {
 rpc Register(ProfileRegisterCommand) returns (ProfileRegistrationReceipt);
 rpc GetReceipt(ProfileRegistrationQuery) returns (ProfileRegistrationReceipt);
 rpc ListLifecycle(ProfileLifecycleQuery) returns (AssetCatalogResponse);
 rpc GetLifecycle(ProfileLifecycleQuery) returns (AssetCatalogResponse);
}
message ProfileRegisterCommand {
 PublicationScope scope = 1;
 string command_id = 2;
 PromptDraftSource source = 3;
 string definition_json = 4;
 PromptDraftSource prompt = 5;
 PromptDraftSource generation_route = 6;
 string reason = 7;
}
message ProfileRegistrationQuery {
 PublicationScope scope = 1;
 string command_id = 2;
}
message ProfileRegistrationReceipt {
 string schema_version = 1;
 string command_id = 2;
 string receipt_json = 3;
}

// Rebind retained evaluation cases to immutable assets. A new Run and approval
// are required; registration never copies a previous Run's evidence or verdict.
service SuiteManagement {
 rpc Register(SuiteRegisterCommand) returns (SuiteRegistrationReceipt);
 rpc GetReceipt(SuiteRegistrationQuery) returns (SuiteRegistrationReceipt);
}
message SuiteRegisterCommand {
 PublicationScope scope = 1;
 string command_id = 2;
 FrozenEvaluationRef source = 3;
 string suite_id = 4;
 string suite_version = 5;
 PromptDraftSource profile = 6;
 PromptDraftSource prompt = 7;
 PromptDraftSource generation_route = 8;
 string reason = 9;
 string case_edits_json = 10;
 FrozenEvaluationRef semantic_prompt = 11;
 int64 semantic_owner_organization_id = 12;
}
message SuiteRegistrationQuery {
 PublicationScope scope = 1;
 string command_id = 2;
}
message SuiteRegistrationReceipt {
 string schema_version = 1;
 string command_id = 2;
 string receipt_json = 3;
}


// Immutable shared definitions only; QS authorizes readers. No audit receipts or activation state.
service AssetCatalog {
  rpc List(AssetCatalogQuery) returns (AssetCatalogResponse);
  rpc Get(AssetCatalogGetQuery) returns (AssetCatalogResponse);
}
message AssetCatalogQuery {
  PublicationScope scope = 1;
  string kind = 2;
  string identity = 3;
  int32 limit = 4;
  string cursor = 5;
}
message AssetCatalogGetQuery {
  PublicationScope scope = 1;
  string kind = 2;
  string identity = 3;
  string version = 4;
}
message AssetCatalogResponse {
  string schema_version = 1;
  string payload_json = 2;
}

message EvaluationCatalogQuery {
 PublicationScope scope = 1;
 string status = 2;
 int32 limit = 3;
 string cursor = 4;
}
message EvaluationCatalogPage {
 repeated EvaluationSummary items = 1;
 string next_cursor = 2;
}
message EvaluationSummary {
 string run_id = 1;
 int64 organization_id = 2;
 int64 version = 3;
 string status = 4;
 string created_at = 5;
 string requested_by = 6;
 string profile_id = 7;
 string profile_version = 8;
 string prompt_id = 9;
 string prompt_version = 10;
 string release_fingerprint = 11;
 int64 unresolved_result_unknown_count = 12;
 int64 review_count = 13;
 int64 required_candidates = 14;
 int64 accepted_candidates = 15;
 int64 review_ready_candidates = 16;
 string last_cause = 17;
 string last_reason = 18;
}

message EvaluationCapacityReservation {
 string run_id = 1;
 int64 provider_calls = 2;
 string requested_by = 3;
 string reserved_at = 4;
}
message EvaluationCapacitySnapshot {
 int64 organization_id = 1;
 string budget_day = 2;
 int64 daily_provider_calls = 3;
 int64 reserved_provider_calls = 4;
 int64 remaining_provider_calls = 5;
 int64 full_run_provider_calls = 6;
 int64 remaining_full_runs = 7;
 int64 max_active_runs = 8;
 int64 active_runs = 9;
 int64 reservation_count = 10;
 // Latest 100 receipts; totals include all reservations in the UTC day.
 repeated EvaluationCapacityReservation reservations = 11;
 bool reservations_truncated = 12;
}

// QS supplies current organization administrator authority over mTLS.
service ParticipantManagement {
 rpc GetCapacity(ParticipantCapacityQuery) returns (ParticipantCapacitySnapshot);
 rpc GetExecution(ParticipantExecutionQuery) returns (ParticipantExecution);
 rpc Retry(ParticipantRetryCommand) returns (Receipt);
 rpc GetRetryReceipt(ParticipantRetryReceiptQuery) returns (Receipt);
}
message ParticipantCapacityQuery {
 PublicationScope scope = 1;
 string subject_id = 2;
 string assessment_id = 3;
}
message ParticipantCapacityPolicy {
 int64 daily_org = 1;
 int64 daily_user = 2;
 int64 daily_assessment = 3;
 int64 active_org = 4;
 int64 active_user = 5;
 int64 active_assessment = 6;
}
message ParticipantCapacityUsage {
 string identity = 1;
 int64 daily_reserved = 2;
 int64 daily_remaining = 3;
 int64 active = 4;
 int64 active_remaining = 5;
}
message ParticipantReservation {
 string run_id = 1;
 string session_id = 2;
 string subject_id = 3;
 repeated string assessment_ids = 4;
 string budget_day = 5;
 string reserved_at = 6;
 bool active = 7;
 string acquired_at = 8;
}
message ParticipantCapacitySnapshot {
 int64 organization_id = 1;
 string budget_day = 2;
 ParticipantCapacityPolicy policy = 3;
 ParticipantCapacityUsage organization = 4;
 ParticipantCapacityUsage subject = 5;
 ParticipantCapacityUsage assessment = 6;
 repeated ParticipantReservation daily_reservations = 7;
 repeated ParticipantReservation active_reservations = 8;
 bool daily_truncated = 9;
 bool active_truncated = 10;
}

message ParticipantExecutionQuery { PublicationScope scope = 1; string session_id = 2; }
message ParticipantRetryReceiptQuery { PublicationScope scope = 1; string command_id = 2; }
message ParticipantRetryCommand {
 PublicationScope scope = 1;
 string session_id = 2;
 string command_id = 3;
 string expected_run_id = 4;
 int64 expected_version = 5;
 string reason = 6;
 bool confirm = 7;
 int64 expected_provider_invocations = 8;
 bool accept_result_unknown_risk = 9;
}
message ParticipantExecution {
 int64 organization_id = 1;
 string session_id = 2;
 string request_id = 3;
 string run_id = 4;
 int64 version = 5;
 string status = 6;
 string subject_id = 7;
 string testee_id = 8;
 repeated string assessment_ids = 9;
 string failure_code = 10;
 string model_call_status = 11;
 string invocation_id = 12;
 string source_run_id = 13;
 bool can_retry = 14;
 bool unknown_result_risk = 15;
 int64 retry_provider_invocations = 16;
}

message ProfileLifecycleQuery {
 PublicationScope scope = 1;
 string identity = 2;
 string version = 3;
 string status = 4;
 int32 limit = 5;
 string cursor = 6;
}

// Product workspace: additive management API. Existing Run/review/publication services stay authoritative.
service SolutionManagement {
  rpc List(SolutionQuery) returns (SolutionResponse);
  rpc Get(SolutionQuery) returns (SolutionResponse);
  rpc GetReceipt(SolutionQuery) returns (SolutionResponse);
  rpc GetModels(SolutionQuery) returns (SolutionResponse);
  rpc Create(SolutionWrite) returns (SolutionResponse);
  rpc Save(SolutionWrite) returns (SolutionResponse);
  rpc Prepare(SolutionWrite) returns (SolutionResponse);
}
message SolutionQuery {
  PublicationScope scope = 1;
  string solution_id = 2;
  string command_id = 3;
  string cursor = 4;
}
message SolutionWrite {
  PublicationScope scope = 1;
  string solution_id = 2;
  string command_json = 3;
}
message SolutionResponse {
  string schema_version = 1;
  string data_json = 2;
}

// Organization quota policy. Scope is asserted by the authorized QS workload.
service QuotaManagement {
  rpc Get(QuotaQuery) returns (QuotaResponse);
  rpc History(QuotaQuery) returns (QuotaResponse);
  rpc GetReceipt(QuotaQuery) returns (QuotaResponse);
  rpc Update(QuotaWrite) returns (QuotaResponse);
  rpc Rollback(QuotaWrite) returns (QuotaResponse);
}
message QuotaQuery {
  PublicationScope scope = 1;
  string command_id = 2;
  int64 before_revision = 3;
}
message QuotaWrite {
  PublicationScope scope = 1;
  string command_json = 2;
}
message QuotaResponse {
  string schema_version = 1;
  string data_json = 2;
}

// Read-only runtime evidence. Does not renew leases or dispatch models.
service RuntimeManagement {
  rpc Health(RuntimeQuery) returns (RuntimeResponse);
  rpc BatchGet(RuntimeQuery) returns (RuntimeResponse);
  rpc Get(RuntimeQuery) returns (RuntimeResponse);
}
message RuntimeQuery {
  PublicationScope scope = 1;
  repeated string session_ids = 2;
}
message RuntimeResponse {
  string schema_version = 1;
  string data_json = 2;
}

// Judge drafts are organization-scoped editing state, never evaluation approval.
service SemanticPromptDrafts {
  rpc Create(SemanticDraftWrite) returns (SemanticDraftResponse);
  rpc Get(SemanticDraftQuery) returns (SemanticDraftResponse);
  rpc Revise(SemanticDraftWrite) returns (SemanticDraftResponse);
  rpc Validate(SemanticDraftQuery) returns (SemanticDraftResponse);
  rpc Freeze(SemanticDraftWrite) returns (SemanticDraftResponse);
  rpc GetReceipt(SemanticDraftQuery) returns (SemanticDraftResponse);
}
message SemanticDraftWrite {
  PublicationScope scope = 1;
  string command_json = 2;
}
message SemanticDraftQuery {
  PublicationScope scope = 1;
  string draft_id = 2;
  int64 revision = 3;
  string command_id = 4;
}
message SemanticDraftResponse {
  string schema_version = 1;
  string data_json = 2;
}
