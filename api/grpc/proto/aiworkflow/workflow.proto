syntax = "proto3";
package qsai.workflow.v1;
option go_package = "github.com/FangcunMount/qs-server/api/grpc/gen/aiworkflow";
service Commands {
 rpc Start(StartCommand) returns (Receipt);
 rpc Change(ChangeCommand) returns (Receipt);
}
service Results {
 rpc Accept(StateEvent) returns (Acknowledgement);
}
message Actor { string org_id = 1; string subject_id = 2; }
message StartCommand {
 string request_id = 1; Actor actor = 2; string testee_id = 3;
 repeated string assessment_ids = 4; string goal = 5;
 repeated EvidenceItem evidence = 6;
}
message ChangeCommand {
 string command_id = 1; string session_id = 2; Actor actor = 3;
 string action = 4; int64 expected_version = 5; string question_id = 6;
 optional string answer = 7; bool skip = 8;
}
message Receipt { string session_id = 1; string run_id = 2; string status = 3; int64 version = 4; }
// Snapshot event. Intermediate versions may be skipped; newer versions never regress.
message StateEvent {
 string event_id = 1; string request_id = 2; string session_id = 3;
 Actor actor = 4; string testee_id = 5; int64 version = 6; string status = 7;
 string question_id = 8; string question = 9; bool can_skip = 10; string failure_code = 11;
 // Complete immutable ArtifactCandidate envelope; required only for completed.
 string artifact_json = 12;
}
message Acknowledgement { string event_id = 1; }

message Fact { string ref = 1; string value = 2; }
message EvidenceItem {
 string assessment_id = 1; string testee_id = 2; string report_id = 3;
 string source_version = 4; repeated Fact facts = 5;
}

// Trusted QS backend only. QS must authorize OrgAdmin before forwarding these operations.
service EvaluationManagement {
 // Explicitly schedules an existing frozen requested Run; does not call a model inline.
 rpc Start(EvaluationStartCommand) returns (EvaluationState);
 rpc Get(EvaluationQuery) returns (EvaluationState);
 rpc ResolveUnknown(UnknownResolutionCommand) returns (EvaluationState);
}
message EvaluationQuery {
 string run_id = 1;
 int64 organization_id = 2;
 int64 operator_user_id = 3;
}
message UnknownResolutionCommand {
 EvaluationQuery scope = 1;
 int64 expected_version = 2;
 string execution_id = 3;
 string decision = 4;
 string reason = 5;
 bool confirm = 6;
 bool acknowledged_duplicate_call_and_cost_risk = 7;
}
message EvaluationState {
 string run_id = 1;
 int64 version = 2;
 string status = 3;
 int64 unresolved_result_unknown_count = 4;
 // Audit-only decisions, excluding prompts, reports, model output and credentials.
 string resolutions_json = 5;
}

message EvaluationStartCommand {
 EvaluationQuery scope = 1;
 int64 expected_version = 2;
 string reason = 3;
 bool confirm = 4;
}
