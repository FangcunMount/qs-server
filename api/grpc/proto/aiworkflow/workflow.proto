syntax = "proto3";
package qsai.workflow.v1;
option go_package = "github.com/FangcunMount/qs-server/api/grpc/gen/aiworkflow";
service Commands {
 rpc Start(StartCommand) returns (Receipt);
 rpc Change(ChangeCommand) returns (Receipt);
}
service Results {
 rpc Accept(StateEvent) returns (Acknowledgement);
}
message Actor { string org_id = 1; string subject_id = 2; }
message StartCommand {
 string request_id = 1; Actor actor = 2; string testee_id = 3;
 repeated string assessment_ids = 4; string goal = 5;
 repeated EvidenceItem evidence = 6;
}
message ChangeCommand {
 string command_id = 1; string session_id = 2; Actor actor = 3;
 string action = 4; int64 expected_version = 5; string question_id = 6;
 optional string answer = 7; bool skip = 8;
}
message Receipt { string session_id = 1; string run_id = 2; string status = 3; int64 version = 4; }
// Snapshot event. Intermediate versions may be skipped; newer versions never regress.
message StateEvent {
 string event_id = 1; string request_id = 2; string session_id = 3;
 Actor actor = 4; string testee_id = 5; int64 version = 6; string status = 7;
 string question_id = 8; string question = 9; bool can_skip = 10; string failure_code = 11;
 // Complete immutable ArtifactCandidate envelope; required only for completed.
 string artifact_json = 12;
}
message Acknowledgement { string event_id = 1; }

message Fact { string ref = 1; string value = 2; }
message EvidenceItem {
 string assessment_id = 1; string testee_id = 2; string report_id = 3;
 string source_version = 4; repeated Fact facts = 5;
}

// Trusted QS backend only. QS authorizes governance writes and candidate audit reads.
service EvaluationManagement {
 // The caller reuses scope.run_id for retries of the identical creation request.
 rpc Create(EvaluationCreateCommand) returns (EvaluationState);
 // Explicitly schedules an existing frozen requested Run; does not call a model inline.
 rpc Start(EvaluationStartCommand) returns (EvaluationState);
 rpc Get(EvaluationQuery) returns (EvaluationState);
 rpc ResolveUnknown(UnknownResolutionCommand) returns (EvaluationState);
 // QS authorizes the selected review role; AI records the trusted operator and server time.
 rpc Review(EvaluationReviewCommand) returns (EvaluationState);
 rpc ListCandidates(EvaluationQuery) returns (EvaluationCandidateIndex);
 rpc GetCandidate(EvaluationCandidateQuery) returns (EvaluationCandidateEvidence);
 // Read-only complete gate preview; does not approve the Run or publish a release.
 rpc PreviewGates(EvaluationGateQuery) returns (EvaluationGatePreview);
 // Recompute gates under CAS; this records approval/rejection, never publishes a release.
 rpc Finalize(EvaluationFinalizeCommand) returns (EvaluationState);
 // Reopen eligible semantic-review signatures, preserving the complete previous round.
 rpc ReopenReview(EvaluationReopenCommand) returns (EvaluationState);
}
message EvaluationReopenCommand {
 EvaluationQuery scope = 1;
 int64 expected_version = 2;
 string reason = 3;
 bool confirm = 4;
}
message EvaluationFinalizeCommand {
 EvaluationQuery scope = 1;
 int64 expected_version = 2;
 // Presence is mandatory; false explicitly confirms the previewed rejection.
 optional bool expected_passed = 3;
 string reason = 4;
 bool confirm = 5;
}
message EvaluationGateQuery {
 EvaluationQuery scope = 1;
 int64 expected_version = 2;
}
message EvaluationGatePreview {
 string run_id = 1;
 int64 version = 2;
 string release_fingerprint = 3;
 string gate_result_json = 4;
}
message EvaluationCandidateSummary {
 string candidate_id = 1;
 string case_id = 2;
 int32 slot_ordinal = 3;
}
message EvaluationCandidateIndex {
 string run_id = 1;
 int64 version = 2;
 repeated EvaluationCandidateSummary candidates = 3;
}
message EvaluationCandidateQuery {
 EvaluationQuery scope = 1;
 string candidate_id = 2;
 int64 expected_version = 3;
}
message EvaluationCandidateEvidence {
 string run_id = 1;
 int64 version = 2;
 string candidate_id = 3;
 bytes normalized_output = 4;
 bytes semantic_output = 5;
 string evidence_json = 6;
}
message EvaluationQuery {
 string run_id = 1;
 int64 organization_id = 2;
 int64 operator_user_id = 3;
}
message UnknownResolutionCommand {
 EvaluationQuery scope = 1;
 int64 expected_version = 2;
 string execution_id = 3;
 string decision = 4;
 string reason = 5;
 bool confirm = 6;
 bool acknowledged_duplicate_call_and_cost_risk = 7;
}
message EvaluationState {
 string run_id = 1;
 int64 version = 2;
 string status = 3;
 int64 unresolved_result_unknown_count = 4;
 // Audit-only decisions, excluding prompts, reports, model output and credentials.
 string resolutions_json = 5;
 // Append-only human audit records, including bounded contradiction-review excerpts.
 string reviews_json = 6;
 // Revalidated final gate, release identity, actor, reason, server time and version.
 string finalization_json = 7;
 // At most three prior finalizations and review rounds, revalidated against original evidence.
 string reopenings_json = 8;
}

message SemanticContradictionReview {
 string policy_version = 1;
 string execution_id = 2;
 string output_fingerprint = 3;
 int32 assertion_ordinal = 4;
 string original_detail = 5;
 string candidate_excerpt = 6;
 string reason = 7;
}
message CandidateReviewItem {
 string candidate_id = 1;
 string decision = 2;
 string reason = 3;
 SemanticContradictionReview semantic_review = 4;
}
message EvaluationReviewCommand {
 EvaluationQuery scope = 1;
 int64 expected_version = 2;
 string role = 3;
 repeated CandidateReviewItem reviews = 4;
}

message EvaluationStartCommand {
 EvaluationQuery scope = 1;
 int64 expected_version = 2;
 string reason = 3;
 bool confirm = 4;
}

message FrozenEvaluationRef { string id = 1; string version = 2; string fingerprint = 3; }
message EvaluationRelease {
 FrozenEvaluationRef suite = 1;
 FrozenEvaluationRef prompt = 2;
 FrozenEvaluationRef profile = 3;
 FrozenEvaluationRef input_schema = 4;
 FrozenEvaluationRef output_schema = 5;
 FrozenEvaluationRef generation_route = 6;
 FrozenEvaluationRef semantic_prompt = 7;
 FrozenEvaluationRef semantic_output_schema = 8;
 FrozenEvaluationRef semantic_route = 9;
 FrozenEvaluationRef execution_policy = 10;
 FrozenEvaluationRef gate_policy = 11;
}
message EvaluationCreateCommand {
 EvaluationQuery scope = 1;
 EvaluationRelease release = 2;
 string reason = 3;
 bool confirm = 4;
}

// Shared configuration catalog. QS authorizes each operator before delegation.
// Server timestamps and immutable evaluation proof are never supplied by callers.
service PublicationManagement {
 rpc Publish(PublicationPublishCommand) returns (PublicationReceipt);
 rpc Rollback(PublicationRollbackCommand) returns (PublicationReceipt);
 rpc Disable(PublicationDisableCommand) returns (PublicationReceipt);
 rpc Get(PublicationQuery) returns (PublicationState);
 // Same authorized organization/operator that submitted the command; read-only.
 rpc GetReceipt(PublicationReceiptQuery) returns (PublicationReceipt);
}
message PublicationScope {
 int64 organization_id = 1;
 int64 operator_user_id = 2;
}
message PublicationSelector {
 string audience = 1;
 string model_kind = 2;
 string decision_kind = 3;
 optional string model_code = 4;
 optional string model_version = 5;
}
message PublicationExpectation {
 PublicationSelector selector = 1;
 int64 version = 2;
 // Empty only when explicitly confirming an inactive or never-published slot.
 string active_publication_id = 3;
}
message PublicationPublishCommand {
 PublicationScope scope = 1;
 string command_id = 2;
 PublicationExpectation expected = 3;
 string reason = 4;
 bool confirm = 5;
 string run_id = 6;
 int64 run_version = 7;
 string release_fingerprint = 8;
}
message PublicationRollbackCommand {
 PublicationScope scope = 1;
 string command_id = 2;
 PublicationExpectation expected = 3;
 string reason = 4;
 bool confirm = 5;
 string target_publication_id = 6;
}
message PublicationDisableCommand {
 PublicationScope scope = 1;
 string command_id = 2;
 PublicationExpectation expected = 3;
 string reason = 4;
 bool confirm = 5;
}
message PublicationQuery {
 PublicationScope scope = 1;
 PublicationSelector selector = 2;
}
message PublicationReceiptQuery {
 PublicationScope scope = 1;
 string command_id = 2;
}
message PublicationState {
 PublicationSelector selector = 1;
 int64 version = 2;
 string active_publication_id = 3;
 // Canonical qs-ai-publication/v1 record. Empty if no active publication.
 string publication_json = 4;
 string changed_at = 5;
}
message PublicationReceipt {
 string command_id = 1;
 PublicationState previous = 2;
 PublicationState current = 3;
 string action = 4;
 string actor = 5;
 string reason = 6;
 string changed_at = 7;
}

// Draft revisions are editable governance records, never published Prompt assets.
// QS authorizes each operation. Receipt lookup is restricted to the original actor.
service PromptDraftManagement {
 rpc Create(PromptDraftCreateCommand) returns (PromptDraftState);
 rpc Revise(PromptDraftReviseCommand) returns (PromptDraftState);
 rpc Get(PromptDraftQuery) returns (PromptDraftState);
 rpc GetReceipt(PromptDraftReceiptQuery) returns (PromptDraftState);
 // Freeze validated template syntax into a native immutable asset, not a release.
 rpc Freeze(PromptDraftFreezeCommand) returns (PromptDraftFreezeReceipt);
 rpc GetFreezeReceipt(PromptDraftReceiptQuery) returns (PromptDraftFreezeReceipt);
}
message PromptDraftFreezeCommand {
 PublicationScope scope = 1;
 string draft_id = 2;
 string command_id = 3;
 int64 expected_revision = 4;
 string reason = 5;
}
message PromptDraftFreezeReceipt {
 string schema_version = 1;
 string command_id = 2;
 string receipt_json = 3;
}
message PromptDraftSource {
 string identity = 1;
 string version = 2;
 string fingerprint = 3;
 string content_sha256 = 4;
}
message PromptDraftContent {
 string system_message = 1;
 string task_template = 2;
 string data_preamble = 3;
 repeated string allowed_placeholders = 4;
}
message PromptDraftCreateCommand {
 PublicationScope scope = 1;
 string draft_id = 2;
 string command_id = 3;
 PromptDraftSource source = 4;
 string template_id = 5;
 string target_version = 6;
 string reason = 7;
}
message PromptDraftReviseCommand {
 PublicationScope scope = 1;
 string draft_id = 2;
 string command_id = 3;
 int64 expected_revision = 4;
 PromptDraftContent content = 5;
 string reason = 6;
}
message PromptDraftQuery {
 PublicationScope scope = 1;
 string draft_id = 2;
 // Absent reads current revision. Present values must be positive.
 optional int64 revision = 3;
}
message PromptDraftReceiptQuery {
 PublicationScope scope = 1;
 string command_id = 2;
}
message PromptDraftState {
 string schema_version = 1;
 string draft_id = 2;
 int64 revision = 3;
 // Complete immutable revision, original source and actor/time/reason audit.
 string snapshot_json = 4;
}

// Register a validated immutable Profile; this does not approve or publish it.
// QS authorizes writes and reads; original command receipts retain actor scope.
service ProfileManagement {
 rpc Register(ProfileRegisterCommand) returns (ProfileRegistrationReceipt);
 rpc GetReceipt(ProfileRegistrationQuery) returns (ProfileRegistrationReceipt);
}
message ProfileRegisterCommand {
 PublicationScope scope = 1;
 string command_id = 2;
 PromptDraftSource source = 3;
 string definition_json = 4;
 PromptDraftSource prompt = 5;
 PromptDraftSource generation_route = 6;
 string reason = 7;
}
message ProfileRegistrationQuery {
 PublicationScope scope = 1;
 string command_id = 2;
}
message ProfileRegistrationReceipt {
 string schema_version = 1;
 string command_id = 2;
 string receipt_json = 3;
}
