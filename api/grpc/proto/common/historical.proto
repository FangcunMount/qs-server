syntax = "proto3";

package common;

option go_package = "github.com/FangcunMount/qs-server/api/grpc/gen/common";

// HistoricalExecutionContext is an optional, trusted service-to-service
// carrier for business occurrence timestamps. System clocks still govern
// authentication, locks, leases, retries and outbox delivery.
message HistoricalExecutionContext {
  string batch_id = 1;
  string scenario_id = 2;
  uint64 org_id = 3;
  uint32 version = 4;
  BusinessTimeline timeline = 5;
}

message BusinessTimeline {
  string entry_resolved_at = 1;
  string entry_intake_at = 2;
  string enrollment_joined_at = 3;
  string task_opened_at = 4;
  string task_completed_at = 5;
  string answersheet_filled_at = 6;
  string assessment_created_at = 7;
  string assessment_submitted_at = 8;
  string evaluated_at = 9;
  string report_generated_at = 10;
}
